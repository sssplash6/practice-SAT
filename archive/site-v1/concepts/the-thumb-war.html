<title>The Thumb War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --paper: #FFFFFF; --ink: #3F3F3F; --amber: #F18508;
    --mat: #EDEAE5; --line: #E4E1DC; --soft: #8A847C;
    --font: "Archivo", "Helvetica Neue", system-ui, sans-serif;   /* placeholder type, see brand/BRAND.md */
    --mono: "DM Mono", ui-monospace, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .screen { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: clamp(18px, 3vh, 30px); padding-block: 32px 48px; padding-inline: 24px; text-align: center; }
  svg.scene { width: min(780px, 94vw); max-width: 100%; aspect-ratio: 800 / 600; display: block; overflow: visible; }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 900; letter-spacing: -.04em; line-height: .98; min-height: 1em; text-wrap: balance; }
  .btn { font: 800 15px var(--font); min-height: 52px; padding: 0 32px; border: 0; border-radius: 999px; background: var(--amber); color: var(--ink); cursor: pointer;
         box-shadow: 0 10px 30px -14px rgba(241,133,8,.9); transition: transform .18s var(--ease), box-shadow .25s var(--ease); }
  .btn:hover { transform: translateY(-1px); } .btn:active { transform: translateY(1px); } .btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .hint { font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--soft); margin: 0; min-height: 1.4em; }

  /* the drawing: one line, one weight; the paper-white fill only exists so a moving thumb hides what is behind it */
  .sil { fill: var(--paper); stroke: none; fill-rule: evenodd; }
  .ink { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
  .patch { fill: var(--paper); }
  .edge { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<script>
const NS='http://www.w3.org/2000/svg', reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const $=id=>document.getElementById(id);
const lerp=(a,b,k)=>a+(b-a)*k, clamp=v=>Math.min(1,Math.max(0,v)), f1=v=>(+v).toFixed(1);

/* ---------------------------------------------------------------- the thumbs: each a cut-out of the drawing that turns about its root */
const PIV={L:[191.0,246.9],R:[577.0,278.0]}, TIP={L:[328.7,124.8],R:[408.2,127.2]};
const SGN={L:1,R:-1};                      // a positive turn leans the thumb toward the other one
const PIN={L:46,R:44}, WIN={L:51,R:40};     // how far each has to turn to lie flat on the knuckles, or to come down across the other
const FC={L:.85,R:.85};                      // where along the thumb the joint is: the point of contact
const root=$('root'), thumbs=$('thumbs'), beam=$('beam');
const hands={};
['L','R'].forEach(s=>{ const grad=$('heat'+s), stops=[]; for(let i=0;i<7;i++) stops.push(el('stop',{offset:0,'stop-color':'#FFFFFF'},grad)); hands[s]={g:$('th'+s),wrap:$('wrap'+s),trim:$('trim'+s),stops}; });

/* ---------------------------------------------------------------- colour: paper, one orange, a grey for the spent thumb */
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const PAPER=hex('#FFFFFF'), ORANGE=hex('#F18508'), HOT=hex('#E2481A'), GREY=hex('#E4E1DC');
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k);
const css=c=>`rgb(${c.map(v=>Math.round(v)).join(',')})`;

/* ---------------------------------------------------------------- motion: seven seconds, one clock, every pose a function of it */
const ss=(a,b,t)=>{ const k=clamp((t-a)/(b-a)); return k*k*(3-2*k); };
const bump=(t,t0,w)=>{ const k=(t-t0)/w; return k<0||k>1?0:Math.pow(Math.sin(Math.PI*k),2); };
const spring=(v,damp,freq)=>v<0?0:Math.exp(-v*damp)*Math.cos(v*freq);
const LOOP=7;

function pose(T,loop){
  const w=loop%2?'L':'R', l=w==='R'?'L':'R';
  const P={shiftX:0,bob:0,rock:0,winner:w,loser:l};
  /* the count: four heavy beats; the thumbs cross on one and two, again on three and four */
  let b=0; if(T<1.6){ const u=(T%.4)/.4; b=u<.28?Math.pow(u/.28,2):spring(u-.28,7,20); }
  const cross=(ss(0,.16,T)-ss(.4,.56,T)+ss(.8,.96,T)-ss(1.2,1.36,T))*(1-ss(1.6,1.85,T));
  P.bob=12*b;
  /* the break: loose, circling opposite ways, arrhythmic */
  const loose=ss(1.6,1.85,T)*(1-ss(3.4,3.58,T)), circ=loose*(1-.5*ss(2.4,2.6,T));
  const phi=(T-1.6)*Math.PI*2*1.5+.6*Math.sin(T*7.3);
  let rW=26*cross+loose*6+circ*13*Math.sin(phi),      xW=circ*5*Math.cos(phi),      yW=circ*3*Math.sin(phi*1.3);
  let rL=26*cross+loose*6+circ*13*Math.sin(-phi+1.2), xL=circ*5*Math.cos(-phi+1.2), yL=circ*3*Math.sin(-phi*1.3+1.9);
  rW+=30*bump(T,1.95,.16); rL-=18*bump(T,2.02,.14);                                          // a dart, a flinch
  rW+=30*bump(T,2.68,.22); rL+=30*bump(T,2.76,.22);                                          // a near-miss
  rW+=34*bump(T,3.1,.2);  rL+=34*bump(T,3.12,.2); rW-=20*bump(T,3.3,.12); rL-=20*bump(T,3.3,.12);   // catches a corner, slips off
  P.rock=(T>2.78?2.0*spring(T-2.78,6,24):0)+(T>3.22?2.8*spring(T-3.22,6,24):0);
  /* the pin: one drops flat across the other, onto the knuckles; the whole mass takes the hit */
  const pinK=Math.pow(ss(3.4,3.58,T),2.2), relW=ss(5.0,5.5,T), relL=ss(5.15,5.9,T);
  const pinW=pinK*(1-relW), pinL=pinK*(1-relL), hold=pinL*ss(3.58,3.7,T)*(1-ss(4.0,4.3,T));
  const sign=w==='R'?-1:1;
  if(T>3.58){ const j=spring(T-3.58,9,26); P.shiftX=4*sign*j; P.bob+=3*j; P.rock+=1.2*sign*j; }
  if(T>5.6) P.bob+=-3*spring(T-5.6,7,20);
  /* the spent thumb: grey and slack after the light leaves it, then the grip re-settles */
  const slack=ss(4.55,4.9,T)*(1-ss(6.0,6.6,T));
  const W={rot:lerp(rW,WIN[w],pinW)+1.5*Math.sin(T*6)*hold, dx:lerp(xW,0,pinW), dy:lerp(yW,8,pinW)};
  const L={rot:lerp(rL,PIN[l],pinL)+1.4*Math.sin(T*38)*hold-8*slack*(1-pinL), dx:lerp(xL,0,pinL), dy:lerp(yL,6,pinL)+4*slack*(1-pinL)};
  L.heat=ss(4.0,4.5,T); L.deepen=ss(4.3,4.55,T); L.cool=ss(4.55,4.98,T); L.slack=slack;
  W.heat=0; W.deepen=0; W.cool=0; W.slack=0;
  P[w]=W; P[l]=L;
  const grow=ss(4.4,4.64,T), rise=ss(4.58,5.02,T);
  P.beam=grow>0&&rise<1?{grow,rise,op:grow*(1-rise)}:null;
  return P;
}

function thumbPoint(s,th,frac){                                 // a point part-way up the thumb, in scene coordinates
  const [px,py]=PIV[s], [tx,ty]=TIP[s], a=th.rot*SGN[s]*Math.PI/180, vx=(tx-px)*frac, vy=(ty-py)*frac;
  return [px+th.dx+vx*Math.cos(a)-vy*Math.sin(a), py+th.dy+vx*Math.sin(a)+vy*Math.cos(a)];
}
function applyThumb(s,th){
  const h=hands[s], [px,py]=PIV[s];
  const tr=`translate(${f1(px+th.dx)} ${f1(py+th.dy)}) rotate(${f1(th.rot*SGN[s])}) translate(${f1(-px)} ${f1(-py)})`;
  h.g.setAttribute('transform',tr); h.trim.setAttribute('transform',tr);
  /* heat: a tint that spreads from the point of contact toward the base, deepest at the contact, and never reaches the root,
     so the cut where the thumb leaves the hand stays paper on paper; afterwards the same region cools to a faint grey */
  const spent=mix(PAPER,GREY,th.slack);
  const hot=mix(mix(PAPER,ORANGE,.78),spent,th.cool), centre=mix(mix(mix(PAPER,ORANGE,.92),HOT,th.deepen*.55),spent,th.cool), ahead=PAPER;
  const fc=FC[s], k=th.heat*.62, e=.14;
  const offs=[0, clamp(fc-k-e), clamp(fc-k), fc, clamp(fc+k), clamp(fc+k+e), 1];
  const cols=th.heat>0||th.slack>0?[ahead,ahead,hot,centre,hot,ahead,ahead]:[ahead,ahead,ahead,ahead,ahead,ahead,ahead];
  h.stops.forEach((st,i)=>{ st.setAttribute('offset',offs[i].toFixed(3)); st.setAttribute('stop-color',css(cols[i])); });
}
function apply(P){
  root.setAttribute('transform',`translate(${f1(P.shiftX)} ${f1(P.bob)}) rotate(${f1(P.rock)} 400 340)`);
  applyThumb('L',P.L); applyThumb('R',P.R);
  if(P.beam){ const [x,y]=thumbPoint(P.loser,P[P.loser],FC[P.loser]);
    beam.style.display=''; beam.setAttribute('transform',`translate(${f1(x+P.shiftX)} ${f1(y+P.bob-130*P.beam.rise)}) scale(1 ${Math.max(.001,P.beam.grow).toFixed(3)})`); beam.style.opacity=P.beam.op.toFixed(3); }
  else beam.style.display='none';
}
function order(P){ thumbs.appendChild(hands[P.winner].wrap); }        // the winning thumb goes over the other

/* ---------------------------------------------------------------- run */
let lastLoop=-1;
if(reduce||location.hash==='#still'){ const P=pose(0,0); order(P); apply(P); }
else { const t0=performance.now();
  (function frame(now){ const e=(now-t0)/1000, loop=Math.floor(e/LOOP), P=pose(e%LOOP,loop);
    if(loop!==lastLoop){ lastLoop=loop; order(P); } apply(P); requestAnimationFrame(frame); })(t0); }
window.__peek=(T,loop=0)=>{ const P=pose(T,loop); order(P); apply(P); };

/* -- ROUTER SEAM: placement is three duels from seed 1000; the button starts the first ------------ */
$('go').addEventListener('click',()=>console.log('[router] /duel/calibrate'));
</script>
