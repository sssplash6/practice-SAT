<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duels · SAT Freshman</title>
<meta name="description" content="Five questions, one opponent, one rating on the line.">
<link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
  /* The rank is the page. The mark is the badge, per spec/rating.md: the ring
     fills in ten steps and the counter takes the digit, so a level reads as how
     much is filled rather than off a colour ramp. */
  .rank {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(18px,3vh,30px); padding:24px var(--gutter) 48px; text-align:center;
  }

  .badge-btn {
    appearance:none; border:0; background:none; padding:0; cursor:pointer;
    border-radius:18px; transition:transform .18s var(--ease);
  }
  .badge-btn:active { transform:scale(.97); }
  .badge { width:clamp(180px,26vh,248px); height:auto; display:block; }

  .stat { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .stat-n {
    font:900 clamp(2.6rem,7vw,3.9rem)/1 var(--font);
    letter-spacing:-.05em; font-variant-numeric:tabular-nums;
  }
  .stat-band { font:500 11.5px var(--mono); letter-spacing:.05em; color:var(--faint); }
  .unplaced .stat-n { color:var(--faint); }

  .togo { font:500 12px var(--mono); letter-spacing:.04em; color:var(--soft); }
  .togo b { font:700 13px var(--font); color:var(--ink); letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  .togo[hidden] { display:none; }

  .note { max-width:40ch; font-size:13.5px; color:var(--soft); }
  .note[hidden] { display:none; }

  /* ---------------------------------------------------------- the ladder
     Every badge at once, each with the rating that earns it. Nothing else. */
  .ranks { border:0; padding:0; background:none; max-width:min(720px,94vw); }
  .ranks::backdrop { background:rgba(255,255,255,.62); backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px); }
  @supports not (backdrop-filter: blur(1px)) { .ranks::backdrop { background:rgba(255,255,255,.9); } }

  .ranks-in {
    position:relative;
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:30px clamp(20px,4vw,34px);
    box-shadow:0 34px 90px -44px rgba(63,63,63,.45);
  }
  .ranks-x {
    position:absolute; top:12px; right:12px;
    appearance:none; border:0; background:none; cursor:pointer;
    width:34px; height:34px; display:grid; place-items:center; border-radius:999px;
    color:var(--faint); transition:color .16s var(--ease), background-color .16s var(--ease);
  }
  @media (hover:hover) and (pointer:fine) { .ranks-x:hover { color:var(--ink); background:var(--sleeve); } }

  .ranks-list { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(2,1fr); gap:2px 26px; }
  .ranks-list li {
    display:flex; align-items:center; gap:13px;
    padding:8px 10px; border-radius:9px;
  }
  .ranks-list li[data-here="true"] { background:var(--amber-wash); }
  .ranks-list svg { flex:none; width:38px; height:38px; display:block; }
  .rank-range { font:500 12px var(--mono); letter-spacing:.03em; color:var(--soft); font-variant-numeric:tabular-nums; }
  .ranks-list li[data-here="true"] .rank-range { color:var(--ink); }

  @media (max-width:560px) { .ranks-list { grid-template-columns:1fr; } }
  @media (prefers-reduced-motion: reduce) { .badge-btn { transition:none; } }
</style>
</head>
<body data-nav="duels">

<a class="skip" href="#main">Skip to content</a>

<div class="app">
  <aside class="rail"></aside>

  <main class="main" id="main">
    <header class="head">
      <button class="rail-toggle" type="button" aria-label="Show navigation" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <h1 class="head-title">Duels</h1>
    </header>

    <section class="rank rise" id="rank">
      <button class="badge-btn" type="button" id="badgeBtn" aria-haspopup="dialog">
        <svg class="badge" id="badge" viewBox="0 0 100 100" role="img" aria-labelledby="badgeLabel">
          <title id="badgeLabel"></title>
        </svg>
      </button>

      <div class="stat">
        <p class="stat-n" id="rating">0</p>
        <p class="stat-band" id="band"></p>
      </div>

      <p class="togo" id="togo" hidden></p>
      <p class="note" id="note" hidden></p>

      <button class="btn" type="button" id="go">Find a duel</button>
    </section>
  </main>
</div>

<dialog class="ranks" id="ranks" aria-label="The ten levels">
  <div class="ranks-in">
    <button class="ranks-x" type="button" id="ranksX" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
    </button>
    <ol class="ranks-list" id="ranksList"></ol>
  </div>
</dialog>

<script src="../assets/app.js"></script>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const S=window.SATF||{};
const P=(S.player&&S.player())||{rating:1000,placed:false};
const LEVEL=(S.levelOf||(()=>3))(P.rating);
const CORNER=S.corner||'M45 8 H30 A22 22 0 0 0 8 30 V45 H34 V41 A7 7 0 0 1 41 34 H45 Z';

/* the bands, straight off spec/rating.md: a floor, eight equal steps, an open top */
const BANDS=[[1,800],[801,950],[951,1100],[1101,1250],[1251,1400],
             [1401,1550],[1551,1700],[1701,1850],[1851,2000],[2001,null]];
const rangeOf=i=>BANDS[i][1]===null?`${BANDS[i][0]} and up`
               :i===0?`up to ${BANDS[i][1]}`:`${BANDS[i][0]} to ${BANDS[i][1]}`;

/* ---------------------------------------------------------------- the badge
   One quadrant of the mark, turned four times, on a graphite track with an
   orange fill clipped to the level. Used big on the page and small in the list. */
let clipSeq=0;
function badge(svg,level,digit){
  [...svg.querySelectorAll('g,defs,text')].forEach(n=>n.remove());
  const id='fill'+(++clipSeq);
  const clip=el('clipPath',{id},el('defs',{},svg));
  const rect=el('rect',{x:0,y:100-level*10,width:100,height:level*10},clip);
  const quad=(fill,parent)=>[0,90,180,270].forEach(a=>
    el('path',{d:CORNER,fill,...(a?{transform:`rotate(${a} 50 50)`}:{})},parent));
  quad('#E4E1DC',el('g',{},svg));
  quad('#F18508',el('g',{'clip-path':`url(#${id})`},svg));
  if(digit!==''){
    const t=el('text',{x:50,y:51,'text-anchor':'middle','dominant-baseline':'central',
      'font-family':'Archivo, sans-serif','font-weight':'900','font-size':'36',fill:'#3F3F3F'},svg);
    t.textContent=digit;
  }
  return rect;
}

/* ---------------------------------------------------------------- the page */
(()=>{
  const placed=!!P.placed;

  const rect=badge($('badge'),placed?LEVEL:0,placed?LEVEL:'');
  $('badge').querySelector('title').textContent=placed
    ? `Level ${LEVEL} of ten, rating ${P.rating}.` : 'Not yet placed. Three duels to go.';

  /* the ring climbing to the level is the only motion on the page */
  if(!reduce&&placed){
    const target=LEVEL*10, t0=performance.now();
    (function step(now){
      const k=Math.max(0,Math.min(1,(now-t0)/900)), h=target*(1-Math.pow(1-k,3));
      rect.setAttribute('y',100-h); rect.setAttribute('height',h);
      if(k<1) requestAnimationFrame(step);
    })(t0);
  }

  $('rank').classList.toggle('unplaced',!placed);
  $('rating').textContent=placed?P.rating:'--';
  $('band').textContent=placed?`Level ${LEVEL} · ${rangeOf(LEVEL-1)}`:'';

  const togo=$('togo');
  if(placed&&LEVEL<10){ togo.hidden=false; togo.innerHTML=`<b>${BANDS[LEVEL][0]-P.rating}</b> till Level ${LEVEL+1}`; }
  else if(placed){ togo.hidden=false; togo.textContent='Top of the ladder'; }

  if(!placed){
    const note=$('note'); note.hidden=false;
    note.textContent='Everyone starts at 1000, which is level 3. Three placement duels decide where you actually sit.';
  }

  /* every badge, with the rating that earns it */
  const list=$('ranksList');
  BANDS.forEach((b,i)=>{
    const li=document.createElement('li');
    if(placed&&i+1===LEVEL) li.dataset.here='true';
    const svg=el('svg',{viewBox:'0 0 100 100','aria-hidden':'true'});
    badge(svg,i+1,i+1);
    const r=document.createElement('span');
    r.className='rank-range'; r.textContent=rangeOf(i);
    li.append(svg,r); list.appendChild(li);
  });

  const dlg=$('ranks');
  $('badgeBtn').addEventListener('click',()=>dlg.showModal());
  $('ranksX').addEventListener('click',()=>dlg.close());
  /* a click on the backdrop lands on the dialog itself, not its panel */
  dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });

  const go=$('go');
  go.textContent=placed?'Find a duel':'Calibrate';
  go.addEventListener('click',()=>console.log('[router]',placed?'/duel/find':'/duel/calibrate'));
})();
</script>

</body>
</html>
