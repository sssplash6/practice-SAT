<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Student · SAT Freshman admin</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body data-page="admin">
<main class="page" data-nofold>
  <div class="adm" id="root"></div>
</main>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/admin/admin.js"></script>
<script>
(() => {
  const { h, api, boot, num, pct, dur, day, ago, tone } = AD;
  const root = document.getElementById('root');
  const id = new URLSearchParams(location.search).get('id');
  const KINDS = { mock: 'Full section', section: 'Full section', module: 'Module', paper: 'Paper', twin: 'Twin', custom: 'Custom test', diagnostic: 'Diagnostic', shared: 'Shared test' };
  const SUBJ = { total: 'Total', rw: 'R&W', math: 'Math' };
  const testName = t => (t.kind === 'full' ? 'Full SAT' : `${t.subject === 'rw' ? 'R&W' : 'Math'} · ${KINDS[t.kind] || t.kind}${t.number ? ` #${t.number}` : ''}`);
  const tile = (v, l) => h('div', { class: 'adm-tile' }, h('b', { text: v }), h('span', { text: l }));
  const card = (title, sub, ...kids) => h('section', { class: 'adm-card' }, h('h2', { text: title }), sub ? h('p', { class: 'sub', text: sub }) : null, ...kids);
  const kv = pairs => h('dl', { class: 'adm-kv' }, pairs.flatMap(([k, v]) => [h('dt', { text: k }), h('dd', { text: v === null || v === undefined || v === '' ? '-' : String(v) })]));
  const meter = x => h('span', { class: 'adm-meter' }, h('i', { style: `width: ${Math.round((x || 0) * 100)}%` }));
  const table = (head, rows, right = 1) => h('div', { class: 'adm-wrap' }, h('table', { class: 'adm-t' },
    head ? h('thead', {}, h('tr', {}, head.map((t, i) => h('th', { class: i >= right ? 'n' : '', text: t })))) : null, h('tbody', {}, rows)));
  boot(root, 'Student', async () => {
    if (!id) { location.href = '/admin/students/'; return; }
    const d = await api(`/students/${encodeURIComponent(id)}`);
    const p = d.profile, a = d.activity, c = d.compete, w = d.words, m = d.mistakes;
    document.title = `${p.name || 'Student'} · SAT Freshman admin`;

    const max = Math.max(1, ...d.last30.map(x => x.answers));
    const bars = h('div', { class: 'adm-bars', role: 'img', 'aria-label': 'Questions answered per day over the last 30 days' },
      d.last30.map(x => h('i', { class: x.answers ? 'on' : '', style: `height: ${Math.max(2, Math.round(x.answers / max * 100))}%`, title: `${day(x.day)}: ${x.answers} answered, ${x.right} right` })));
    // a pointer or a tap names its day in the axis row (a fixed slot); at rest, the 30-day total
    const n30 = d.last30.length, total = d.last30.reduce((s, x) => s + (x.answers || 0), 0);
    const read = h('span', { class: 'adm-read', 'aria-hidden': 'true' });
    const say = k => {
      const x = k === null ? null : d.last30[k];
      read.textContent = x ? `${day(x.day)}: ${num(x.answers)} answered, ${num(x.right)} right` : `${num(total)} in ${n30} days`;
      [...bars.children].forEach((b, i) => b.toggleAttribute('data-at', i === k));
    };
    const at = e => { const r = bars.getBoundingClientRect(); return r.width ? Math.max(0, Math.min(n30 - 1, Math.floor((e.clientX - r.left) / r.width * n30))) : null; };
    bars.addEventListener('pointermove', e => say(at(e)));
    bars.addEventListener('pointerdown', e => say(at(e)));
    bars.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') say(null); });
    say(null);

    const doms = {};
    d.skills.forEach(s => { (doms[s.domain || 'Other'] = doms[s.domain || 'Other'] || []).push(s); });
    const skillRows = Object.entries(doms).flatMap(([dom, list]) => [
      h('tr', {}, h('td', { colspan: 4, class: 'adm-dom', text: dom })),
      ...list.map(s => h('tr', {}, h('td', { text: s.name }), h('td', { class: 'n', text: num(s.answers) }),
        h('td', { class: `n ${tone(s.accuracy)}` }, meter(s.accuracy), pct(s.accuracy)), h('td', { class: 'n', text: ago(s.last) })))]);

    const sit = d.tests.sittings.map(t => h('tr', {}, h('td', { text: day(t.finished) }), h('td', { text: testName(t) }),
      h('td', { class: 'n', text: t.low ? `${t.low}–${t.high}` : (t.asked ? `${t.right} / ${t.asked}` : '-') }), h('td', { class: 'n', text: t.minutes === null ? '-' : `${t.minutes} min` }),
      h('td', { class: `n${t.integrity && t.integrity.flagged ? ' low' : ''}`, text: AD.integrity(t.integrity) })));
    // scores side by side, College Board's order (Total, R&W, Math): now as the server's 20-point range, the target, and that subject's answers
    const sc = d.scores || {}, subs = a.subjects || {};
    const scRows = ['total', 'rw', 'math'].map(k => {
      const x = sc[k] || {}, s = k === 'total' ? { answers: a.answers, accuracy: a.accuracy } : (subs[k] || {});
      const now = x.low !== null && x.low !== undefined ? `${x.low}–${x.high}${x.source === 'yours' ? ' (typed)' : x.source && x.source !== 'measured' ? ` (${x.source})` : ''}` : '-';
      return h('tr', {}, h('td', { text: SUBJ[k] }), h('td', { class: 'n', text: now }), h('td', { class: 'n', text: x.target ? String(x.target) : '-' }),
        h('td', { class: 'n', text: num(s.answers || 0) }), h('td', { class: `n ${tone(s.accuracy)}`, text: pct(s.accuracy) }));
    });

    root.replaceChildren(
      h('a', { class: 'quiet adm-back', href: '/admin/students/' }, UI.icon('caret_left', 16), 'All students'),
      h('div', {}, h('h1', { class: 'h1', text: p.name || 'No name yet' }),
        h('p', { class: 'adm-empty', text: [p.email, p.handle && `@${p.handle}`, `joined ${day(p.joined)}`, `last active ${ago(a.last)}`].filter(Boolean).join('  ·  ') })),
      h('div', { class: 'adm-tiles' }, tile(num(a.answers), 'questions answered'), tile(pct(a.accuracy), 'accuracy'), tile(dur(a.minutes), 'study time'),
        tile(num(a.active_days), 'active days'), tile(a.streak === null || a.streak === undefined ? '-' : num(a.streak), 'day streak'), tile(num(d.tests.sittings.length), 'tests taken')),
      h('div', { class: 'adm-grid' },
        h('div', { class: 'adm-col' },
          card('Last 30 days', 'Questions answered each day', bars, h('div', { class: 'adm-axis' }, h('span', { text: day(d.last30[0].day) }), read, h('span', { text: 'today' }))),
          card('Skills', `${d.skills.length} skills practised`, d.skills.length ? table(['Skill', 'Answers', 'Accuracy', 'Last'], skillRows) : h('p', { class: 'adm-empty', text: 'No answers yet.' })),
          card('Tests', `${d.tests.practice_sets} practice sets finished`, sit.length ? table(['Date', 'Test', 'Score', 'Time', 'Integrity'], sit, 2) : h('p', { class: 'adm-empty', text: 'No tests taken yet.' }))),
        h('div', { class: 'adm-col' },
          card('Scores', null, table(['', 'Now', 'Target', 'Answers', 'Accuracy'], scRows)),
          card('Mistakes', `${m.open} open, ${m.fixed} fixed`, m.top.length ? table(null, m.top.map(t => h('tr', {}, h('td', {}, t.label, h('span', { class: 'adm-sm', text: t.skill })), h('td', { class: 'n', text: `${t.hits}×` })))) : h('p', { class: 'adm-empty', text: 'No open mistakes.' })),
          card('Compete', null, kv([['Rating', c.rating ? `${c.rating} (${c.rated_sittings} rated sittings)` : 'not rated yet'], ['Contests played', c.contests_played], ['Daily challenges', c.daily_challenges]]),
            c.recent.length ? table(null, c.recent.map(r => h('tr', {}, h('td', { text: r.title }), h('td', { class: 'n', text: r.points === null ? '-' : `${r.points} pts` }), h('td', { class: 'n', text: ago(r.at) })))) : null),
          card('Words', null, kv([['Words touched', num(w.touched)], ['Reviews', num(w.reviews)], ['Lapses', num(w.lapses)], ['Saved', num(w.saved)], ['Due now', num(w.due_now)]])),
          card('Goals and account', null, kv([['SAT date', p.exam_date && day(p.exam_date)], ['Daily minutes', p.daily_minutes], ['Study plan', p.has_plan ? 'yes' : 'no'],
            ['Hard questions', a.hard_answers ? `${num(a.hard_answers)} answered, ${pct(a.hard_accuracy)} right` : 'none yet'], ['Hints used', num(a.hints_used)], ['Badges earned', d.badges],
            ['Email', p.email ? `${p.email}${p.email_verified ? '' : ' (not verified)'}` : 'none'], ['Country', p.country], ['Parents', d.parents.length ? d.parents.map(x => x.name || x.email || 'unnamed').join(', ') : 'none'], ['Learner id', p.id]]),
            d.reports.length ? h('p', { class: 'adm-empty', text: `Sent ${d.reports.length} report${d.reports.length === 1 ? '' : 's'}: ${d.reports.map(r => r.title || r.kind).join('; ')}` }) : null))));
  });
})();
</script>
</body>
</html>
