<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Students · SAT Freshman admin</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  .adm { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding-bottom: 60px; }
  .adm-gate { display: grid; gap: 10px; max-width: 420px; }
  .adm-row { display: flex; gap: 8px; }
  .adm-row .field { flex: 1; min-width: 0; }
  .adm-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .adm-tile { display: grid; gap: 4px; padding: 14px 16px; border-radius: var(--radius-card); background: var(--tile); }
  .adm-tile b { font: 600 24px/1.1 var(--mono); letter-spacing: -.02em; }
  .adm-tile span { font: 500 12.5px var(--font); color: var(--soft); }
  .low { color: var(--amber-deep); } .mid, .good { color: var(--ink); }
  .adm-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (min-width: 980px) { .adm-grid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); } }
  .adm-col { display: grid; gap: 18px; min-width: 0; }
  .adm-card { display: grid; gap: 12px; padding: 18px 20px; border-radius: var(--radius-card); background: var(--tile); min-width: 0; }
  .adm-card h2 { margin: 0; font: 700 17px var(--font); letter-spacing: -.01em; }
  .adm-card .sub { margin: -6px 0 0; font: 400 13px var(--font); color: var(--soft); }
  .adm-wrap { overflow-x: auto; }
  table.adm-t { width: 100%; border-collapse: collapse; font: 400 14px/1.4 var(--font); }
  .adm-t th { text-align: left; font: 500 11.5px var(--mono); color: var(--soft); text-transform: uppercase; letter-spacing: .05em; padding: 0 10px 8px 0; white-space: nowrap; }
  .adm-t td { padding: 10px 10px 10px 0; border-top: 1px solid var(--line); vertical-align: middle; }
  .adm-t td.n, .adm-t th.n { text-align: right; white-space: nowrap; }
  .adm-t td.n { font: 400 13px var(--mono); }
  .adm-t tr.row { cursor: pointer; }
  .adm-t tr.row:hover td { background: var(--tile-2); }
  .adm-name { font-weight: 600; }
  .adm-sm { display: block; font: 400 12.5px var(--font); color: var(--soft); }
  .adm-bars { display: grid; grid-template-columns: repeat(30, minmax(0, 1fr)); gap: 3px; align-items: end; height: 96px; }
  .adm-bars i { display: block; border-radius: 3px 3px 0 0; background: var(--faint); }
  .adm-bars i.on { background: var(--amber); }
  .adm-axis { display: flex; justify-content: space-between; font: 500 11.5px var(--mono); color: var(--soft); }
  .adm-meter { display: inline-block; width: 60px; height: 6px; border-radius: 3px; background: var(--mat); vertical-align: middle; margin-right: 8px; overflow: hidden; }
  .adm-meter i { display: block; height: 100%; background: var(--ink); }
  .adm-t td.adm-dom { font: 600 12px var(--mono); color: var(--soft); text-transform: uppercase; letter-spacing: .05em; padding-top: 14px; }
  .adm-kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 18px; margin: 0; font: 400 14px/1.4 var(--font); }
  .adm-kv dt { color: var(--soft); } .adm-kv dd { margin: 0; overflow-wrap: anywhere; }
  .adm-search { display: flex; flex-wrap: wrap; gap: 8px; }
  .adm-search .field { flex: 1 1 220px; max-width: 360px; }
  .adm-back { justify-self: start; }
  .adm-empty { color: var(--soft); font: 400 14px var(--font); margin: 0; }
</style>
</head>
<body data-page="admin">
<main class="page">
  <div class="adm" id="root"></div>
</main>
<script src="/assets/kit.js"></script>
<script src="/admin/admin.js"></script>
<script>
(() => {
  const { h, api, boot, num, pct, dur, ago, tone } = AD;
  const root = document.getElementById('root');
  boot(root, 'Students', async () => {
    const d = await api('/students');
    let q = '', sort = 'last';
    const SORTS = { last: ['Last active', s => -(Date.parse(s.last || s.joined || 0) || 0)], answers: ['Most answers', s => -s.answers],
      accuracy: ['Lowest accuracy', s => (s.accuracy === null ? 2 : s.accuracy)], minutes: ['Most study time', s => -s.minutes],
      mistakes: ['Most open mistakes', s => -s.open_mistakes], joined: ['Newest', s => -(Date.parse(s.joined) || 0)] };
    const body = h('tbody');
    const draw = () => {
      const rows = d.students.filter(s => !q || `${s.name} ${s.email || ''} ${s.handle || ''}`.toLowerCase().includes(q)).sort((a, b) => SORTS[sort][1](a) - SORTS[sort][1](b));
      body.replaceChildren(...rows.map(s => {
        const tr = h('tr', { class: 'row', tabindex: '0', onclick: () => { location.href = `/admin/student/?id=${encodeURIComponent(s.id)}`; } },
          h('td', {}, h('span', { class: 'adm-name', text: s.name || 'No name yet' }), h('span', { class: 'adm-sm', text: s.email || (s.handle ? `@${s.handle}` : s.id.slice(0, 14)) })),
          h('td', { text: ago(s.last) }), h('td', { class: 'n', text: num(s.answers) }), h('td', { class: `n ${tone(s.accuracy)}`, text: pct(s.accuracy) }),
          h('td', { class: 'n', text: dur(s.minutes) }), h('td', { class: 'n', text: num(s.days) }), h('td', { class: 'n', text: num(s.tests) }),
          h('td', { class: 'n', text: num(s.open_mistakes) }), h('td', { class: 'n', text: s.rating ? num(s.rating) : '-' }));
        tr.addEventListener('keydown', e => { if (e.key === 'Enter') tr.click(); });
        return tr;
      }));
      if (!rows.length) body.replaceChildren(h('tr', {}, h('td', { colspan: 9, class: 'adm-empty', text: 'No students match.' })));
    };
    const search = h('input', { class: 'field', type: 'search', placeholder: 'Search name or email', 'aria-label': 'Search students' });
    search.addEventListener('input', () => { q = search.value.trim().toLowerCase(); draw(); });
    const sel = h('select', { class: 'field', 'aria-label': 'Sort' }, Object.entries(SORTS).map(([k, v]) => h('option', { value: k, text: v[0] })));
    sel.addEventListener('change', () => { sort = sel.value; draw(); });
    const tile = (v, l) => h('div', { class: 'adm-tile' }, h('b', { text: v }), h('span', { text: l }));
    draw();
    root.replaceChildren(h('h1', { class: 'h1', text: 'Students' }),
      h('div', { class: 'adm-tiles' }, tile(num(d.total), 'students'), tile(num(d.active_7d), 'active in the last 7 days'), tile(num(d.answers), 'questions answered')),
      h('div', { class: 'adm-search' }, search, sel),
      h('div', { class: 'adm-card' }, h('div', { class: 'adm-wrap' }, h('table', { class: 'adm-t' },
        h('thead', {}, h('tr', {}, ['Student', 'Last active', 'Answers', 'Accuracy', 'Study time', 'Days', 'Tests', 'Open mistakes', 'Rating'].map((t, i) => h('th', { class: i > 1 ? 'n' : '', text: t })))), body))));
  });
})();
</script>
</body>
</html>
