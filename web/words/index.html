<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Words · SAT Freshman</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* The Words library (spec 3.8 §3, words.md layout, W2 W4 W5 W11 W12 W14 W18 W21). The word bank is the task, in
     main; Today's words, the daily questions, By exam day and Collections sit in the aside. Shared parts (tabs, Today's
     words, By exam day, the sheet) are words-ui.js. */
  /* block, not a grid: the shell puts its banner and Up next strip inside main with their own margins, and grid gaps
     doubled them; only this page's own blocks are spaced */
  .wl { padding-bottom: 72px; }   /* room for the study bar */
  .wl-head ~ * { margin-top: var(--card-gap); }
  .wl * { min-width: 0; }
  .wl-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .wl-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .wl-head > #bring { margin-left: auto; }
  .wl-main { display: grid; gap: 20px; align-content: start; }
  #today:empty, #finish:empty { display: none; }
  /* one filter row (premium): search, Filters · n (a popover here, the shared sheet on a phone), the sort as its value
     alone ("A–Z"), the count and one menu; the facets that are set show as removable chips under it */
  .wl-fbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .wl-fbar > #q { flex: 1 1 220px; width: auto; min-width: 180px; }
  .wl-fbar .filters { flex: none; }
  .wl-fbar .filters > :not(.filters-open):not(.filters-keep) { display: none; }
  .wl-fbar .filters > .filters-open { display: inline-flex; order: -1; }
  .wl-fbar [data-fkey="sort"] .dd-k { display: none; }
  .wl-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: -8px; }
  .wl-chips .wchip svg { width: 14px; height: 14px; color: var(--soft); }
  .wl-legacts { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .wl-count { font: 500 12.5px var(--font); color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .wl-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; max-width: 300px; font: 400 14px/1.4 var(--font); }
  .wl-legend > li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; align-items: center; }
  .wl-legend .mk { display: flex; justify-content: center; }
  .wl-legend .mk .sl { width: 40px; }
  .wl-legend .st { color: var(--amber); }
  /* the aside: Today's words is the page's one hero; the daily questions and By exam day are lines at its foot */
  .wl-today { display: grid; gap: 12px; }
  .wl-today:has(#today:empty):has(#finish:empty):has(#strip[hidden]) { display: none; }
  .wl-tfoot { display: grid; gap: 12px; }
  .wl-tfoot > * { padding-top: 12px; border-top: 1px solid var(--line); }
  .wl-tfoot .wfin .fold-s h2 { font-size: 14.5px; }
  .wl-dline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  .wl-dline > .btn { margin-left: auto; }
  .wl-dqs { display: grid; }
  .wl-dq { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; }
  .wl-dq + .wl-dq { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .wl-dq-t { font: 600 14.5px/1.35 var(--font); }
  .wl-dq-s { grid-column: 1; font: 400 12.5px/1.4 var(--font); color: var(--soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .wl-dq-s.q { font: 400 14.5px/1.45 var(--serif); color: var(--ink); }
  .wl-dq > .btn { grid-column: 2; grid-row: 1 / span 2; }
  /* Collections: a plain filter list, no fill until hover; the chosen one keeps the shared selected look */
  .wl-colls .choice-row[aria-pressed="true"] { box-shadow: none; }   /* picked: the tint band and 600, no boxed edge (as the nav's current item) */
  .wl-colls :where(.choice-row:not([aria-pressed="true"])) { background: none; }   /* :where: the shared hover and states still win */
  .wl-all > .fold-s { font: 600 16px/1.3 var(--font); letter-spacing: -.01em; color: var(--ink); }
  .wl-all[open] > .fold-s { margin-bottom: 8px; }
  .wl-groups { display: grid; gap: 12px; }
  .wl-group { display: grid; gap: 4px; }
  /* a collection is the shared .choice-row: the name left, its due count and known share quiet on the right, the known
     share again as a hairline bar along its foot */
  .wl-gtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 4px 12px; }
  .ctile b { flex: 1 1 0; min-width: 0; font-weight: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctile .choice-meta { flex: none; }
  .wl-new { padding: 8px 12px 0; }
  /* the grid */
  #gridSec { display: grid; gap: 12px; }
  .wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  @media (max-width: 389px) { .wgrid { grid-template-columns: repeat(2, 1fr); } }
  .wtile { appearance: none; border: 0; cursor: pointer; text-align: left; position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto 1fr; gap: 2px 6px;
    padding: 10px 12px 12px; border-radius: 10px; background: var(--raised); box-shadow: var(--shadow-1); color: var(--ink); font: inherit;
    transition: box-shadow .14s var(--ease); }
  /* a tile is a small clickable card: white on the warm page at --shadow-1, a step up on hover (no lift) */
  @media (hover: hover) and (pointer: fine) { .wtile:not(.skel):not([aria-checked="true"]):hover { box-shadow: var(--shadow-2); } }
  .wtile .w { grid-area: 1 / 1; font: 600 14.5px/1.3 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the rows under the word span the tile in source order; the hover line (part of speech, difficulty) goes last */
  .wtile > :is(.mt, .tag, .bot) { grid-column: 1 / -1; }
  .wtile > .tag.reveal { order: 1; align-self: end; }
  /* a fine pointer: the hover line (part of speech, difficulty) shows in the topic's place, so no row waits empty;
     a touch screen shows it always, on its own line */
  @media (hover: hover) and (pointer: fine) {
    .wtile.swap > :is(.mt, .tag) { grid-row: 2; }
    .wtile.swap > .mt { transition: opacity .16s var(--ease); }
    .wtile.swap:is(:hover, :focus-within) > .mt { opacity: 0; }
  }
  .wtile .w .sn { font-weight: 500; color: var(--soft); }
  .wtile .tag { display: flex; align-items: center; gap: 6px; font: 500 11.5px/1.3 var(--font); color: var(--soft); }
  /* strength: a 2px line at the foot, only once the word is studied (no empty pips on new words) */
  .sl { display: block; height: 2px; border-radius: 1px; background: var(--track); overflow: hidden; }
  .sl i { display: block; height: 100%; background: var(--amber); }
  .wtile .sl { position: absolute; left: 12px; right: 12px; bottom: 6px; }
  .wgrid.selecting .wtile .sl { right: 34px; }
  .wtile .mt { font: 400 12.5px/1.35 var(--font); color: var(--soft); }
  .wtile .mt.on { color: var(--ink); }
  .wtile .bot { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 4px; }
  .wtile .dbars { font-size: 0; }
  .wtile .marks { grid-area: 1 / 2; display: flex; align-items: center; gap: 4px; font: 500 11.5px var(--font); }
  .wtile .marks:empty { display: none; }
  .wtile .marks .st { display: inline-flex; color: var(--amber); }   /* saved: the filled star */
  .wtile .marks .st svg { width: 13px; height: 13px; }
  /* selecting: the shared checkbox look (A1), the check growing in */
  .wtile .ck { position: absolute; bottom: 8px; right: 8px; width: 18px; height: 18px; border-radius: 5px; display: none;
    background: var(--paper) no-repeat center / 0 0; box-shadow: inset 0 0 0 1.5px var(--off-fg), inset 0 1px 2px rgb(var(--sh) / .08);
    transition: background-color .14s var(--ease), box-shadow .14s var(--ease), background-size .16s var(--ease); }
  .wgrid.selecting .wtile .ck { display: block; }
  .wtile[aria-checked="true"] { background: var(--sel-bg); box-shadow: var(--sel-edge); }
  .wtile[aria-checked="true"] .ck { background-color: var(--amber); background-image: var(--check-ink); background-size: 13px 13px; box-shadow: inset 0 0 0 1px var(--pill-edge); }
  .wtile.skel { cursor: default; }
  .wl-more { justify-self: center; }
  .wl-msg { padding: 32px 0; text-align: center; display: grid; gap: 12px; justify-items: center; }
  .lmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
  @media (max-width: 759px) { .lmap { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; } .lmap .logic-col { flex: 0 0 82%; scroll-snap-align: start; } }
  .logic-col { display: grid; gap: 8px; align-content: start; padding: 12px; border-radius: var(--radius-card); background: var(--raised); box-shadow: var(--shadow-1); }
  .logic-col h3 { font: 600 14.5px var(--font); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .logic-col .test { font: 400 12.5px/1.4 var(--font); color: var(--ink); }
  .logic-col .wtile { min-height: 0; padding: 8px 10px; box-shadow: var(--edge); }   /* flat inside the column's card */
  .logic-col .kb { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .logic-col .kb i { display: block; height: 100%; background: var(--ink); }
  /* the study bar: only while the view is narrowed (a search, a filter) or words are being selected */
  .wl-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--page); box-shadow: 0 -1px 0 var(--line); }
  body.has-side .wl-bar { left: var(--side-w); }
  body.has-rail .wl-bar { left: var(--rail-w); }
  .wl-bar-in { max-width: var(--max); margin: 0 auto; min-height: 56px; padding: 8px var(--gutter) calc(8px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .wl-bar[hidden] { display: none; }
  .wl-bar .l1 { font: 600 14.5px/1.35 var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wl-bar-in > div:first-child { min-width: 0; }
  .wl-bar .go { display: flex; gap: 8px; align-items: center; flex: none; }
  /* the sticky aside stops above the bar (56px and the 16px gap) */
  body:has(.wl-bar:not([hidden])) .wl { --twocol-bottom: 72px; }
  @media (max-width: 759px) {
    .wl-head > #wtabs { flex: 1 1 100%; order: 1; }   /* Add words stays beside the title (its meta wraps under it), the tabs take their own row */
    .wl-title { flex: 1 1 0; }
    .wl-fbar > #q { flex: 1 1 100%; }
    .wl-bar { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    .wl-bar-in { min-height: 52px; padding-top: 6px; padding-bottom: 6px; flex-wrap: nowrap; gap: 8px; }
    .wl-bar .l1 { font-size: 14px; }
    .wl { padding-bottom: calc(148px + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>
<body data-page="words">
<header id="bar"></header>
<main class="page wl" id="main" tabindex="-1">
  <header class="wl-head">
    <div class="wl-title">
      <h1 class="h1">Words</h1>
      <p class="meta" id="meta">Loading…</p>
    </div>
    <div id="wtabs"></div>
    <button type="button" class="btn dd" id="bring" aria-haspopup="menu">Add words</button>
  </header>
  <div class="twocol side-first">
    <div class="wl-main">
      <div class="wl-fbar" id="fbar"><input class="field sm" id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search words and meanings" aria-label="Search words and meanings"></div>
      <div class="wl-chips" id="fchips" role="group" aria-label="Filters that are on" hidden></div>
      <section id="gridSec" aria-label="Words" aria-live="polite"></section>
    </div>
    <aside class="twocol-side" aria-label="Today and collections">
      <div class="card hero wl-today" data-m-now>
        <div id="today"></div>
        <div class="wl-tfoot"><section class="wl-dline" id="strip" aria-label="Daily questions" hidden></section><div id="finish"></div></div>
      </div>
      <section class="wl-colls" id="colls" aria-label="Collections"></section>
    </aside>
  </div>
</main>
<div class="wl-bar" id="studybar" role="region" aria-label="Study these words" hidden>
  <div class="wl-bar-in">
    <div><p class="l1"><span id="barText">Loading…</span> <button type="button" class="quiet" id="barDone" hidden>Done selecting</button></p></div>
    <div class="go"><button type="button" class="ibtn" id="barMore" aria-label="Share, print or grade a worksheet" aria-haspopup="menu"></button><button type="button" class="btn sm" id="barQuiz">Quiz</button><button type="button" class="btn sm" id="barCards">Flashcards</button></div>
  </div>
</div>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script>UI.shell({ page: 'words', now: false, ownPrimary: true });   // Today's words is this page's Start: the Now strip and section bar don't repeat it, the sidebar's goes quiet</script>
<script src="/assets/words-ui.js"></script>
<script>
(() => {
  'use strict';
  const h = UI.h, $ = id => document.getElementById(id);
  const W = UI.word;
  const cap = s => (s ? s[0].toUpperCase() + s.slice(1) : '');
  const num = n => UI.num ? UI.num(n) : String(n);
  const params = () => new URLSearchParams(location.search);
  const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } } };
  const SUBJECTS = [['science', 'Science'], ['history', 'History & social studies'], ['literature', 'Literature & arts']];
  const LOGIC = [['contrast', 'Contrast', 'Does sentence 2 push against sentence 1?'], ['concession', 'Concession', 'Does sentence 2 admit a point before the claim still holds?'],
    ['cause-effect', 'Cause → effect', 'Is sentence 2 a result of sentence 1?'], ['addition', 'Addition', 'Does sentence 2 add a point in the same direction?'],
    ['example', 'Example', 'Is sentence 2 a case of what sentence 1 says?'], ['sequence', 'Sequence', 'Does sentence 2 come next in time?'],
    ['clarification', 'Clarification and emphasis', 'Does sentence 2 restate or sharpen sentence 1?'], ['similarity', 'Similarity', 'Does sentence 2 show the same thing elsewhere?'],
    ['conclusion', 'Conclusion', 'Does sentence 2 sum up what came before?']];
  const CONFUSABLE = { concession: 'contrast', contrast: 'concession', 'cause-effect': 'sequence', sequence: 'cause-effect', example: 'addition',
    addition: 'example', clarification: 'example', similarity: 'addition', conclusion: 'cause-effect' };
  const STATUS_OPTS = [['new', 'New'], ['learning', 'Learning'], ['claimed', 'Claimed'], ['known', 'Known'], ['due', 'Due today'], ['saved', 'Saved'],
    ['missed', 'Missed lately'], ['thought', 'Thought I knew'], ['probable', 'Probably known'], ['trap', 'Fell for a trap'], ['stubborn', 'Stubborn'],
    ['atrisk', 'At risk'], ['lookedup', 'Looked up'], ['second', 'Two meanings'], ['ladder', 'On a ladder'], ['root', 'Has a root'], ['mine', 'My own']];
  const SORTS = [['az', 'A–Z'], ['topic', 'By topic'], ['value', 'Test value'], ['due', 'Due soonest'], ['weakest', 'Weakest first'],
    ['hardforyou', 'Hard for you'], ['missed', 'Most missed by students'], ['level', 'Level'], ['recent', 'Recently added']];
  const LIMIT0 = 400;

  let entered = false;
  let lib = null, ins = null, words = [], famSize = new Map(), rootsOf = new Map(), fbar = null, shown = [], limit = LIMIT0;
  let meanings = params().get('m') === '1', selecting = false, selected = new Set(), lastPick = null, alsoOf = new Map(), fdefs = [];
  const qEl = $('q');
  qEl.value = params().get('q') || '';

  UI.menu.bind($('bring'), () => [
    { label: 'A word', sub: 'Type one in yourself', kbd: 'N', onClick: () => UI.addWord() },
    { separator: true },
    { label: 'From a text', sub: 'Paste a passage; see which words are new', onClick: () => UI.bringWords('text') },
    { label: 'A word list', sub: 'One per line or comma-separated', onClick: () => UI.bringWords('list') },
    { label: 'A question I missed', sub: 'Log a Words in Context or Transitions miss', onClick: () => UI.bringWords('missed') },
    { label: 'Import a file or a paste', sub: 'Quizlet, CSV, one per line', onClick: () => UI.bringWords('import') },
  ]);
  UI.wordsTabs($('wtabs'), 'library');

  function setUrl(k, v) {
    try { const u = new URL(location.href); if (v === null || v === '' || v === undefined) u.searchParams.delete(k); else u.searchParams.set(k, v); history.replaceState(history.state, '', u); } catch (_) {}
  }

  /* ---------------- load */
  async function load() {
    skeleton();
    try { [lib, ins] = await Promise.all([UI.api('/words'), UI.api('/words/insights', { quiet: true }).catch(() => null)]); }
    catch (e) { $('meta').textContent = ''; $('gridSec').replaceChildren(); UI.cardError($('gridSec'), load, 'Words did not load.'); if (e.offline) UI.todayWords($('today'), { card: false }); return; }
    words = lib.words || [];
    famSize = new Map(); rootsOf = new Map();
    words.forEach(w => {
      if (w.family) famSize.set(w.family, (famSize.get(w.family) || 0) + 1);
      (w.roots || []).forEach(r => { if (!rootsOf.has(r)) rootsOf.set(r, []); rootsOf.get(r).push(w); });
    });
    (lib.groups || []).forEach(g => (g.collections || []).forEach(c => { W._coll[c.id] = c.name; }));
    const builtin = new Set(['second-sense', 'my-words', ...Object.keys(W._coll)]);
    W._lists = [...new Set(words.flatMap(w => [...(w.lists || []).filter(l => !builtin.has(l)), ...(w.own && w.collection ? [w.collection] : [])]))];
    W.index().then(ix => { ix.words.forEach(x => alsoOf.set(x.slug, (x.also || []).join(' ').toLowerCase())); if (qEl.value) paintGrid(); }).catch(() => {});
    head();
    UI.todayWords($('today'), { lib, card: false, onChange: load });   // the hero's surface is .wl-today
    strip();
    if (ins) UI.wordsFinish($('finish'), ins, { lib, card: false, collapsible: true, onChange: load }); else $('finish').replaceChildren();   // By exam day (W12), a line at the hero's foot
    groups();
    if (!fbar) filters(); else { fbar.counts && fbar.counts('s', statusCounts()); fchips(); }
    paintGrid();
    if (!entered) { entered = true; document.querySelectorAll('.wl-main, .wl .twocol-side').forEach(x => { x.dataset.m = 'stagger'; }); }
    const w = params().get('w');
    if (w && !document.querySelector('dialog.wsheet[open]')) openWord(w, { fromLink: true });
  }
  function skeleton() {
    const g = h('div', { class: 'wgrid' });
    for (let i = 0; i < 18; i++) g.append(h('div', { class: 'wtile skel', 'aria-hidden': 'true' }));
    $('gridSec').replaceChildren(g);
  }

  /* ---------------- title meta: "1,180 words · 212 known · 64 claimed · 12 due" */
  function head() {
    const c = lib.counts || {};
    const mine = c.mine || words.filter(w => w.own).length;
    $('meta').textContent = [c.known ? `${num(c.known)} known` : null, mine ? `${num(mine)} of your own` : null].filter(Boolean).join(' · ');
  }

  /* ---------------- the daily questions: one line at the hero's foot ("2 to answer"); both open in a sheet */
  const DAILY = [['wic', 'Word of the day'], ['transition', 'Transition']];
  let dailyData = null;
  function strip() {
    UI.api('/words/today', { quiet: true }).then(t => { dailyData = t; dailyLine(); }).catch(() => { dailyData = null; dailyLine(); });
  }
  function dailyLine() {
    const el = $('strip');
    const items = dailyData ? DAILY.filter(([f]) => dailyData[f] && dailyData[f].item) : [];
    el.hidden = !items.length;
    if (!items.length) { el.replaceChildren(); return; }
    const done = items.filter(([f]) => dailyData[f].mine).length, all = done === items.length;
    el.replaceChildren(h('span', { class: 'wl-dq-t', text: items.length === 1 ? 'Daily question' : 'Daily questions' }),
      h('span', { class: 'meta', text: all ? (items.length === 1 ? 'done' : 'both done') : done ? `${done} of ${items.length} done` : `${items.length} to answer` }),
      h('button', { type: 'button', class: 'btn sm', text: all ? 'See them' : 'Answer', 'aria-haspopup': 'dialog', onclick: dailySheet }));
  }
  function dailySheet() {
    const sh = UI.sheet({ title: 'Daily questions', size: 's', body: h('div', { class: 'wl-dqs' }, DAILY.map(([f, t]) => daily(f, t, () => sh.close())).filter(Boolean)) });
  }
  function daily(fmt, title, close) {
    const d = dailyData && dailyData[fmt];
    if (!d || !d.item) return null;   // no item today: no row
    const row = h('div', { class: 'wl-dq' }, h('span', { class: 'wl-dq-t', text: title }));
    const open = () => { close(); answerDaily(fmt, title, d); };
    if (d.mine) {
      const g = /^[0-3]$/.test(String(d.mine.given)) ? (d.item.choices || [])[+d.mine.given] : d.mine.given;
      const w = d.word ? (words.find(x => x.slug === d.word) || {}).word || d.word : '';
      row.append(h('span', { class: 'wl-dq-s', text: [w, d.mine.correct ? 'You got it' : `You picked “${g}”`, 'new one tomorrow'].filter(Boolean).join(' · ') }),
        h('button', { type: 'button', class: 'btn sm', text: 'See it again', onclick: open }));
    } else {
      row.append(h('span', { class: 'wl-dq-s q', text: d.item.text || '' }), h('button', { type: 'button', class: 'btn sm', text: 'Answer it', onclick: open }));
    }
    return row;
  }
  async function answerDaily(fmt, title, d) {
    try { if (!UI.workspace) await UI.need('question'); } catch (_) { UI.toast('Could not load the question.'); return; }
    const item = d.item;
    const q = { id: item.item_id, type: 'mcq', stem: item.text || '', choices: item.choices || [], latex: [] };
    UI.sheet({ title, size: 'm', body: b => {
      const ws = UI.workspace(b, q, { mode: 'quiz', head: { label: fmt === 'wic' ? 'Words in Context' : 'Transitions' },
        onCheck: async (answer, meta) => {

  }
  function legendNode() {
    const n = fn => shown.filter(fn).length;
    const row = (mark, text, count) => h('li', {}, h('span', { class: 'mk' }, mark), h('span', {}, text, count ? h('span', { class: 'meta', text: ` · ${num(count)} here` }) : null));
    return h('ul', { class: 'wl-legend' },
      row(strength({ state: { box: 3 } }), 'Strength, 1 to 5 (a new word has none)'),
      row('✓', 'Proven in context', n(w => w.proven)),
      row(h('span', { class: 'badge line', text: 'Due' }), 'Due today', n(w => w.is_due)),
      row(h('span', { class: 'st', html: UI.svg(UI.ICON_FILL.star, 13) }), 'Saved', n(w => w.saved)),
      row(h('span', { class: 'dot' }), 'Fell for a trap', n(w => w.trap)),
      row('⌇', 'Stubborn', n(w => w.stubborn)),
      row(UI.dbars ? UI.dbars('medium') : '', 'Difficulty: estimated until your first answer, then measured from students’ answers'));
  }

  /* ---------------- the study bar */
  function studySlugs() {
    const pick = selected.size ? shown.filter(w => selected.has(w.slug)) : shown;
    const rank = w => (w.is_due ? 0 : W.status(w) === 'new' ? 1 : 2);
    return [...pick].sort((a, b) => rank(a) - rank(b)).slice(0, 200).map(w => w.slug);
  }
  function narrowed() {
    const v = fbar ? fbar.values() : {};
    return selected.size > 0 || !!qEl.value.trim() || ['c', 't', 'f', 'd', 's', 'p'].some(k => [].concat(v[k] || []).filter(Boolean).length);
  }
  function barShow() {
    const n = narrowed();
    $('studybar').hidden = !(n || selecting) || !words.length;
    $('barDone').hidden = !selecting;
  }
  function bar() {
    const pick = selected.size ? shown.filter(w => selected.has(w.slug)) : shown;
    const due = pick.filter(w => w.is_due).length, nw = pick.filter(w => W.status(w) === 'new').length;
    $('barText').textContent = selected.size ? `${num(selected.size)} selected` : '';
    const last = ls.get('satf.words.study', {}) || {};
    const n = (last.cards && last.cards.count) || 20;
    $('barCards').title = pick.length > n ? `Takes ${n}: due first, then new` : '';
    $('barCards').disabled = $('barQuiz').disabled = !pick.length;
    barShow();
  }
  function cardsGo() {
    const last = (ls.get('satf.words.study', {}) || {}).cards || {};
    UI.startWords({ mode: 'cards', deck: { source: 'words', words: studySlugs() }, count: Math.min(200, last.count || 20), order: 'due', direction: last.direction || 'word' });
  }
  function quizGo() {
    const last = (ls.get('satf.words.study', {}) || {}).quiz || {};
    const deck = { source: 'words', words: studySlugs() };
    if (last.formats && last.formats.length) UI.startWords({ mode: 'quiz', deck, formats: last.formats, count: last.count || 10, timer: last.timer || 0 }, { fallback: { mode: 'quiz', deck, formats: ['meaning2word', 'word2meaning'], count: last.count || 10 } });
    else W.quizStart(deck, 10);
  }
  $('barCards').addEventListener('click', cardsGo);
  $('barQuiz').addEventListener('click', quizGo);
  $('barDone').addEventListener('click', () => setSelecting(false));

  // ⋯: share this view or the selection, print it as a worksheet, grade a printed one (W20)
  const viewTitle = () => {
    const c = (fbar ? fbar.values().c : []) || [];
    const name = c.length === 1 ? ((W._coll || {})[c[0]] || c[0]) : '';
    return selected.size ? (name ? `${name} · picked` : 'Picked words') : name || (qEl.value.trim() ? `Words: ${qEl.value.trim()}` : 'Words');
  };
  // study (the view menu only: the bar has its own buttons), share, print, grade
  function studyItems(withStudy) {
    const pick = studySlugs();
    return [
      ...(withStudy ? [{ label: 'Flashcards', sub: `${num(pick.length)} ${pick.length === 1 ? 'word' : 'words'} here, due first`, disabled: !pick.length, onClick: cardsGo },
        { label: 'Quiz', sub: 'These words, your last quiz settings', disabled: !pick.length, onClick: quizGo }] : []),
      { label: 'Share these words', sub: `${num(pick.length)} words · a link anyone can open`, disabled: !pick.length, onClick: () => W.share({ title: viewTitle(), words: pick }) },
      { label: 'Print a worksheet', sub: 'In context and meaning, with a key page', disabled: !pick.length,
        onClick: () => { const q = (ls.get('satf.words.study', {}) || {}).quiz || {}; W.print({ source: 'words', words: pick }, { formats: q.formats, count: Math.min(20, pick.length) }); } },
      { label: 'Grade a worksheet', sub: 'The code and your letters', onClick: () => W.gradeSheet() }];
  }
  $('barMore').replaceChildren(UI.icon('more', 20));
  $('barMore').addEventListener('click', () => UI.menu($('barMore'), studyItems(false), { align: 'end', label: 'More' }));

  /* ---------------- search and keys */
  let qt = 0;
  qEl.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => { setUrl('q', qEl.value.trim() || null); limit = LIMIT0; paintGrid(); }, 150); });
  qEl.addEventListener('keydown', e => { if (e.key === 'Escape' && qEl.value) { qEl.value = ''; setUrl('q', null); paintGrid(); } });
  UI.keys.register('wordslib', {
    '/': { does: 'Search words', run: () => { qEl.focus(); qEl.select(); } },
    N: { does: 'Add a word', run: () => UI.addWord() },
  }, { label: 'Words' });
  W.listKeys('wordslist', '.wgrid .wtile, .lmap .wtile, .wroots .wtile', { label: 'Word tiles', select: el => {
    const slug = el.dataset.slug;
    if (!slug) return;
    if (!selecting) setSelecting(true);
    const t = document.querySelector(`.wtile[data-slug="${CSS.escape(slug)}"]`);
    if (t) { t.click(); t.focus(); }
  } });
  document.addEventListener('satf:words', () => load());
  addEventListener('popstate', () => { const w = params().get('w'); if (w) openWord(w, { fromLink: true }); });
  load();
})();
</script>
</body>
</html>
