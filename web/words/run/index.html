<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Words run · SAT Freshman</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/runner.css">
<style>
  /* The Words runner (spec 3.8 §6-§8; words.md W1-W3, W6-W11, W15, W16). No site chrome
     (design rule 6): its own top bar, one item at a time, then the summary. */
  body { background: var(--paper); }
  .wr { max-width: 820px; margin: 0 auto; padding: 0 var(--gutter) calc(120px + env(safe-area-inset-bottom, 0px)); }
  .wr * { min-width: 0; }
  .wr-top { position: sticky; top: 0; z-index: 20; background: var(--paper); display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center;
    padding: 12px 0 10px; box-shadow: 0 1px 0 var(--line); }
  .wr-mid { display: grid; gap: 6px; }
  .wr-title { font: 600 14px var(--font); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .wr-title .meta { font-size: 12.5px; }
  .wr-prog { display: flex; gap: 3px; align-items: center; }
  .wr-prog i { flex: 1; height: 6px; border-radius: 3px; background: var(--track); max-width: 32px; }
  .wr-prog i.know, .wr-prog i.right { background: var(--amber); }
  .wr-prog i.dont, .wr-prog i.wrong { background: var(--ink); }
  .wr-prog i.done { background: var(--tile-2); box-shadow: inset 0 0 0 1px var(--faint); }
  .wr-prog i.cur { background: var(--faint); }   /* where you are: a step darker, no ring */
  .wr-prog i.grow { animation: wgrow .3s var(--ease) both; }
  @keyframes wgrow { from { transform: scaleX(0); } }
  .wr-prog .n { font: 500 12.5px var(--font); color: var(--soft); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .wr-clock { font: 500 12.5px var(--font); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .wr-clock.low { color: var(--ink-deep); font-weight: 600; }
  .wr-tools { display: flex; gap: 2px; }
  .wr-tbar { height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; margin-top: 6px; }
  .wr-tbar i { display: block; height: 100%; background: var(--ink); transform-origin: left; }
  .wr-stage { padding-top: 24px; display: grid; gap: 16px; }
  .wr-status { min-height: 22px; font: 500 14px var(--font); text-align: center; color: var(--ink); }
  .wr-left { font: 500 12.5px var(--font); color: var(--soft); text-align: center; font-variant-numeric: tabular-nums; }
  /* the flashcard */
  /* the flashcard is the page's one raised surface (premium): paper with a warm layered shadow; while 2 or more cards are
     left, the deck shows as up to two edges under it (data-left, a real count) */
  .fstack { position: relative; width: 100%; max-width: 620px; margin: 8px auto 0; perspective: 1400px; isolation: isolate; }
  /* the edges shrink toward the card's foot (transform-origin bottom), so 6px and 12px of each actually show under it */
  .fstack[data-left]::before, .fstack[data-left="2"]::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: var(--radius-card);
    background: var(--paper); box-shadow: var(--shadow-1); transform-origin: 50% 100%; transform: translateY(7px) scale(.96); }
  .fstack[data-left="2"]::after { z-index: -2; transform: translateY(14px) scale(.92); }
  .fstack[data-left] { margin-bottom: 14px; }   /* the edges hang below the box: keep "4 left" clear of them */
  .fcard { position: relative; min-height: 340px; transition: transform 360ms var(--ease-move); transform-style: preserve-3d; touch-action: pan-y; }
  .fcard.flipped { transform: rotateY(180deg); cursor: grab; }
  .fcard.dragging { transition: none; cursor: grabbing; -webkit-user-select: none; user-select: none; }   /* follows the finger 1:1 (premium bug 7) */
  .fface { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius-card); background: var(--paper); box-shadow: var(--shadow-3);
    padding: 24px 28px; display: grid; align-content: center; gap: 10px; overflow-y: auto; }
  .fface.back { transform: rotateY(180deg); align-content: start; }
  /* the swipe says what it will do: Know (amber edge) as the card goes right, Again (ink) as it goes left */
  .stamp { position: absolute; top: 16px; left: 50%; translate: -50% 0; padding: 4px 12px; border-radius: 8px; background: var(--paper);
    font: 600 16px var(--font); opacity: 0; pointer-events: none; }
  .stamp.know { color: var(--amber-deep); box-shadow: inset 0 0 0 2px var(--amber); rotate: -6deg; }
  .stamp.again { color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); rotate: 6deg; }
  .fcard.tall { min-height: 460px; }
  .fface.learnc { position: relative; inset: auto; min-height: 300px; }
  .ffront { text-align: center; justify-items: center; }
  .fword { font: 600 clamp(36px, 6vw, 56px)/1.05 var(--font); letter-spacing: -.03em; overflow-wrap: anywhere; }
  .fword.sm { font-size: clamp(32px, 5vw, 44px); }
  .learn-h { display: flex; gap: 10px; align-items: center; }
  .center { text-align: center; }
  .fmean { font: 400 24px/1.4 var(--serif); }
  .fmean.sm { font-size: 20px; }
  .fsent { font: 400 21px/1.5 var(--serif); }
  .fchips { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .fback-w { font: 600 16px var(--font); }
  .fback .k { margin-top: 8px; }
  .fback .meaning { font: 400 19px/1.45 var(--serif); }
  .fback .ex { font: 400 16px/1.5 var(--serif); }
  .fback details.fold { margin-top: 6px; }
  .fpicks { font: 500 12.5px var(--font); color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .fcard { transition: none; transform: none !important; } .fface.back { transform: none; opacity: 0; transition: opacity .15s; } .fcard.flipped .fface.back { opacity: 1; } .fcard.flipped .fface.ffront { opacity: 0; } .wr-prog i.grow { animation: none; } }
  html[data-motion="reduce"] .fcard { transition: none; transform: none !important; }
  html[data-motion="reduce"] .fface.back { transform: none; opacity: 0; }
  html[data-motion="reduce"] .fcard.flipped .fface.back { opacity: 1; }
  html[data-motion="reduce"] .fcard.flipped .fface.ffront { opacity: 0; }
  .wr-ctl { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; max-width: 620px; margin: 0 auto; width: 100%; }
  /* one height per control row: the pill's */
  .wr-ctl > :is(.btn, .quiet) { min-height: 42px; }
  .wr-ctl > .quiet { margin: 0; }
  @media (max-width: 759px), (pointer: coarse) { .wr-ctl > .pill { height: var(--touch); } }
  .wr-ctl .grade { flex: 1; }
  .wr-ctl .nav { min-width: var(--touch); }
  .wr-ctl .kbd { margin-left: 6px; }
  /* a touch screen has no keys to hint at (ui.css hides the .kbd caps; .keys is this page's "Space" line) */
  @media (hover: none) and (pointer: coarse) { .wr .keys { display: none; } }
  /* sorting and placement */
  .sortw { text-align: center; display: grid; gap: 18px; justify-items: center; padding: 40px 0 16px; }
  .sortw .fword { font-size: clamp(40px, 7vw, 64px); }
  .sort-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; max-width: 480px; }
  .sort-btns button { min-height: 48px; padding: 0 8px; }
  /* staged items, quick options, order, typed */
  .wtext { font: 400 var(--q-size, 20px)/1.6 var(--serif); }
  .wtext .blank { display: inline-block; width: 4em; border-bottom: 1.5px solid var(--ink); }
  .wask { font: 600 14.5px var(--font); }
  .q-stem + .wask, .q-stem + .wsrc { margin-top: 10px; }
  .ws-actions { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .wsrc { font: italic 400 13px var(--font); color: var(--soft); }
  .wstage { display: grid; gap: 8px; }
  .wstage .btn, .wquick .btn { justify-content: flex-start; min-height: 48px; text-align: left; white-space: normal; padding: 8px 16px; font: 500 16px/1.35 var(--font); }
  .wstage .quiet { justify-self: start; }
  .wstage .btn .kbd, .wquick .btn .kbd { flex: none; }
  .wquick { display: grid; gap: 8px; }
  .wquick .btn[aria-pressed="true"] { background: var(--sel-bg); box-shadow: var(--sel-edge); }
  .wtray { display: flex; flex-wrap: wrap; gap: 6px; }
  .word-order { position: relative; display: grid; gap: 8px; list-style: none; padding: 0; }
  /* the ladder's rows are keys you move: the control face, the one selected look when picked */
  .word-order li { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border-radius: 10px; background: var(--face); box-shadow: var(--shadow-btn); font: 600 16px var(--font); cursor: grab; }
  .word-order li[aria-selected="true"] { background: var(--sel-bg); box-shadow: var(--sel-edge); }
  .word-order li.dragging { position: relative; z-index: 1; box-shadow: var(--shadow-3); scale: 1.02; }   /* the row in your hand lifts; the others glide */
  .word-order .hd { width: 44px; height: 44px; display: grid; place-items: center; color: var(--soft); touch-action: none; cursor: grab; }
  .word-order .n { font: 500 12.5px var(--font); color: var(--soft); width: 18px; font-variant-numeric: tabular-nums; }
  .word-order li.ok { box-shadow: inset 0 0 0 1.5px var(--amber-deep); }
  .typed { display: flex; gap: 8px; flex-wrap: wrap; }
  .typed .field { flex: 1 1 240px; font: 500 16px var(--font); }
  .typed .btn { min-height: var(--touch); }
  .wverd { display: grid; gap: 8px; padding: 12px 16px; border-radius: var(--radius-card); background: var(--tile); }
  .wverd .head { font: 600 16px var(--font); display: flex; gap: 8px; align-items: center; }
  .wverd .line { font: 400 14.5px/1.5 var(--font); }
  .wverd-acts { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .wr-oot { font: 600 14px var(--font); }
  .ws-next.autonext { position: relative; }
  .ws-next.autonext::after { content: ""; position: absolute; inset: -4px; border-radius: 14px; border: 2px solid var(--amber); animation: wdrain 2.5s linear forwards; }
  @keyframes wdrain { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 100% 0 0); } }
  .ws-headline { display: flex; gap: 10px; align-items: center; }
  .wr-q { outline: none; }
  .wr-push { margin: 0 0 0 auto; }
  /* summary */
  .wsum { display: grid; gap: 20px; padding-top: 24px; }
  /* the summary's hero: the score at the hero step, this run's strip under it (a segment per item, each opens its word) */
  .wsum-hero { display: grid; gap: 8px; }
  .wsum .score { font-variant-numeric: tabular-nums; }   /* .hero-num: the step, the ink, the unit small on the baseline */
  .wsum .score-l { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .wsum-strip { display: flex; gap: 3px; margin-top: 8px; }
  .wsum-strip > button { appearance: none; border: 0; padding: 0; flex: 1; max-width: 40px; height: 10px; border-radius: 3px; background: var(--track); cursor: pointer; }
  .wsum-strip > .know, .wsum-strip > .right { background: var(--amber); }
  .wsum-strip > .dont, .wsum-strip > .wrong { background: var(--ink); }
  .wsum-strip > .done { background: var(--tile-2); box-shadow: inset 0 0 0 1px var(--faint); }
  .wsum-strip > :disabled { cursor: default; }
  .wsum h2 { font: 600 16px/1.3 var(--font); margin-bottom: 8px; }
  .wsum .rows { display: grid; }
  .wsum .row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: space-between; min-height: var(--row-h); padding: 8px 0; border-top: 1px solid var(--line); font: 400 14.5px var(--font); }
  .wsum .row:last-child { border-bottom: 1px solid var(--line); }
  .wsum .row .meta { font-size: 12.5px; }
  .wsum .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .wsum .upnext { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .wsum .upnext > .btn { min-height: 42px; }
  .wsum .upnext > .quiet { margin: 0 0 0 4px; }
  /* phone: the pill takes the row, the button and More share the next one (More never wraps alone) */
  @media (max-width: 759px) { .wsum .upnext { display: grid; grid-template-columns: minmax(0, 1fr) auto; } .wsum .upnext > :first-child { grid-column: 1 / -1; } }
  .wsum-place { display: grid; gap: 14px; }
  .wsum-act { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .wsum .study { margin-top: 8px; justify-self: start; }
  .wr-msg { display: grid; gap: 12px; justify-items: start; padding-top: 24px; }
  .wsum .chips .wchip svg { color: var(--ink); }
  .wr-acts { display: flex; gap: 10px; flex-wrap: wrap; }
  .band { display: grid; grid-template-columns: 180px 1fr auto; gap: 10px; align-items: center; font: 400 14px var(--font); }
  .band .b { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .band .b i { display: block; height: 100%; background: var(--ink); }
  .band .meta { font-size: 12.5px; }
  @media (max-width: 759px) {
    .wr-top { grid-template-columns: auto 1fr auto; }
    .wr-clock { grid-column: 2; grid-row: 2; }
    .fcard { min-height: 56vh; }
    .fface { padding: 20px; }
    .wr-ctl.grades { position: fixed; left: 0; right: 0; bottom: 0; background: var(--paper); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -1px 0 var(--line); z-index: 15; }
    .band { grid-template-columns: 1fr auto; }
    .band .b { grid-column: 1 / -1; }
  }
</style>
</head>
<body data-page="words-run">
<main class="wr" id="main" tabindex="-1">
  <header class="wr-top">
    <button type="button" class="ibtn" id="exit" aria-label="End this run"></button>
    <div class="wr-mid">
      <p class="wr-title" id="title">Words</p>
      <div class="wr-prog" id="prog" aria-hidden="true"></div>
    </div>
    <p class="wr-clock" id="clock" aria-live="off"></p>
    <div class="wr-tools" id="tools"></div>
  </header>
  <div class="wr-tbar" id="tbar" hidden><i></i></div>
  <section class="wr-stage" id="stage" aria-live="polite"><p class="meta">Loading…</p></section>
</main>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/assets/question.js"></script>
<script src="/assets/words-ui.js"></script>
<script>
(() => {
  'use strict';
  const h = UI.h, $ = id => document.getElementById(id), W = UI.word;
  const enc = encodeURIComponent;
  const num = n => UI.num ? UI.num(n) : String(n);
  const cap = s => (s ? String(s)[0].toUpperCase() + String(s).slice(1) : '');
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches || document.documentElement.dataset.motion === 'reduce';
  const put = (el, ...kids) => { el.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); return el; };
  const MODE = { cards: 'Flashcards', quiz: 'Quiz', mix: 'Today’s words', placement: 'Find your level', sort: 'Sort what you know', sprint: 'Sprint', check: 'Words check', print: 'Worksheet' };
  const CARDS = new Set(['card', 'fix']);
  $('exit').replaceChildren(UI.icon('x', 20));

  const P = new URLSearchParams(location.search);
  let id = P.get('id');
  const R = {
    run: null, items: [], verdicts: new Map(), cur: null, prevStack: [], viewing: null, flipped: false, shownAt: 0, ws: null,
    guess: false, busy: false, graded: 0, right: 0, asked: 0, timer: null, boxEnd: null, boxOver: false, sprintEnd: null, miss: [], last: null,
    checkPick: null, order: null, typedHint: false, autoT: 0, dir: 'word',
  };
  let ix = null;
  W.index().then(x => { ix = x; }).catch(() => {});
  const wordOf = slug => W.nameOf(slug, ix && ix.bySlug.get(slug) ? ix.bySlug.get(slug).word : String(slug || '').replace(/\..*$/, '').replace(/^u:.*/, 'your word'));
  const pos = item => R.items.findIndex(x => x.item_id === item.item_id);   // items get copied (predictions, back faces), so match by id
  const shortOf = slug => (ix && ix.bySlug.get(slug) ? ix.bySlug.get(slug).short : '');

  /* ---------------- load or create */
  async function boot() {
    if (!id && P.get('today')) {
      try { const r = await UI.api('/words/run', { method: 'POST', body: { mode: 'mix', deck: { source: 'today' } } }); id = r.id; history.replaceState(null, '', `/words/run/?id=${enc(id)}`); }
      catch (e) { return fail(e.status === 409 ? cap(e.message) : 'Couldn’t start today’s words.'); }
    }
    if (!id) return nothingHere();
    let run;
    const kept = W.offline && W.offline.ok() ? await W.offline.run(id) : null;
    R.stored = !!kept;
    R.keptDone = new Set((kept && kept.done) || []);
    try { run = await UI.api(`/words/run/${enc(id)}`, { quiet: R.stored }); }
    catch (e) {
      // W22: no signal, and this run's cards are on the device: go on from the first one not yet graded
      if (e.offline && kept) {
        const done = new Set(kept.done || []);
        run = { ...kept, next: (kept.items || []).find(x => !done.has(x.item_id)) || null, finished: false };
        R.offline = true;
        W.offline.pending().then(n => W.offline.banner(n || 0));
      } else return fail(e.status === 403 ? 'This run belongs to someone else.' : e.status === 404 ? 'No such run.' : 'This run did not load.', e.status >= 500 || e.offline, e.status === 404);
    }
    if (run.mode === 'print' && !run.finished) { location.replace(`/words/print/?id=${enc(id)}`); return; }
    R.run = run;
    R.items = run.items || [];
    R.dir = (run.cfg && run.cfg.direction) || 'word';
    const t = MODE[run.mode] || 'Words';
    document.title = `${t} · SAT Freshman`;
    put($('title'), h('span', { text: t }), deckLabel(run.deck) ? h('span', { class: 'meta', text: deckLabel(run.deck) }) : null);
    tools();
    if (run.finished) return summary(run.summary || {});
    const cfg = run.cfg || {};
    if (cfg.box) R.boxEnd = Date.now() + cfg.box * 60000;
    if (run.mode === 'sprint' && run.timer_total) R.sprintEnd = Date.now() + run.timer_total * 1000;
    if (run.mode === 'check' && run.timer_total) R.sprintEnd = Date.now() + run.timer_total * 1000;
    if (R.boxEnd || R.sprintEnd) tick();
    if (!run.next) return finish();
    show(run.next);
  }
  function deckLabel(d) {
    if (!d) return '';
    const s = d.source;
    return { due: 'Due today', new: 'New words', today: '', missed: 'Missed lately', saved: 'Saved', thought: 'Thought I knew', stubborn: 'Stubborn',
      atrisk: 'At risk', looked_up: 'Looked up', probable: 'Probably known', trap: `Trap · ${W.TRAP[d.value] || d.value}`,
      collection: W._coll[d.value] || { 'sat-core': 'SAT core', 'sat-advanced': 'SAT advanced', transitions: 'Transitions', 'second-sense': 'Second meanings', 'answer-choice': 'Answer-choice language' }[d.value] || d.value,
      topic: cap(String(d.value || '').replace(/-/g, ' ')), root: `Root · ${d.value}`, words: d.words ? `${d.words.length} words` : '', mine: 'My words', list: d.value }[s] ?? '';
  }
  function fail(text, retry, lost) {
    put($('stage'), h('div', { class: 'wr-msg' }, lost ? h('span', { 'aria-hidden': 'true', html: UI.spotArt('lost') }) : null, h('p', { text }),
      h('div', { class: 'wr-acts' }, retry ? h('button', { type: 'button', class: 'btn', text: 'Retry', onclick: boot }) : null, h('a', { class: 'btn', href: '/words/', text: 'Words' }))));
  }
  function nothingHere() {
    put($('stage'), h('div', { class: 'wr-msg' }, h('span', { 'aria-hidden': 'true', html: UI.spotArt('start') }), h('p', { text: 'Start a run from the Words library, Flashcards or Quiz.' }),
      h('div', { class: 'wr-acts' }, h('a', { class: 'pill sm', href: '/words/run/?today=1', text: 'Today’s words' }), h('a', { class: 'btn', href: '/words/', text: 'Library' }))));
  }

  /* ---------------- top bar: tools, progress, clocks */
  function tools() {
    const b = (label, icon, fn, o = {}) => { const x = h('button', { type: 'button', class: 'ibtn', 'aria-label': label, title: label + (o.key ? ` (${o.key})` : ''), onclick: fn }, W.icon(icon)); if (o.id) x.id = o.id; return x; };
    const open = h('button', { type: 'button', class: 'ibtn', 'aria-label': 'Open the word', title: 'Open the word (O)', onclick: openCur, html: UI.svg(UI.ICON.words, 18) });
    put($('tools'), b('Say it', 'speak', speakCur, { key: 'P' }), b('Save', 'star', saveCur, { key: 'B', id: 'saveBtn' }), open, b('Report a problem', 'flag', reportCur));
  }
  function openCur() { const s = curSlug(); if (s && (isCard() || answered())) W.open(s); else UI.toast('Answer first: the word is hidden until the verdict.'); }
  const curSlug = () => { const it = R.viewing || R.cur; if (!it) return null; const v = R.verdicts.get(it.item_id); return it.word || (v && v.word) || null; };
  function speakCur() { const it = R.viewing || R.cur; const s = curSlug(); const t = it && CARDS.has(it.kind) ? it.text : s ? wordOf(s) : null; if (t) UI.speak(t); else UI.toast('Answer first: the word is hidden until the verdict.'); }
  async function saveCur() {
    const it = R.viewing || R.cur; if (!it) return;
    const v = R.verdicts.get(it.item_id);
    try {
      if (CARDS.has(it.kind) || it.kind === 'learn') await UI.api(`/words/${enc(it.word)}/save`, { method: 'POST', body: { on: true } });

    if (live && graded.length && R.items.length > 1 && R.items.length <= 60 && !['placement', 'sort', 'check'].includes(mode)) {
      const SAID = { know: 'Know', dont: 'Don’t know', right: 'Right', wrong: 'Wrong', done: 'Skipped' };
      hero.append(h('div', { class: 'wsum-strip', role: 'group', 'aria-label': 'This run, item by item' }, R.items.map(it => {
        const v = R.verdicts.get(it.item_id), slug = it.word || (v && v.word), cls = v ? seg(it, v) : '';
        return h('button', { type: 'button', class: cls || null, disabled: !slug, 'aria-label': `${slug ? wordOf(slug) : 'An item'}: ${cls ? SAID[cls] : 'not reached'}`,
          title: slug ? wordOf(slug) : null, onclick: () => W.open(slug) });
      })));
    }
    // moved to Known, still learning, next reviews
    const movedEl = (s.moved_known || []).length ? h('div', { class: 'chips' }, s.moved_known.map(x => chip(x, true))) : null;
    if (movedEl) out.append(sec('Moved to Known', movedEl));
    const learning = [...new Map((s.learning || []).map(l => [l.slug, l])).values()].slice(0, 40);   // a requeued word is one chip
    // one date for all of them is said once, in the heading; the dates are the scheduled ones
    const days = new Set(learning.map(l => l.due || ''));
    const one = days.size === 1 && learning[0].due ? backOn(learning[0].due) : '';
    if (learning.length) out.append(sec(one ? `Still learning · ${learning.length === 1 ? 'back' : `all ${learning.length} back`} ${one}` : 'Still learning',
      h('div', { class: 'chips' }, learning.map(l => h('button', { type: 'button', class: 'wchip', onclick: () => W.open(l.slug) }, wordOf(l.slug), !one && l.due ? h('small', { text: backOn(l.due) }) : null)))));
    const sc = { ...(s.schedule || {}) };
    // ponytail: the server files words due today under "tomorrow"; count those back out from the learning list (helper: split "today" server-side)
    const dueNow = (s.learning || []).filter(l => l.due && l.due <= W.today()).length;
    if (dueNow && sc.tomorrow) sc.tomorrow = Math.max(0, sc.tomorrow - dueNow);
    const nx = [dueNow ? `${dueNow} today` : null, sc.tomorrow ? `${sc.tomorrow} tomorrow` : null, sc.in3 ? `${sc.in3} in 3 days` : null, sc.in7 ? `${sc.in7} in a week` : null, sc.later ? `${sc.later} later` : null].filter(Boolean);
    if (nx.length) out.append(h('p', { class: 'line', text: `Next reviews: ${nx.join(' · ')}` }));
    // by type, with pace against 71 s
    const bk = Object.entries(s.by_kind || {}).filter(([k]) => !['card', 'fix', 'learn', 'placement', 'sort'].includes(k));
    if (bk.length > 1) out.append(sec('By type', h('div', { class: 'rows' }, bk.map(([k, v]) => {
      const p = (s.pace || {})[k] || {};
      return h('div', { class: 'row' }, h('span', { text: W.KIND[k] || k }), h('span', { class: 'meta', text: `${v.right}/${v.asked}${p.median_ms ? ` · ${Math.round(p.median_ms / 1000)} s median · SAT pace 71 s` : ''}` }));
    }))));
    if ((s.rushed_misses || []).length) out.append(h('p', { class: 'line', text: `Rushed misses (wrong in under 8 s): ${s.rushed_misses.length} · slow down on these` }));
    // how you missed (W5)
    const mix = (s.mixups || []).filter(m => m.n);
    if (mix.length) out.append(sec('How you missed', h('div', { class: 'rows' }, mix.map(m => h('div', { class: 'row trap-row' }, h('span', {}, h('b', { text: W.TRAP[m.kind] || m.kind }), ` ×${m.n}`),
      h('button', { type: 'button', class: 'btn sm', text: 'Twin ×10', title: 'Ten in-context questions with this trap', onclick: () => UI.startWords({ mode: 'quiz', deck: { source: 'trap', value: m.kind }, formats: ['incontext'], count: 10 }) }))))));
    if (s.caution && mode !== 'placement') out.append(h('p', { class: 'help', text: s.caution }));
    // sprint tray
    if (mode === 'sprint' && R.miss.length) out.append(sec('Missed', [h('div', { class: 'rows' }, [...new Set(R.miss)].map(sl => h('div', { class: 'row' }, h('b', { text: wordOf(sl) }), h('span', { class: 'meta', text: shortOf(sl) })))),
      h('button', { type: 'button', class: 'btn study', text: 'Study these', onclick: () => UI.startWords({ mode: 'cards', deck: { source: 'words', words: [...new Set(R.miss)] } }) })]));
    // skipped
    if ((s.skipped || []).length) out.append(h('p', { class: 'line' }, `${s.skipped.length} skipped · `, h('button', { type: 'button', class: 'quiet', text: 'Study them', onclick: () => UI.startWords({ mode: 'cards', deck: { source: 'words', words: [...new Set(s.skipped)] } }) })));
    // up next
    out.append(await upNext(s, c));
    put($('stage'), out);
    put($('prog'));
    const title = $('title').firstChild; if (title) title.textContent = `${MODE[mode] || 'Words'} · done`;
    // the words this run moved to Known join the total on screen
    // a run that just ended here (pointer or not: this is the result, not a control): the score rolls up from 0,
    // the Known chips land 40ms apart (at most 12), then the total rolls (never on a reopened run)
    let after = 400;
    if (live && scoreN && s.right) { scoreN.textContent = '0'; requestAnimationFrame(() => UI.roll(scoreN, s.right)); }
    if (live && movedEl && !UI.motion.off()) { [...movedEl.children].forEach((x, i) => UI.motion.enter(x, 'nudge', { delay: 200 + Math.min(i, 12) * 40, force: true })); after = 200 + Math.min(12, movedEl.children.length) * 40 + 200; }
    if (known && rolls) setTimeout(() => UI.roll(known, c.known), after);
  }
  const sec = (t, body) => h('section', {}, h('h2', { text: t }), body);
  const backOn = day => { const n = W.dayDiff(W.today(), day); return n <= 0 ? 'today' : n === 1 ? 'tomorrow' : n < 7 ? `in ${n} days` : `on ${W.shortDate(day)}`; };
  function placementResult(s) {
    const e = s.estimate || {};
    const BAND = b => { const [tier, lv] = String(b).split(':'); return `SAT ${tier} · ${lv}`; };
    return h('div', { class: 'wsum-place' },
      h('p', { class: 'score hero-num' }, `~${num(e.n || 0)}`, h('small', { text: ` words (±${Math.max(0, (e.hi || 0) - (e.n || 0))})` })),
      h('p', { class: 'line', text: `You know about ${num(e.n || 0)} of the SAT words.` }),
      s.caution ? h('p', { class: 'help', text: s.caution }) : null,
      h('div', { class: 'rows' }, (e.bands || []).map(b => h('div', { class: 'band' }, h('span', { text: BAND(b.band) }), h('span', { class: 'b', role: 'img', 'aria-label': `${Math.round(b.rate * 100)}%` }, h('i', { style: `width:${Math.round((b.rate || 0) * 100)}%` })), h('span', { class: 'meta', text: `about ${num(b.n)} of ${num(b.size)}` })))),
      s.claimed_n ? h('p', { class: 'line', text: `The ${s.claimed_n} placement words you said you know come back once each as an in-context question over the next 2 weeks.` }) : null,
      s.probable_n ? h('div', { class: 'wsum-act' }, h('p', { class: 'line', text: `${num(s.probable_n)} more are probably known: 1–2 a day come back as one in-context question each.` }),
        h('button', { type: 'button', class: 'btn', text: `Confirm the rest · ${num(s.probable_n)} words · ~${Math.max(1, Math.round(s.probable_n * 1.5 / 60))} min`, onclick: () => UI.startWords({ mode: 'sort', deck: { source: 'probable' } }) })) : null);
  }
  async function upNext(s, c) {
    const row = h('div', { class: 'upnext' });
    let item = null;
    try { await UI.refresh(); item = (UI.nextItems() || [])[0] || null; } catch (_) {}
    const acts = [];
    if (item) {
      const words = item.start && /\/words\/run/.test(item.start.path || '');
      acts.push({ label: `Next: ${item.title || 'Up next'}`, onClick: () => (words ? UI.startWords(item.start.body) : UI.start(item)) });
    }
    if (c && c.due) acts.push({ label: `Review ${c.due} due`, onClick: () => UI.startWords({ mode: 'cards', deck: { source: 'due' } }) });
    acts.push({ label: `Learn ${(c && c.goal) || 10} new`, onClick: () => UI.startWords({ mode: 'cards', deck: { source: 'new' }, count: (c && c.goal) || 10 }) });
    const played = R.items.map(x => x.word).filter(Boolean).concat((s.learning || []).map(l => l.slug), s.moved_known || []);
    const uniq = [...new Set(played)].slice(0, 200);
    if (uniq.length >= 4 && R.run.mode === 'cards') acts.push({ label: `Quiz these ${uniq.length}`, onClick: () => W.quizStart({ source: 'words', words: uniq }, Math.min(20, uniq.length)) });
    acts.push({ label: 'Library', href: '/words/' });
    const btn = (a, cls) => (a.href ? h('a', { class: cls, href: a.href, text: a.label }) : h('button', { type: 'button', class: cls, text: a.label, onclick: a.onClick }));
    const [first, second, ...rest] = acts;
    row.append(btn(first, 'pill'));
    if (second) row.append(btn(second, 'btn'));
    if (rest.length === 1 && rest[0].href) row.append(btn(rest[0], 'quiet'));   // only Library left: a link, not a one-item menu
    else if (rest.length) {
      const more = h('button', { type: 'button', class: 'btn dd' }, 'More');
      UI.menu.bind(more, rest, { label: 'More ways on' });
      row.append(more);
    }
    return sec('Up next', row);
  }

  /* ---------------- exit */
  $('exit').addEventListener('click', async () => {
    const from = (() => { try { return sessionStorage.getItem('satf.words.from'); } catch (_) { return null; } })() || '/words/';
    if (!R.run || R.run.finished || document.querySelector('.wsum')) { location.href = from; return; }
    if (!R.graded && !(R.run.answered)) { location.href = from; return; }
    finish();
  });

  /* ---------------- keys (§2.8, §14) */
  const it = () => R.viewing || R.cur;
  const isCard = () => !!it() && CARDS.has(it().kind);
  const kindIs = (...k) => !!R.cur && !R.viewing && k.includes(R.cur.kind);
  const answered = () => !!R.cur && R.verdicts.has(R.cur.item_id);
  UI.keys.register('wordsrun', {
    Space: { does: 'Flip the card', when: () => (isCard() && !R.flipped) || kindIs('learn'), run: () => (kindIs('learn') ? gotit() : R.flipCard && R.flipCard()) },
    1: { does: 'Don’t know · Yes · Know it', when: () => (isCard() && R.flipped && !R.viewing) || kindIs('placement', 'sort', 'commit') || (kindIs('order') && !R.order.done) || (!!R.cur && R.cur.step && !R.cur.choices) || (R.run && R.run.mode === 'sprint' && !!R.cur),
      run: () => keyNum(1) },
    2: { does: 'Know · No · Not sure', when: () => (isCard() && R.flipped && !R.viewing) || kindIs('placement', 'sort', 'commit') || (kindIs('order') && !R.order.done) || (!!R.cur && R.cur.step && !R.cur.choices) || (R.run && R.run.mode === 'sprint' && !!R.cur),
      run: () => keyNum(2) },
    3: { does: 'Not sure · New to me', when: () => kindIs('placement', 'sort', 'commit') || (kindIs('order') && !R.order.done) || (!!R.cur && R.cur.step && !R.cur.choices) || (R.run && R.run.mode === 'sprint' && !!R.cur), run: () => keyNum(3) },
    4: { does: 'Fourth choice', when: () => (kindIs('order') && !R.order.done) || (!!R.cur && R.cur.step && !R.cur.choices && (R.cur.predictions || []).length > 3) || (R.run && R.run.mode === 'sprint' && !!R.cur), run: () => keyNum(4) },
    0: { does: 'No idea (Commit first)', when: () => kindIs('commit') && !answered(), run: () => commitPick(null) },
    ArrowLeft: { does: 'Previous', when: () => isCard() || (!!R.viewing), run: () => back() },
    ArrowRight: { does: 'Next without grading', when: () => isCard(), run: () => (R.viewing ? forward() : skip()) },
    ArrowUp: { does: 'Move it up (Order the ladder)', when: () => kindIs('order') && !R.order.done, run: () => moveOrder(-1) },
    ArrowDown: { does: 'Move it down (Order the ladder)', when: () => kindIs('order') && !R.order.done, run: () => moveOrder(1) },
    Enter: { does: 'Next', when: () => !!R.cur && !R.viewing && ((answered() && !R.ws) || (R.ws && R.ws.answered && R.ws.answered()) || kindIs('order') || (R.cur.step && !R.cur.choices) || (R.run && R.run.mode === 'check')),
      run: () => {
        if (R.run.mode === 'check') return checkNext();
        if (R.cur.step && !R.cur.choices) return predict('skip');
        if (kindIs('order') && !R.order.done) return checkOrder();
        if (R.ws && R.ws.answered && R.ws.answered()) return next();
        if (R.onEnter) { const f = R.onEnter; R.onEnter = null; f(); }
      } },
    Z: { does: 'Undo the last (triage)', when: () => R.run && R.run.mode === 'sort', run: undoSort },
    T: { does: 'Twin: same word, new text', when: () => !!R.ws && answered() && twinable(R.cur), run: () => another('word') },
    'Shift+T': { does: 'Twin menu', when: () => !!R.ws && answered() && twinable(R.cur), run: () => (R.twinMenu ? R.twinMenu() : another('trap')) },
    O: { does: 'Open the word', when: () => !!curSlug() && (isCard() || answered()), run: () => W.open(curSlug()) },
    B: { does: 'Save', when: () => !!it(), run: saveCur },
    P: { does: 'Say it', when: () => !!it(), run: speakCur },
    I: { does: 'Mark a guess before choosing', when: () => !!R.ws && !answered(), run: () => { R.guess = !R.guess; UI.toast(R.guess ? 'Marked as a guess · a right guess never moves the box' : 'Guess mark off'); } },
    Escape: { does: 'End the run', when: () => !document.querySelector('dialog[open]'), run: () => $('exit').click() },
  }, { label: 'Words run' });
  function keyNum(n) {
    const c = R.cur;
    if (!c) return;
    if (CARDS.has(c.kind) && R.flipped) return n === 1 ? grade(false) : n === 2 ? grade(true) : null;
    if (c.kind === 'placement') return sortPick(['yes', 'no', 'unsure'][n - 1]);
    if (c.kind === 'sort') return sortPick(['know', 'unsure', 'no'][n - 1]);
    if (c.kind === 'commit') return commitPick(n - 1);
    if (c.kind === 'order') { R.order.sel = Math.min(n - 1, R.order.words.length - 1); return R.order.draw(); }
    if (c.step && !c.choices) return (c.predictions || [])[n - 1] !== undefined ? predict(n - 1) : null;
    if (R.run.mode === 'sprint') return sprintPick(n - 1);
  }
  // letters and digits the workspace owns reach it when focus is outside it
  document.addEventListener('keydown', e => {
    if (e.defaultPrevented || !R.ws || document.querySelector('dialog[open]')) return;
    if (R.ws.el.contains(document.activeElement)) return;
    if (R.ws.key && R.ws.key(e)) e.preventDefault();
  });
  document.addEventListener('keydown', e => {
    if (e.defaultPrevented || R.run == null || R.run.mode !== 'check' || !R.cur || e.target.closest('input, textarea')) return;
    const i = 'ABCD'.indexOf(e.key.toUpperCase());
    if (i >= 0 && e.key.length === 1) { const b = $('stage').querySelectorAll('.wquick .btn')[i]; if (b) { b.click(); e.preventDefault(); } }
  });
  boot();
})();
</script>
</body>
</html>
