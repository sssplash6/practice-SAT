<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My words · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* My words (spec 3.8 §9, override 38; words.md W5 W6 W7 W9 W12 W13). */
  .wm { padding-bottom: 150px; display: grid; gap: 22px; }
  .wm * { min-width: 0; }
  .wm-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  .wm-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .wm-stats .stat:disabled { opacity: .5; }
  .wm-stats .stat .btn { margin-top: 8px; align-self: flex-start; }
  .wm-two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .wm-card { display: grid; gap: 10px; }
  .wm-card h2 { font: 700 16px var(--font); display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .wm-card h2 .meta { font-weight: 500; }
  .wm-line { font: 400 14px/1.5 var(--font); }
  .wm-line b { font-weight: 600; }
  .trap-row, .mix-row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 9px 0; border-top: 1px solid var(--line); font: 400 14px var(--font); }
  .trap-row .l, .mix-row .l { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .trap-row .meta { font-size: 12.5px; }
  .wm-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .wm-view { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
  .wm-list .table td, .wm-list .table th { white-space: nowrap; }
  .wm-list .table .w { font-weight: 600; }
  .wm-list .due { color: var(--amber-deep); font: 500 12.5px var(--mono); }
  .wm-list input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--amber); }
  .wm-more { justify-self: center; }
  .wall { display: grid; gap: 10px; }
  .wall-row { display: grid; grid-template-columns: 80px 1fr; gap: 10px; align-items: start; }
  .wall-cells { display: flex; flex-wrap: wrap; gap: 3px; }
  .wcell { appearance: none; border: 0; padding: 0; width: 12px; height: 12px; border-radius: 3px; cursor: pointer; position: relative; background: transparent; box-shadow: inset 0 0 0 1.2px var(--faint); }
  .wcell.learning { background: rgba(63, 63, 63, .3); box-shadow: none; }
  .wcell.claimed { background: var(--ink); box-shadow: none; }
  .wcell.known { background: var(--amber); box-shadow: none; }
  .wcell.due::after { content: ""; position: absolute; top: -2px; right: -2px; width: 5px; height: 5px; border-radius: 50%; background: var(--amber-deep); box-shadow: 0 0 0 1px var(--paper); }
  .wcell.stubborn { outline: 1.5px dotted var(--ink); outline-offset: 1px; }
  .wcell:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .wall-row.big .wcell { width: 44px; height: 44px; }
  .wall-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 500 12px var(--mono); color: var(--soft); align-items: center; }
  .wall-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 5px; box-shadow: inset 0 0 0 1.2px var(--faint); }
  .wall-legend i.learning { background: rgba(63, 63, 63, .3); box-shadow: none; }
  .wall-legend i.claimed { background: var(--ink); box-shadow: none; }
  .wall-legend i.known { background: var(--amber); box-shadow: none; }
  .wm-empty { display: grid; gap: 12px; justify-items: start; padding: 24px 0; }
  .wm-bulk .selbar, .wm-bulk { position: sticky; bottom: 0; }
  @media (max-width: 999px) { .wm-two { grid-template-columns: 1fr; } }
  @media (max-width: 759px) {
    .wm-stats { grid-template-columns: repeat(2, 1fr); }
    .wm-list .table thead { display: none; }
    .wm-list .table tr { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .wm-list .table td { border: 0; padding: 0; white-space: normal; }
    .wm-list .table td.c-sel { grid-row: 1 / span 2; align-self: center; }
    .wm-list .table td.c-word { grid-column: 2; }
    .wm-list .table td.c-str { grid-column: 3; grid-row: 1; }
    .wm-list .table td.c-meta { grid-column: 2 / span 2; font-size: 12.5px; color: var(--soft); }
    .wm-list .table td.c-hide { display: none; }
    .wall-row { grid-template-columns: 1fr; }
  }
  @media print {
    .wm > :not(.wm-list), .wm-view, .wm-tools { display: none !important; }
    .wm-list .table { columns: 2; }
  }
</style>
</head>
<body data-page="words-mine">
<main class="page wm" id="main" tabindex="-1">
  <header class="wm-head"><h1 class="h1">My words</h1><p class="meta" id="meta">Loading…</p></header>
  <div id="today"></div>
  <div id="wtabs"></div>
  <section class="wm-stats" id="stats" aria-label="Your words"></section>
  <div class="wm-two">
    <section class="card wm-card" id="forecast" aria-label="Due in the next 14 days"></section>
    <div id="finish"></div>
  </div>
  <div class="wm-two">
    <section class="card wm-card" id="traps" aria-label="How you miss words"></section>
    <section class="card wm-card" id="habits" aria-label="Your schedule"></section>
  </div>
  <div class="wm-tools" id="tools"></div>
  <div class="wm-view" id="view"></div>
  <section class="wm-list" id="list" aria-live="polite"></section>
  <div class="wm-bulk" id="bulk"></div>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script>UI.shell('words');</script>
<script src="/assets/words-ui.js"></script>
<script>
(() => {
  'use strict';
  const h = UI.h, $ = id => document.getElementById(id), W = UI.word;
  const num = n => UI.num ? UI.num(n) : String(n);
  const cap = s => (s ? s[0].toUpperCase() + s.slice(1) : '');
  const P = () => new URLSearchParams(location.search);
  const setUrl = (k, v) => { try { const u = new URL(location.href); if (v === null || v === '' || v === undefined) u.searchParams.delete(k); else u.searchParams.set(k, v); history.replaceState(history.state, '', u); } catch (_) {} };
  const put = (el, ...kids) => { el.replaceChildren(...kids.flat().filter(k => k !== null && k !== undefined && k !== false)); return el; };
  const LIMIT0 = 120;
  let lib = null, ins = null, me = null, words = [], mine = [], fbar = null, tile = P().get('tile') || '', view = P().get('view') === 'wall' ? 'wall' : 'table';
  let limit = LIMIT0, selected = new Set(), table = null;
  UI.wordsTabs($('wtabs'), 'mine');

  // "my words": everything the student has touched, starred, placed or made
  const touched = w => w.own || w.saved || w.looked_up || w.placed || (w.state && (w.state.box > 0 || w.state.reps > 0 || w.state.first));
  const TILES = [
    ['due', 'Due today', w => w.is_due, null], ['learning', 'Learning', w => W.status(w) === 'learning', null],
    ['claimed', 'Claimed', w => W.status(w) === 'claimed', 'Said you know it; prove it in context'],
    ['known', 'Known', w => W.status(w) === 'known', 'Right in an SAT-style question after 10+ days'],
    ['saved', 'Saved', w => w.saved, null], ['mine', 'My own', w => w.own, null], ['missed', 'Missed lately', w => w.missed, null],
    ['thought', 'Thought I knew', w => w.thought, 'You were sure and it slipped'], ['trap', 'Fell for a trap', w => !!w.trap, null],
    ['stubborn', 'Stubborn', w => w.stubborn, 'Words that keep slipping get a different drill'], ['atrisk', 'At risk', w => w.at_risk, null],
    ['lookedup', 'Looked up', w => w.looked_up, null]];

  async function load() {
    try { [lib, ins, me] = await Promise.all([UI.api('/words'), UI.api('/words/insights', { quiet: true }).catch(() => null), UI.me().catch(() => null)]); }
    catch (e) { $('meta').textContent = ''; put($('list')); UI.cardError($('list'), load, 'Your words did not load.'); return; }
    words = lib.words || [];
    mine = words.filter(touched);
    (lib.groups || []).forEach(g => (g.collections || []).forEach(c => { W._coll[c.id] = c.name; }));
    W._lists = [...new Set(words.filter(w => w.own && w.collection).map(w => w.collection))];
    const c = lib.counts || {};
    $('meta').textContent = [mine.length ? `${num(mine.length)} studied or saved` : null, c.known ? `${num(c.known)} known` : null, c.claimed ? `${num(c.claimed)} claimed` : null, c.due ? `${num(c.due)} due` : null].filter(Boolean).join(' · ');
    UI.todayWords($('today'), { lib, onChange: load });
    stats(); forecast(); UI.wordsFinish($('finish'), ins, { lib, onChange: load }); traps(); habits(); tools();
    if (!fbar) filters();
    paint();
  }

  /* ---------------- the stat tiles (12) */
  function stats() {
    const host = $('stats');
    put(host);
    const exam = ins && ins.finish && ins.finish.exam;
    TILES.forEach(([id, label, fn, sub]) => {
      const n = words.filter(fn).length;
      let s = sub;
      if (id === 'saved' && n) { const ns = words.filter(w => w.saved && W.status(w) === 'new').length; s = ns ? `${ns} not started` : null; }
      if (id === 'atrisk') s = exam ? `before ${W.shortDate(exam)}` : 'Needs an exam date';
      if (id === 'due' && !n) { const nx = (lib.forecast || []).find(d => d.n > 0 && d.day > lib.today); s = nx ? `Next: ${nx.n} on ${W.dayName(nx.day, { plain: true })}` : null; }
      const t = UI.tile(host, { label, value: n, sub: s || undefined, pressed: tile === id, onClick: () => { tile = tile === id ? '' : id; setUrl('tile', tile || null); stats(); limit = LIMIT0; paint(); } });
      t.el.setAttribute('aria-pressed', String(tile === id));
      if (!n && tile !== id) t.el.disabled = true;
      if (id === 'due' && n) t.el.append(h('button', { type: 'button', class: 'btn sm', text: 'Review', onclick: e => { e.stopPropagation(); UI.startWords({ mode: 'cards', deck: { source: 'due' } }); } }));
    });
  }

  /* ---------------- forecast (14 bars, then weeks to the exam) */
  function forecast() {
    const el = $('forecast');
    const f = lib.forecast || [];
    const days = (me && me.days && me.days.recent) || [];
    const todayRow = days.find(d => d.day === lib.today);
    const week = days.slice(-7).reduce((a, d) => a + (d.words || 0), 0);
    const rs = me && me.words ? me.words.reviews_week : week;
    put(el, h('h2', {}, 'Due in the next 14 days', h('span', { class: 'meta', text: [todayRow && todayRow.words ? `Reviewed today ${todayRow.words}` : null, rs ? `this week ${rs}` : null, me && me.days && me.days.streak ? `streak ${me.days.streak} days` : null].filter(Boolean).join(' · ') })));
    const total = f.reduce((a, d) => a + d.n, 0);
    if (!total) { el.append(h('p', { class: 'wm-line', text: 'Nothing is scheduled yet. Words you study come back here on their review days.' })); return; }
    if (UI.barChart) UI.barChart(el, f.map(d => ({ day: d.day, value: d.n, today: d.day === lib.today, exam: ins && ins.finish && d.day === ins.finish.exam })), { unit: 'q', noun: 'due', labels: 'weekday', today: 'amber', height: 120, max: Math.max(4, ...f.map(d => d.n)), label: 'Words due each day, next 14 days' });
    const wk = (ins && ins.finish && ins.finish.forecast_to_exam) || [];
    if (wk.length) {
      el.append(h('p', { class: 'k', text: 'Weeks to the exam' }));
      UI.barChart && UI.barChart(el, wk.map(x => ({ label: W.shortDate(x.week), value: x.n })), { unit: 'q', noun: 'due', labels: 'label', height: 90, label: 'Words due each week until the exam' });
    }
  }

  /* ---------------- how you miss words (W5), logic mix-ups, gaps (W6) */
  function traps() {
    const el = $('traps');
    const t = (ins && ins.traps) || [], lg = (ins && ins.logic) || [], gaps = (ins && ins.gaps) || {};
    put(el, h('h2', {}, 'How you miss words', t.length ? h('span', { class: 'meta', text: '60 days' }) : null));
    if (!t.length) el.append(h('p', { class: 'wm-line', text: 'No trap has caught you in the last 60 days. In-context questions name the trap behind every miss.' }));
    t.forEach(x => el.append(h('div', { class: 'trap-row' },
      h('span', { class: 'l' }, h('b', { text: x.name || W.TRAP[x.id] || x.id }), h('span', { class: 'meta', text: `${x.n}× · ${Math.round((x.share || 0) * 100)}% of misses${x.trend ? ` · ${x.trend > 0 ? '▲' : x.trend < 0 ? '▼' : '='}` : ''}` }),
        x.last_word ? h('button', { type: 'button', class: 'wchip', onclick: () => W.open(x.last_word), text: x.last_word }) : null),
      h('button', { type: 'button', class: 'btn sm', text: 'Twin ×10', onclick: () => UI.startWords({ mode: 'quiz', deck: { source: 'trap', value: x.id }, formats: ['incontext'], count: 10 }) }))));
    if (lg.length) {
      el.append(h('p', { class: 'k', style: 'margin-top:8px', text: 'Logic mix-ups' }));
      lg.slice().sort((a, b) => b.n - a.n).forEach(m => el.append(h('div', { class: 'mix-row' },
        h('span', { class: 'l', text: `You read ${m.needed} as ${m.picked} ${m.n}×` }),
        h('button', { type: 'button', class: 'btn sm', text: 'Quiz the pair · 8', onclick: () => UI.startWords({ mode: 'quiz', deck: { source: 'logic', value: `${m.needed}>${m.picked}` }, formats: ['transition'], count: 8 }) }))));
    }
    if (gaps.word || gaps.reading) {
      el.append(h('p', { class: 'wm-line', style: 'margin-top:8px', text: `This week’s misses: ${gaps.word || 0} word gaps · ${gaps.reading || 0} reading gaps` }),
        h('div', { class: 'wm-tools' },
          gaps.word ? h('button', { type: 'button', class: 'btn sm', text: `Learn these ${gaps.word}`, onclick: () => UI.startWords({ mode: 'cards', deck: { source: 'missed' }, count: gaps.word }) }) : null,
          gaps.reading ? h('button', { type: 'button', class: 'btn sm', text: 'Practise finding the clue · 10', onclick: () => UI.startWords({ mode: 'quiz', deck: { source: 'readgap' }, formats: ['incontext'], count: 10 }) }) : null));
    }
  }
  function habits() {
    const el = $('habits');
    const cal = (ins && ins.calibration) || {}, rc = (ins && ins.recall) || {};
    const lines = [];
    if (cal.n) lines.push(h('p', { class: 'wm-line' }, 'When you say Know, you’re right ', h('b', { text: `${cal.pct}%` }), ` of the time (last ${cal.n} ${cal.n === 1 ? 'check' : 'checks'})`));
    if (rc.n) {
      lines.push(h('p', { class: 'wm-line' }, 'Recall on due reviews, 30 days: ', h('b', { text: `${rc.pct}%` }), ' · the aim is 85–95%'));
      if (rc.scale && rc.scale !== 1) lines.push(h('p', { class: 'wm-line', text: `Your intervals: ×${rc.scale} (you recall ${rc.pct}% of due words)` }));
    }
    const known = (lib.counts || {}).known;
    if (known && ins && ins.finish && ins.finish.exam) lines.push(h('p', { class: 'wm-line', text: `Ready for test day: ${num(ins.finish.likely || 0)}` }));
    put(el, h('h2', { text: 'How your schedule is working' }),
      lines.length ? lines : h('p', { class: 'wm-line', text: 'After a few due reviews this shows how often you recall them, and how well your Know holds up.' }));
  }

  /* ---------------- tools */
  function tools() {
    const el = $('tools');
    const bring = h('button', { type: 'button', class: 'btn', text: 'Bring words ▾', 'aria-haspopup': 'menu' });
    UI.menu.bind(bring, () => [
      { label: 'From a text', onClick: () => UI.bringWords ? UI.bringWords('text') : UI.toast('Bring words is not ready yet.') },
      { label: 'A word list', onClick: () => UI.bringWords ? UI.bringWords('list') : UI.toast('Bring words is not ready yet.') },
      { label: 'A question I missed', onClick: () => UI.bringWords ? UI.bringWords('missed') : UI.toast('Bring words is not ready yet.') }]);
    put(el, h('button', { type: 'button', class: 'btn', onclick: () => UI.addWord() }, W.icon('plus', 16), 'Add a word'), bring,
      h('button', { type: 'button', class: 'btn', text: 'Import', onclick: importSheet }),
      h('button', { type: 'button', class: 'btn', text: 'Export CSV', onclick: exportCsv }),
      h('button', { type: 'button', class: 'btn', text: 'Print this list', onclick: () => print() }), shareBtn(),
      h('button', { type: 'button', class: 'btn', text: 'Grade a worksheet', onclick: () => W.gradeSheet() }));
  }
  // W20: share any list; a list the server does not keep (own words' list) goes by its words
  function shareBtn() {
    const b = h('button', { type: 'button', class: 'btn', text: 'Share a list ▾', 'aria-haspopup': 'menu' });
    UI.menu.bind(b, () => {
      const names = [...new Set(words.flatMap(w => [...(w.lists || []), ...(w.own && w.collection ? [w.collection] : [])]))].sort();
      const of = n => words.filter(w => (w.lists || []).includes(n) || (w.own && w.collection === n)).map(w => w.slug);
      return names.length ? names.map(n => ({ label: n, sub: `${num(of(n).length)} words`,
        onClick: async () => { if (await W.share({ list: n, quiet404: true }) === false) W.share({ title: n, words: of(n) }); } }))
        : [{ label: 'No lists yet', sub: 'Make one from the library: Select, then + New list', disabled: true }];
    });
    return b;
  }
  async function exportCsv() {
    try {
      const r = await fetch('/api/words/mine.csv', { headers: { 'X-Learner': UI.learner() } });
      if (!r.ok) throw new Error();
      const a = h('a', { href: URL.createObjectURL(await r.blob()), download: 'my-words.csv' });
      document.body.append(a); a.click(); a.remove();
    } catch (_) { UI.toast('Export did not work. Try again.'); }
  }
  function importSheet() {
    const ta = h('textarea', { class: 'field', rows: '8', placeholder: 'One per line: word, then a tab, " - ", ":" or " — ", then the meaning' });
    const list = h('input', { class: 'field sm', value: 'My words', maxlength: '30', 'aria-label': 'List', list: 'imp-lists' });
    const dl = h('datalist', { id: 'imp-lists' }, [...new Set(['My words', ...(W._lists || [])])].map(n => h('option', { value: n })));
    const prev = h('div', { 'aria-live': 'polite' });
    const LABEL = { new: 'new', dup: 'duplicate', lib: 'in the library', bad: 'not understood' };
    let ix = null, rows = [], done = false, sh = null;
    W.index().then(x => { ix = x; upd(); }).catch(() => {});
    const ownWords = () => new Set(words.filter(w => w.own).map(w => w.word.toLowerCase()));
    // a tab, " - ", " — " or ":" splits word from meaning; a CSV with a word,meaning header too;
    // a line with neither is a word to match against the library (W19)
    const parse = () => {
      const lines = ta.value.split('\n').map(l => l.trim()).filter(Boolean);
      const csv = lines.length && /^word\s*,\s*meaning/i.test(lines[0]);
      const own = ownWords();
      return (csv ? lines.slice(1) : lines).map(l => {
        const m = csv ? l.match(/^([^,]+),(.*)$/) : l.match(/^(.+?)(?:\t| - | — |:)\s*(.+)$/);
        const word = (m ? m[1] : l).trim().replace(/^"|"$/g, ''), meaning = m ? m[2].trim().replace(/^"|"$/g, '') : '';
        const hit = ix && ix.byWord.get(word.toLowerCase());
        const st = meaning ? (own.has(word.toLowerCase()) ? 'dup' : 'new') : hit ? 'lib' : 'bad';
        return { word, meaning, st, slug: hit && hit.slug };
      });
    };
    const addBtn = () => sh && sh.foot && sh.foot.querySelector('.pill, [data-primary], button:last-child');
    function upd() {
      if (done) return;
      rows = parse();
      const n = rows.filter(r => r.st === 'new' || r.st === 'lib').length;
      const b = addBtn();
      if (b) { b.textContent = n ? `Add ${num(n)} ${n === 1 ? 'word' : 'words'}` : 'Add them'; b.disabled = !n; }
      if (!rows.length) { put(prev, h('p', { class: 'help', text: 'A Quizlet export pastes in as is. A CSV with a word,meaning header works too.' })); return; }
      put(prev, h('div', { class: 'table-wrap' }, h('table', { class: 'table compact' },
        h('thead', {}, h('tr', {}, h('th', { text: 'Word' }), h('th', { text: 'Meaning' }), h('th', { text: '' }))),
        h('tbody', {}, rows.slice(0, 60).map(r => h('tr', {}, h('td', { class: 'w', text: r.word }), h('td', { text: r.meaning || (r.st === 'lib' ? 'the library’s meaning' : '—') }),
          h('td', { class: 'meta', text: LABEL[r.st] })))))),
        rows.length > 60 ? h('p', { class: 'help', text: `and ${num(rows.length - 60)} more` }) : null);
    }
    async function addToList(name, slugs) {
      try { await UI.api('/words/lists', { method: 'POST', body: { name, words: slugs } }); }
      catch (e) {
        if (e.status !== 409) throw e;
        const had = words.filter(w => (w.lists || []).includes(name)).map(w => w.slug);
        await UI.api(`/words/lists/${encodeURIComponent(name)}`, { method: 'PUT', body: { words: [...new Set([...had, ...slugs])] } });
      }
    }
    ta.addEventListener('input', upd);
    sh = UI.sheet({ title: 'Import words', size: 'm', body: h('div', { style: 'display:grid;gap:10px' }, ta, h('label', { class: 'label', text: 'List' }), list, dl, prev),
      actions: [{ label: 'Cancel', quiet: true }, { label: 'Add them', primary: true, onClick: async () => {
        if (done) return true;
        rows = parse();
        const name = list.value.trim().slice(0, 30) || 'My words';
        const own = rows.filter(r => r.st === 'new'), lib = rows.filter(r => r.st === 'lib');
        if (!own.length && !lib.length) return false;
        let added = 0, skipped = rows.filter(r => r.st === 'dup' || r.st === 'bad').map(r => ({ word: r.word, why: r.st === 'dup' ? 'you already have it' : 'no meaning, and not in the library' }));
        try {
          if (own.length) {
            const r = await UI.api('/words/mine/import', { method: 'POST', body: { text: own.map(x => `${x.word}\t${x.meaning}`).join('\n'), list: name } });
            added += r.added || 0;
            (r.skipped || []).forEach(s => skipped.push({ word: (own[(s.line || 1) - 1] || {}).word || `line ${s.line}`, why: /existing/.test(String(s.why)) ? 'you already have it' : String(s.why) }));
          }
          if (lib.length) { await addToList(name, [...new Set(lib.map(x => x.slug))]); added += lib.length; }
        } catch (e) { if (!e.offline) put(prev, h('p', { class: 'field-err', text: 'Not added. Try again.' })); return false; }
        done = true;
        put(prev, h('p', { class: 'line' }, h('b', { text: `Added ${num(added)}` }), skipped.length ? ` · skipped ${num(skipped.length)}` : ''),
          skipped.length ? h('ul', { class: 'help' }, skipped.slice(0, 30).map(s => h('li', { text: `${s.word}: ${s.why}` }))) : null);
        const b = addBtn(); if (b) { b.textContent = 'Done'; b.disabled = false; }
        sh.foot.querySelectorAll('button').forEach(x => { if (x !== b) x.hidden = true; });
        ta.disabled = true;
        load();
        return false;
      } }] });
    upd();
  }

  /* ---------------- filters and the list */
  function filters() {
    const collOpts = [];
    (lib.groups || []).forEach(g => (g.collections || []).forEach(c => { if (c.kind !== 'own') collOpts.push({ value: c.id, label: c.name }); }));
    (W._lists || []).forEach(l => collOpts.push({ value: 'own:' + l, label: l }));
    fbar = UI.filterBar($('view'), [
      { key: 'q', type: 'search', label: 'Search your words', placeholder: 'Search your words' },
      { key: 'c', label: 'Collection', type: 'multi', options: collOpts },
      { key: 'd', label: 'Difficulty', type: 'pills', options: [{ value: 'easy', label: 'Easy' }, { value: 'medium', label: 'Medium' }, { value: 'hard', label: 'Hard' }, { value: 'hardforyou', label: 'Hard for you' }] },
      { key: 'p', label: 'Part of speech', type: 'multi', options: Object.entries(W.POS).filter(([k]) => k !== 'phrase').map(([v, l]) => ({ value: v, label: l })) },
    ], { url: true, label: 'Filter your words', onChange: () => { limit = LIMIT0; paint(); } });
    const tv = h('span', {});
    UI.seg(tv, [{ value: 'table', label: 'Table' }, { value: 'wall', label: 'Wall' }], { value: view, label: 'View', onChange: v => { view = v; setUrl('view', v === 'wall' ? 'wall' : null); paint(); } });
    $('view').append(tv);
  }
  const fold = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function rows() {
    const v = fbar ? fbar.values() : {};
    const t = TILES.find(x => x[0] === tile);
    const q = fold(v.q || '');
    // the wall (W13) shows every word of the selected collection, not only the ones touched
    return (t ? words.filter(t[2]) : view === 'wall' ? words : mine).filter(w => {
      if ((v.c || []).length && !v.c.some(c => c.startsWith('own:') ? w.own && w.collection === c.slice(4) : w.collection === c || (w.lists || []).includes(c) || (c === 'roots' && (w.roots || []).length))) return false;
      if ((v.d || []).length && !v.d.some(d => d === 'hardforyou' ? w.hard_for_you : W.level(w.measured, w.difficulty).tier === d)) return false;
      if ((v.p || []).length && !v.p.includes(w.pos)) return false;
      if (q && !fold(w.word).includes(q) && !fold(w.short).includes(q)) return false;
      return true;
    });
  }
  function paint() {
    const host = $('list');
    const rs = rows();
    if (!mine.length && !tile) {
      put(host, h('div', { class: 'wm-empty' }, h('p', { text: 'No words yet. Study a deck in the Library, star words to keep them, or add your own.' }),
        h('div', { class: 'wm-tools' }, h('a', { class: 'pill sm', href: '/words/', text: 'Library' }), h('button', { type: 'button', class: 'btn', text: 'Add a word', onclick: () => UI.addWord() }))));
      bulk(); return;
    }
    if (!rs.length) {
      const empty = tile === 'trap' ? 'No trap has caught you in the last 60 days.' : tile === 'due' ? 'Nothing due.' : 'No words match these filters.';
      put(host, h('div', { class: 'wm-empty' }, h('p', { text: empty }), h('button', { type: 'button', class: 'btn', text: 'Clear filters', onclick: () => { tile = ''; setUrl('tile', null); fbar.clear(); stats(); paint(); } })));
      bulk(); return;
    }
    if (view === 'wall') { wall(host, rs); bulk(); return; }
    const kinds = w => { const s = w.state || {}; return s.right || s.wrong ? `${s.right || 0}/${(s.right || 0) + (s.wrong || 0)}` : ''; };
    const cols = [
      { key: 'sel', label: '', sort: false, render: w => { const cb = h('input', { type: 'checkbox', 'aria-label': `Select ${w.word}`, checked: selected.has(w.slug) ? true : null }); cb.addEventListener('click', e => { e.stopPropagation(); if (cb.checked) selected.add(w.slug); else selected.delete(w.slug); bulk(); }); return cb; } },
      { key: 'word', label: 'Word', sort: true, value: w => w.word, render: w => h('span', { class: 'w', text: w.word }) },
      { key: 'coll', label: 'Collection · topic', sort: true, value: w => w.own ? w.collection : `${W._coll[w.collection] || w.collection}${(w.topics || [])[0] ? ' · ' + cap(w.topics[0]) : ''}` },
      { key: 'level', label: 'Level', sort: true, value: w => ({ easy: 1, medium: 2, hard: 3 })[W.level(w.measured, w.difficulty).tier], render: w => UI.dbars ? UI.dbars(W.level(w.measured, w.difficulty).tier) : W.level(w.measured).tier },
      { key: 'str', label: 'Strength', sort: true, value: w => (w.state || {}).box || 0, render: w => W.pips(w) },
      { key: 'next', label: 'Next review', sort: true, value: w => (w.state || {}).due || 'z', render: w => w.is_due ? h('span', { class: 'due', text: 'Due' }) : (w.state || {}).due ? W.dayName(w.state.due, { plain: true }).replace(',', '') : '' },
      { key: 'quiz', label: 'Right / total', sort: true, value: kinds },
      { key: 'last', label: 'Last reviewed', sort: true, value: w => (w.state || {}).last || '', render: w => (w.state || {}).last ? W.shortDate(w.state.last) : '' },
      { key: 'star', label: '★', sort: true, value: w => (w.saved ? 1 : 0), render: w => h('span', w.saved ? { 'aria-label': 'saved', text: '★' } : {}) },
    ];
    const shown = rs.slice(0, limit);
    put(host);
    table = UI.table(host, cols, shown, { label: 'Your words', onRow: w => W.open(w.slug, { list: rs.map(x => x.slug), onChange: () => { dirty = true; }, onClose: () => { if (dirty) { dirty = false; load(); } } }), sort: { key: 'next', dir: 'asc' } });
    // phone layout classes
    host.querySelectorAll('tbody tr').forEach(tr => { const td = tr.children; ['c-sel', 'c-word', 'c-meta', 'c-hide', 'c-str', 'c-meta', 'c-hide', 'c-hide', 'c-hide'].forEach((c, i) => td[i] && td[i].classList.add(c)); });
    if (rs.length > limit) host.append(h('button', { type: 'button', class: 'btn wm-more', text: `Show ${Math.min(120, rs.length - limit)} more · ${num(rs.length - limit)} left`, onclick: () => { limit += 120; paint(); } }));
    bulk();
  }
  let dirty = false;
  function wall(host, rs) {
    const lv = w => W.level(w.measured, w.difficulty).tier;
    const st = w => { const s = W.status(w); return s === 'probable' ? 'new' : s; };
    const counts = { new: 0, learning: 0, claimed: 0, known: 0 };
    rs.forEach(w => { counts[st(w)]++; });
    const rowsEl = ['easy', 'medium', 'hard'].map(l => {
      const ws = rs.filter(w => lv(w) === l);
      if (!ws.length) return null;
      const cells = h('div', { class: 'wall-cells', role: 'group', 'aria-label': `${cap(l)} words` }, ws.map(w => {
        const b = h('button', { type: 'button', class: `wcell ${st(w)}${w.is_due ? ' due' : ''}${w.stubborn ? ' stubborn' : ''}`, tabindex: '-1',
          'aria-label': `${w.word}, ${W.STATUS[W.status(w)]}${w.is_due ? ', due today' : ''}${w.stubborn ? ', stubborn' : ''}`, onclick: () => W.open(w.slug, { list: rs.map(x => x.slug) }) });
        if (UI.tooltip) UI.tooltip(b, `${w.word} · ${W.STATUS[W.status(w)]}${w.proven ? ` since ${W.shortDate(w.proven)}` : ''}`);
        return b;
      }));
      const row = h('div', { class: 'wall-row' }, h('span', { class: 'k', text: `${cap(l)} · ${ws.length}` }), cells);
      if (matchMedia('(max-width: 759px)').matches) row.querySelector('.k').addEventListener('click', () => row.classList.toggle('big'));
      return row;
    }).filter(Boolean);
    const all = () => [...host.querySelectorAll('.wcell')];
    const w = h('div', { class: 'wall' },
      h('p', { class: 'wall-legend' }, ['new', 'learning', 'claimed', 'known'].filter(s => counts[s]).map(s => h('span', {}, h('i', { class: s }), `${W.STATUS[s]} ${num(counts[s])}`)),
        rs.some(w => w.is_due) ? h('span', { text: `• due today ${rs.filter(w => w.is_due).length}` }) : null, rs.some(w => w.stubborn) ? h('span', { text: `⌇ stubborn ${rs.filter(w => w.stubborn).length}` }) : null,
        h('span', { text: 'Tap a word’s cell to open it' })),
      rowsEl);
    put(host, w);
    const cells = all();
    if (cells[0]) cells[0].tabIndex = 0;
    w.addEventListener('keydown', e => {
      const i = cells.indexOf(document.activeElement);
      if (i < 0) return;
      const d = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 20, ArrowUp: -20 }[e.key];
      if (!d) return;
      e.preventDefault();
      const j = Math.max(0, Math.min(cells.length - 1, i + d));
      cells[i].tabIndex = -1; cells[j].tabIndex = 0; cells[j].focus();
    });
  }

  /* ---------------- the bulk bar */
  let bar = null;
  function bulk() {
    if (!bar) {
      bar = UI.selbar($('bulk'), { onClear: () => { selected.clear(); paint(); }, actions: [
        { label: 'Flashcards', onClick: () => UI.startWords({ mode: 'cards', deck: { source: 'words', words: [...selected].slice(0, 200) } }) },
        { label: 'Quiz', onClick: () => W.quizStart({ source: 'words', words: [...selected].slice(0, 200) }, Math.min(20, selected.size)) },
        { label: 'Share', onClick: () => W.share({ title: 'My words', words: [...selected] }) },
        { label: 'Print a worksheet', onClick: () => W.print({ source: 'words', words: [...selected].slice(0, 200) }, { formats: ['meaning2word', 'incontext'], count: Math.min(40, Math.max(10, selected.size)) }) },
        { label: 'Save', onClick: () => star(true) }, { label: 'Unsave', onClick: () => star(false) },
        { label: 'Reset progress', onClick: reset },
        { label: 'Delete (own only)', onClick: del }] });
    }
    bar.update(selected.size);
  }
  async function star(on) {
    const list = [...selected];
    await Promise.all(list.map(s => UI.api(`/words/${encodeURIComponent(s)}/save`, { method: 'POST', body: { on } }).catch(() => null)));
    UI.toast(`${on ? 'Saved' : 'Unsaved'} ${list.length}`); load();
  }
  async function reset() {
    if (!await UI.confirm({ title: `Reset ${selected.size} words?`, text: 'Their boxes, due dates and stars go back to new. Review history stays.', confirm: 'Reset', destructive: true })) return;
    try { await UI.api('/words/reset', { method: 'POST', body: { words: [...selected] } }); UI.toast('Progress reset'); selected.clear(); load(); } catch (e) { if (!e.offline) UI.toast('Not reset. Try again.'); }
  }
  async function del() {
    const own = [...selected].filter(s => s.startsWith('u:'));
    if (!own.length) { UI.toast('Only your own words can be deleted.'); return; }
    if (!await UI.confirm({ title: `Delete ${own.length} of your words?`, text: 'They and their review history go. Library words stay.', confirm: 'Delete', destructive: true })) return;
    await Promise.all(own.map(s => UI.api(`/words/mine/${encodeURIComponent(s)}`, { method: 'DELETE' }).catch(() => null)));
    UI.toast(`Deleted ${own.length}`); own.forEach(s => selected.delete(s)); load();
  }

  UI.keys.register('wordsmine', {
    '/': { does: 'Search your words', run: () => { const i = $('view').querySelector('input[type=search]'); if (i) i.focus(); } },
    N: { does: 'Add a word', run: () => UI.addWord() },
  }, { label: 'My words' });
  W.listKeys('wordsminelist', '.wm-list tr[tabindex], .wm-list .wall button', { label: 'Your words', select: el => { const cb = el.querySelector('input[type=checkbox]'); if (cb) { cb.click(); el.focus(); } } });
  document.addEventListener('satf:words', load);
  load();
})();
</script>
</body>
