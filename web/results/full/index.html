<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Full SAT · SAT Freshman</title>
<meta name="description" content="A full SAT's result: the total, then Reading and Writing and Math.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* A full SAT's result (spec/full-sat DESIGN 2): the header (Results / Full SAT #n, one meta line), the total as the
     page's one hero (.card.hero, 400-1600), the two sections in College Board's order, then what to do next. One
     column, read top to bottom. Tokens only. */
  .fs { display: grid; gap: var(--card-gap); max-width: 760px; }
  .fs * { min-width: 0; }
  .fs-crumb { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; margin: 0; }
  .fs-crumb > a, .fs-crumb > span { font: 500 22px/1.2 var(--font); letter-spacing: -.02em; color: var(--soft); text-decoration: none; }
  .fs-crumb > span { color: var(--faint); }
  .fs-crumb > a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
  .fs-crumb > .h1 { margin: 0; }
  .fs-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; margin: 4px 0 0; font: 400 14px/1.45 var(--font); color: var(--soft); }
  .fs-meta > span + span:not(.badge)::before { content: "·"; margin-right: 8px; }
  /* the total: its figure at the hero step with "/1600" small beside it, then its scale and one line */
  #total { display: grid; gap: 12px; }
  #total > p { margin: 0; }
  .fs-figrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; }
  .fs-figrow .hero-num { font-size: min(var(--fs-hero), 12vw); }     /* "1220–1240 /1600" fits a 390px phone */
  .fs-figrow .hero-num small { font: 400 14.5px var(--font); letter-spacing: 0; color: var(--soft); }
  .fs-line { font: 400 14.5px/1.5 var(--font); color: var(--ink); text-wrap: pretty; }
  .fs-line b { font-weight: 600; font-variant-numeric: tabular-nums; }
  /* the sections: one row each, a hairline between; the name and its line left, the range and the report right */
  .fs-sec { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; padding: 16px 0; }
  .fs-sec + .fs-sec { border-top: 1px solid var(--line); }
  .fs-sec:first-of-type { padding-top: 4px; }
  .fs-sec:last-child { padding-bottom: 0; }
  .fs-sec h3 { margin: 0; font: 600 16px/1.3 var(--font); }
  .fs-sec .meta { margin: 0; }
  .fs-band { font: 600 28px/1.05 var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: var(--ink-strong); justify-self: end; }
  .fs-sec .fs-acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  /* what to do next: one row each, what it is and its size, the action right */
  .fs-next { display: grid; }
  .fs-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; align-items: center; min-height: var(--row-h); padding: 8px 0; }
  .fs-row + .fs-row { border-top: 1px solid var(--line); }
  .fs-row h3 { margin: 0; font: 600 14.5px/1.35 var(--font); }
  .fs-row .meta { margin: 2px 0 0; }
  @media (max-width: 759px) {
    .fs-crumb > a, .fs-crumb > span { font-size: 18px; }
  }
  @media print { #bar, #tabs, .fs-next-card { display: none !important; } }
</style>
</head>
<body data-page="report">
<header id="bar"></header>

<main class="page" id="main" aria-busy="true">
  <div class="fs" id="root">
    <header id="head"></header>
    <section id="total" class="card hero" aria-label="Total"></section>
    <section id="sections" class="card" aria-label="Sections" hidden></section>
    <section id="next" class="card fs-next-card" aria-label="What to do next" hidden></section>
  </div>
</main>

<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/assets/results-ui.js"></script>
<script src="/results/full/page.js"></script>
</body>
</html>
