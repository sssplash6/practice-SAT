<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Report · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/runner.css">
<style>
  /* The score report (spec 3.5 §1, reports.md SR1-SR25). One sitting, read top down:
     what the score means, where the points went, why each miss happened, then every
     question, then the skills, judgement and time. Every region keeps its frame. */
  .rp { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
  .rp > * { grid-column: 1 / -1; min-width: 0; }
  .rp > [hidden] { display: none; }
  .rp-helper { font: 400 14px/1.45 var(--font); color: var(--soft); text-wrap: pretty; }
  .rp-line { font: 400 15px/1.5 var(--font); color: var(--ink); text-wrap: pretty; }
  .rp-line b, .rp-num { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .rp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .rp-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 999px; background: var(--tile-2); color: var(--ink); font: 500 13px var(--font); border: 0; text-decoration: none; }
  button.rp-chip, a.rp-chip { cursor: pointer; }
  .rp-chip.ok { background: var(--wash-2); box-shadow: inset 0 0 0 1.5px var(--amber); }
  .rp-chip.line { background: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--soft); }
  .rp-qchip { font-family: var(--mono); }
  .rp-dot::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); margin-right: 2px; }
  .rp-cols { display: grid; grid-template-columns: repeat(var(--c, 2), minmax(0, 1fr)); gap: 12px; }

  .rp-info { min-height: 24px; padding: 0 6px; margin-left: 2px; font: 500 14px/1 var(--font); color: var(--soft); vertical-align: 1px; }
  .card-head .rp-headr { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .card-head .rp-headr .seg + .help { display: none; }
  .rp-alone { display: grid; gap: 14px; justify-items: start; }
  .rp-inline { display: inline-flex; vertical-align: middle; gap: 6px; }
  .rp-chip[aria-pressed="true"] { background: var(--wash-2); box-shadow: inset 0 0 0 1.5px var(--amber); }
  .rp-chip b.rp-num { font-weight: 500; color: var(--soft); }
  .rp-count { justify-items: start; align-content: center; gap: 6px; }
  .rp-count .rp-num { font-size: 18px; color: var(--soft); }
  .rp-tools .k { flex: none; }
  .rp-tools .rp-row { gap: 6px 10px; }
  .rp-tools .chips + .help:empty, .rp-tools .seg + .help:empty { display: none; }
  .rp-legend .legend { margin: 0; }
  .rp-mrow > .rp-row.acts { grid-column: 2 / -1; }
  .rp-vrow > .rp-row { justify-content: flex-start; }
  #review .cell-grid { --cell: 40px; }
  @media (max-width: 759px) { #review .cell-grid { --cell: 44px; --cols: 7; --cell-gap: 6px; } }

  /* header */
  #head { display: grid; gap: 12px; }
  .rp-back { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 500 14px var(--font); }
  .rp-back a { color: var(--soft); text-decoration: none; }
  .rp-back a:hover { color: var(--ink); text-decoration: underline; }
  .rp-title { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; align-items: flex-end; }
  .rp-title > div:first-child { flex: 1 1 340px; min-width: 0; }
  .rp-rw select.field { width: auto; }
  .rp-title h1 { font: 800 clamp(22px, 3.2vw, 30px)/1.2 var(--font); letter-spacing: -.02em; }
  .rp-acts { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; }
  .rp-split { display: inline-flex; align-items: stretch; }
  .rp-split > .pill:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; padding-right: 16px; }
  .rp-split > .pill + .pill { border-top-left-radius: 0; border-bottom-left-radius: 0; padding: 0 12px; margin-left: 1px; }
  .rp-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-radius: var(--radius); background: var(--tile-2); font: 500 14px var(--font); }
  .rp-note { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .rp-note q { font: italic 400 15px/1.4 var(--serif, var(--font)); }
  .rp-note .field { max-width: 360px; }

  /* recovery strip and second look */
  .rp-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .rp-step { display: grid; gap: 2px; padding: 12px 14px; border-radius: 10px; background: var(--tile-2); text-align: left; border: 0; font: inherit; color: var(--ink); cursor: pointer; }
  .rp-step b { font: 700 14px var(--font); }
  .rp-step span { font: 500 12.5px var(--mono); color: var(--soft); }
  .rp-step[data-state="done"] { background: var(--wash-2); box-shadow: inset 0 0 0 1.5px var(--amber); }
  #second { background: var(--wash); }

  /* hero */
  .rp-hero { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; align-items: start; }
  .rp-gauge { grid-column: span 5; display: grid; gap: 10px; justify-items: center; }
  .rp-facts { grid-column: span 7; display: grid; gap: 12px; }
  .rp-big { font: 800 clamp(44px, 7vw, 64px)/1 var(--font); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .rp-facts details summary { cursor: pointer; font: 600 14px var(--font); }
  .rp-facts details ul { margin: 8px 0 0 18px; display: grid; gap: 4px; color: var(--soft); font-size: 14px; }
  .rp-rw { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .rp-rw .field { width: 110px; }

  /* tiles */
  #tiles .stats { --cols: 5; }
  #tiles .stats[data-n="8"] { --cols: 4; }

  /* takeaways, value, habits */
  .rp-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .rp-card { display: grid; gap: 8px; align-content: start; padding: 16px; border-radius: 12px; background: var(--tile-2); }
  .rp-card h3 { font: 700 15.5px/1.3 var(--font); }
  .rp-card .rp-row { margin-top: 4px; }
  .rp-vrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .rp-vrow:first-of-type { border-top: 0; }
  .rp-vbar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--tile-2); overflow: hidden; }
  .rp-vbar i { display: block; height: 100%; width: calc(var(--rp) * 100%); background: var(--amber); }
  .rp-mist-wrap { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; align-items: start; }
  .rp-mist-wrap > #mistakes { grid-column: span 8; }
  .rp-mist-wrap > #value { grid-column: span 4; }

  /* mistakes */
  .rp-group { display: grid; gap: 8px; margin-top: 16px; }
  .rp-group > h3 { font: 700 12px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .rp-mrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 14px; border-radius: 10px; background: var(--paper); align-items: start; }
  .rp-mrow .glyph { width: 20px; height: 20px; margin-top: 2px; }
  .rp-mrow h4 { font: 600 15px/1.35 var(--font); }
  .rp-mrow .meta { font-size: 12.5px; }
  .rp-mrow .st { font: 500 13px var(--font); color: var(--ink); }
  .rp-mrow.fixed h4 { text-decoration: line-through; text-decoration-thickness: 1px; color: var(--soft); }
  .rp-mrow .rp-row.acts { grid-column: 2 / -1; }
  .rp-mrow > .side { display: grid; justify-items: end; gap: 4px; }

  /* review */
  .rp-tools { display: grid; gap: 10px; }
  .rp-tools .rp-row.lab > .k { margin-right: 4px; }
  .rp-legend { margin-top: 4px; }
  .rp-grid-group { display: grid; gap: 8px; margin-top: 14px; }
  .rp-grid-group > h3 { font: 600 14px var(--font); }
  .rp-grid-group .meta { font-weight: 500; }
  .rp-cells .cell { overflow: visible; }
  .rp-cells .cell small { position: absolute; bottom: 2px; left: 0; right: 0; text-align: center; font: 500 8.5px/1 var(--mono); }
  .rp-cells .cell[data-saver]::before { content: "▲"; position: absolute; left: 3px; bottom: 2px; font: 700 8px/1 var(--font); color: var(--amber-deep); background: none; width: auto; height: auto; clip-path: none; }
  .cell[data-whatif="right"]::after { content: "✓" !important; color: var(--amber-deep) !important; font-size: 11px !important; }
  .cell[data-whatif="wrong"]::after { content: "✕" !important; color: var(--ink) !important; font-size: 11px !important; }
  .cell[data-whatif] { outline: 2px dashed var(--ink); outline-offset: 1px; }
  .cell[aria-selected="true"] { outline: 2.5px solid var(--amber-deep); outline-offset: 1.5px; }
  /* colour by time, cause, points, level, crowd: four warm steps, always with a corner letter or number */
  [data-colour]:not([data-colour="status"]):not([data-colour="difficulty"]) .cell[data-shade] { border-color: transparent; text-shadow: none; }
  [data-colour]:not([data-colour="status"]):not([data-colour="difficulty"]) .cell[data-shade="0"] { background: #F4EFE8; color: var(--ink); }
  [data-colour]:not([data-colour="status"]):not([data-colour="difficulty"]) .cell[data-shade="1"] { background: #DDD3C6; color: var(--ink); }
  [data-colour]:not([data-colour="status"]):not([data-colour="difficulty"]) .cell[data-shade="2"] { background: #A89A88; color: #fff; }
  [data-colour]:not([data-colour="status"]):not([data-colour="difficulty"]) .cell[data-shade="3"] { background: #5B5046; color: #fff; }
  [data-colour]:not([data-colour="status"]):not([data-colour="difficulty"]) .cell[data-shade]::after { content: attr(data-corner); color: inherit; opacity: .85; }
  [data-colour]:not([data-colour="status"]):not([data-colour="difficulty"]) .cell:not([data-shade]) { opacity: .45; }
  .rp-steps-key { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 500 12.5px var(--mono); color: var(--soft); }
  .rp-steps-key i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 5px; }
  .rp-table .ans { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rp-table .mist { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rp-table table { table-layout: fixed; }
  .rp-whatif { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-radius: 10px; background: var(--wash); }

  /* modules, domains, skills, split, judgement, pace */
  .rp-mods { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .rp-mod { display: grid; gap: 10px; padding: 16px; border-radius: 12px; background: var(--tile-2); }
  .rp-doms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .rp-dom { display: grid; gap: 8px; align-content: start; padding: 16px; border-radius: 12px; background: var(--tile-2); }
  .rp-dom h3 { font: 600 14px/1.3 var(--font); }
  .rp-dom .v { font: 500 28px/1 var(--mono); }
  .rp-lvl { display: flex; gap: 3px; }
  .rp-lvl i { flex: 1; height: 8px; border-radius: 2px; background: var(--mat); }
  .rp-lvl i.on { background: var(--ink); }
  .rp-srow { display: grid; grid-template-columns: minmax(0, 1.6fr) 90px minmax(0, 1fr) 150px; gap: 6px 16px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
  .rp-srow:first-child { border-top: 0; }
  .rp-srow > .rp-row { justify-content: flex-end; }
  .rp-srow .nm { display: flex; align-items: center; gap: 8px; font: 600 14.5px var(--font); }
  .rp-srow .glyph { width: 18px; height: 18px; flex: none; }
  .rp-mb { position: relative; height: 8px; border-radius: 4px; background: var(--mat); }
  .rp-mb i { position: absolute; inset: 0 auto 0 0; width: calc(var(--a) * 100%); border-radius: 4px; background: var(--ink); transition: width .6s var(--ease); }
  .rp-mb b { position: absolute; top: -3px; bottom: -3px; width: 2px; left: calc(var(--b) * 100%); background: var(--soft); }
  .rp-bars { display: grid; gap: 8px; }
  .rp-bar { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 0; background: none; padding: 4px 0; font: inherit; text-align: left; color: var(--ink); cursor: pointer; }
  .rp-bar .t { height: 10px; border-radius: 5px; background: var(--tile-2); overflow: hidden; }
  .rp-bar .t i { display: block; height: 100%; width: calc(var(--rp) * 100%); background: var(--amber); }
  .rp-conf { display: grid; grid-template-columns: auto repeat(2, minmax(0, 1fr)); gap: 6px; max-width: 420px; }
  .rp-conf > * { padding: 8px 10px; border-radius: 8px; background: var(--tile-2); font: 500 13.5px var(--mono); text-align: center; border: 0; }
  .rp-conf > .h { background: none; font: 600 12px var(--font); color: var(--soft); text-align: left; }
  .rp-conf button { cursor: pointer; color: var(--ink); }
  .rp-judge { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; }
  .rp-judge > div { display: grid; gap: 8px; align-content: start; }
  .rp-judge h3, .rp-sub { font: 700 12px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  #next { border-top: 1px solid var(--line); padding-top: 24px; background: none; }

  /* the sticky strip on a phone: the primary, Jump to, Review, more */
  .rp-stick { display: none; }
  @media (max-width: 1099px) {
    .rp-gauge, .rp-facts { grid-column: 1 / -1; }
    .rp-mist-wrap > #mistakes, .rp-mist-wrap > #value { grid-column: 1 / -1; }
    .rp-doms { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .rp-cards { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 759px) {
    .rp { gap: 16px; }
    body[data-page="report"] .sections { display: none; }
    .rp-stick { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 21; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin: 0 calc(-1 * var(--gutter)); padding: 8px var(--gutter); background: var(--paper); box-shadow: 0 1px 0 var(--line); }
    .rp-stick[hidden] { display: none; }
    .rp-stick select { flex: 1 1 120px; min-height: var(--touch); }
    .rp-title { grid-template-columns: minmax(0, 1fr); }
    .rp-acts { justify-content: flex-start; }
    #tiles .stats, #tiles .stats[data-n="8"] { --cols: 2; }
    .rp-steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .rp-mods, .rp-judge { grid-template-columns: minmax(0, 1fr); }
    .rp-srow { grid-template-columns: minmax(0, 1fr) auto; }
    .rp-srow .rp-mb { grid-column: 1 / -1; }
    .rp-bar { grid-template-columns: 110px minmax(0, 1fr) auto; }
    .rp-mrow { grid-template-columns: 22px minmax(0, 1fr); }
    .rp-mrow > .side { grid-column: 2; justify-items: start; }
  }
  @media print {
    .rp-stick, #next, .rp-tools, .rp-whatif { display: none !important; }
    .rp { display: block; }
    .rp > section { break-inside: avoid-page; margin-bottom: 16px; }
  }
</style>
</head>
<body data-page="report">
<header id="bar"></header>

<main class="page" id="main" aria-busy="true">
  <div class="rp-stick" id="stick" hidden></div>
  <div class="rp" id="root">
    <header id="head"></header>
    <section id="recovery" class="card" hidden></section>
    <section id="second" class="card" hidden></section>
    <section id="hero" class="card" aria-label="Score"></section>
    <section id="ledger" class="card" hidden></section>
    <section id="compare" class="card" hidden></section>
    <section id="takeaways" class="card" hidden></section>
    <section id="tiles" aria-label="Summary"></section>
    <section id="habits" class="card" hidden></section>
    <div class="rp-mist-wrap" id="mistwrap">
      <section id="mistakes" class="card"></section>
      <section id="value" class="card" hidden></section>
    </div>
    <section id="review" class="card"></section>
    <section id="modules" class="card" hidden></section>
    <section id="domains" class="card" hidden></section>
    <section id="skills" class="card" hidden></section>
    <section id="judgement" class="card" hidden></section>
    <section id="split" class="card" hidden></section>
    <section id="pace" class="card" hidden></section>
    <section id="next" hidden></section>
  </div>
</main>

<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/assets/question.js"></script>
<script src="/assets/runner.js"></script>
<script src="/assets/results-ui.js"></script>
<script src="/results/report/page.js"></script>
</body>
</html>
