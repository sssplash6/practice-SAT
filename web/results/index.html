<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Results · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* Where you stand: the score over time, every skill, every sitting. */
  .top { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
  .card { border-radius: 14px; background: var(--tile); padding: 22px 24px; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart .grid line { stroke: var(--mat); stroke-width: 1; }
  .chart .grid text, .chart .xl { font: 500 10.5px var(--mono); fill: var(--soft); }
  .chart .band { fill: var(--mat); }
  .chart .band.last { fill: var(--wash-2); }
  .chart .mid { fill: var(--ink); }
  .chart .mid.last { fill: var(--amber); stroke: var(--amber-deep); stroke-width: 1; }
  .chart .trend { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
  .now .num { font-size: clamp(48px, 6vw, 72px); display: block; margin-top: 8px; }
  .now .meta { display: block; margin-top: 10px; }
  .totals { margin-top: 26px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .totals .num { font-size: 26px; display: block; }
  .totals .k { display: block; margin-top: 6px; }

  .block { margin-top: 44px; }
  .block > .k { display: block; margin-bottom: 14px; }
  .skills { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 20px; }
  .dcol { display: grid; gap: 6px; align-content: start; }
  .dcol .k { margin-bottom: 4px; }
  .sk { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--tile); text-decoration: none; color: var(--ink); }
  .sk .glyph { width: 20px; height: 20px; }
  .sk .nm { font: 500 13.5px var(--font); }
  .sk .mbar { grid-column: 2; height: 2px; }
  .sk .dots { position: absolute; }

  .list { display: grid; gap: 2px; }
  .item {
    display: grid; grid-template-columns: 70px 110px minmax(0, 1fr) auto 20px; gap: 16px; align-items: center;
    padding: 14px 16px; border-radius: 10px; text-decoration: none; color: var(--ink);
    transition: background-color .16s var(--ease);
  }
  @media (hover: hover) and (pointer: fine) { .item:hover { background: var(--tile); } }
  .item .when { font: 500 12.5px var(--mono); color: var(--soft); }
  .item .what { font: 600 14.5px var(--font); }
  .item .tops { display: flex; gap: 6px; min-width: 0; overflow: hidden; }
  .item .tops .glyph { width: 18px; height: 18px; }
  .item .sc { font: 800 17px var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .item svg.arr { width: 18px; height: 18px; color: var(--faint); }
  .more { margin-top: 12px; }

  @media (max-width: 959px) { .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 759px) {
    .top { grid-template-columns: minmax(0, 1fr); }
    .item { grid-template-columns: 60px minmax(0, 1fr) auto 18px; }
    .item .tops { display: none; }
  }
</style>
</head>
<body data-page="results">
<header id="bar"></header>

<main class="page">
  <div class="top">
    <section class="card chart rise" aria-label="Score over time"><div id="chart"></div></section>
    <section class="card now rise rise-2" aria-label="Latest">
      <span class="k" id="nowK">Math</span>
      <span class="num" id="now">—</span>
      <span class="meta" id="nowSub"></span>
      <a class="quiet" id="takeTest" href="/tests/" hidden style="margin-top:14px">Take a test</a>
      <div class="totals">
        <div><span class="num" id="tq">0</span><span class="k">Answered</span></div>
        <div><span class="num" id="tr">—</span><span class="k">Right</span></div>
        <div><span class="num" id="ts">0</span><span class="k">Streak</span></div>
      </div>
    </section>
  </div>

  <section class="block rise rise-2" aria-label="Skills"><span class="k">Skills</span><div class="skills" id="skills"></div></section>
  <section class="block rise rise-3" aria-label="Sittings"><span class="k">Sittings</span><div class="list" id="list"></div>
    <button type="button" class="quiet more" id="more" hidden>More</button>
  </section>
</main>

<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script>
(() => {
  'use strict';
  const { api, h, s, glyph, TOPIC, TOPICS, DOMAINS, band, day, svg, ICON, $ } = UI;
  UI.shell();
  const NAME = { mock: 'Section', module: 'Module', diagnostic: 'Diagnostic', drill: 'Practice', challenge: 'Challenge', practice: 'Practice' };

  /* ---------------------------------------------------------- the chart
     Each sitting is its band, drawn from low to high on the 200-800 scale,
     with its middle marked; the newest is the orange one. */
  function chart(sittings) {
    const host = $('#chart');
    const pts = sittings.filter(x => x.estimate).slice(0, 12).reverse();
    if (!pts.length) { host.replaceChildren(h('p', { class: 'empty', text: 'No scored sittings yet.' })); return; }
    // drawn at the card's own width, so the labels stay their CSS size on a phone
    const W = Math.max(280, Math.round(host.clientWidth) || 640), H = W < 480 ? 200 : 260, L = 38, R = 10, T = 12, B = 30;
    const y = v => T + (H - T - B) * (1 - (v - 200) / 600);
    const step = (W - L - R) / Math.max(pts.length, 6);
    const x = i => L + step * (i + .5);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    g.setAttribute('viewBox', `0 0 ${W} ${H}`);
    g.setAttribute('role', 'img');
    g.setAttribute('aria-label', 'Score bands over time');
    const grid = s('g', { class: 'grid' }, g);
    [200, 400, 600, 800].forEach(v => {
      s('line', { x1: L, x2: W - R, y1: y(v), y2: y(v) }, grid);
      s('text', { x: L - 8, y: y(v) + 3.5, 'text-anchor': 'end' }, grid).textContent = v;
    });
    const mids = pts.map((p, i) => [x(i), y((p.estimate.low + p.estimate.high) / 2)]);
    if (mids.length > 1) s('polyline', { class: 'trend', points: mids.map(m => m.join(',')).join(' ') }, g);
    pts.forEach((p, i) => {
      const last = i === pts.length - 1;
      const bw = Math.min(26, step * .5);
      s('rect', { class: 'band' + (last ? ' last' : ''), x: x(i) - bw / 2, width: bw, y: y(p.estimate.high),
                  height: Math.max(2, y(p.estimate.low) - y(p.estimate.high)), rx: 5 }, g);
      s('circle', { class: 'mid' + (last ? ' last' : ''), cx: mids[i][0], cy: mids[i][1], r: last ? 5.5 : 4 }, g);
      // a date label is about 40px wide, so a narrow chart labels every few, the newest always
      if ((pts.length - 1 - i) % Math.ceil(44 / step) === 0) {
        const t = s('text', { class: 'xl', x: x(i), y: H - 8, 'text-anchor': 'middle' }, g);
        t.textContent = day(p.finished);
      }
    });
    host.replaceChildren(g);
  }

  /* ---------------------------------------------------------- the skills */
  function skills(topics) {
    const by = Object.fromEntries(topics.map(t => [t.topic, t]));
    $('#skills').replaceChildren(...DOMAINS.map(([domain, short]) => h('div', { class: 'dcol' },
      h('span', { class: 'k', text: short }),
      TOPICS.filter(t => t.domain === domain).map(t => {
        const b = by[t.slug] || { mastery: 0, traps: [] };
        const fill = h('i');
        setTimeout(() => fill.style.setProperty('--m', b.mastery.toFixed(3)), 200);
        const row = h('a', { class: 'sk', href: '/practice/', title: `${b.answered || 0} answered` },
          glyph(t.slug), h('span', { class: 'nm' }, t.short, b.traps.length ? h('span', { class: 'dot', style: 'margin-left:8px;vertical-align:1px' }) : null),
          h('span', { class: 'mbar' }, fill));
        return row;
      }))));
  }

  /* ---------------------------------------------------------- the sittings */
  let all = [], shown = 20;
  function list() {
    $('#list').replaceChildren(...all.slice(0, shown).map(x => h('a', { class: 'item', href: `/results/report/?id=${encodeURIComponent(x.id)}` },
      h('span', { class: 'when', text: day(x.finished) }),
      h('span', { class: 'what', text: NAME[x.kind] || 'Practice' }),
      h('span', { class: 'tops' }, (x.topics || []).slice(0, 6).map(t => glyph(t))),
      h('span', { class: 'sc', text: x.estimate ? band(x.estimate) : (x.asked ? `${x.right}/${x.asked}` : '—') }),
      h('span', { html: svg(ICON.arrow, 18, 'arr') }))));
    if (!all.length) $('#list').replaceChildren(h('p', { class: 'empty', text: 'Nothing finished yet.' }));
    $('#more').hidden = all.length <= shown;
  }
  $('#more').addEventListener('click', () => { shown += 40; list(); });

  (async () => {
    const [hist, map, me] = await Promise.all([api('/history'), api('/map'), api('/me')]).catch(() => [null, null, null]);
    if (!hist) return;
    all = hist.sessions;
    chart(all);
    skills(map.topics);
    list();
    const scored = all.find(x => x.estimate);
    if (scored) {
      $('#now').textContent = band(scored.estimate);
      $('#nowSub').textContent = `${NAME[scored.kind]} · ${day(scored.finished)}`;
    } else { $('#takeTest').hidden = false; }
    const total = me.days.total;
    const right = me.days.recent.reduce((a, d) => a + d.right, 0), asked = me.days.recent.reduce((a, d) => a + d.questions, 0);
    $('#tq').textContent = total;
    $('#tr').textContent = asked ? `${Math.round(100 * right / asked)}%` : '—';
    $('#ts').textContent = me.days.streak;
  })();
})();
</script>
</body>
</html>
