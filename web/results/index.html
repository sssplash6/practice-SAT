<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Results · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* Results (spec 3.5 §2, reports.md SR21-SR24): where you stand, where the points go,
     every sitting, then every skill. One region per idea; each keeps its frame. */
  .rs { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; }
  .rs > * { grid-column: 1 / -1; min-width: 0; }
  .rs > [hidden] { display: none; }
  #estimate { grid-column: span 4; }
  #overview { grid-column: span 8; }
  .rs-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .rs-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-radius: var(--radius); background: var(--tile-2); font: 500 14px var(--font); }
  .rs-line { font: 400 15px/1.5 var(--font); color: var(--ink); text-wrap: pretty; }
  .rs-line b, .rs-num { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .rs-helper { font: 400 13.5px/1.45 var(--font); color: var(--soft); text-wrap: pretty; }
  .rs-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .rs-info { min-height: 24px; padding: 0 6px; margin-left: 2px; font: 500 14px/1 var(--font); color: var(--soft); }
  .card-head .rs-headr { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .card-head .rs-headr .help:empty { display: none; }
  .rs-big { white-space: nowrap; font: 800 clamp(30px, 2.9vw, 38px)/1.05 var(--font); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .rs-est { display: grid; gap: 12px; align-content: start; }
  .rs-facts { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .rs-facts li { font: 400 14px/1.4 var(--font); color: var(--ink); }
  .rs-facts li b { font: 500 14px var(--mono); }
  #totals .stats { --cols: 4; }
  .rs-bars { display: grid; gap: 8px; }
  .rs-bar { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 12px; align-items: center; font: 500 14px var(--font); }
  /* the skill's glyph beside its name, a two-line name wrapping beside the glyph, not under it */
  .rs-bar > span:first-child { display: flex; align-items: flex-start; gap: 6px; line-height: 1.3; }
  .rs-bar > span:first-child > svg, .rs-bar > span:first-child > .glyph { flex: none; margin-top: 1px; }
  .rs-bar .t { height: 10px; border-radius: 5px; background: var(--tile-2); overflow: hidden; }
  .rs-bar .t i { display: block; height: 100%; width: calc(var(--rp) * 100%); background: var(--amber); }
  .rs-dt { width: 100%; border-collapse: collapse; font: 500 13.5px var(--mono); }
  .rs-dt th, .rs-dt td { padding: 10px 8px; text-align: left; border-top: 1px solid var(--line); }
  .rs-dt thead th { border-top: 0; font: 600 12px var(--font); color: var(--soft); }
  .rs-dt td[data-s] { background: color-mix(in srgb, var(--amber) calc(var(--s) * 38%), transparent); border-radius: 6px; }
  .rs-dt th[scope=row] { font: 600 13.5px var(--font); }
  .rs-list { display: grid; gap: 10px; }
  .rs-group > h3 { font: 700 12px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); margin: 18px 0 10px; }
  .rs-group > h3 span { text-transform: none; letter-spacing: 0; font: 500 12.5px var(--mono); margin-left: 8px; }
  .rs-trap { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
  .rs-trap:first-child { border-top: 0; }
  .rs-trap h4 { font: 600 15px/1.35 var(--font); }
  .rs-trap .glyph { width: 20px; height: 20px; }
  .rs-trap .st { font: 500 13px var(--font); }
  .rs-trap .st.open::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: var(--amber); vertical-align: 1px; }
  .rs-skills { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .rs-skill { display: grid; gap: 8px; align-content: start; padding: 14px; border-radius: 12px; background: var(--tile-2); border: 0; text-align: left; font: inherit; color: var(--ink); cursor: pointer; }
  .rs-skill:hover { box-shadow: inset 0 0 0 1.5px var(--line); }
  .rs-skill b { display: flex; align-items: center; gap: 8px; font: 600 14.5px/1.3 var(--font); }
  .rs-skill .glyph { width: 18px; height: 18px; flex: none; }
  .rs-skill .badge { justify-self: start; }
  .rs-dom-h { grid-column: 1 / -1; font: 700 12px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); margin-top: 8px; }
  .rs-cmp { position: sticky; bottom: 16px; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--ink); color: var(--on-ink); }
  .rs-cmp[hidden] { display: none; }
  .rs-cmp .quiet { color: var(--on-ink); }
  .rs-sample { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  @media (max-width: 759px), (pointer: coarse) {
    .rs-info { position: relative; }
    .rs-info::before { content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: max(100%, 44px); transform: translate(-50%, -50%); }
  }
  @media (max-width: 1099px) {
    #estimate, #overview { grid-column: 1 / -1; }
  }
  @media (max-width: 759px) {
    .rs { gap: 16px; }
    #totals .stats { --cols-phone: 2; }
    .rs-bar { grid-template-columns: minmax(0, 1fr) auto; }
    .rs-bar .t { grid-column: 1 / -1; order: 3; }
    .card-head .rs-headr { flex: 1 1 100%; margin-left: 0; min-width: 0; }
    .card-head .rs-headr .seg { max-width: 100%; overflow-x: auto; }
    .rs-dt .old { display: none; }
    .rs-trap { grid-template-columns: 22px minmax(0, 1fr); }
    .rs-trap > .rs-row { grid-column: 2; }
    .rs-cmp { bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  }
  @media print {
    #bar, #tabs, .rs-cmp, .rs-sample { display: none !important; }
    .rs { display: block; }
    .rs > section { break-inside: avoid-page; margin-bottom: 16px; }
  }
</style>
</head>
<body data-page="results">
<header id="bar"></header>

<main class="page" id="main" aria-busy="true">
  <div class="rs" id="root">
    <header class="rs-head" id="head">
      <h1 class="h1">Results</h1>
      <div class="rs-row" id="headacts"></div>
    </header>
    <section id="sample" class="card" hidden></section>
    <section id="estimate" class="card" aria-label="Current estimate"></section>
    <section id="overview" class="card" aria-label="Score over time"></section>
    <section id="gap" class="card" hidden></section>
    <section id="totals" aria-label="Totals"></section>
    <section id="days" class="card" hidden></section>
    <section id="why" class="card" hidden></section>
    <section id="split" class="card" hidden></section>
    <section id="domtrend" class="card" hidden></section>
    <section id="sittings" class="card"></section>
    <section id="traps" class="card" hidden></section>
    <section id="skills" class="card"></section>
  </div>
  <div class="rs-cmp" id="cmpbar" hidden></div>
</main>

<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/assets/question.js"></script>
<script src="/assets/runner.js"></script>
<script src="/assets/results-ui.js"></script>
<script src="/results/page.js"></script>
</body>
</html>
