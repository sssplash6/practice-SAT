<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Help · SAT Freshman</title>
<meta name="description" content="Answers about practice, mistakes, scores, the plan, your account and privacy. All of SAT Freshman is free.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/me/me.css">
<style>
  /* Help (Shell 8, shell-me override 39): the answers from answers.json in the main column, searchable;
     shortcuts and Still stuck in the aside from 1280px (after the answers below that) */
  .help-page { --twocol-top: 60px; }
  .help-page .card, .help-g { scroll-margin-top: 64px; }
  .help-main { display: grid; gap: 32px; max-width: 820px; }
  /* the search is the page's one hero; the answers are one surface, a heading per group */
  .help-top { display: grid; gap: 16px; }
  .help-top .search { width: 100%; }
  .help-top #none { margin: 0; }
  .help-g + .help-g { margin-top: 28px; }
  .help-g[hidden] { display: none; }
  .help-g > h2 { margin: 0 0 4px; font: 600 16px/1.3 var(--font); letter-spacing: -.01em; color: var(--ink-strong, var(--ink)); }
  .keys-more > summary { cursor: pointer; padding: 8px 0; font: 500 14px var(--font); color: var(--soft); }
  .keys-more[open] > summary { color: var(--ink); }
  .qa { border-top: 1px solid var(--line); scroll-margin-top: 72px; }
  .qa:first-of-type { border-top: 0; }
  .qa > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 12px 0; font: 600 14.5px/1.4 var(--font); }
  .qa > summary::-webkit-details-marker { display: none; }
  .qa > summary svg { width: 16px; height: 16px; flex: none; color: var(--soft); transition: transform .2s var(--ease); }
  .qa[open] > summary svg { transform: rotate(90deg); }
  .qa > div { padding: 0 0 12px 24px; display: grid; gap: 8px; }
  .qa p { font: 400 14.5px/1.55 var(--font); }
  .qa .copy { justify-self: start; margin-block: 0; }
  .keys { display: grid; }
  .key-row { display: grid; gap: 4px; padding: 8px 0; border-top: 1px solid var(--line); font: 400 14px/1.4 var(--font); }
  .key-row:first-child { border-top: 0; padding-top: 0; }
  .key-row > .kbd { justify-self: start; }
  .fixed-row { display: grid; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); }
</style>
</head>
<body data-page="help">
<header id="bar"></header>
<main class="page me" id="main" tabindex="-1">
  <div class="help-page twocol">
    <div class="help-main" data-m="stagger">
      <section class="card hero help-top" aria-labelledby="help-h">
        <h1 class="h1" id="help-h">Help</h1>
        <input class="field search" id="q" type="search" placeholder="Search the answers" aria-label="Search the answers" autocomplete="off">
        <p class="soft" id="none" hidden>No question matches. <button type="button" class="quiet" id="ask">Send feedback and ask</button></p>
      </section>
      <section class="card" id="groups" aria-label="Answers"></section>
    </div>
    <aside class="twocol-side">
      <section class="card" aria-labelledby="stuck-h">
        <div class="card-head"><h2 id="stuck-h">Still stuck?</h2></div>
        <p>Tell us what happened. Replies show under Settings › Your reports.</p>
        <div class="card-foot"><button type="button" class="pill sm" id="fb">Send feedback</button></div>
      </section>
      <section class="card" id="keys-card" aria-labelledby="keys-h">
        <div class="card-head"><h2 id="keys-h">Keyboard shortcuts</h2></div>
        <p>Press <span class="kbd">?</span> on any page for its shortcuts.</p>
        <details class="keys-more"><summary>The main ones (9)</summary><div class="keys" id="keys" role="list"></div></details>
        <div class="card-foot"><button type="button" class="btn sm" id="allkeys">All shortcuts on this page</button></div>
      </section>
    </aside>
  </div>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script>
(() => {
  'use strict';
  const h = UI.h, $ = s => document.querySelector(s);
  UI.shell({ page: 'help', ownPrimary: true });   // Send feedback is the page's one orange
  // anchors other pages and the levers link to, onto the answer that covers them
  const ALIAS = { 'score-band': 'band', percentile: 'band', review: 'checks', 'study-days': 'plan', cap580: 'cap', calendar: 'reminders' };
  const KEYS = [['G then T, P, M, W, E, L, R, C, U, S, H', 'Today, Practice, Review, Words, Tests, Plan, Results, Compete, Profile, Settings, Help'],
    ['G then N', 'Start what’s up next'], ['Q', 'A quick question, or log a mistake'], ['⌘K or Ctrl K', 'Search everything, or type a command'],
    ['[', 'Collapse or open the sidebar'], ['?', 'Every shortcut on the page you’re on'],
    ['A–D or 1–4', 'Choose an answer in a question'], ['Enter', 'Check, then next'], ['Esc', 'Close a sheet or a menu']];
  $('#keys').append(...KEYS.map(([k, v]) => h('div', { class: 'key-row', role: 'listitem' }, h('span', { class: 'kbd', text: k }), h('span', { text: v }))));
  $('.keys-more > summary').textContent = `The main ones (${KEYS.length})`;
  $('#allkeys').addEventListener('click', () => UI.keys && UI.keys.sheet && UI.keys.sheet());
  const feedback = () => UI.report({ kind: 'page', source: '/help/' });
  $('#fb').addEventListener('click', feedback);
  $('#ask').addEventListener('click', feedback);

  let items = [];
  const groups = [];
  const chev = () => h('span', { 'aria-hidden': 'true', html: UI.svg(UI.ICON.chev, 16) });
  function render(list) {
    const by = new Map();
    list.forEach(x => { if (!by.has(x.group)) by.set(x.group, []); by.get(x.group).push(x); });
    const host = $('#groups');
    host.replaceChildren(...[...by].map(([g, xs], i) => {
      const id = 'g-' + g.toLowerCase().replace(/[^a-z]+/g, '-');
      groups.push({ id, label: g });
      return h('section', { class: 'help-g', id, 'aria-labelledby': `${id}-h` }, h('h2', { id: `${id}-h`, text: g }),
        xs.map(x => {
          const d = h('details', { class: 'qa', id: x.id }, h('summary', {}, chev(), h('span', { text: x.q })),
            h('div', {}, ...String(x.a).split('\n').map(t => h('p', { text: t })),
              x.id === 'fixed' ? h('div', { id: 'fixed-list' }, UI.skel(null, 'lines:3')) : null,
              h('button', { type: 'button', class: 'quiet copy reveal', text: 'Copy link to this answer',
                onclick: ev => UI.saving(ev.currentTarget, () => UI.copyText(`${location.origin}/help/#${x.id}`, { toast: false }).then(ok => { if (!ok) throw new Error('not copied'); }),
                  { busy: 'Copying', done: 'Link copied', fail: 'Not copied' }).catch(() => {}) })));
          d.addEventListener('toggle', () => { if (d.open) { try { history.replaceState(null, '', `#${x.id}`); } catch (_) {} if (x.id === 'fixed') loadFixed(); } });
          x.el = d;
          return d;
        }));
    }));
  }
  function filter(text) {
    const toks = text.toLowerCase().split(/\s+/).filter(Boolean);
    let shown = 0;
    items.forEach(x => {
      const hay = `${x.q} ${x.a} ${x.group}`.toLowerCase();
      const ok = toks.every(t => hay.includes(t));
      x.el.hidden = !ok;
      if (ok) shown += 1;
      if (toks.length) x.el.open = ok && shown <= 3;
    });
    document.querySelectorAll('#groups > section').forEach(s => { s.hidden = !s.querySelector('.qa:not([hidden])'); });
    $('#groups').hidden = !shown;
    $('#none').hidden = shown > 0;
  }
  let fixedAsked = false;
  function loadFixed() {
    if (fixedAsked) return;
    fixedAsked = true;
    const host = $('#fixed-list');
    fetch('/api/reports/fixed').then(r => (r.ok ? r.json() : Promise.reject(r))).then(list => {
      host.replaceChildren(...(list.length ? list.map(f => h('div', { class: 'fixed-row' }, h('p', { text: f.change }),
        h('p', { class: 'meta', text: [f.date, f.chip, f.reports > 1 ? `${f.reports} reports` : null].filter(Boolean).join(' · ') })))
        : [h('p', { class: 'soft', text: 'Nothing fixed yet. When a report leads to a fix, it’s listed here.' })]));
    }, () => { fixedAsked = false; host.replaceChildren(UI.cardError(null, loadFixed)); });
  }
  function openHash() {
    const id = ALIAS[location.hash.slice(1)] || location.hash.slice(1);
    const x = id && items.find(i => i.id === id);
    if (!x) return;
    x.el.open = true;
    setTimeout(() => x.el.scrollIntoView({ block: 'start' }), 60);
  }
  fetch('/help/answers.json').then(r => r.json()).then(d => {
    items = d.answers || [];
    render(items);
    UI.shell({ page: 'help', ownPrimary: true, sections: groups.concat([{ id: 'keys-card', label: 'Shortcuts' }]) });
    openHash();
    const q0 = new URLSearchParams(location.search).get('q');
    if (q0) { $('#q').value = q0; filter(q0); }
  }, () => { $('#groups').replaceChildren(UI.cardError(null, () => location.reload(), 'Couldn’t load the answers.')); });
  $('#q').addEventListener('input', e => filter(e.target.value));
  addEventListener('hashchange', openHash);
})();
</script>
</body>
</html>
