<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Walk your misses · SAT Freshman</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/runner.css">
<style>
  /* The walk (review.md V2): UI.review mode 'walk' opens over this page; the page holds
     where you are when it is closed (paused, done, empty or an error). */
  .rw { max-width: 760px; }
  .rw-top { display: flex; align-items: center; gap: 8px 16px; flex-wrap: wrap; }
  .rw-top .h1 { flex: 1 1 auto; min-width: 0; }
  .rw-back { gap: 4px; color: var(--soft); }
  .rw-sub { margin: 4px 0 16px; font: 400 12.5px/1.5 var(--font); color: var(--soft); font-variant-numeric: tabular-nums; }
  .rw-sub:empty { display: none; }
  .rw-sub:empty + #walk { margin-top: 20px; }
  .rw-card { display: grid; gap: 12px; }
  .rw-card .t { margin: 0; font: 600 16px/1.3 var(--font); }
  .rw-card .s { margin: 0; color: var(--soft); }
  .rw-acts { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .rw-dots { display: flex; flex-wrap: wrap; gap: 6px; }
  .rw-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
  .rw-dots i[data-done] { background: var(--amber); }   /* walked */
  .rw-dots i[data-on] { outline: 2px solid var(--amber); outline-offset: 1px; }
  .rw-done { display: grid; gap: 6px; }
  .rw-card .hero-num { margin: 0; font-variant-numeric: tabular-nums; }
  @media (max-width: 759px) {
    .rw-acts > .pill, .rw-acts > .btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<header id="bar"></header>
<main class="page rw" id="main" tabindex="-1">
  <header class="rw-top">
    <a class="quiet rw-back" href="/review/?tab=redo">Review</a>
    <h1 class="h1">Walk your misses</h1>
  </header>
  <p class="rw-sub" id="sub"></p>
  <section id="walk" aria-live="polite" aria-busy="true"></section>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/question.js"></script>
<script src="/assets/runner.js"></script>
<script>UI.shell({ page: 'review', ownPrimary: true });</script>
<script src="/review/item.js"></script>
<script src="/review/walk/walk.js"></script>
</body>
</html>
