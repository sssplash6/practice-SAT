<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Walk your misses · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/runner.css">
<style>
  /* The walk (review.md V2): UI.review mode 'walk' opens over this page; the page holds
     where you are when it is closed (paused, done, empty or an error). */
  .rw { max-width: 760px; }
  .rw-back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; color: var(--ink-soft); text-decoration: none; font-weight: 600; }
  .rw-back:hover { color: var(--ink); }
  .rw h1 { font: 800 36px/1.1 var(--sans, 'Archivo'), sans-serif; margin: 4px 0 6px; }
  .rw-sub { margin: 0 0 24px; color: var(--ink-soft); }
  .rw-card { background: var(--tile); border-radius: 12px; padding: 20px; display: grid; gap: 12px; }
  .rw-card .t { font-weight: 700; font-size: 18px; margin: 0; }
  .rw-card .s { margin: 0; color: var(--ink-soft); }
  .rw-acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .rw-dots { display: flex; flex-wrap: wrap; gap: 6px; }
  .rw-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line, #ddd); }
  .rw-dots i[data-on] { outline: 2px solid var(--ink); outline-offset: 1px; }
  @media (max-width: 759px) {
    .rw h1 { font-size: 28px; }
    .rw-acts > .pill, .rw-acts > .btn { flex: 1 1 100%; justify-content: center; }
  }
</style>
</head>
<body>
<header id="bar"></header>
<main class="page rw" id="main" tabindex="-1">
  <a class="rw-back" href="/review/?tab=redo">‹ Review</a>
  <h1>Walk your misses</h1>
  <p class="rw-sub" id="sub">Try it again, name the mistake, see the trap, then prove it on new numbers.</p>
  <section id="walk" aria-live="polite" aria-busy="true"></section>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/question.js"></script>
<script src="/assets/runner.js"></script>
<script>UI.shell('review');</script>
<script src="/review/item.js"></script>
<script src="/review/walk/walk.js"></script>
</body>
</html>
