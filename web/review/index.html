<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Review · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/runner.css">
<style>
  /* The Review hub (spec 3.9, review.md V1-V19). Shared pieces (tiles, seg, cells, pips,
     sheets, the pane player) are ui.css and runner.css; these rules lay the page out.
     The six tiles are the tabs: each number is said once (decision 7). */
  .rh { padding-bottom: 140px; }
  .rh * { min-width: 0; }
  .rh-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
  .rh-head .h1 { font-size: 36px; }
  .rh-helper { margin-top: 8px; max-width: 46ch; font: 500 14px/1.45 var(--font); color: var(--soft); }
  .rh-start { display: grid; justify-items: end; gap: 8px; }
  .rh-start .seg { font-size: 13px; }
  .rh-split { display: inline-flex; align-items: stretch; }
  .rh-split > .pill:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .rh-split > .pill + .pill { min-width: 44px; padding: 0 12px; border-top-left-radius: 0; border-bottom-left-radius: 0;
    box-shadow: inset 1px 0 0 rgba(0, 0, 0, .18); }
  .rh-startmeta { font: 500 12.5px var(--mono); color: var(--soft); text-align: right; }
  .rh-notes { display: grid; gap: 10px; margin-top: 20px; }
  .rh-notes:empty { display: none; }
  .rh-walk { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 16px 20px; }
  .rh-walk p { font: 600 15px/1.4 var(--font); }
  .rh-walk .meta { display: block; margin-top: 2px; font-weight: 500; }
  .rh-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font: 500 14px/1.4 var(--font); }
  .rh-line .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: none; }

  /* the six tiles, one tablist */
  .rh-tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-top: 24px; }
  .rh-tab { appearance: none; border: 0; font: inherit; cursor: pointer; text-align: left; display: flex; flex-direction: column;
    min-height: 104px; padding: 14px 14px 13px; border-radius: var(--radius); background: var(--tile); color: var(--ink);
    transition: background-color .16s var(--ease), box-shadow .16s var(--ease); }
  .rh-tab .stat-k { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rh-tab .stat-v { margin-top: 6px; }
  .rh-tab .stat-sub { margin-top: 4px; }
  .rh-tab[aria-selected="true"] { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink), inset 0 -3px 0 var(--amber); }
  .rh-tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .rh-tab:not([aria-selected="true"]):hover { background: var(--tile-2); } }
  .rh-tab .stat-spark { height: 18px; margin-top: auto; padding-top: 6px; color: var(--soft); }
  .rh-tab .rh-tl { display: none; }

  .rh-headbox { display: grid; gap: 14px; margin-top: 18px; }
  .rh-headbox:empty { display: none; }
  .rh-tabsub { display: none; }
  .rh-card { padding: 18px 20px; }
  .rh-card .card-head { margin-bottom: 12px; }
  .rh-card .rh-k { flex: 1 1 auto; font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
  .rh-row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  /* Saved · Your rules (V19): the rules replace the question list, its filters, pane and bar */
  .rh.rh-rules #optsbox, .rh.rh-rules #filters, .rh.rh-rules #body, .rh.rh-rules #actbar { display: none; }
  .rh-rules-l { display: grid; gap: 0; }
  .rh-rule { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  .rh-rule:first-child { border-top: 0; padding-top: 0; }
  .rh-rule-h, .rh-rule-t { margin: 0; }
  .rh-rule-t { font-size: 15px; }
  .rh-rule-ed textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--bg); color: var(--ink); resize: vertical; }
  .rh-rule-ask .quiet { min-height: 32px; }
  .rh-kinds { display: flex; flex-wrap: wrap; gap: 6px; }
  .rh-kind { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px;
    background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); font: 600 12.5px var(--font); color: var(--ink); white-space: nowrap; }
  .rh-kind b { font: 500 12px var(--mono); }
  .rh-kind.ink { background: var(--ink); color: var(--on-ink); box-shadow: none; }
  .rh-kind.amber { background: var(--wash); box-shadow: inset 0 0 0 1px var(--amber); }
  .rh-today { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 300px); align-items: center; gap: 16px 24px; }
  .rh-today .ring { --rs: 64px; font-size: 15px; }
  .rh-today .rh-big { font: 700 17px/1.3 var(--font); }
  .rh-wait { margin-top: 6px; font: 500 12.5px var(--mono); color: var(--soft); }
  .rh-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .rh-chips .btn { max-width: 100%; }
  .rh-chips .btn span.l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36ch; }
  .rh-chips .pts { margin-left: 6px; }
  .rh-grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .rh-matrix { display: grid; grid-template-columns: auto repeat(2, minmax(0, 1fr)); gap: 6px; align-items: stretch; }
  .rh-matrix .h { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--soft); align-self: end; }
  .rh-matrix .rl { font: 600 13.5px var(--font); align-self: center; padding-right: 8px; }
  .rh-matrix .rl small { display: block; font: 500 11.5px var(--mono); color: var(--soft); }
  .rh-matrix button { min-height: 44px; border: 0; border-radius: 10px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line);
    font: 500 13px var(--mono); color: var(--ink); cursor: pointer; }
  .rh-matrix button[data-hot] { box-shadow: inset 0 0 0 1.5px var(--ink); font-weight: 600; }
  .rh-list-p { display: grid; gap: 6px; font: 400 14px/1.45 var(--font); }
  .rh-foot { font: 500 12.5px var(--mono); color: var(--soft); }

  .rh-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 18px; }
  .rh-filters .filters { flex: 1 1 auto; margin: 0; }
  .rh-filters:empty { display: none; }

  .rh-body { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 24px; align-items: start; margin-top: 14px; }
  .rh-body.no-pane { grid-template-columns: minmax(0, 1fr); }
  .rh-body.no-pane .rh-pane { display: none; }
  .rh-pane { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; border-radius: var(--radius-card);
    box-shadow: inset 0 0 0 1px var(--line); background: var(--paper); }
  .rh-pane:empty { display: none; }
  .rh-pane .rv-pane { min-height: 300px; }
  .rh-panenote { padding: 22px; font: 400 14.5px/1.5 var(--font); color: var(--soft); }

  .rh-listhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-height: 44px; }
  .rh-listhead .meta { margin-left: auto; }
  .rh-list { display: grid; gap: 6px; }
  .rh-group { display: grid; gap: 6px; margin-top: 14px; }
  .rh-group:first-child { margin-top: 4px; }
  .rh-gh { display: grid; grid-template-columns: 44px auto minmax(0, 1fr) auto; align-items: center; column-gap: 8px; min-height: 48px; }
  .rh-gh.plain { grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; }
  .rh-gh .glyph { width: 18px; height: 18px; flex: none; }
  .rh-gh .gt { display: flex; flex-direction: column; min-width: 0; }
  .rh-gh .t { font: 700 15px/1.3 var(--font); }
  .rh-gh .meta { font-size: 12px; }
  .rh-gh .tell { grid-column: 3 / -1; font: italic 400 13px/1.4 var(--font); color: var(--soft); }
  .rh-gh .act { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 6px; }
  .rh-gh .fold { width: 36px; height: 36px; }
  .rh-gh .fold svg { transition: transform .2s var(--ease); }
  .rh-group[data-folded] .fold svg { transform: rotate(-90deg); }
  .rh-group[data-folded] > .rh-row { display: none; }

  .rh-row { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: stretch; border-radius: 10px;
    background: var(--tile); transition: background-color .16s var(--ease), box-shadow .16s var(--ease); }
  .rh-row[aria-current="true"] { box-shadow: inset 0 0 0 1.5px var(--amber); background: var(--paper); }
  .rh-row.nosel { grid-template-columns: 14px minmax(0, 1fr); }
  .rh-row > label.sel { display: grid; place-items: center; cursor: pointer; }
  .rh-row > label.sel input { width: 18px; height: 18px; margin: 0; cursor: pointer; }
  .rh-row > .rh-rb { appearance: none; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; min-height: 64px; padding: 10px 14px 10px 0; }
  .rh-row.compact > .rh-rb { min-height: 48px; padding: 6px 12px 6px 0; }
  .rh-row.tall > .rh-rb { min-height: 88px; align-items: start; padding-top: 14px; }
  .rh-row > .rh-rb:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 10px; }
  @media (hover: hover) and (pointer: fine) { .rh-row:not([aria-current="true"]):hover { background: var(--tile-2); } }
  .rh-row .lead { display: grid; place-items: center; min-width: 28px; grid-row: 1 / span 2; align-self: center; }
  .rh-row .rh-rb > .sub { grid-column: 2 / -1; min-width: 0; }
  .rh-row .lead .cell { width: 28px; height: 28px; min-width: 28px; min-height: 28px; }
  .rh-row .l1 .glyph { display: inline-block; width: 16px; height: 16px; margin-right: 6px; vertical-align: -2px; }
  .rh-row .rh-rb > .l1 { align-self: end; }
  .rh-row .rh-rb > .tags { align-self: start; }
  .rh-pane .rv-tools { flex-wrap: nowrap; justify-content: space-between; width: 100%; }
  .rh-pane .rv-tool { flex: 1 1 auto; min-width: 0; padding: 4px 2px; font-size: 11px; }
  .rh-pane .cell[data-status="open"], .rh-pane .cell[data-status="half"] { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); }
  .rh-pane .cell[data-status="relapsed"], .rh-pane .cell[data-status="stuck"], .rh-pane .cell[data-status="sure"] { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .rh-pane .cell[data-status="unchecked"], .rh-pane .cell[data-status="due"] { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--amber); }
  .rh-pane .cell[data-status="held"] { background: var(--amber); color: var(--ink-deep); }
  .rh-pane .cell[data-status="dismissed"] { background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); color: var(--faint); }
  .rh-row .l1 { font: 600 15px/1.35 var(--font); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rh-row .l1.stem { font: 400 15.5px/1.4 var(--serif, 'Source Serif 4', serif); }
  .rh-row.compact .l1 { -webkit-line-clamp: 1; font-size: 14.5px; }
  .rh-row .l2 { display: block; margin-top: 3px; font: 500 12px/1.55 var(--mono); color: var(--soft); }
  .rh-row .l2 > span + span::before { content: "·"; margin: 0 6px; color: var(--faint); }
  .rh-row .l2 .dbars { vertical-align: -1px; }
  .rh-row .l2 .pts { font-weight: 600; color: var(--ink); }
  .rh-row .l2 .over { color: var(--ink); }
  .rh-row .l3 { margin-top: 4px; font: 400 13px/1.4 var(--font); color: var(--soft); }
  .rh-row .l3.note { font-style: italic; }
  .rh-row .tags { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 220px; }
  .rh-row .tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; white-space: nowrap;
    background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); font: 600 11.5px var(--font); color: var(--ink); }
  .rh-row .tag.ink { background: var(--ink); color: var(--on-ink); box-shadow: none; }
  .rh-row .tag.new::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); }
  .rh-row .tag.amber { background: var(--wash); box-shadow: inset 0 0 0 1px var(--amber); }
  .rh-row .tag.soft { color: var(--soft); }
  .rh-row .x { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); width: 40px; height: 40px; display: grid; place-items: center;
    border: 0; border-radius: 10px; background: none; color: var(--soft); cursor: pointer; }
  .rh-row .x:hover { background: var(--tile-2); color: var(--ink); }
  .rh-row.has-x > .rh-rb { padding-right: 52px; }
  .rh-row[data-done] .why { text-decoration: line-through; }
  .rh-row[data-snoozed] { opacity: .55; }
  .rh-row .ract { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px 0; grid-column: 2; }
  .rh-row .rnote { grid-column: 2; padding: 0 14px 12px 0; display: grid; gap: 6px; }
  .rh-row .rnote textarea { width: 100%; min-height: 72px; resize: vertical; }
  .rh-tries { grid-column: 2; padding: 0 14px 10px 0; display: grid; gap: 2px; font: 500 12.5px var(--mono); color: var(--soft); }
  .rh-sit { display: grid; gap: 10px; margin-top: 18px; padding: 14px 16px; border-radius: var(--radius); background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
  .rh-sit:first-child { margin-top: 4px; }
  .rh-sit .t { font: 700 15px/1.35 var(--font); }
  .rh-sit .t .meta { margin-left: 6px; font-weight: 500; }
  .rh-sit .cells { display: flex; flex-wrap: wrap; gap: 4px; }
  .rh-sit .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .rh-sit .kids { font: 500 12.5px var(--mono); color: var(--soft); }
  .rh-sit[data-void] .t { color: var(--soft); }
  .rh-dayh { display: flex; align-items: baseline; gap: 10px; margin-top: 16px; font: 700 14px var(--font); }
  .rh-dayh:first-child { margin-top: 4px; }
  .rh-dayh .meta { font-weight: 500; }
  .rh-more { justify-self: center; margin-top: 10px; }
  .rh-empty { padding: 8px 0; }
  .rh-empty .empty-sample .rh-rb { padding-right: 84px; cursor: default; }
  .rh-skel { display: grid; gap: 6px; }

  /* the action bar: summary, options, primary (sticky at the bottom) */
  .rh-bar { position: sticky; bottom: 16px; z-index: 25; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 18px;
    padding: 10px 12px 10px 16px; border-radius: var(--radius-card); background: var(--paper); box-shadow: 0 0 0 1px var(--line), var(--shadow-pop); }
  .rh-bar:empty { display: none; }
  .rh-sum { flex: 1 1 220px; font: 600 14px/1.35 var(--font); font-variant-numeric: tabular-nums; }
  .rh-sum small { display: block; font: 500 12px var(--mono); color: var(--soft); }
  .rh-sum .err { display: block; margin-top: 2px; font: 500 12.5px var(--font); color: var(--ink); }
  .rh-optrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .rh-opt { display: inline-flex; align-items: center; gap: 6px; }
  .rh-opt > .k { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .rh-opt .seg { font-size: 12.5px; }
  .rh-opt input.field { width: 64px; }
  .rh-opt .help { display: none; }
  .rh-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .rh-optsbox { display: grid; gap: 10px; margin-top: 14px; }
  .rh-optsbox:empty { display: none; }

  @media (max-width: 1099px) {
    .rh-body { grid-template-columns: minmax(0, 1fr) 380px; }
  }
  @media (max-width: 959px) {
    .rh-body { grid-template-columns: minmax(0, 1fr); }
    .rh-pane { display: none; }
    .rh-today { grid-template-columns: auto minmax(0, 1fr); }
    .rh-today .rh-fc { grid-column: 1 / -1; }
    .rh-grid3 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 759px) {
    .rh { padding-bottom: calc(200px + env(safe-area-inset-bottom, 0px)); }
    .rh-head { display: grid; gap: 14px; }
    .rh-head .h1 { font-size: 28px; }
    .rh-start { justify-items: stretch; }
    .rh-opt { flex-wrap: wrap; width: 100%; }
    .rh-opt > .k { flex: 1 0 100%; }
    .rh-opt .seg { display: flex; flex: 1 1 auto; }
    .rh-opt .seg > * { flex: 1 1 0; min-width: 0; padding-left: 2px; padding-right: 2px; }
    .rh-opt input.field { width: 56px; flex: none; }
    .rh-split { display: flex; }
    .rh-split > .pill:first-child { flex: 1 1 auto; justify-content: center; }
    .rh-startmeta { text-align: left; }
    .rh-tabs { position: sticky; top: var(--bar-h, 56px); z-index: 20; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; margin: 20px calc(-1 * var(--gutter)) 0;
      padding: 0 var(--gutter); background: var(--paper); box-shadow: inset 0 -1px 0 var(--line); }
    .rh-tab { min-height: 52px; padding: 6px 0; border-radius: 0; background: none; align-items: center; justify-content: center; text-align: center; gap: 2px; }
    .rh-tab .stat-k, .rh-tab .stat-sub, .rh-tab .stat-spark { display: none; }
    .rh-tab .rh-tl { display: block; font: 600 13px/1.2 var(--font); }
    .rh-tab .stat-v { margin: 0; font-size: 12px; line-height: 1.2; color: var(--soft); }
    .rh-tab .stat-v:empty::before { content: "\00a0"; }
    .rh-tab[aria-selected="true"] { box-shadow: inset 0 -2px 0 var(--amber); background: none; }
    .rh-tabsub { display: block; font: 500 12.5px/1.5 var(--mono); color: var(--soft); }
    .rh-tabsub:empty { display: none; }
    .rh-card { padding: 16px; }
    .rh-today { grid-template-columns: auto minmax(0, 1fr); gap: 12px 16px; }
    .rh-row .rh-rb > .tags { grid-column: 2 / -1; grid-row: 3; justify-content: flex-start; max-width: none; margin-top: 4px; }
    .rh-row > .rh-rb { grid-template-columns: auto minmax(0, 1fr); padding-right: 12px; }
    .rh-row .lead { grid-row: 1 / span 3; }
    .rh-row .l1 { -webkit-line-clamp: 3; }
    .rh-bar { position: fixed; left: 8px; right: 8px; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); margin: 0; }
    .rh-bar .rh-sum { flex: 1 0 100%; }
    .rh-bar .rh-acts { flex: 1 0 100%; }
    .rh-bar .rh-acts > .pill { flex: 1 1 auto; justify-content: center; }
    .rh-matrix button { min-height: 44px; }
  }
  @media print {
    .rh-bar, .rh-pane, .rh-filters, .rh-start, .rh-optsbox { display: none !important; }
  }
</style>
</head>
<body>
<header id="bar"></header>
<main class="page rh" id="main" tabindex="-1">
  <header class="rh-head">
    <div>
      <h1 class="h1">Review</h1>
      <p class="rh-helper">Every miss, named by the mistake behind it. Two clean answers on new numbers close one.</p>
    </div>
    <div class="rh-start" id="start" aria-label="Today's review"></div>
  </header>
  <div class="rh-notes" id="notes"></div>
  <div class="rh-tabs" id="rhtabs" role="tablist" aria-label="Review lists"></div>
  <p class="rh-tabsub" id="tabsub"></p>
  <div class="rh-headbox" id="tabhead"></div>
  <div class="rh-optsbox" id="optsbox" aria-label="Set options"></div>
  <div class="rh-filters" id="filters"></div>
  <div class="rh-body" id="body">
    <section id="panel" role="tabpanel" tabindex="-1">
      <div class="rh-listhead" id="listhead"></div>
      <div class="rh-list" id="list" role="list" aria-busy="true"></div>
    </section>
    <aside class="rh-pane" id="pane" aria-label="Question"></aside>
  </div>
  <div class="rh-bar" id="actbar" role="region" aria-label="Practise these"></div>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/assets/question.js"></script>
<script src="/assets/runner.js"></script>
<script>UI.shell('review');</script>
<script src="/review/item.js"></script>
<script src="/review/review.js"></script>
</body>
</html>
