<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Domain Turntable — Domain Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    --paper: #FFFFFF; --ink: #3F3F3F; --amber: #F18508;
    --vinyl: #3F3F3F; --groove: #5C5C5C; --mat: #EDEAE5; --sleeve: #F6F4F0; --line: #E4E1DC; --soft: #8A847C;
    --font: "Archivo", "Helvetica Neue", system-ui, sans-serif;   /* placeholder type */
    --mono: "DM Mono", ui-monospace, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; }
  .screen { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: clamp(18px, 3vh, 30px); padding: 32px 24px 48px; text-align: center; }
  svg.scene { width: min(780px, 94vw); aspect-ratio: 800 / 600; display: block; overflow: visible; }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 900; letter-spacing: -.04em; line-height: .98; min-height: 1em; }
  .btn { font: 800 15px var(--font); min-height: 52px; padding: 0 32px; border: 0; border-radius: 999px; background: var(--amber); color: #fff; cursor: pointer;
         box-shadow: 0 10px 30px -14px rgba(241,133,8,.9); transition: transform .18s var(--ease), box-shadow .25s var(--ease), opacity .3s var(--ease); }
  .btn:hover { transform: translateY(-1px); } .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .35; cursor: default; box-shadow: none; transform: none; }

  .plinth { fill: #FBFAF8; stroke: var(--line); stroke-width: 1.5; }
  .platter { fill: var(--mat); stroke: var(--ink); stroke-width: 2; }
  .tick { stroke: #D3CEC6; stroke-width: 2; stroke-linecap: round; }
  .spindle { fill: var(--ink); }
  .arm { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; fill: none; }
  .arm-base { fill: #fff; stroke: var(--ink); stroke-width: 2; }
  .head { fill: var(--ink); }
  .weight { fill: var(--ink); }
  .rest { stroke: var(--line); stroke-width: 6; stroke-linecap: round; }

  .slot { cursor: pointer; }
  .sleeve { fill: var(--sleeve); stroke: var(--ink); stroke-width: 1.5; }
  .sleeve-name { font: 500 10.5px var(--mono); fill: var(--ink); letter-spacing: .1em; text-transform: uppercase; }
  .lift { transition: transform .35s var(--ease); }
  .slot:hover .lift { transform: translateY(-16px); }
  body.busy .slot { cursor: default; } body.busy .slot:hover .lift { transform: none; }

  .vinyl { fill: var(--vinyl); }
  .groove { fill: none; stroke: var(--groove); stroke-width: .7; }
  .sheen { fill: none; stroke: #7A7A7A; stroke-width: 1.2; stroke-linecap: round; opacity: .55; }
  .label { fill: #fff; stroke: var(--ink); stroke-width: .8; transition: fill .4s var(--ease); }
  .label-text { font: 900 10px var(--font); fill: var(--ink); letter-spacing: -.02em; transition: fill .4s var(--ease); }
  .disc.on .label { fill: var(--amber); stroke: var(--amber); }
  .disc.on .label-text { fill: #fff; }
  .hole { fill: var(--paper); }
  .hint { font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--soft); }
  @media (prefers-reduced-motion: reduce) { .lift, .btn, .label, .label-text { transition: none; } }
</style>
</head>
<body>

<main class="screen">
  <svg class="scene" id="scene" viewBox="0 0 800 600" aria-hidden="true">
    <rect class="plinth" id="plinth" x="120" y="60" width="600" height="360" rx="28"/>
    <g id="platter"><circle class="platter" cx="330" cy="240" r="160"/><g id="ticks"></g></g>
    <g id="onPlatter"></g>
    <circle class="spindle" cx="330" cy="240" r="5"/>
    <line class="rest" x1="612" y1="352" x2="642" y2="352"/>
    <g id="arm">
      <line class="arm" id="armLine"/>
      <rect class="head" id="armHead" width="22" height="14" rx="3"/>
      <rect class="weight" x="-38" y="-8" width="30" height="16" rx="6"/>
    </g>
    <circle class="arm-base" cx="640" cy="120" r="16"/>
    <g id="sleeves"></g>
    <g id="fly"></g>
  </svg>
  <p class="hint" id="hint">Tap a record</p>
  <h1 id="hl">One domain. Deep.</h1>
  <button class="btn" type="button" id="go" disabled>Start practice</button>
</main>

<script>
const NS = 'http://www.w3.org/2000/svg';
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const easeBack = k => { const c = 1.4; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const tween = (ms, fn, ease = easeOut) => new Promise(res => { if (reduce) { fn(1); return res(); } const t0 = performance.now();
  (function step(now) { const k = Math.min(1, (now - t0) / ms); fn(ease(k)); k < 1 ? requestAnimationFrame(step) : res(); })(t0); });

/* ---------------------------------------------------------------- the deck */
const PLATTER = { x: 330, y: 240, r: 160 }, PIVOT = { x: 640, y: 120 };
const ticks = document.getElementById('ticks');
for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; el('line', { class: 'tick', x1: PLATTER.x + 138 * Math.cos(a), y1: PLATTER.y + 138 * Math.sin(a), x2: PLATTER.x + 150 * Math.cos(a), y2: PLATTER.y + 150 * Math.sin(a) }, ticks); }

// the arm lands on the outer groove; its rest position is swung 30° clear of the platter
const LAND = { x: PLATTER.x + 148 * Math.cos(-0.55), y: PLATTER.y + 148 * Math.sin(-0.55) };
const ARM_LEN = Math.hypot(LAND.x - PIVOT.x, LAND.y - PIVOT.y);
const PLAY_A = Math.atan2(LAND.y - PIVOT.y, LAND.x - PIVOT.x) * 180 / Math.PI, REST_A = PLAY_A - 32;
const arm = document.getElementById('arm'), armLine = document.getElementById('armLine'), armHead = document.getElementById('armHead');
armLine.setAttribute('x1', 0); armLine.setAttribute('y1', 0); armLine.setAttribute('x2', ARM_LEN - 10); armLine.setAttribute('y2', 0);
armHead.setAttribute('x', ARM_LEN - 22); armHead.setAttribute('y', -7);
let armA = REST_A; const setArm = a => { armA = a; arm.setAttribute('transform', `translate(${PIVOT.x} ${PIVOT.y}) rotate(${a})`); };
setArm(REST_A);
const armTo = (a, ms = 650, ease = easeBack) => { const from = armA; return tween(ms, k => setArm(lerp(from, a, k)), ease); };

/* ---------------------------------------------------------------- the records */
const DOMAINS = [['Algebra', 'ALG'], ['Advanced Math', 'ADV'], ['Problem-Solving & Data', 'DATA'], ['Geometry & Trig', 'GEO']];
const sleeves = document.getElementById('sleeves'), fly = document.getElementById('fly'), onPlatter = document.getElementById('onPlatter');
const SW = 128, GAP = 24, X0 = (800 - (4 * SW + 3 * GAP)) / 2, SY = 466;

const discs = DOMAINS.map(([name, abbr], i) => {
  const cx = X0 + i * (SW + GAP) + SW / 2, home = { x: cx, y: SY + 22 };
  const slot = el('g', { class: 'slot' }, sleeves);
  const g = el('g', { class: 'disc' }, slot);            // positioned by JS
  const lift = el('g', { class: 'lift' }, g);            // hover lift, CSS
  el('circle', { class: 'vinyl', r: 60 }, lift);
  for (let r = 26; r <= 56; r += 4) el('circle', { class: 'groove', r }, lift);
  el('path', { class: 'sheen', d: 'M-44 -30 A53 53 0 0 1 -10 -52' }, lift);
  el('circle', { class: 'label', r: 21 }, lift);
  const t = el('text', { class: 'label-text', 'text-anchor': 'middle', 'dominant-baseline': 'middle', y: 1 }, lift); t.textContent = abbr;
  el('circle', { class: 'hole', r: 2.4 }, lift);
  const sleeve = el('rect', { class: 'sleeve', x: cx - SW / 2, y: SY, width: SW, height: SW, rx: 8 }, slot);
  const lines = name.split(' & ');
  lines.forEach((ln, j) => { const tx = el('text', { class: 'sleeve-name', x: cx, y: SY + SW - 34 + j * 15 - (lines.length - 1) * 7, 'text-anchor': 'middle' }, slot); tx.textContent = (j ? '& ' : '') + ln; });
  const d = { i, name, g, slot, sleeve, home, x: home.x, y: home.y, s: 1, r: 0 };
  slot.addEventListener('pointerdown', () => play(i));
  place(d); return d;
});
function place(d) { d.g.setAttribute('transform', `translate(${d.x} ${d.y}) scale(${d.s}) rotate(${d.r})`); }

/* ---------------------------------------------------------------- playing */
const hl = document.getElementById('hl'), hint = document.getElementById('hint'), go = document.getElementById('go');
let current = null, busy = false, spinning = false, platterA = 0, last = performance.now();
(function spin(now) { const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (spinning && !reduce) { platterA += 110 * dt; document.getElementById('platter').setAttribute('transform', `rotate(${platterA} ${PLATTER.x} ${PLATTER.y})`);
    const d = discs[current]; d.r += 110 * dt; place(d); }
  requestAnimationFrame(spin); })(last);

async function returnCurrent(midHint) {                 // lift the needle, send the playing disc back to its sleeve
  const p = discs[current]; spinning = false; p.g.classList.remove('on'); hl.textContent = 'One domain. Deep.'; hint.textContent = midHint;
  await armTo(REST_A, 550, easeOut); await goHome(p); current = null;
}

async function play(i) {
  if (busy || current === i) return; busy = true; document.body.classList.add('busy'); go.disabled = true;
  if (current !== null) await returnCurrent('Changing record');
  const d = discs[i]; current = i; hint.textContent = 'Cueing';
  // 1. slide out of the sleeve
  d.g.querySelector('.lift').style.transform = 'none';
  fly.appendChild(d.g);
  await tween(300, k => { d.y = d.home.y - 30 * k; place(d); });
  // 2. travel to the platter along a lifted arc, growing as it comes forward
  const from = { x: d.x, y: d.y };
  await tween(950, k => { d.x = lerp(from.x, PLATTER.x, k); d.y = lerp(from.y, PLATTER.y, k) - 110 * Math.sin(Math.PI * k); d.s = lerp(1, 2.5, k); d.r = lerp(0, 40, k); place(d); }, easeInOut);
  onPlatter.appendChild(d.g);
  // 3. the arm swings in, and only then does it play
  await armTo(PLAY_A);
  spinning = true; d.g.classList.add('on'); hl.textContent = d.name + '.'; hint.textContent = 'Now playing'; go.disabled = false;
  busy = false; document.body.classList.remove('busy');
}

async function goHome(d) {
  fly.appendChild(d.g);
  const from = { x: d.x, y: d.y, r: d.r % 360 };
  await tween(800, k => { d.x = lerp(from.x, d.home.x, k); d.y = lerp(from.y, d.home.y - 30, k) - 90 * Math.sin(Math.PI * k); d.s = lerp(2.5, 1, k); d.r = lerp(from.r, 0, k); place(d); }, easeInOut);
  d.slot.insertBefore(d.g, d.sleeve);   // back behind its sleeve
  await tween(280, k => { d.y = d.home.y - 30 + 30 * k; place(d); });
  d.g.querySelector('.lift').style.transform = '';
}

/* tapping the player itself (the plinth, the platter track, or the spinning disc) while something
   is on it stops the play and sends that disc back to its sleeve */
async function stopPlaying() {
  if (busy || current === null) return; busy = true; document.body.classList.add('busy'); go.disabled = true;
  await returnCurrent('Taking it off');
  hint.textContent = 'Tap a record'; go.disabled = true;
  busy = false; document.body.classList.remove('busy');
}
const onDeckTap = e => { e.stopPropagation(); stopPlaying(); };
[document.getElementById('plinth'), document.getElementById('platter'), onPlatter].forEach(t => t.addEventListener('pointerdown', onDeckTap));

/* -- ROUTER SEAM: the chosen domain is discs[current].name ---------------- */
go.addEventListener('click', () => console.log('[router] /practice/domain ->', discs[current].name));
</script>

</body></html>
