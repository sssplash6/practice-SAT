<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test · SAT Freshman</title>
<meta name="description" content="The test window: one module at a time, Bluebook's rules, nothing lost.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/runner.css">
<style>
  /* The test window (spec 3.4 section 4). The runner (runner.css) draws the module; these rules
     lay out the screens around it: the lobby, between modules, time's up, the hand-in moment and
     the problem states. No site chrome: nothing can cover Next (2.1 rule 6). Tokens only (R32). */
  body { background: var(--paper); }
  #run main { view-transition-name: none; }
  .tw-top { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px;
    height: 64px; padding: 0 16px; background: var(--paper); box-shadow: inset 0 -1px 0 var(--line); }
  .tw-top .rn-exit .ic { display: inline-flex; }
  .tw-title { font: 600 16px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the screens are a plain column: the h1, its facts as hairline rows, one row with the primary */
  .tw-body { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 20px; }
  .tw-body.wide { max-width: 760px; }
  .tw-body * { min-width: 0; }
  .tw-card { display: grid; gap: 16px; outline: none; }
  .tw-card .h1 { margin: 0; }
  .tw-lead { margin: 0; font: 500 16px/1.5 var(--font); color: var(--ink); }
  .tw-facts { margin: 0; padding: 0; list-style: none; display: grid; border-top: 1px solid var(--line); }
  .tw-facts li { display: flex; align-items: center; min-height: var(--row-h); padding: 8px 0; border-bottom: 1px solid var(--line); font: 400 14.5px/1.45 var(--font); color: var(--ink); }
  .tw-go { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; }
  .tw-set { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-width: 0; }
  .tw-set .v { margin: 0; font: 400 14.5px/1.4 var(--font); color: var(--soft); }
  .tw-go .tw-acts { margin-left: auto; }
  .tw-go .tw-acts:only-child { margin-left: 0; }   /* Resume / Continue alone stays on the left edge */
  .tw-sec { display: grid; gap: 8px; margin: 0 0 16px; }
  .tw-sec[hidden] { display: none; }
  .tw-sec > .k, .tw-sec > .help { margin: 0; }
  .tw-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .tw-links { display: flex; flex-wrap: wrap; gap: 2px 20px; margin: -8px 0 0; }
  .tw-links .quiet { font-weight: 500; justify-self: start; }   /* quiet links under the bold primary */
  /* in two even columns, so the fourth never wraps alone onto a line of its own */
  @media (min-width: 760px) { .tw-links { display: grid; grid-template-columns: repeat(2, max-content); column-gap: 32px; } }
  [data-quiet]:focus-visible { outline: none; }   /* test.js quietFocus: focused on load, ringed once a key moves focus */
  /* Timing: the shared .choice-row (label left, minutes right); .off is the Training-only timing under Test-day */
  .tw-radios { display: grid; gap: 4px; }
  .tw-radios .off { color: var(--faint); cursor: default; }
  .tw-kline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: -8px 0 0; }
  .tw-kline .badge { height: auto; min-height: 20px; white-space: normal; }
  .tw-scale { min-height: 72px; }
  .tw-band { font-size: 44px; line-height: 1; letter-spacing: -.03em; margin: 0; }
  .tw-route { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0; font: 400 14.5px/1.45 var(--font); }
  .tw-moments { margin: 0; padding: 0; list-style: none; display: grid; border-top: 1px solid var(--line); }
  .tw-moments li { min-height: var(--row-h); padding: 8px 0; border-bottom: 1px solid var(--line); font: 500 14.5px/1.4 var(--font); }
  .tw-later { display: grid; border-top: 1px solid var(--line); }
  .tw-later p { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; min-height: var(--row-h); padding: 4px 0; border-bottom: 1px solid var(--line); font: 400 14.5px var(--font); }
  .tw-pace { display: grid; gap: 6px; }
  .tw-trainer { display: grid; gap: 12px; padding: var(--card-pad); border-radius: var(--radius-card); background: var(--tile); }
  .tw-trainer .k { margin: 0; }
  .tw-strip { display: flex; gap: 3px; }
  .tw-strip i { flex: 1; max-width: 22px; height: 10px; border-radius: 2px; box-shadow: inset 0 0 0 1.5px var(--line); }
  .tw-strip i.on { background: var(--ink); box-shadow: none; }
  .tw-strip i.line { outline: 2px solid var(--amber); outline-offset: 2px; }
  .tw-cost { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .tw-cost li { display: inline-flex; align-items: center; gap: 8px; font: 500 14.5px var(--font); }
  @media (max-width: 759px) {
    .tw-top { height: 56px; padding: 0 8px; }
    .tw-acts .pill { flex: 1 1 100%; justify-content: center; }
    .tw-go .tw-acts { flex: 1 1 100%; margin-left: 0; }
  }
</style>
</head>
<body data-page="test">
<main id="main">
  <div id="run"></div>
  <div id="view" hidden></div>
</main>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/assets/question.js"></script>
<script src="/assets/runner.js"></script>
<script src="/test/test.js"></script>
</body>
</html>
