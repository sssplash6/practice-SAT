<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Not found · SAT Freshman</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* StaticFiles serves this for any path with no page, so every URL here is absolute */
  /* calm: one figure (the mark's corners drifted apart, UI.spotArt('lost')), the sentence, the code and path, two
     ways out, centred around a fifth of the way down */
  .lost { max-width: 34rem; margin: 0 auto; padding-top: clamp(32px, 16vh, 160px); display: grid; gap: 8px; justify-items: center; text-align: center; }
  .lost-art:not(:empty) { margin-bottom: 12px; }
  .lost-art .spot { width: 96px; height: 96px; }
  @media (max-width: 759px) { .lost-art .spot { width: 72px; height: 72px; } }
  .lost .path { margin: 0; overflow-wrap: anywhere; }
  .lost-go { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; margin-top: 24px; }
</style>
</head>
<body data-page="">
<a class="skip" href="#main">Skip to content</a>
<header id="bar"></header>
<main class="page" id="main" tabindex="-1">
  <section class="lost" aria-labelledby="lost-h" data-m="stagger">
    <div class="lost-art" id="lost-art"></div>
    <h1 class="h1" id="lost-h">That page does not exist.</h1>
    <p class="meta path" id="lost-path">404 · not found</p>
    <div class="lost-go" data-m-now>
      <a class="pill" href="/">Today</a>
      <a class="btn" href="/practice/">Practice</a>
    </div>
  </section>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script>
  (() => {
    const p = document.getElementById('lost-path');
    let path = location.pathname;
    try { path = decodeURI(path); } catch (_) {}         // a malformed %-escape shows as typed
    // the error code and the path typed, under the title (a direct visit to /404.html keeps "not found")
    if (location.pathname !== '/404.html') p.textContent = `404 · ${path}${location.search}`;
    if (window.UI && UI.spotArt) document.getElementById('lost-art').innerHTML = UI.spotArt('lost');
    // now: false: Today is this page's one way in, so the phone's Up next strip doesn't add a second orange
    if (window.UI && UI.shell) UI.shell({ now: false, ownPrimary: true });   // Today is the one orange; the sidebar's Start stays quiet
  })();
</script>
</body>
</html>
