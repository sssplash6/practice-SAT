<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today · SAT Freshman</title>
<meta name="description" content="Free SAT Math practice that never runs out and never repeats.">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/runner.css">
<style>
  /* Today (spec 3.2, today.md T1-T20, R27, R30). Every shared piece (cards, seg, chips,
     sheets, charts, the question) is ui.css / runner.css; these rules lay the page out. */
  .td { padding-bottom: 110px; position: relative; }
  .td :where(*:not(.q-table)) { min-width: 0; }
  /* over the page, not in its flow, so it never moves the grid when it goes */
  .td-upd { position: absolute; top: 4px; right: var(--gutter); z-index: 3; margin: 0; padding: 2px 8px; border-radius: 6px; background: var(--tile); font: 500 11px var(--font); color: var(--soft); }
  /* the first frame is the skeleton, never empty card shells */
  #today:not(.ready) { visibility: hidden; }
  @media (max-width: 759px) { #bar:empty { display: block; height: var(--bar); } }

  /* the grid: below 1080px the DOM order is the phone order and order + span place the two columns;
     from 1080px paintToday moves the cards into bands of a main and a side column (.td-col), so a
     short card never holds a row open beside a tall one (the user: large empty areas) */
  #today { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  .td-col { display: contents; }
  @media (min-width: 760px) {
    #today { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #today section { grid-column: span 1; }
    #hero, #next, #qotd, #gain, #study, #plan, #tests, #due { grid-column: span 2 !important; }
    /* short cards pair with short ones: Mistakes with Score, the SAT with Pace, the challenge with Words */
    #hero { order: 1; } #next { order: 2; } #due { order: 2; } #qotd { order: 3; } #gain { order: 4; } #mist { order: 5; } #score { order: 6; } #exam { order: 7; }
    #pace { order: 8; } #study { order: 9; } #chal { order: 10; } #words { order: 11; } #plan { order: 12; } #tests { order: 13; }
    #today.stretch #exam { order: 1; grid-column: span 2 !important; }
    #today.stretch #mist { order: 2; grid-column: span 2 !important; }
  }
  @media (min-width: 1080px) {
    #today { grid-template-columns: repeat(12, minmax(0, 1fr)); }
    #today section, #today .td-col { order: 0 !important; }
    #hero, #qotd, #tests { grid-column: 1 / -1 !important; }
    .td-col { display: flex; flex-direction: column; gap: 20px; }
    .td-main { grid-column: 1 / span 8; }
    .td-side { grid-column: 9 / -1; }
    .td-col:empty { display: none; }
  }

  .td .card-head { justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .td .card-head > h2 { flex: 1 1 auto; margin: 0; outline-offset: 4px; }
  .td .card-head .card-act { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
  .td .sub, .td-takes .sub { margin: 18px 0 8px; font: 600 11px/1.3 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .td .sub:first-child, .td-takes .sub:first-child { margin-top: 0; }
  .td .line, .td-takes .line { margin: 6px 0 0; font: 400 14.5px/1.45 var(--font); color: var(--ink); text-wrap: pretty; }
  .td .line.soft, .td-takes .line.soft { color: var(--soft); font-size: 13.5px; }
  .td .row, .td-takes .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .td .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 14px; }
  .td .big { font: 600 44px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--ink); }
  .td .bar4 { display: block; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin-top: 6px; }
  .td .bar4 > i { display: block; height: 100%; background: var(--amber); border-radius: 2px; }
  .td hr.sep { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  .td .tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 6px; background: var(--tile-2); font: 600 12px/1.5 var(--font); color: var(--ink); }
  .td .tag.ink { background: var(--ink); color: var(--on-ink); }
  .td a.plain { color: inherit; text-decoration: none; }
  .td a.plain:hover { text-decoration: underline; }
  /* DM Mono only for the numbers that matter (decision 7): a meta line is words, so it is Archivo;
     the figures (.big, .score-band, .fig .v, .qm, .band, the countdown) keep the mono */
  .td .meta { font-family: var(--font); letter-spacing: 0; }
  .td .card .k:not(h2) { font: 600 11px/1.3 var(--font); letter-spacing: .06em; }
  .td .help { font-size: 13px; }
  /* a quiet link's box is its text here: the -9px -12px margins made its hover and focus cover neighbours (the user) */
  .td .quiet { margin: 0; padding: 4px 2px; font-size: 14px; text-align: left; }
  .td .quiet:focus-visible { outline-offset: 2px; }
  .td .pill:disabled { background: var(--tile-2); color: var(--faint); opacity: 1; }
  /* a small (i): its sentence opens on tap, and a 44px hit area around it */
  .why-i { position: relative; flex: none; appearance: none; border: 1.5px solid var(--faint); background: none; color: var(--soft); width: 18px; height: 18px; border-radius: 50%;
    display: inline-grid; place-items: center; font: 600 11px/1 var(--font); font-style: italic; margin-left: 6px; vertical-align: 1px; cursor: pointer; padding: 0; }
  .why-i::before { content: ""; position: absolute; inset: -13px; }
  .why-i[aria-expanded="true"] { border-color: var(--ink); color: var(--ink); }
  .info-pop { max-width: 320px; }
  .info-pop p { margin: 0; font: 400 14px/1.5 var(--font); color: var(--ink); }
  .info-pop p + p, .info-pop ul, .info-pop ol { margin-top: 8px; }
  .info-pop ul, .info-pop ol { padding-left: 18px; font: 400 14px/1.5 var(--font); }
  .fold { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 12px; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer;
    font: 600 14px var(--font); color: var(--ink); text-align: left; }
  .fold .chev { margin-left: auto; transition: transform .16s var(--ease); }
  .fold[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .fold .meta { font-weight: 500; }
  @media (hover: hover) and (pointer: fine) { .fold:hover > span:first-child { text-decoration: underline; text-underline-offset: 4px; } }
  :root[data-theme="dark"] .td .tag.ink { background: var(--mat); color: var(--ink); }

  /* hero */
  #hero { padding: 4px 0 0; }
  .hero-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  .hero-top .h1 { margin: 4px 0 0; outline: none; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hero-name { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-top: 8px; }
  .hero-name .field { max-width: 240px; }
  .hero-stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .hero-stats a { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 16px; background: var(--tile);
    font: 600 13px var(--font); color: var(--ink); text-decoration: none; font-variant-numeric: tabular-nums; }
  .hero-stats a.bold { background: var(--ink); color: var(--on-ink); }
  .hero-stats a > span[aria-hidden] { display: inline-flex; }
  .hero-stats svg { display: block; width: 16px; height: 16px; }
  .hero-stats .on svg .flame { fill: var(--amber); stroke: var(--amber-deep); }
  .brief { margin: 10px 0 0; font: 400 15px/1.5 var(--font); color: var(--soft); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .brief a { color: var(--ink); text-decoration: none; }
  .brief a:hover { text-decoration: underline; }
  .brief .sep { color: var(--faint); }
  .brief .risk { color: var(--ink); font-weight: 600; }
  /* each fact on its own line on a phone, so no separator is left hanging at a line's end */
  @media (max-width: 759px) { .brief { flex-direction: column; align-items: flex-start; gap: 2px; } .brief .sep { display: none; } }

  /* up next */
  #next { background: var(--wash); }
  #next .lead { display: grid; gap: 6px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid color-mix(in srgb, var(--amber) 25%, transparent); }
  #next .lead-t { font: 700 20px/1.25 var(--font); letter-spacing: -.01em; color: var(--ink); }
  .size { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  /* the streak: flame and number centred on one line, the number in the text font (the user: misaligned) */
  .streak { display: inline-flex; align-items: center; gap: 6px; font: 600 14px/1 var(--font); font-variant-numeric: tabular-nums; }
  .streak > span[aria-hidden] { display: inline-flex; }
  .streak svg { display: block; width: 16px; height: 16px; }
  button.streak { appearance: none; border: 0; background: none; padding: 4px 2px; cursor: pointer; color: var(--ink); }
  .exam-sum { margin: 10px 0 0; font-size: 16px; }
  .exam-det { margin-top: 12px; }
  .size > * { margin: 0; }
  .size-picks { display: flex; align-items: center; }
  .size-picks .chips { gap: 6px; align-items: center; margin: 0; }
  /* one height for the row: the toggle's track, its options and the number chips are all --ctl (the user: misaligned) */
  .td .size-picks .chips > button { min-height: var(--ctl); min-width: var(--ctl); justify-content: center; }
  .size-help { margin: 6px 0 0; }
  .sess-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 14px; }
  .reason { margin: 16px 0 0; font: 500 15px/1.45 var(--font); color: var(--ink); }
  .blocks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 2px; transition: opacity .15s; }
  .blocks.stale { opacity: .6; }
  .blocks li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 40px; padding: 4px 0; border-bottom: 1px solid color-mix(in srgb, var(--amber) 16%, transparent); }
  .blocks li .no { font: 500 13px var(--mono); color: var(--soft); }
  .blocks li .lb { font: 500 14.5px/1.35 var(--font); color: var(--ink); }
  .blocks li .lb .meta { display: block; margin-top: 2px; }
  .blocks li .qm { font: 500 13px var(--mono); color: var(--ink); white-space: nowrap; }
  .blocks li.tot .lb { font-weight: 700; }
  .blocks li.then { border-bottom: 0; }
  .blocks li.then .lb { color: var(--soft); font-size: 13.5px; }
  .tchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .tchip { display: inline-flex; flex-direction: column; gap: 4px; padding: 7px 11px 6px; border-radius: 10px; background: var(--paper); font: 600 13.5px var(--font); color: var(--ink); }
  .tchip .tc-t { display: inline-flex; align-items: center; gap: 6px; }
  .tchip .mbar { width: 100%; }
  .q1 { margin-top: 16px; padding: 16px 18px; border-radius: 12px; background: var(--paper); }
  .q1-after { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 12px; }
  .go { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 18px; }
  @media (max-width: 759px) { .td .go { flex-direction: column; align-items: flex-start; row-gap: 12px; } }
  .note-ok { margin: 10px 0 0; font: 400 13px/1.4 var(--font); color: var(--soft); }
  .receipt { margin: 0 0 18px; padding: 14px 16px; border-radius: 12px; background: var(--paper); }
  .receipt p { margin: 4px 0 0; font: 400 14.5px/1.45 var(--font); color: var(--ink); }
  .receipt p.rfig { font: 600 16px var(--mono); }
  .receipt .rdet { margin-top: 6px; }
  .receipt [data-fact] { cursor: pointer; }

  /* due today */
  .due-sum { color: var(--ink); cursor: default; }
  .drow { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid color-mix(in srgb, var(--amber) 14%, transparent); }
  .drow:last-child { border-bottom: 0; }
  .drow[data-status="skipped"] { opacity: .55; }
  /* the title and its (i) stay on one line; the title wraps inside its own box */
  .drow .dt { display: flex; align-items: center; gap: 6px; font: 600 15px/1.35 var(--font); color: var(--ink); }
  .drow .dt .why-i { margin-left: 0; }
  .drow .dm { margin-top: 2px; }
  .drow .dm > span, .td .nw > span { white-space: nowrap; }
  .drow .dwhy { grid-column: 2 / -1; margin: 0; font: 400 13.5px/1.45 var(--font); color: var(--ink); }
  .drow .dwhy ul { margin: 0; padding-left: 18px; }
  .drow .dres { margin: 4px 0 0; font: 500 13px var(--font); color: var(--ink); }
  .drow .dact { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .drow .dact .ibtn-sp { width: var(--ib, 36px); flex: none; }
  @media (max-width: 759px), (pointer: coarse) { .drow .dact .ibtn-sp { width: var(--touch); } }
  .drow .dextra { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .st { position: relative; display: inline-grid; place-items: center; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .st[data-s="done"], .st[data-s="marked"] { background: var(--amber); box-shadow: none; }
  .st[data-s="done"]::after, .st[data-s="marked"]::after { content: ""; width: 9px; height: 5px; border: solid var(--ink-deep); border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
  .st[data-s="progress"] { box-shadow: inset 0 0 0 1.5px var(--ink); background: conic-gradient(var(--ink) calc(var(--f, 0) * 1turn), transparent 0); -webkit-mask: radial-gradient(circle, transparent 5px, #000 5.5px); mask: radial-gradient(circle, transparent 5px, #000 5.5px); }
  .st[data-s="skipped"] { box-shadow: none; }
  .st[data-s="skipped"]::after { content: ""; width: 12px; height: 2px; background: var(--soft); }
  .st-box { display: inline-grid; place-items: center; width: 28px; height: 28px; }
  .st-box input { width: 20px; height: 20px; accent-color: var(--amber); margin: 0; }

  /* mistakes / review card */
  .mist-fig { display: flex; align-items: baseline; gap: 10px; }
  .mist-fig .k { text-transform: none; letter-spacing: 0; font-size: 14px; }
  #mist .mist-fig + .meta { margin-top: 4px; }
  #mist .mlist { margin-top: 16px; }
  /* a mistake row (.mrow: plan-ui.js carries its own .trow): the dot, the label that starts its fix, a chevron;
     under it one quiet line, then the row's actions at one size */
  .mrow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 10px; align-items: first baseline; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .mrow:last-child { border-bottom: 0; }
  .mrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); align-self: center; }
  .mrow button.tl { all: unset; cursor: pointer; font: 500 14px/1.35 var(--font); color: var(--ink); }
  .mrow button.tl:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
  @media (hover: hover) and (pointer: fine) { .mrow button.tl:hover { text-decoration: underline; text-underline-offset: 3px; } }
  .mrow .go-chev { display: inline-grid; place-items: center; width: 28px; height: 28px; border: 0; background: none; padding: 0; color: var(--soft); cursor: pointer; }
  .mrow .go-chev svg { width: 16px; height: 16px; }
  .mrow .tm { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font: 500 13px var(--font); color: var(--soft); }
  .mrow .tm .glyph { width: 16px; height: 16px; vertical-align: -3px; }
  .mrow .tm .tp { display: inline-flex; align-items: center; gap: 5px; }
  .mrow .tacts { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 4px; }
  .mrow .tacts .quiet { font-size: 13px; }
  .habit { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .habit .hn { font: 600 15px/1.35 var(--font); }
  .habit .hn.broken { text-decoration: line-through; }
  .habit .tell { font-style: italic; }

  /* questions of the day */
  .qd-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .qd-tabs { display: none; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .qd-tabs button { display: inline-flex; align-items: center; gap: 8px; min-height: var(--ctl); padding: 0 12px; border-radius: 10px; border: 0; background: var(--tile-2);
    font: 600 14px var(--font); color: var(--ink); cursor: pointer; }
  /* the chosen tab is the chosen .seg option: paper with an orange edge (an ink fill was the page's brightest block in dark) */
  .qd-tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--amber); }
  .qd-rowk { margin: 0 0 10px; }
  /* each tile its own height: the shorter one no longer ends in a blank block */
  .qd-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }
  .qd-slot.was .verdict { animation: none; }
  .qd-row + .qd-rowk { margin-top: 28px; }
  .qd-slot { display: grid; align-content: start; gap: 10px; padding: 18px; border-radius: 12px; background: var(--paper); }
  .qd-lab { display: flex; align-items: center; gap: 8px; }
  .mk { position: relative; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); flex: none; font: 700 10px/1 var(--font); }
  .mk[data-m="right"] { background: var(--amber); box-shadow: none; color: var(--ink-deep); }
  .mk[data-m="wrong"] { background: var(--ink); box-shadow: none; color: var(--on-ink); }
  .mk[data-rep]::after { content: "↻"; position: absolute; right: -6px; top: -7px; font: 700 10px var(--font); color: var(--ink); }
  .qd-text { margin: 0; font: 400 var(--q-opt)/1.55 var(--serif); color: var(--ink); }
  .qd-after { display: grid; gap: 8px; }
  .qd-after .line { margin: 0; }
  .qd-past { display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
  .qd-days { flex: 0 1 auto; min-width: 0; display: flex; justify-content: flex-end; gap: 6px; overflow: hidden; }
  .qd-days .qd-day { flex: none; width: 44px; }
  .qd-days .qd-day.mon { box-shadow: inset 2px 0 0 var(--line); }
  .qd-day { display: inline-grid; justify-items: center; align-content: center; gap: 4px; min-width: 44px; min-height: 44px; padding: 5px 6px; border: 0; border-radius: 10px; background: var(--tile-2); cursor: pointer; font: 600 12px var(--font); color: var(--ink); }
  .qd-day.none { opacity: .5; }
  .qd-day.older svg { width: 18px; height: 18px; }
  .qd-day[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); opacity: 1; }
  .qd-day .mm { display: flex; gap: 3px; }
  .qd-day .mm i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.2px var(--faint); }
  .qd-day .mm i[data-m="right"] { background: var(--amber); box-shadow: none; }
  .qd-day .mm i[data-m="wrong"] { background: var(--ink); box-shadow: none; }
  :root[data-theme="dark"] .td :is(.qd-day .mm i, .mk)[data-m="wrong"] { background: var(--mat); color: var(--ink); box-shadow: inset 0 0 0 1.2px var(--soft); }
  .qd-arch { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 14px; }
  @media (max-width: 1079px) {
    .qd-tabs { display: flex; }
    .qd-rowk { display: none; }
    .qd-row { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .qd-row + .qd-rowk { margin-top: 0; }
    .qd-slot:not(.on) { display: none; }
    .qd-slot { padding: 0; background: none; touch-action: pan-y; }
    .qd-lab { display: none; }
  }

  /* points, pace, score */
  /* only the sort row stays in view while the list scrolls (the user: the whole head was sticky) */
  .gain-sort { position: sticky; top: calc(var(--bar, 64px) + 4px); z-index: 2; background: var(--tile); padding: 6px 0 8px; margin: -6px 0 4px; }
  @media (min-width: 1080px) { .gain-sort { top: 8px; } }
  .gain-rows .skill-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .gain-rows .skill-row:last-child { border-bottom: 0; }
  /* the last column is a fixed share, so the figures and tracks line up row after row */
  @media (min-width: 760px) { .td .skill-row.gain { grid-template-columns: minmax(150px, 1fr) 84px minmax(150px, 1.2fr) 150px; } }
  .td .skill-m .meta { white-space: nowrap; }
  .td .skill-track > i.goal { background: var(--soft); }
  .extra-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .extra-row b { font: 600 18px var(--mono); }
  .extra-row b.lt5 { font: 500 14px var(--font); color: var(--soft); }

  /* exam */
  .exam-trig { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 0; background: var(--tile-2); font: 600 13.5px var(--font); color: var(--ink); cursor: pointer; }
  .exam-cap { font: 600 17px/1.35 var(--font); color: var(--ink); }
  .td .countdown { margin-top: 14px; }
  .td .countdown .num { font-size: 28px; }
  .check-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px 24px; }
  @media (min-width: 760px) { .check-list { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); } .check-list > li.meta { grid-column: 1 / -1; } }
  .check-list label { display: flex; align-items: center; gap: 10px; min-height: 40px; font: 400 15px/1.35 var(--font); cursor: pointer; }

  .exam-dates-row .btn { width: 100%; padding: 0 8px; }
  .ready-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }

  /* study */
  .figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }
  @media (max-width: 759px) { .figs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  :is(.figs, .plan-stats) > .fig { padding: 12px 14px; border-radius: 10px; background: var(--paper); }
  .fig .v { font: 600 24px/1.1 var(--mono); }
  .fig .k { display: block; margin-top: 4px; }
  /* the month fills its card: the cells stretch with the width (the user: a strip with half the width empty) */
  #study .cal-grid { grid-template-columns: repeat(7, minmax(36px, 1fr)); max-width: 640px; }
  #study .cal-d { height: auto; aspect-ratio: 1.7; min-height: 36px; }
  #study .cal-head { max-width: 640px; }
  @media (max-width: 759px) { .td .cal-metric .seg { display: flex; } .td .cal-metric .seg > * { flex: 1 1 0; padding: 0 6px; font-size: 13px; } }
  /* the day detail is the calendar's caption, under it (the user: it floated beside the controls) */
  .cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 18px; }
  .cal-wrap[hidden] { display: none; }
  .day-detail { padding: 14px 0 0; border-top: 1px solid var(--line); background: none; }
  .day-detail[hidden] { display: none; }
  .day-detail .dd-t { font: 600 15px/1.35 var(--font); }
  .day-detail ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }

  /* challenge, words, plan, tests */
  .board { list-style: none; margin: 10px 0 0; padding: 0; }
  .board li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 36px; border-bottom: 1px solid var(--line); font: 500 14px var(--font); }
  .board li.you { background: var(--wash); box-shadow: inset 3px 0 0 var(--amber); padding-left: 6px; }
  .board li .meta { color: var(--ink); }
  .slots10 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .slots10 > div { display: grid; justify-items: center; gap: 4px; }

  .slots10 .fpct { font: 500 10px var(--mono); color: var(--soft); }
  .slot-detail:empty { display: none; }
  .slot-detail { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--paper); }
  .slot-detail .line { margin: 0; }
  .td .blk { margin-top: 18px; }
  .out-row { justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--line); font: 400 13.5px var(--font); }
  .wk-hd { all: unset; display: grid; gap: 2px; justify-items: center; cursor: pointer; border-radius: 6px; }
  .wk-hd:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .plan-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 759px) { .plan-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .wk-pager { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .wk-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  .wk-day { display: grid; gap: 4px; align-content: start; padding: 8px 6px; border-radius: 10px; background: var(--paper); font: 500 12px var(--font); text-align: center; min-height: 96px; }
  .wk-day[data-today] { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .wk-day.off { background: none; box-shadow: inset 0 0 0 1px var(--line); opacity: .6; }
  .wk-day .wk-k { font: 600 11px var(--font); color: var(--soft); text-transform: uppercase; letter-spacing: .06em; }
  .wk-day .wk-s { font: 600 12px var(--font); }
  .wk-day .meta { font-size: 10.5px; }
  /* its box stays inside the tile (the user: hover and focus spilled onto the next tile) */
  .wk-day .quiet { justify-self: center; justify-content: center; margin: 0; padding: 2px 4px; min-height: 28px; font-size: 12px; line-height: 1.2; white-space: normal; text-align: center; }
  .wk-day .quiet svg { width: 16px; height: 16px; }
  .draft-ctl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; margin-top: 8px; align-items: start; }
  @media (max-width: 759px) { .draft-ctl { grid-template-columns: minmax(0, 1fr); } }
  .draft-ctl label.label { display: block; margin-bottom: 6px; }
  .draft-ctl .field { height: var(--ctl); }
  .days7 { display: flex; flex-wrap: wrap; gap: 4px; }
  .days7 button { min-width: 40px; min-height: var(--ctl); border: 0; border-radius: 8px; background: var(--tile-2); font: 600 13px var(--font); color: var(--ink); cursor: pointer; }
  /* the chosen days look like every other chosen toggle on the page */
  .days7 button[aria-pressed="true"] { background: var(--paper); box-shadow: inset 0 0 0 1.5px var(--ink); color: var(--ink); }
  .week-rows { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .week-rows li { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 2px 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font: 400 13.5px var(--font); }
  .week-rows li b { font: 600 13px var(--font); }
  .cta-steps { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 0; padding: 0; list-style: none; }
  .cta-steps a { font: 500 14px var(--font); color: var(--ink); }
  .tests-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 1079px) { .tests-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 759px) { .tests-grid { grid-template-columns: minmax(0, 1fr); } }
  .tcard { display: grid; gap: 8px; align-content: start; padding: 16px; border-radius: 12px; background: var(--paper); }
  .tcard.open { box-shadow: inset 3px 0 0 var(--amber); }
  .tcard .band { font: 600 34px/1 var(--mono); letter-spacing: -.02em; }
  .mchips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .mchips button { min-width: 28px; height: 26px; padding: 0 5px; border-radius: 6px; border: 0; background: var(--ink); color: var(--on-ink); font: 500 12px var(--mono); cursor: pointer; }
  .mchips button.blank { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--faint); }

  @media (max-width: 759px) {
    .td .big { font-size: 38px; }
    .score-band { font-size: 40px; }
    .qd-slot .opt { min-height: 56px; }
    /* touch targets of at least 40px (§14) */
    .brief a, .mrow button.tl { display: inline-flex; align-items: center; min-height: 40px; }
    .td .quiet, .td .btn, .td .pill, .exam-trig, .hero-stats a { min-height: 40px; }
    .mchips button { min-width: 40px; height: 40px; }
    .td a.chip { min-height: 40px; } .wk-hd { min-height: 40px; align-content: center; }
    .wk-strip { gap: 4px; } .wk-day { padding: 8px 2px; } .wk-day .wk-s { font-size: 10px; overflow-wrap: normal; }
    .wk-day .quiet { min-height: 36px; }
  }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none !important; } }
</style>

<script>UI.shell({ page: 'today', now: false });</script>
<script>
(() => {
  'use strict';
  const h = UI.h, $ = id => document.getElementById(id);
  const S = { t: null, ins: null, q: null, cal: null, chal: null, board: null, hist: null, histMore: [], calMonth: null, calDay: null,
              week: null, draft: null, qday: null, gainSort: 'points', mistView: 'type', causePick: null, calMetric: 'minutes' };
  const api = (p, o) => UI.api(p, o);
  const post = (p, body) => api(p, { method: 'POST', body: body || {} });
  const put = (p, body) => api(p, { method: 'PUT', body });
  const n = x => UI.num(x);
  const pl = (k, one, many) => `${n(k)} ${k === 1 ? one : (many || one + 's')}`;
  const pct = x => `${Math.round((x > 1 ? x / 100 : x || 0) * 100)}%`;
  const TOP = slug => (UI.TOPIC && UI.TOPIC[slug] || {}).short || String(slug || '').replace(/_/g, ' ');
  const DSHORT = d => ((UI.DOMAINS || []).find(x => x[0] === d) || [d, d])[1];
  const sdur = s => UI.dur((s || 0) / 60);
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
  const phone = () => matchMedia('(max-width: 759px)').matches;
  const narrow = () => matchMedia('(max-width: 1079px)').matches;
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
  const localDay = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const addDays = (iso, k) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + k); return d.toISOString().slice(0, 10); };
  const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
  const today = () => (S.t && S.t.days && S.t.days.today) || localDay();
  const flame = on => h('span', { class: on ? 'on' : '', html: UI.svg(UI.ICON.flame, 16), 'aria-hidden': 'true' });

  /* ---------------------------------------------------------------- small builders */
  function btn(label, onClick, cls = 'btn') {
    const b = h('button', { type: 'button', class: cls, text: label });
    if (onClick) b.addEventListener('click', e => run(b, () => onClick(e, b)));
    return b;
  }
  const quiet = (label, onClick) => btn(label, onClick, 'quiet');
  // a start that fails says so in its own card, under its controls, which keep their values (§3a)
  const inCard = (host, fn) => async () => {
    const old = host.querySelector(':scope > .field-err');
    if (old) old.remove();
    try { await fn(); } catch (e) {
      if (e && e.name === 'AbortError') return;
      host.append(h('p', { class: 'field-err', role: 'alert', text: errText(e) }));
    }
  };
  const pill = (label, onClick) => btn(label, onClick, 'pill');
  const link = (label, href, cls = 'quiet') => h('a', { class: cls, href, text: label });
  const line = (text, cls = '') => h('p', { class: 'line' + (cls ? ' ' + cls : ''), text });
  const meta = text => h('p', { class: 'meta', text });
  const sub = text => h('p', { class: 'sub', text });
  const bar4 = f => h('span', { class: 'bar4', 'aria-hidden': 'true' }, h('i', { style: `width:${Math.max(0, Math.min(100, Math.round((f || 0) * 100)))}%` }));
  const join = (...xs) => xs.flat().filter(Boolean).join(' · ');
  // decision 7: a server line's zero parts ("0 check-ins", "0 of 2") say nothing, so they go
  const nz = s => String(s || '').split(' · ').filter(x => !/^0\b/.test(x.trim())).join(' · ');
  // a ' · ' line whose parts never break inside (the user: lines that started with a dot, "check- / ins")
  const nw = (s, cls = 'meta') => { const p = h('p', { class: cls + ' nw' }); String(s).split(' · ').forEach((x, i) => p.append(i ? ' · ' : '', h('span', { text: x }))); return p; };
  // the one label of each test, the same on every card (the user: the same action under three names)
  const MODULE = 'Module · 22 questions · 35 min', DIAG = 'Diagnostic · 20 questions · 32 min', SECTION = 'Section · 44 questions · 70 min';
  const svgI = (d, size = 16) => UI.svg(`<path d="${d}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`, size);
  const CHEV = 'M9 6l6 6-6 6';
  // a small (i): the sentence opens on tap or hover, never a paragraph on the card (decision 7, the user's "help paragraphs")
  function info(text, label = 'More about this') {
    const b = h('button', { type: 'button', class: 'why-i', text: 'i', 'aria-label': label, 'aria-haspopup': 'dialog', 'aria-expanded': 'false' });
    b.addEventListener('click', () => UI.pop(b, () => h('div', { class: 'info-pop' }, [].concat(typeof text === 'function' ? text() : text).map(x => typeof x === 'string' ? h('p', { text: x }) : x)), { label }));
    return b;
  }
  // a folded list: one row that says what is inside and opens in place; its state is remembered on this device
  function fold(key, label, metaText, body, def = false) {
    let open = def;
    const k = `satf.fold.${key}`, v = ls.get(k);
    if (v !== null) open = v === '1';
    const b = h('button', { type: 'button', class: 'fold', 'aria-expanded': String(open) }, h('span', { text: label }), metaText ? h('span', { class: 'meta', text: metaText }) : null,
      h('span', { class: 'chev', 'aria-hidden': 'true', html: svgI(CHEV) }));
    const box = h('div', { class: 'fold-body' }, body);
    box.hidden = !open;
    b.addEventListener('click', () => { open = !open; box.hidden = !open; b.setAttribute('aria-expanded', String(open)); ls.set(k, open ? '1' : '0'); });
    return [b, box];
  }
  function errText(e) {
    const d = e && e.detail;
    if (d && typeof d === 'object' && d.reason) return cap(String(d.reason).replace(/_/g, ' ')) + '.';
    if (typeof d === 'string' && d.length < 120) return cap(d) + (/[.!?]$/.test(d) ? '' : '.');
    return e && e.offline ? 'Can’t reach SAT Freshman.' : 'That didn’t work. Try again.';
  }
  async function run(b, fn) {
    if (b.getAttribute('aria-busy') === 'true') return;
    b.setAttribute('aria-busy', 'true');
    try { await fn(); } catch (e) { if (e && e.name !== 'AbortError') UI.toast(errText(e)); }
    finally { b.removeAttribute('aria-busy'); }
  }
  function head(id, label, ...right) {
    const r = right.flat().filter(Boolean);
    // the kit's card title: 18px Archivo in ink, one look on every card (the user: caps heads and a mono eyebrow)
    return h('div', { class: 'card-head' }, h('h2', { id: id + '-h', tabindex: '-1', text: label }),
      r.length ? h('div', { class: 'card-act' }, ...r) : null);
  }
  function card(id, label, right, ...kids) {
    const el = $(id);
    el.setAttribute('aria-labelledby', id + '-h');
    el.replaceChildren(head(id, label, right || []), ...kids.flat(3).filter(Boolean));
    return el;
  }
  const skel = (id, label, ...shapes) => card(id, label, null, shapes.map(x => UI.skel(null, x)));
  const topicChip = (slug, o = {}) => {
    const c = h('span', { class: 'tchip', 'aria-label': join(TOP(slug), o.answered !== undefined && `${n(o.answered)} answered`, o.traps && pl(o.traps, 'open mistake')) });
    c.append(h('span', { class: 'tc-t' }, UI.glyph(slug), TOP(slug),
      o.traps ? h('span', { class: 'dots', 'aria-hidden': 'true' }, Array.from({ length: Math.min(3, o.traps) }, () => h('i'))) : null));
    if (o.mastery > 0) c.append(h('span', { class: 'mbar', 'aria-hidden': 'true' }, h('i', { style: `--m:${Math.max(0, Math.min(1, o.mastery || 0))}` })));
    return c;
  }

  /* ---------------------------------------------------------------- starting things */
  function hrefOf(path, r) {
    if (!r) return '/';
    if (r.href) return r.href;
    if (r.next_url) return r.next_url;
    const id = encodeURIComponent(r.id || r.session || '');
    if (/^\/mock/.test(path)) return `/test/?s=${id}`;
    if (/^\/words\/run/.test(path)) return `/words/run/?id=${id}`;
    if (r.runner === 'test') return `/test/?s=${encodeURIComponent(r.session)}`;
    return `/practice/session/?id=${id}`;
  }
  async function go(st) {
    if (!st) return;
    if (typeof st === 'string') { location.href = st; return; }
    if (!st.path) { if (st.href) location.href = st.href; return; }
    const path = String(st.path).replace(/^\/api(?=\/)/, '');
    if (/^\/challenge\/start|^\/contest\/daily\/start/.test(path)) return startChallenge();
    const r = await post(path, st.body || {});
    location.href = hrefOf(path, r);
  }
  const drill = body => go({ path: '/drill', body });
  async function startChallenge() {
    const r = await post('/contest/daily/start');
    location.href = hrefOf('/contest', r);
  }
  function prefetchSession(el) {
    el.addEventListener('pointerdown', () => {
      if (document.querySelector('link[data-pf]')) return;
      document.head.append(h('link', { rel: 'prefetch', href: '/practice/session/', 'data-pf': '' }));
    }, { once: true });
  }
  // one .ics with several events: UI.ics makes one calendar per event, so their VEVENTs are joined (§8, T17)
  function icsFile(name, events) {
    const texts = events.map(ev => UI.ics(Object.assign({ download: false }, ev)));
    const vevents = texts.flatMap(t => t.match(/BEGIN:VEVENT[\s\S]*?END:VEVENT\r\n/g) || []);
    const text = texts[0].replace(/BEGIN:VEVENT[\s\S]*END:VEVENT\r\n/, vevents.join(''));
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'text/calendar;charset=utf-8' })), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  const BYDAY = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'];
  // Add to calendar (§8, T17): the SAT, and the study days at a time the student picks
  function calSheet() {
    const p = S.t.profile, pr = (UI.prefs.now && UI.prefs.now()) || {};
    const days = (p.days || '').split('').map((b, i) => b === '1' ? BYDAY[i] : null).filter(Boolean);
    const study = !!(p.exam_date && p.minutes && days.length && (S.t.plan || p.days));
    const time = h('input', { type: 'time', class: 'field sm', value: pr.study_time || '17:00', 'aria-label': 'Study time' });
    const withStudy = h('input', { type: 'checkbox', checked: study });
    let sheet;
    const body = b => {
      b.append(h('p', { class: 'line', text: join(`SAT · ${UI.date(p.exam_date, 'long')}`, 'all day', 'a reminder at 6 PM the evening before') }));
      if (!study) return;
      b.append(h('label', { class: 'row', style: 'margin-top:14px' }, withStudy,
        h('span', { text: join(`Study days · ${days.map(d => ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][BYDAY.indexOf(d)]).join(', ')}`, `${n(p.minutes)} min`, `until ${UI.date(addDays(p.exam_date, -1))}`) })));
      b.append(h('div', { class: 'row', style: 'margin-top:10px' }, h('span', { class: 'label', text: 'Start at' }), time));
      if (!pr.study_time && S.t.usual_start) {
        const [hh, mm] = S.t.usual_start.split(':').map(Number);
        const said = new Date(2000, 0, 1, hh, mm).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

  /* where the cards sit. Below 1080px the DOM order is the phone order (and tab order); from 1080px the cards

      : ['hero', 'next', 'due', 'qotd', 'gain', 'mist', 'exam', 'score', 'pace', 'study', 'plan', 'chal', 'words', 'tests'];

    nodes.forEach(e => parent.append(e));

  function place() {

    const col = (id, cls) => $(id) || h('div', { id, class: `td-col ${cls}` });
    if (!WIDE.matches) {

    }
    const aMain = col('tdAm', 'td-main'), aSide = col('tdAs', 'td-side'), bMain = col('tdBm', 'td-main'), bSide = col('tdBs', 'td-side');
    ensure(grid, [$('hero'), aMain, aSide, $('qotd'), bMain, bSide, $('tests')]);

      ensure(bSide, ['score', 'pace', 'chal', 'words'].map($));

  // the lower side cards float up into the upper side column while it has room beside its main column
  let balT = 0;
  function balance() {
    cancelAnimationFrame(balT);
    balT = requestAnimationFrame(() => {
      if (!WIDE.matches || !$('tdAs')) return;
      const aSide = $('tdAs'), bSide = $('tdBs'), GAP = 20;
      const hOf = id => $(id).offsetHeight;
      const stretch = $('today').classList.contains('stretch');
      // the side cards in order (Due today first: the day's parts come before the mistakes list); the first ones always sit
      // beside Up next. The split is the one that leaves the least empty space beside the two main columns, the gaps spread
      // over both bands rather than one large one (cards move down as well as up)
      const seq = stretch ? ['exam', 'due', 'mist', 'score', 'pace', 'chal', 'words'] : ['due', 'mist', 'exam', 'score', 'pace', 'chal', 'words'];
      // exam morning keeps only the SAT card up there: Up next is one warm-up, so the rest may wait lower down
      const fixed = $('today').classList.contains('examday') ? 1 : stretch ? 3 : 2;
      const Am = hOf('next') + GAP + hOf('gain'), Bm = hOf('study') + GAP + hOf('plan');
      const hs = seq.map(hOf), all = hs.reduce((a, b) => a + b + GAP, -GAP);
      let best = fixed, bestS = Infinity, bestM = Infinity, used = -GAP;
      hs.forEach((x, i) => {
        used += GAP + x;
        if (i + 1 < fixed) return;
        const rest = i + 1 < hs.length ? all - used - GAP : 0;
        const gA = Math.abs(Am - used), gB = Math.abs(Bm - rest), s = gA + gB, m = Math.max(gA, gB);
        if (s < bestS - 30 || (Math.abs(s - bestS) <= 30 && m < bestM)) { best = i + 1; bestS = s; bestM = m; }

          kids.push(h('div', { class: 'acts' }, sh, h('span', { class: 'meta', title: `Answers behind it: ${ev}`, text: `Thin in ${pl(thin.length, 'domain')}` })));

    const pts = [...(t.scores || []).map(x => ({ id: x.session, at: x.at, low: x.low, high: x.high, kind: x.kind, href: `/results/report/?id=${encodeURIComponent(x.session)}` })),
      ...(t.outside || []).map(x => ({ id: 'o' + x.id, day: x.day, value: x.math, low: x.math, high: x.math, kind: 'outside', outside: x.source === 'official' ? 'Official' : 'Bluebook' }))];

      kids.push(fig, h('p', { class: 'meta' }, pts.length === 1 ? '1 scored sitting · ' : '', h('a', { class: 'plain', href: '/results/', text: 'All results' })));

    }

    if (t.plan && t.plan.suggest && t.plan.suggest.current) kids.push(driftBlock(t, t.plan.suggest));

  }
  // drift (T10, R16): the sittings behind it, what the new start changes, then the choice
  function driftBlock(t, sg) {

    const el = h('div', { class: 'blk' }, sub('Your plan’s start'),
      line(down ? `Tests are running below the plan’s start (${was} → ${sg.current})` : `Your last tests average ${sg.current}; your plan started from ${was}.`));
    const sits = (sg.sessions || []).map(id => (t.scores || []).find(x => x.session === id)).filter(Boolean);
    if (sits.length) el.append(h('div', { class: 'row', style: 'margin-top:8px' }, sits.map(x =>
      h('a', { class: 'chip', href: `/results/report/?id=${encodeURIComponent(x.session)}`, text: `${UI.date(x.at)} · ${x.low}–${x.high}` }))));
    if ((sg.moved || []).length) el.append(meta(sg.moved.map(m => `${TOP(m.topic)} ${m.delta >= 0 ? '+' : '−'}${Math.abs(m.delta).toFixed(2)}`).join(' · ') + ' since the plan started'));
    const effect = meta(sg.preview || '');
    el.append(effect);
    if (!sg.preview && t.profile.target) Promise.all([within(previewFor({ current: was })), within(previewFor({ current: sg.current }))]).then(([a, b]) => {
      if (a && b && a.pace_per_week !== undefined) effect.textContent = `New start ${sg.current} · the pace needed goes from +${Math.round(a.pace_per_week)} to +${Math.max(0, Math.round(b.pace_per_week))} a week`;
    });
    const upd = btn(`Update the ${down ? 'start' : 'plan’s start'} to ${sg.current}`, async () => {
      await api(`/plan/${encodeURIComponent(t.plan.id)}`, { method: 'PATCH', body: { current: sg.current } });
      UI.toast(`Plan starts from ${sg.current}`, { undo: () => api(`/plan/${encodeURIComponent(t.plan.id)}`, { method: 'PATCH', body: { current: was } }).then(() => refresh(['today'])) });
      refresh(['today']);
    });
    el.append(h('div', { class: 'acts' }, upd, down ? btn('Sharpen · 12', () => drill({ source: 'probe', count: 12 })) : null,

  }
  const CAUSE = { clock: 'Clock', entry: 'Entry', trap: 'Traps', slip: 'Slips', gap: 'Gaps', misread: 'Misreads', changed: 'Changed' };
  function causesBlock(c) {
    const el = h('div', { class: 'blk' });
    el.append(sub('Where points went · last 14 days'));
    if (!c.total || c.total < 5) { el.append(line('Fewer than 5 misses in 14 days: nothing to sort yet.', 'soft')); return el; }
    const segs = Object.keys(CAUSE).filter(k => c.by[k]).map(k => ({ key: k, label: CAUSE[k], value: c.by[k] }));
    const fix = h('div', {});
    // the bar labels its parts, so the legend only carries parts too narrow for a label, and the sentence adds the lever,
    // not the count a third time; one cause alone is just the sentence (the user: one number said three times)
    const one = segs.length === 1;
    if (UI.stackBar && !one) UI.stackBar(el, segs, { largest: true, legend: 'auto', noun: 'misses', label: 'Misses by cause', onPick: sg => { S.causePick = sg.key; fixRow(c, sg.key, fix); } });
    else if (!one) el.append(meta(segs.map(s => `${s.label} ${s.value}`).join(' · ')));
    const lvWord = c.lever && CAUSE[c.lever] ? CAUSE[c.lever].toLowerCase() : null;
    const lv = one ? `All ${c.total} misses in 14 days were ${CAUSE[segs[0].key].toLowerCase()}${segs[0].key === 'trap' ? ': fixing them is your fastest gain.' : '.'}`
      : lvWord && c.by[c.lever] ? `Most of your misses are ${lvWord}${c.lever === 'trap' ? ': fixing them is your fastest gain.' : '.'}` : null;
    if (lv) el.append(line(lv));
    if (one) fixRow(c, segs[0].key, fix);
    el.append(fix);
    if (S.causePick) fixRow(c, S.causePick, fix);
    const ch = c.changes || {};
    if ((ch.right_to_wrong || 0) + (ch.wrong_to_right || 0) >= 5) el.append(line(ch.right_to_wrong > ch.wrong_to_right
      ? `On tests you changed ${ch.right_to_wrong} right answers to wrong and ${ch.wrong_to_right} wrong to right: keep your first answer unless you find an error.`
      : `Your changes help: ${ch.wrong_to_right} wrong to right, ${ch.right_to_wrong} right to wrong. Keep checking.`));

  }
  function fixRow(c, key, host) {

  /* the target dialog (§9, T11) */
  function targetSheet(opener, draft) {
    const p = S.t.profile, sc = S.t.score;
    let v = (draft ? draft.target : p.target) || (sc ? Math.min(800, Math.ceil(((sc.low + sc.high) / 2 + 60) / 10) * 10) : 600);
    let rwNow = p.rw_now || null, rwT = p.rw_target || null;

    num.addEventListener('input', () => { if (num.value.length >= 3) set(+num.value); });

    const quick = UI.chips(null, QUICK.map(x => ({ value: x, label: String(x) })), { value: v, label: 'Quick targets', onChange: x => set(x) });

          if (p.exam_date && pv.pace_per_week) kids.push(line(join(`${pv.study_days} study days`, `about ${Math.round(pv.pace_per_week)} a week`, pv.pace_tag)));

              kids.push(h('div', { class: 'row' }, chip));

          } else if (later) { later = null; changed(); }

    save.addEventListener('click', () => run(save, async () => {
      if (draft) { draft.target = v; sheet.close(); paintPlan(); return; }
      const was = { target: p.target ?? null, rw_now: p.rw_now ?? null, rw_target: p.rw_target ?? null };
      const change = Object.assign({ target: v, rw_now: rwNow, rw_target: rwT }, later ? { exam_date: later } : {});

  /* ---------------------------------------------------------------- SAT countdown (§10, T12, T13) */
  let stopCount = null;
  // Plan's preview on the student's own numbers, with some of them changed (T11, T12)
  function previewFor(over) {
    const p = S.t.profile, sc = S.t.score;
    const current = (S.t.plan && S.t.plan.current) || (sc ? Math.round((sc.low + sc.high) / 20) * 10 : p.current) || undefined;
    const body = Object.assign({ current, target: p.target || undefined, exam_date: p.exam_date || undefined, minutes: p.minutes || 45, days: p.days || '1111111' }, over);   // every day, as the workload counts
    if (body.target && body.current && body.target < body.current) return Promise.resolve({});   // the server refuses a target below now
    return post('/plan/preview', body);
  }
  // at most `ms` to wait, so a slow preview never holds a control shut
  const within = (pr, ms = 700) => Promise.race([pr.catch(() => null), new Promise(r => setTimeout(() => r(null), ms))]);
  async function examPop(anchor) {
    const dates = (((UI.shellData && UI.shellData()) || {}).dates || []).filter(d => d.day >= today());
    // each official date with what it means: study days, the pace it asks, its tag (T12)
    const pvs = await Promise.all(dates.map(d => within(previewFor({ exam_date: d.day }))));
    return UI.examDate(anchor, { value: S.t.profile.exam_date, onSave: setExam, dates: dates.map((d, i) => {
      const pv = pvs[i] || {}, paced = S.t.profile.target && pv.pace_per_week !== undefined;
      return { date: d.day, register_by: d.register_by, late_by: d.late_by, study_days: pv.study_days ?? null,
        per_week: paced ? Math.max(0, Math.round(pv.pace_per_week)) : null, tag: paced ? pv.pace_tag : null };
    }) });
  }
  async function setExam(v) {
    const before = S.t.profile.exam_date;
    await api('/me', { method: 'PUT', body: { exam_date: v }, optimistic: () => { S.t.profile.exam_date = v; paintExam(); return () => { S.t.profile.exam_date = before; paintExam(); }; } });
    UI.toast(v ? `SAT date set to ${UI.date(v)}` : 'SAT date removed', { undo: () => setExam(before) });

  }
  function paintExam() {
    const t = S.t, p = t.profile, ex = t.exam, w = t.workload;

    const dates = (((UI.shellData && UI.shellData()) || {}).dates || []).filter(d => d.day >= today());

      return;
    }
    const ed = UI.date(p.exam_date, 'long');       // carries the year only outside this year
    const trig = h('button', { type: 'button', class: 'exam-trig', 'aria-haspopup': 'listbox', text: `${/\d{4}$/.test(ed) ? ed : `${ed}, ${p.exam_date.slice(0, 4)}`} ▾` });
    trig.addEventListener('click', () => examPop(trig));
    const days = ex ? ex.days : dayDiff(today(), p.exam_date);
    const kids = [];
    const mode = stageMode();
    if (days < 0 || mode === 'after') {
      // the date and when scores come; the two asks are Up next's (the user: the same message and buttons in two cards)
      kids.push(h('p', { class: 'exam-cap', text: `Your SAT was ${UI.date(p.exam_date)}` }));
      if (ex && ex.scores_by) kids.push(h('p', { class: 'line' }, `Scores come out around ${UI.date(ex.scores_by)} `,
        quiet('Remind me', () => UI.ics({ title: 'SAT scores come out', start: ex.scores_by, allDay: true, alarm: 0, url: 'https://studentscores.collegeboard.org/', filename: 'sat-scores.ics' }))));
      card('exam', 'SAT', trig, kids);
      return;
    }
    if (days === 0) kids.push(meta('Good luck'));
    else if (w) {
      kids.push(h('p', { class: 'exam-cap', text: join(pl(w.study_days, 'study day'), w.capacity > 0 && `~${sdur(w.capacity)} at your goal`, w.need && w.need.tests_n && `${pl(w.need.tests_n, 'test')} left`) }));

      if ($('planHelp')) $('planHelp').hidden = !!dr.current;
      try {
        const body = { target: dr.target || undefined, exam_date: dr.exam_date, minutes: dr.minutes, days: dr.days };
        if (dr.current) body.current = dr.current;
        const pv = await post('/plan/preview', body);
        const ul = h('ul', { class: 'week-rows', 'aria-label': 'Your first 7 days' });
        (pv.week || []).slice(0, 7).forEach(d => ul.append(h('li', {}, h('b', { text: UI.date(d.date, 'long') }), h('span', { text: join(cap(d.kind), d.minutes && `${d.minutes} min`, (d.topics || []).slice(0, 3).map(TOP).join(', ')) }))));
        host.replaceChildren(ul, dr.current ? meta(join(pv.study_days && `${pv.study_days} study days`, pv.pace_per_week && `about +${Math.round(pv.pace_per_week)} a week`, pv.pace_tag)) : '');
      } catch (e) { host.replaceChildren(line('Pick a date and your days to see the first week.', 'soft')); }
    }, 250);
  }

  /* ---------------------------------------------------------------- recent tests (§11, T16) */
  // test sittings only: until /api/history applies kind=tests (R26) it lists every finished session
  const TEST_KINDS = new Set(['mock', 'paper', 'module', 'custom', 'diagnostic', 'twin', 'section']);
  function paintTests() {
    const all = [...((S.hist && S.hist.sessions) || []), ...S.histMore].filter(r => TEST_KINDS.has(r.kind));
    const paged = !!(S.hist && S.hist.next_offset !== undefined);
    const rows = paged ? all : all.slice(0, S.testsShown || 6);
    const open = S.t && S.t.open && S.t.open.test;
    const total = S.hist && (S.hist.total ?? (paged ? null : all.length));
    const right = link(`All tests${total ? ` (${n(total)})` : ''}`, '/tests/');
    if (!rows.length && !open) {
      // the module and Add a score are the Score card's "Get a score"; the full section is only here, as one quiet offer
      card('tests', 'Recent tests', right, h('p', { class: 'line soft', style: 'margin:0' }, 'No tests yet'),
        h('div', { class: 'acts' }, quiet(SECTION, () => go({ path: '/mock/new', body: { full: true } }))));
      return;
    }
    const grid = h('div', { class: 'tests-grid' });
    if (open) {
      const out = open.timed && open.seconds_left === 0;
      grid.append(h('div', { class: 'tcard open' }, h('p', { class: 'k', text: 'In progress' }), h('p', { class: 'line', style: 'margin:0;font-weight:600', text: open.section ? `Section · module ${open.module}` : cap(open.kind) }),
        meta(join(open.timed ? (out ? 'Time’s up' : `${UI.mmss(open.seconds_left)} left`) : 'Untimed', `${open.answered} of ${open.asked} answered`)),
        h('div', { class: 'acts' }, h('a', { class: 'btn', href: `/test/?s=${encodeURIComponent(open.id)}`, text: out ? (open.section && open.module === 1 ? 'Continue to module 2' : 'See results') : 'Resume' }))));
    }
    rows.filter(r => r.finished).forEach(r => {
      if (UI.sittingCard) { const hst = h('div', {}); UI.sittingCard(hst, r, {}); grid.append(hst); return; }
      grid.append(testCard(r, all));
    });
    const kids = [grid];
    if (paged ? S.hist.next_offset : all.length > rows.length) kids.push(h('div', { class: 'acts' }, btn('Show 6 more', async () => {
      if (!paged) { S.testsShown = rows.length + 6; paintTests(); return; }
      const more = await api(`/history?kind=tests&all=1&limit=6&offset=${S.hist.next_offset}`);
      S.histMore.push(...(more.sessions || [])); S.hist.next_offset = more.next_offset; paintTests();
    })));
    card('tests', 'Recent tests', right, kids);
  }
  function testCard(r, all) {
    const el = h('div', { class: 'tcard' });
    const asked = r.asked || 0, misses = r.misses ?? (asked - (r.right || 0));
    el.append(meta(join(UI.date(r.finished || r.started), UI.KIND && UI.KIND.label ? UI.KIND.label(r) : cap(r.kind), asked && pl(asked, 'question'))));
    if (r.gated) {
      el.append(h('a', { class: 'btn', href: `/diagnostic/signup.html?s=${encodeURIComponent(r.id)}`, text: 'Sign up to see your results' }));
      return el;
    }
    if (r.estimate) el.append(h('p', { class: 'band', text: `${r.estimate.low}–${r.estimate.high}` }));
    if (r.route) el.append(h('span', { class: 'tag', text: r.route === 'up' ? 'Harder module 2' : `Easier module 2${r.capped ? ` · capped ${r.capped}` : ''}` }));
    el.append(meta(join(`${r.right}/${asked} right`, r.minutes && `${r.minutes} min`)));
    // T16: against the previous sitting of the same kind, and the SAT total with the student's R&W
    const prev = (all || []).find(x => x !== r && x.kind === r.kind && x.estimate && x.finished < r.finished);
    const mid = e => (e.low + e.high) / 2;
    const rw = S.t && S.t.profile.rw_now;
    if (r.estimate && (prev || rw)) el.append(meta(join(prev && `${mid(r.estimate) >= mid(prev.estimate) ? '+' : '−'}${Math.abs(Math.round(mid(r.estimate) - mid(prev.estimate)))} vs ${UI.date(prev.finished)}`,
      rw && `≈ ${r.estimate.low + rw}–${r.estimate.high + rw} with your R&W ${rw}`)));
    if (r.causes && r.causes.total) el.append(line(`Lost ${r.causes.total}: ` + Object.keys(CAUSE).filter(k => r.causes.by && r.causes.by[k]).map(k => `${r.causes.by[k]} ${CAUSE[k].toLowerCase()}`).join(' · '), 'soft'));
    if (r.worth && r.worth.text) el.append(line(r.worth.text, 'soft'));
    (r.time || []).forEach(t => el.append(meta(t.text || join(`M${t.module} ${UI.mmss(t.used)} used`, t.ran_out_at && `ran out at Q${t.ran_out_at}`, t.blank && `${t.blank} blank at time-up`))));
    if (r.estimate && UI.scale) { const f = h('div', {}); UI.scale(f, { band: r.estimate, target: S.t && S.t.profile.target, compact: true, min: 200, max: 800 }); el.append(f); }
    (r.modules || []).forEach(m => {
      const miss = [...(m.missed || m.wrong || []).map(q => [q, 'wrong']), ...(m.blank || []).map(q => [q, 'blank'])].sort((a, b) => a[0] - b[0]);
      if (!miss.length) return;
      const row = h('div', { class: 'mchips' }, h('span', { class: 'meta', text: `M${m.n || m.module}` }));
      miss.slice(0, 10).forEach(([q, kind]) => {
        const b = h('button', { type: 'button', class: kind === 'blank' ? 'blank' : '', text: String(q), 'aria-label': `Module ${m.n || m.module} question ${q}, ${kind}` });
        UI.menu.bind(b, [{ label: `Review Q${q}`, href: `/results/report/?id=${encodeURIComponent(r.id)}&q=M${m.n || m.module}-${q}` },
          { label: 'Twin', onClick: () => twinSheet({ from_session: r.id, only: [`m${m.n || m.module}q${String(q).padStart(2, '0')}`], each: 1, source: 'twin', parent: r.id }, null, 'Twin') }]);
        row.append(b);
      });
      if (miss.length > 10) row.append(h('span', { class: 'meta', text: `+${miss.length - 10}` }));
      el.append(row);
    });
    if ((r.modules || []).length) el.append(h('p', { class: 'meta', text: '■ wrong ▢ blank' }));
    const acts = h('div', { class: 'acts' });
    const old = r.finished && dayDiff(String(r.finished).slice(0, 10), today()) >= 3;
    const twinB = btn('Twin test', () => go({ path: '/mock/new', body: { kind: 'twin', twin_of: r.id } }));
    if (old || misses >= 5) acts.append(twinB);
    acts.append(h('a', { class: 'btn', href: `/results/report/?id=${encodeURIComponent(r.id)}`, text: 'Review' }));
    if (misses > 0) acts.append(btn(`Fix ${misses}`, () => drill({ from_session: r.id })));
    else acts.append(h('span', { class: 'meta', text: 'All right' }));
    if (!(old || misses >= 5)) acts.append(twinB);
    acts.append(quiet('New one like this', () => go({ path: '/mock/new', body: { full: r.kind === 'mock' } })));
    el.append(acts);
    return el;
  }

  /* ---------------------------------------------------------------- keys, rollover, return (T20, §12) */
  function cards() {
    return [...document.querySelectorAll('#today section')].filter(s => s.offsetParent !== null)
      .sort((a, b) => { const A = a.getBoundingClientRect(), B = b.getBoundingClientRect(); return Math.abs(A.top - B.top) > 8 ? A.top - B.top : A.left - B.left; });
  }
  function moveCard(k) {
    const list = cards();
    let cur = list.findIndex(s => s.contains(document.activeElement));
    // nothing focused: the card at the top of the view is the current one, so J from the top goes to the second card
    if (cur < 0) cur = Math.max(0, list.filter(s => s.getBoundingClientRect().top <= 80).length - 1);
    const j = Math.max(0, Math.min(list.length - 1, cur + k));
    const hd = list[j].querySelector('h1, h2');
    if (hd) { hd.focus({ preventScroll: true }); hd.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  }
  UI.keys.register('today', {
    J: { does: 'Next card', run: () => moveCard(1) },
    K: { does: 'Previous card', run: () => moveCard(-1) },
    T: { does: 'Try one now', run: () => { const x = S.t && S.t.traps && (S.t.traps.top || [])[0]; if (x) twinSheet({ pool: 'redo', ids: [x.id], count: 1, source: 'try' }, x.label); } },
    Enter: { does: 'Run the focused card’s main action', when: () => document.activeElement && document.activeElement.matches('#today .card-head > h2, #today h1'),
      run: () => { const c = document.activeElement.closest('section'); const b = c && (c.querySelector('.pill') || c.querySelector('.btn')); if (b) b.click(); } },
  }, { label: 'Today' });

  let day0 = localDay();
  setInterval(() => {
    if (localDay() === day0) return;
    day0 = localDay();
    S.qday = null; S.calMonth = null; S.calDay = null; SZ.sel = null; SZ.preview = null; SZ.q1 = null; SZ.sid = null; S.chalRev = null;
    const note = $('dayNote');
    note.textContent = 'It’s a new day. Here are today’s questions.'; note.hidden = false;
    refresh();
  }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(['today', 'insights', 'chal', 'tests']); });
  addEventListener('pageshow', e => { if (e.persisted) refresh(['today', 'insights', 'chal', 'tests']); });

  /* ---------------------------------------------------------------- go */
  const dq = new URLSearchParams(location.search).get('day');
  if (dq) {
    const t0 = localDay();
    if (/^\d{4}-\d{2}-\d{2}$/.test(dq) && dq < t0 && dayDiff(dq, t0) <= 30) S.qday = dq;
    else if (dq !== t0) S.qNote = 'That day is out of range. Here is today’s.';
  }
  firstPaint();
  // the SAT dates come with the shell; when it lands after /api/today, the SAT card and the plan builder get them (they showed none)
  let shellDates = -1;
  if (UI.onShell) UI.onShell(sh => {
    const k = ((sh || {}).dates || []).length;
    if (k === shellDates) return;
    shellDates = k;
    if (S.t) { paintExam(); if (!S.t.plan) paintPlan(); }
  });
  LOADERS.today();
  LOADERS.insights();
  LOADERS.qotd();
  LOADERS.calendar();
  LOADERS.chal();
  LOADERS.tests();
})();
</script>
</body>
</html>
