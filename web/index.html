<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Overview · SAT Freshman</title>
<meta name="description" content="Where you stand on the SAT, and the next thing to practise.">
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-nav="overview">

<a class="skip" href="#main">Skip to content</a>

<div class="app">
  <aside class="rail"></aside>

  <main class="main" id="main">
    <header class="head">
      <button class="rail-toggle" type="button" aria-label="Show navigation" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <h1 class="head-title">Overview</h1>
    </header>

    <div class="page-body">

      <!-- Standing. Figures are stand-in until the serving layer exists. -->
      <section class="standing rise rise-1" aria-label="Your standing">
        <div>
          <p class="score-n">1290</p>
          <p class="score-cap">Projected score</p>
          <div class="splits">
            <div>
              <p class="split-k">Math</p>
              <p class="split-v">660</p>
            </div>
            <div>
              <p class="split-k">Reading and Writing</p>
              <p class="split-v">630</p>
            </div>
          </div>
        </div>

        <figure class="trend">
          <svg viewBox="0 0 300 72" role="img" aria-label="Projected score across the last six mocks, rising from 1150 to 1290.">
            <line x1="0" y1="66" x2="300" y2="66" stroke="#E4E1DC" stroke-width="1"/>
            <path id="trendline"
                  d="M8 50.2 L64.8 43.1 L121.6 47.8 L178.4 33.6 L235.2 26.5 L292 17.1"
                  fill="none" stroke="#F18508" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"
                  pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"
                  style="animation: draw .9s cubic-bezier(.77,0,.175,1) .25s forwards"/>
            <g fill="#3F3F3F">
              <circle cx="8" cy="50.2" r="1.7"/><circle cx="64.8" cy="43.1" r="1.7"/>
              <circle cx="121.6" cy="47.8" r="1.7"/><circle cx="178.4" cy="33.6" r="1.7"/>
              <circle cx="235.2" cy="26.5" r="1.7"/>
            </g>
            <circle cx="292" cy="17.1" r="3.4" fill="#FFFFFF" stroke="#F18508" stroke-width="1.5"/>
          </svg>
          <figcaption class="trend-cap">Last six mocks</figcaption>
        </figure>
      </section>

      <!-- The one thing to do next gets the weight. -->
      <section class="rise rise-2" aria-label="Continue">
        <a class="resume" href="mixed/">
          <span class="resume-art">
            <svg width="40" height="40" viewBox="0 0 44 44" aria-hidden="true">
              <rect x="9" y="5" width="26" height="34" rx="2.5" fill="none" stroke="#3F3F3F" stroke-width="1.4"/>
              <circle cx="17" cy="14" r="3.6" fill="none" stroke="#3F3F3F" stroke-width="1.3"/>
              <rect x="24" y="10.6" width="6.8" height="6.8" rx="1.5" fill="none" stroke="#3F3F3F" stroke-width="1.3"/>
              <path d="M17 23.4 20.4 30h-6.8z" fill="none" stroke="#3F3F3F" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M25 28h6" fill="none" stroke="#E4E1DC" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="resume-txt">
            <span class="resume-k">Pick up where you left off</span>
            <span class="resume-v">Mixed practice, 8 questions</span>
            <span class="resume-sub">Percentages, circles and two more, built yesterday.</span>
          </span>
          <span class="resume-go">
            <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13M13 6.5 18.5 12 13 17.5" fill="none" stroke="#3F3F3F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </a>
      </section>


    </div>
  </main>
</div>

<script src="assets/app.js"></script>

</body>
</html>
