<style>
  /* Today: the day's work in main, the day at a glance in the aside (.twocol, ui.css). Every shared piece (cards, seg,
     chips, tabs, sheets, charts, the question) is ui.css / runner.css; these rules lay the page out. */
  .td { position: relative; }
  .td :where(*:not(.q-table)) { min-width: 0; }
  /* over the page, not in its flow, so it never moves the grid when it goes */
  .td-upd { position: absolute; top: 4px; right: var(--gutter); z-index: 3; margin: 0; padding: 2px 8px; border-radius: 6px; background: var(--raised); box-shadow: var(--edge); font: 500 11.5px var(--font); color: var(--soft); }
  /* the first frame is the skeleton, never empty card shells */
  #today:not(.ready) { visibility: hidden; }
  @media (max-width: 759px) { #bar:empty { display: block; height: var(--bar); } }
  .td-main { display: grid; gap: var(--card-gap); align-content: start; }

  .td .card-head > h2 { flex: 1 1 auto; margin: 0; outline-offset: 4px; }
  .td .card.collapsed > :not(.card-head) { display: none; }
  .td .card.collapsed > .card-head { margin-bottom: 0; }
  .td-main .card.collapsed .card-act { display: none; }   /* the aside's folded rows keep their value (label, value, chevron) */
  .td .cardfold { flex: none; align-self: center; width: 32px; height: 32px; min-height: 0; }
  /* its caret_down turns over while the card is open (ui.css, the shared disclosure) */
  /* a folded card shows its chevron, so it can be seen to open */
  .td .card.collapsed .cardfold.reveal { opacity: 1; }
  /* a disclosure, not a menu: no well while open (ui.css gives an open .ibtn its well); the hover keeps it */
  .td .cardfold:where([aria-expanded="true"]) { background: none; }
  /* where it always shows (the aside, touch) the chevron is the head's last thing, after the value */
  .td-aside .cardfold { order: 3; }
  @media (pointer: coarse) { .td .cardfold { order: 3; } }
  .td .sub { margin: 12px 0 4px; font: 600 12.5px/1.3 var(--font); color: var(--soft); }
  .td .sub:first-child { margin-top: 0; }
  .td .line { margin: 6px 0 0; font: 400 14.5px/1.45 var(--font); color: var(--ink); text-wrap: pretty; }
  .td .line.soft { color: var(--soft); font-size: 12.5px; }
  .td .card-head + .line, .td .row > .line { margin-top: 0; }
  .td .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  /* the target sheet sits outside .td, so it carries its own row spacing */
  #targetSheet .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 8px; }
  #targetSheet .row > .field { flex: 1 1 140px; min-width: 0; }
  #targetSheet .sub { margin: 16px 0 0; font: 600 12.5px/1.3 var(--font); color: var(--soft); }
  #targetSheet .t-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; margin-top: 20px; }
  #targetSheet .t-acts > .quiet:first-child { margin-right: auto; }
  .td .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
  .td .acts.flush { margin-top: 0; }
  /* a card's one number: Geist, tabular (DIRECTION 1, figure) */
  .td .big { font: 600 28px/1.05 var(--font); font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--ink); }
  .td .bar4 { display: block; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin-top: 8px; }
  .td .bar4 > i { display: block; height: 100%; background: var(--amber); border-radius: 2px; }
  .td .bar4.ink > i { background: var(--ink); }   /* a measure, not progress: graphite */
  .td a.plain { color: inherit; text-decoration: none; }
  .td a.plain:hover { text-decoration: underline; }
  .soon-i { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  /* a figure and its unit on one baseline: the number leads, the chart or meter under it is its evidence */
  .figline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  /* one surface of rows: the aside ("Today at a glance") and, in main, Questions of the day, Mistakes and Points.
     Each block keeps its id, head and fold and loses its own box; a hairline splits them (the first one lies on the
     surface's edge, whichever block is first). A block that moves out (the SAT into main in the final stretch) is a card again */
  .td-rows { padding: 0 var(--card-pad); border-radius: var(--radius-card); background: var(--raised); box-shadow: var(--shadow-1); }   /* a .card's surface */
  .td-rows > .card { padding: var(--card-pad) 0; border-radius: 0; background: none; box-shadow: none; border-top: 1px solid var(--line); }
  /* the first visible block's line tucks under the surface's top edge (the card edge is outside the box now), whichever
     block is first; clip is no scroll container, so the sticky Points sort still sticks, and layers mount on body */
  .td-rows { overflow: clip; }
  .td-rows > .card, .td-rows > .td-sinceblk { margin-top: -1px; }
  /* the aside's rows: the label left, the value right (21st's quick stats); only Score and Pace keep a big figure */
  .td-aside > .card { padding: 14px 0; }
  /* a folded row reads label, value, chevron: the chevron always shows (it is the row's one control at rest), the head
     opens it from anywhere; a value that the open row repeats at figure size (.rest) shows only while folded */
  .td-aside .cardfold.reveal { opacity: 1; }
  .td-aside .card-head { cursor: pointer; }
  .td-aside .card:not(.collapsed) .card-act > .rest { display: none; }
  .td-aside .card-head { margin-bottom: 8px; }
  .td-aside .card-head > h2 { flex: none; font: 600 14.5px/1.3 var(--font); letter-spacing: 0; }
  /* the value takes the room the label leaves and wraps inside it (at its " · "), so the fold chevron keeps its place */
  .td-aside .card-head { flex-wrap: nowrap; }
  .td-aside .card-act { flex: 1 1 auto; min-width: 0; justify-content: flex-end; text-align: right; }
  .td-aside .cardfold { margin-left: auto; }   /* a row with no value (Pace) still has its chevron at the right */
  .td .val.soft { color: var(--soft); }
  .td .val { margin: 0; font: 500 14.5px/1.3 var(--font); font-variant-numeric: tabular-nums; color: var(--ink); }
  /* the page's own fold row (fold()); ui.js's details.fold keeps its own look */
  button.fold { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 8px; padding: 8px 0; border: 0; border-top: 1px solid var(--line); background: none; cursor: pointer;
    font: 600 14px var(--font); color: var(--ink); text-align: left; }
  button.fold > svg { flex: none; margin-left: auto; color: var(--soft); }   /* caret_down, turned over while open (ui.css) */
  button.fold > span:first-child { flex: none; white-space: nowrap; }
  button.fold .meta { font-weight: 500; flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) { button.fold:hover > span:first-child { text-decoration: underline; text-underline-offset: 4px; } }
  /* a fold row and the day strip's links read as text, so their focus is the links' (ui.css): an amber-deep underline
     on a wash, never a box around words */
  button.fold:focus-visible, .td-glance a:focus-visible { outline: none; border-radius: 4px; background-color: var(--wash); }
  button.fold:focus-visible > span:first-child, .td-glance a:focus-visible { text-decoration: underline 2px var(--amber-deep); text-underline-offset: 4px; }

  /* the header: the greeting and the date on one row. Under 1280px the day's figures sit under it (from 1280 the
     aside's Today card has them), and what happened since yesterday is one fold row */
  /* one wrapping row: the greeting, the date and the name offer, then (under 1280px) the day strip, which shares the
     offer's line when it fits (a first run's two offers on one line, not three stacked lines); the risk line is its own */
  #hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 24px; }
  .td-head { display: contents; }
  #hero > .td-risk { flex: 1 1 100%; }
  .td-head .h1 { margin: 0; outline: none; }
  /* no name yet: a soft offer on the greeting's row (it read as a second heading under it) */
  .hero-name { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .hero-name > .quiet { gap: 6px; align-items: baseline; font: 500 14px var(--font); color: var(--soft); }
  .hero-name > .quiet > svg { position: relative; top: 2px; }   /* the text, not the pen, sits on the greeting's baseline */
  @media (hover: hover) and (pointer: fine) { .hero-name > .quiet:hover { color: var(--ink); } }
  .hero-name .field { max-width: 240px; }
  /* the day strip (under 1280px): the goal ring and the minutes, the plan, the SAT, on one line */
  .td-glance { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; min-height: 44px; }
  .td-glance .td-min { gap: 8px; }
  .td-glance .td-ring { --ring-w: 3px; }   /* a 28px ring keeps a thin track */
  .td-glance a { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; font: 500 14px var(--font); font-variant-numeric: tabular-nums; color: var(--ink); text-decoration: none; }
  @media (hover: hover) and (pointer: fine) { .td-glance a:hover { text-decoration: underline; text-underline-offset: 3px; } }
  /* an offer (no SAT date yet) reads like the name offer: soft, with its mark; the figures stay ink */
  .td-glance a.td-offer { color: var(--soft); }
  @media (hover: hover) and (pointer: fine) { .td-glance a.td-offer:hover { color: var(--ink); } }
  .td .streak > span[aria-hidden] { display: inline-flex; }
  /* the streak at risk: a warm callout, the one line read first */
  .td-risk { margin: 8px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 10px; background: var(--wash);
    font: 600 14.5px/1.4 var(--font); color: var(--ink); }
  .td-risk-i { display: inline-flex; color: var(--amber-deep); }
  .td-risk > span:nth-child(2) { flex: 1 1 200px; min-width: 0; }
  .td-since { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .td-since li { font: 400 14.5px/1.45 var(--font); color: var(--soft); }
  .td-since a { color: var(--ink); text-decoration: none; }
  .td-since a:hover { text-decoration: underline; }
  /* Since yesterday under 1280px: the first row of the surface under Up next */
  .td-sinceblk { border-top: 1px solid var(--line); }
  .td-sinceblk > button.fold { margin: 0; border-top: 0; min-height: 48px; }
  .td-sinceblk .td-since { padding: 0 0 12px; }
  .td-sinceblk > button.fold[aria-expanded="true"] > .meta { visibility: hidden; }   /* open, the facts are right under it */
  @media (max-width: 759px) { .td-glance .streak { display: none; } .td-glance a { min-height: 40px; } }   /* the phone bar has the streak */
  @media (min-width: 1280px) { .td-glance, #since { display: none; } }
  @media (max-width: 1279px) { #sum { display: none; } }
  /* the day's figure: the goal ring (today's minutes in it) beside what they are against the goal, then the plan */
  #sum .sum-day { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 14px; }
  #sum .sum-day.flat { grid-template-columns: minmax(0, 1fr); }
  #sum .td-ring { font-size: 14px; }
  #sum .sum-t .line { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  #sum .sum-t .line.soft { font-weight: 400; }
  /* the label left (14, ink), the value right (12.5, soft) */
  #sum .sum-row { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin: 4px 0 0; font: 500 14px/1.3 var(--font); color: var(--ink); }
  #sum .sum-row a { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--soft); text-decoration: none; }
  #sum .sum-row a:hover { color: var(--ink); text-decoration: underline; }
  #sum .sub { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }

  /* up next, the page's one raised card (.card.hero): the step as the featured task (20px title, its facts, the full
     Start), then the day's other tasks as compact rows, then one quiet footer line; the practice builder one tap away.
     Its own title recedes so the task is the largest thing in main */
  #next > .card-head > h2 { font: 600 14.5px/1.3 var(--font); letter-spacing: 0; color: var(--soft); }
  @media (max-width: 759px) { #next > .card-head > .card-act { order: 4; flex-basis: 100%; margin: -4px 0 0; } }
  #next .lead { display: grid; gap: 4px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  #next .lead-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  #next .lead-head .lead-t { margin: 0; }
  #next .lead-t { font: 600 20px/1.25 var(--font); letter-spacing: -.015em; color: var(--ink-strong, var(--ink)); }
  #next .lead .acts { margin-top: 12px; }
  .size-est:empty { display: none; }
  .size-help { margin: 8px 0 0; }
  .blocks { list-style: none; margin: 8px 0 0; padding: 0; display: grid; transition: opacity .15s; }
  .blocks.stale { opacity: .6; }
  .blocks li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; min-height: var(--row-h); padding: 4px 0; border-bottom: 1px solid var(--line); }
  .blocks li .no { font: 500 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--soft); }
  .blocks li .lb { font: 500 14.5px/1.35 var(--font); color: var(--ink); }
  .blocks li .lb .meta { display: block; margin-top: 2px; }
  .blocks li .qm { font: 500 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
  .blocks li.tot .lb { font-weight: 600; }
  .blocks li.then { border-bottom: 0; }
  .blocks li.then .lb { color: var(--soft); font-size: 12.5px; }
  .tchips { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; }
  .tchip { display: inline-flex; flex-direction: column; gap: 4px; font: 600 14px var(--font); color: var(--ink); }
  .tchip .tc-t { display: inline-flex; align-items: center; gap: 6px; }
  .tchip .mbar { width: 100%; }
  .q1 { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .q1-after { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
  /* Study, its size (one menu) and the estimate on one line; the quiet offers under it */
  /* .td-go, not .go: ui.css's .go is the way-forward Start (its glyph nudges), and this rule gave that Start a 12px top margin */
  .td-go { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; }
  .td-go + .size-help + .acts { margin-top: 8px; }
  #next .sess { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  /* the footer line: "2 more due · 1 done" left (each opens its list above it), "Or a practice session" right */
  .td-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; min-height: var(--row-h); border-top: 1px solid var(--line); }
  #due:empty + .td-foot { border-top: 0; }   /* under a lead block, whose own line is enough */
  .td-foot-l { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
  button.fold.inline { width: auto; margin: 0; padding: 9px 4px; border-top: 0; gap: 6px; font: 600 14px var(--font); }
  button.fold.inline > .meta { display: none; }    /* what is inside is its tooltip, and the list itself one tap away */
  button.fold.inline > svg { margin-left: 0; width: 14px; height: 14px; }
  .td-prac > svg { width: 14px; height: 14px; }
  .td-prac { margin-left: auto; }
  .note-ok { margin: 8px 0 0; font: 400 12.5px/1.4 var(--font); color: var(--soft); }
  .receipt { margin: 0 0 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .receipt p { margin: 4px 0 0; font: 400 14.5px/1.45 var(--font); color: var(--ink); }
  .receipt p.rfig { font-weight: 600; font-variant-numeric: tabular-nums; }
  .receipt .rdet { margin-top: 6px; }
  .receipt [data-fact] { cursor: pointer; }

  /* the day's tasks (#due inside Up next) */
  .due-sum { color: var(--soft); }
  .drow { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; min-height: var(--row-h); padding: 6px 0; border-top: 1px solid var(--line); }
  #due > .drow:first-child { border-top: 0; }
  .drow[data-status="skipped"] { opacity: .55; }
  /* the title and its (i) stay on one line; the title wraps inside its own box */
  .drow .dt { display: flex; align-items: center; gap: 6px; font: 600 14.5px/1.35 var(--font); color: var(--ink); }
  .drow .dt .why-q { margin-left: 0; }
  .drow .dm { margin-top: 2px; }
  .drow .dm > span, .td .nw > span { white-space: nowrap; }
  .drow .dwhy { grid-column: 2 / -1; margin: 0 0 4px; font: 400 12.5px/1.45 var(--font); color: var(--ink); }
  .drow .dwhy ul { margin: 0; padding-left: 18px; }
  .drow .dwhy p { margin: 0; }
  .drow .dres { margin: 2px 0 0; font: 500 12.5px var(--font); color: var(--ink); }
  .drow .dact { display: flex; align-items: center; justify-content: flex-end; gap: 4px; }
  .drow .dact .ibtn-sp { width: var(--ib, 36px); flex: none; }
  /* a compact row's Start: a quiet play button (an icon button, no fill at rest) */
  .drow .dplay { color: var(--ink-2); }
  .drow .dplay svg { width: 16px; height: 16px; }
  @media (hover: hover) and (pointer: fine) { .drow .dplay:hover { color: var(--ink); } }
  #next .pill.go > svg { width: 14px; height: 14px; }
  @media (max-width: 759px), (pointer: coarse) { .drow .dact .ibtn-sp { width: var(--touch); } .drow .dplay { --ib: var(--touch); } }
  /* on touch a row with a menu has its ? as the menu's first item */
  @media (pointer: coarse) { .drow[data-menu] .dt .why-q { display: none; } }
  /* rows with no ⋯ keep the ? on touch (it is the only way to the why): a faint glyph, not a ringed chip on every row */
  @media (pointer: coarse) { .drow .dt .why-q { box-shadow: none; color: var(--faint); padding: 0 2px; } }
  /* the featured task: the day's step when it is one of the rows */
  .drow.feat { align-items: start; padding: 2px 0 16px; }
  .drow.feat .dt { font: 600 20px/1.25 var(--font); letter-spacing: -.015em; color: var(--ink-strong, var(--ink)); }
  .drow.feat .dm { margin-top: 4px; }
  .drow .dgo { margin-top: 12px; }
  /* a row's kind: a 16px mark at the head of its facts */
  .drow .kind { display: inline-flex; vertical-align: -3px; margin-right: 6px; color: var(--soft); }
  .drow .kind svg { width: 16px; height: 16px; }
  /* the day's tasks all done: the all-clear drawing over one line */
  .td-clear { display: grid; justify-items: start; gap: 8px; padding: 4px 0 12px; }
  .td-clear .line { margin: 0; }
  /* goal met: a small check after the words, drawn once a day when the ring closes */
  .td-met { display: inline-flex; vertical-align: -2px; margin-left: 6px; color: var(--ink); }
  /* the first-use line: the start drawing beside it (not over it), its label on a line of its own and the names under it,
     so no name wraps alone onto a last line */
  #soon:has(.spot) { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 8px 20px; }
  #soon .row > .meta:first-child { flex: 1 1 100%; }
  .drow .dextra { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .drow .dextra:empty { display: none; }
  /* a row's status mark: round (a status, not a control) at the checkbox's size, edge and drawn check (ui.css), so a
     plan row's box and another row's mark read as one set */
  .st { position: relative; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--off-fg); }
  .st[data-s="done"], .st[data-s="marked"] { background: var(--amber) var(--check-ink) no-repeat center / 11px 11px; box-shadow: inset 0 0 0 1px var(--pill-edge); }
  .st[data-s="progress"] { box-shadow: inset 0 0 0 1.5px var(--ink); background: conic-gradient(var(--ink) calc(var(--f, 0) * 1turn), transparent 0); -webkit-mask: radial-gradient(circle, transparent 4px, #000 4.5px); mask: radial-gradient(circle, transparent 4px, #000 4.5px); }
  .st[data-s="skipped"] { box-shadow: none; }
  .st[data-s="skipped"]::after { content: ""; width: 10px; height: 2px; border-radius: 1px; background: var(--soft); }
  .st-box { display: inline-grid; place-items: center; width: 28px; height: 28px; }
  /* the plan row's checkbox is ui.css's drawn one (18px, the check grows in when ticked) */

  /* mistakes / review card */
  .mist-fig { display: flex; align-items: baseline; gap: 8px; }
  #mist .mist-fig + .meta { margin-top: 4px; }
  #mist .mlist { margin-top: 12px; }
  /* a mistake row (.mrow: plan-ui.js carries its own .trow): the dot, the label that starts its fix, a chevron;

  .wk-d { min-height: 1.2em; font: 500 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--soft); }
  .wk-d.up { color: var(--amber-deep); }
  /* the month fills its card: the cells stretch with the width (the user: a strip with half the width empty) */
  #cal .cal-grid { grid-template-columns: repeat(7, minmax(36px, 1fr)); max-width: 640px; }
  #cal .cal-d { height: auto; aspect-ratio: 1.7; min-height: 36px; }
  #cal .cal-head { max-width: 640px; }
  @media (max-width: 759px) { .td .cal-metric .seg { display: flex; } .td .cal-metric .seg > * { flex: 1 1 0; padding: 0 6px; font-size: 12.5px; } }
  /* the day window (a sheet) */
  .day-detail { padding: 12px 0 0; border-top: 1px solid var(--line); background: none; }

  .dd-sheet .dd-t { margin: 0; font: 600 16px/1.3 var(--font); }
  /* the day's figures and skills sit on the sheet, not in tiles inside it (no boxes in boxes) */
  .dd-figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .dd-fig b { display: block; font: 600 20px/1.2 var(--font); font-variant-numeric: tabular-nums; color: var(--ink-strong, var(--ink)); }
  .dd-fig span { font: 500 12.5px var(--font); color: var(--soft); }
  .dd-blk { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .dd-blk h3 { margin: 0 0 8px; font: 600 12.5px/1.3 var(--font); color: var(--soft); }
  .dd-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }

  .dd-sk .nm { flex: 1; min-width: 0; font: 500 14.5px/1.3 var(--font); }
  .dd-sk b { flex: none; font: 600 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--soft); }

  .day-detail ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }

  /* challenge, words, tests */
  .board { list-style: none; margin: 8px 0 0; padding: 0; }
  .board li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; min-height: 36px; border-top: 1px solid var(--line); font: 500 14.5px var(--font); }
  .board li.you { background: var(--wash); padding-left: 6px; font-weight: 600; }   /* your row: wash and 600, no stripe */
  .board li .meta { color: var(--ink); }
  .slots10 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }

  .slots10 .fpct { font: 500 11.5px var(--font); font-variant-numeric: tabular-nums; color: var(--soft); }
  .slot-detail:empty { display: none; }
  .slot-detail { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .slot-detail .line { margin: 0; }
  .td .blk { margin-top: 12px; }
  .out-row { justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--line); font: 400 14.5px var(--font); }
  /* the latest sitting in full, the older ones as rows */
  .tcard { display: grid; gap: 8px; align-content: start; }

  .tests-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .tests-grid .fold-body { padding: 8px 0 4px; }
  .mchips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .mchips button { min-width: 28px; height: 26px; padding: 0 4px; border-radius: 6px; border: 0; background: var(--ink); color: var(--on-ink); font: 500 12.5px var(--font); font-variant-numeric: tabular-nums; cursor: pointer; }
  .mchips button.blank { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--faint); }
  .mchips-key { display: flex; align-items: center; gap: 6px; }
  .mchips-key i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--ink); }

  @media (max-width: 759px) {
    .qd-slot .opt { min-height: 56px; }
    /* touch targets of at least 40px */
    .mrow button.tl { display: inline-flex; align-items: center; min-height: 40px; }

</style>

<script>UI.shell({ page: 'today', now: false, nowBlock: false, ownPrimary: true });</script>
<script>
(() => {
  'use strict';
  const h = UI.h, $ = id => document.getElementById(id);
  const S = { t: null, ins: null, insBy: {}, q: null, cal: null, chal: null, board: null, hist: null, histMore: [], calMonth: null, calDay: null,
              qday: null, gainSort: 'points', mistView: 'type', causePick: null, calMetric: 'minutes' };
  const api = (p, o) => UI.api(p, o);
  const post = (p, body) => api(p, { method: 'POST', body: body || {} });
  const put = (p, body) => api(p, { method: 'PUT', body });
  const n = x => UI.num(x);
  const pl = (k, one, many) => `${n(k)} ${k === 1 ? one : (many || one + 's')}`;
  const pct = x => `${Math.round((x > 1 ? x / 100 : x || 0) * 100)}%`;
  // any skill's name, Math or Reading and Writing (an R&W slug never prints raw)
  const TOP = slug => UI.topicName ? UI.topicName(slug) : (UI.TOPIC && UI.TOPIC[slug] || {}).short || String(slug || '').replace(/_/g, ' ');
  const SUBJ = (s, short = true) => UI.subjectLabel ? UI.subjectLabel(s, short) : (s === 'rw' ? 'R&W' : 'Math');
  const subjOf = slug => UI.subjectOf ? UI.subjectOf(slug) : (/^rw[_.]/.test(String(slug || '')) ? 'rw' : 'math');
  // a section's clock: R&W 27 questions in 32 min (71 s each), Math 22 in 35 (95 s each)
  const PACE = { math: { n: 22, s: 2100, q: 95 }, rw: { n: 27, s: 1920, q: 71 } };
  const DSHORT = d => ((UI.DOMAINS || []).find(x => x[0] === d) || [d, d])[1];
  const sdur = s => UI.dur((s || 0) / 60);
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
  const narrow = () => matchMedia('(max-width: 1079px)').matches;
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
  const localDay = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const addDays = (iso, k) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + k); return d.toISOString().slice(0, 10); };
  const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
  const today = () => (S.t && S.t.days && S.t.days.today) || localDay();
  const flame = () => h('span', { html: UI.svg(UI.ICON.flame, 16), 'aria-hidden': 'true' });   // .streak.on (ui.css) fills it

  /* ---------------------------------------------------------------- small builders */
  function btn(label, onClick, cls = 'btn') {
    const b = h('button', { type: 'button', class: cls, text: label });
    if (onClick) b.addEventListener('click', e => run(b, () => onClick(e, b)));
    return b;
  }
  const quiet = (label, onClick) => btn(label, onClick, 'quiet');
  // a start that fails says so in its own card, under its controls, which keep their values (§3a)
  const inCard = (host, fn) => async () => {
    const old = host.querySelector(':scope > .field-err');
    if (old) old.remove();
    try { await fn(); } catch (e) {
      if (e && e.name === 'AbortError') return;
      host.append(h('p', { class: 'field-err', role: 'alert', text: errText(e) }));
    }
  };
  const pill = (label, onClick) => btn(label, onClick, 'pill');
  const link = (label, href, cls = 'quiet') => h('a', { class: cls, href, text: label });
  const line = (text, cls = '') => h('p', { class: 'line' + (cls ? ' ' + cls : ''), text });
  const meta = text => h('p', { class: 'meta', text });
  const sub = text => h('p', { class: 'sub', text });
  const bar4 = (f, cls) => h('span', { class: 'bar4' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' }, h('i', { style: `width:${Math.max(0, Math.min(100, Math.round((f || 0) * 100)))}%` }));
  const join = (...xs) => xs.flat().filter(Boolean).join(' · ');
  // decision 7: a server line's zero parts ("0 check-ins", "0 of 2") say nothing, so they go

    const right = nw(join(counts, w.done && 'done for today'), 'val');
    if (why) right.append(UI.why(why, { about: 'these words' }));
    const kids = [];
    if (w.new_goal > 0 && UI.meter) kids.push(UI.meter(null, { label: 'New words', value: w.new_today || 0, max: w.new_goal, ticks: Math.min(w.new_goal, 12) }).el);
    const rwDay = S.q && (S.q.slots || []).some(s => s.slot === 'rw:wic');
    kids.push(h('div', { class: 'acts' }, !w.done && w.start && !dueRow_ ? btn('Start', () => go(w.start), 'btn sm') : null,
      link('All words', '/words/'), rwDay ? link('Word of the day', '#qotd') : null));
    card('words', 'Words', right, kids);
  }

  /* ---------------------------------------------------------------- the calendar's day, from elsewhere on the page */
  function showDay(day) {
    S.calDay = day;
    if (S.cal && S.cal.month && S.cal.month !== day.slice(0, 7)) { S.calMonth = day.slice(0, 7); S.openDayAfter = day; LOADERS.calendar(); } else { paintCal(); openDay(day); }
  }

  /* ---------------------------------------------------------------- recent tests (§11, T16) */
  // test sittings only: until /api/history applies kind=tests (R26) it lists every finished session
  const TEST_KINDS = new Set(['full', 'mock', 'paper', 'module', 'custom', 'diagnostic', 'twin', 'section']);
  // a row's name with its section first ("Reading and Writing · Full section #2"); a full SAT names both itself
  const testName = (r, short) => {
    if (r.kind === 'full') return `Full SAT${r.full && r.full.number ? ` #${r.full.number}` : ''}`;
    const base = UI.KIND && UI.KIND.label ? UI.KIND.label(r) : cap(r.kind);
    return join(['math', 'rw'].includes(r.subject) ? UI.subjectLabel(r.subject, short) : null, r.seq && !/#\d/.test(base) ? `${base} #${r.seq}` : base);
  };
  function paintTests() {
    const all = [...((S.hist && S.hist.sessions) || []), ...S.histMore].filter(r => TEST_KINDS.has(r.kind));
    const paged = !!(S.hist && S.hist.next_offset !== undefined);
    const rows = paged ? all : all.slice(0, S.testsShown || 6);
    const open = S.t && S.t.open && S.t.open.test;
    const total = S.hist && (S.hist.total ?? (paged ? null : all.length));
    const right = link(`All tests${total ? ` (${n(total)})` : ''}`, '/tests/');
    soon('tests', !rows.length && !open);
    if (!rows.length && !open) {
      // the module and Add a score are the Score card's "Get a score"; the full section is only here, as one quiet offer
      card('tests', 'Recent tests', right, h('p', { class: 'line soft' }, 'No tests yet'),
        h('div', { class: 'acts' }, quiet(SECTION, () => go({ path: '/mock/new', body: { full: true } }))));
      return;
    }
    const grid = h('div', { class: 'tests-grid' });
    if (open) {
      const out = open.timed && open.seconds_left === 0;
      grid.append(h('div', { class: 'tcard' }, h('p', { class: 'k', text: 'In progress' }), h('p', { class: 'line tl', text: join(
        ['math', 'rw'].includes(open.subject) ? UI.subjectLabel(open.subject) : null,
        open.section ? `${open.full ? 'Full SAT' : 'Section'} · module ${open.module}` : cap(open.kind)) }),
        meta(join(open.timed ? (out ? 'Time’s up' : `${UI.mmss(open.seconds_left)} left`) : 'Untimed', `${open.answered} of ${open.asked} answered`)),
        h('div', { class: 'acts' }, h('a', { class: 'btn', href: `/test/?s=${encodeURIComponent(open.id)}`, text: out ? (open.section && open.module === 1 ? 'Continue to module 2' : 'See results') : 'Resume' }))));
    }
    // the latest sitting in full; the older ones are one row each (date, kind, band) that opens to the same card
    rows.filter(r => r.finished).forEach((r, i) => {
      let body;
      if (UI.sittingCard) { body = h('div', {}); UI.sittingCard(body, r.kind === 'full' ? r : Object.assign({}, r, { kind_label: testName(r), seq: null }), {}); } else body = testCard(r, all);
      if (!i) { grid.append(body); return; }
      // the day as the latest card says it (results-ui's "Today" / "Yesterday"), so one day reads one way
      const t = new Date(r.finished || r.started), ago = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(t).setHours(0, 0, 0, 0)) / 864e5);
      const said = join(ago === 0 ? 'Today' : ago === 1 ? 'Yesterday' : UI.date(t), testName(r, true));   // a row is tight: "R&W"
      grid.append(h('div', {}, ...fold(null, said, r.gated ? '' : r.estimate ? `${r.estimate.low}–${r.estimate.high}` : r.asked ? `${r.right}/${r.asked} right` : '', body)));
    });
    const kids = [grid];
    if (paged ? S.hist.next_offset : all.length > rows.length) kids.push(h('div', { class: 'acts' }, btn('Show 6 more', async () => {
      if (!paged) { S.testsShown = rows.length + 6; paintTests(); return; }
      const more = await api(`/history?kind=tests&all=1&limit=6&offset=${S.hist.next_offset}`);
      S.histMore.push(...(more.sessions || [])); S.hist.next_offset = more.next_offset; paintTests();
    })));
    card('tests', 'Recent tests', right, kids);
  }
  function testCard(r, all) {
    const el = h('div', { class: 'tcard' });
    const asked = r.asked || 0, misses = r.misses ?? (asked - (r.right || 0));
    el.append(meta(join(UI.date(r.finished || r.started), testName(r), asked && pl(asked, 'question'))));
    if (r.gated) {
      el.append(h('a', { class: 'btn', href: `/diagnostic/signup.html?s=${encodeURIComponent(r.id)}`, text: 'Sign up to see your results' }));
      return el;
    }
    if (r.estimate) el.append(h('p', { class: 'band', text: `${r.estimate.low}–${r.estimate.high}` }));
    if (r.route) el.append(h('span', { class: 'badge soft', text: r.route === 'up' ? 'Harder module 2' : `Easier module 2${r.capped ? ` · capped ${r.capped}` : ''}` }));
    el.append(meta(join(`${r.right}/${asked} right`, r.minutes && `${r.minutes} min`)));
    // T16: against the previous sitting of the same kind, and the SAT total with the student's R&W
    const prev = (all || []).find(x => x !== r && x.kind === r.kind && x.estimate && x.finished < r.finished);
    const mid = e => (e.low + e.high) / 2;
    // a total is never a section's range plus a typed number (DESIGN §3): the Score card shows the total
    if (r.estimate && prev) el.append(meta(`${mid(r.estimate) >= mid(prev.estimate) ? '+' : '−'}${Math.abs(Math.round(mid(r.estimate) - mid(prev.estimate)))} vs ${UI.date(prev.finished)}`));
    if (r.causes && r.causes.total) el.append(line(`Lost ${r.causes.total}: ` + Object.keys(CAUSE).filter(k => r.causes.by && r.causes.by[k]).map(k => `${r.causes.by[k]} ${CAUSE[k].toLowerCase()}`).join(' · '), 'soft'));
    if (r.worth && r.worth.text) el.append(line(r.worth.text, 'soft'));
    (r.time || []).forEach(t => el.append(meta(t.text || join(`M${t.module} ${UI.mmss(t.used)} used`, t.ran_out_at && `ran out at Q${t.ran_out_at}`, t.blank && `${t.blank} blank at time-up`))));
    if (r.estimate && UI.scale) { const f = h('div', {}); UI.scale(f, { band: r.estimate, target: S.t && S.t.profile.target, compact: true, min: 200, max: 800 }); el.append(f); }
    (r.modules || []).forEach(m => {
      const miss = [...(m.missed || m.wrong || []).map(q => [q, 'wrong']), ...(m.blank || []).map(q => [q, 'blank'])].sort((a, b) => a[0] - b[0]);
      if (!miss.length) return;
      const row = h('div', { class: 'mchips' }, h('span', { class: 'meta', text: `M${m.n || m.module}` }));
      miss.slice(0, 10).forEach(([q, kind]) => {
        const b = h('button', { type: 'button', class: kind === 'blank' ? 'blank' : '', text: String(q), 'aria-label': `Module ${m.n || m.module} question ${q}, ${kind}` });
        UI.menu.bind(b, [{ label: `Review Q${q}`, href: `/results/report/?id=${encodeURIComponent(r.id)}&q=M${m.n || m.module}-${q}` },
          { label: 'Twin', onClick: () => twinSheet({ from_session: r.id, only: [`m${m.n || m.module}q${String(q).padStart(2, '0')}`], each: 1, source: 'twin', parent: r.id }, null, 'Twin') }]);
        row.append(b);
      });
      if (miss.length > 10) row.append(h('span', { class: 'meta', text: `+${miss.length - 10}` }));
      el.append(row);
    });
    if ((r.modules || []).length) el.append(h('p', { class: 'meta mchips-key' }, h('i', { 'aria-hidden': 'true' }), 'wrong', h('i', { class: 'blank', 'aria-hidden': 'true' }), 'blank'));
    const acts = h('div', { class: 'acts' });
    const old = r.finished && dayDiff(String(r.finished).slice(0, 10), today()) >= 3;
    const twinB = btn('Twin test', () => go({ path: '/mock/new', body: { kind: 'twin', twin_of: r.id } }));
    if (old || misses >= 5) acts.append(twinB);
    acts.append(h('a', { class: 'btn', href: `/results/report/?id=${encodeURIComponent(r.id)}`, text: 'Review' }));
    if (misses > 0) acts.append(btn(`Fix ${misses}`, () => drill({ from_session: r.id })));
    else acts.append(h('span', { class: 'meta', text: 'All right' }));
    if (!(old || misses >= 5)) acts.append(twinB);
    acts.append(quiet('New one like this', () => go({ path: '/mock/new', body: { full: r.kind === 'mock' } })));
    el.append(acts);
    return el;
  }

  /* ---------------------------------------------------------------- keys, rollover, return (T20, §12) */
  function cards() {
    return [...document.querySelectorAll('#today section, #today > header')].filter(s => s.offsetParent !== null)
      .sort((a, b) => { const A = a.getBoundingClientRect(), B = b.getBoundingClientRect(); return Math.abs(A.top - B.top) > 8 ? A.top - B.top : A.left - B.left; });
  }
  function moveCard(k) {
    const list = cards();
    let cur = list.findIndex(s => s.contains(document.activeElement));
    // nothing focused: the card at the top of the view is the current one, so J from the top goes to the second card
    if (cur < 0) cur = Math.max(0, list.filter(s => s.getBoundingClientRect().top <= 80).length - 1);
    const j = Math.max(0, Math.min(list.length - 1, cur + k));
    const hd = list[j].querySelector('h1, h2');
    if (hd) { hd.focus({ preventScroll: true }); hd.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  }
  UI.keys.register('today', {
    J: { does: 'Next card', run: () => moveCard(1) },
    K: { does: 'Previous card', run: () => moveCard(-1) },
    T: { does: 'Twin', run: () => { const x = S.t && S.t.traps && (S.t.traps.top || [])[0]; if (x) twinSheet({ pool: 'redo', ids: [x.id], count: 1, source: 'try', subject: x.subject || subjOf(x.topic) }, x.label); } },
    Enter: { does: 'Run the focused card’s main action', when: () => document.activeElement && document.activeElement.matches('#today .card-head > h2, #today h1'),
      run: () => { const c = document.activeElement.closest('section, header'); const b = c && (c.querySelector('.pill') || c.querySelector('.btn')); if (b) b.click(); } },
  }, { label: 'Today' });

  let day0 = localDay();
  setInterval(() => {
    if (localDay() === day0) return;
    day0 = localDay();
    S.qday = null; S.calMonth = null; S.calDay = null; SZ.sel = null; SZ.subject = null; SZ.preview = null; SZ.q1 = null; SZ.sid = null; S.chalRev = null;
    UI.toast('It’s a new day. Here are today’s questions.', { icon: 'today' });   // a note that leaves by itself
    refresh();
  }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(['today', 'insights', 'chal', 'tests']); });
  addEventListener('pageshow', e => { if (e.persisted) refresh(['today', 'insights', 'chal', 'tests']); });

  /* ---------------------------------------------------------------- go */
  const dq = new URLSearchParams(location.search).get('day');
  if (dq) {
    const t0 = localDay();
    if (/^\d{4}-\d{2}-\d{2}$/.test(dq) && dq < t0 && dayDiff(dq, t0) <= 30) S.qday = dq;
    else if (dq !== t0) S.qNote = 'That day is out of range. Here is today’s.';
  }
  firstPaint();
  // the SAT dates come with the shell; when it lands after /api/today, the SAT card and the plan builder get them (they showed none)
  let shellDates = -1;
  if (UI.onShell) UI.onShell(sh => {
    const k = ((sh || {}).dates || []).length;
    if (k === shellDates) return;
    shellDates = k;
    if (S.t) paintExam();
  });
  LOADERS.today();
  LOADERS.insights();
  LOADERS.qotd();
  LOADERS.calendar();
  LOADERS.chal();
  LOADERS.tests();
})();
</script>
</body>
</html>
