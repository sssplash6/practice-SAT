<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today · SAT Freshman</title>
<meta name="description" content="Free SAT Math practice that never runs out and never repeats.">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/runner.css">
<style>
  /* Today (spec 3.2, today.md T1-T20, R27, R30). Every shared piece (cards, seg, chips,
     sheets, charts, the question) is ui.css / runner.css; these rules lay the page out. */
  .td { padding-bottom: 110px; }
  .td :where(*:not(.q-table)) { min-width: 0; }
  .td-upd { margin: 0 0 10px; padding-top: 6px; border-top: 1px solid var(--line); font: 500 11px var(--mono); color: var(--soft); }

  /* the grid: DOM order is the phone order; order + span place the wider layouts */
  #today { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 760px) {
    #today { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #today > section { grid-column: span 1; }
    #hero, #next, #qotd, #gain, #study, #plan, #tests { grid-column: span 2 !important; }
    #due { grid-column: span 2 !important; }
    #hero { order: 1; } #next { order: 2; } #due { order: 2; } #qotd { order: 3; } #gain { order: 4; } #mist { order: 5; } #exam { order: 6; }
    #score { order: 7; } #pace { order: 8; } #study { order: 9; } #chal { order: 10; } #words { order: 11; } #plan { order: 12; } #tests { order: 13; }
    #today.stretch #exam { order: 1; grid-column: span 2; }
  }
  @media (min-width: 1080px) {
    #today { grid-template-columns: repeat(12, minmax(0, 1fr)); }
    #hero, #qotd, #tests { grid-column: span 12 !important; }
    #next, #gain, #study, #plan { grid-column: span 8 !important; }
    #mist, #exam, #chal, #words { grid-column: span 4 !important; }
    #score, #pace { grid-column: span 6 !important; }
    #next { grid-row: span 2; }
    #mist, #due { grid-column: span 4 !important; }
    #hero { order: 1; } #next { order: 2; } #mist { order: 3; } #due { order: 4; } #gain { order: 5; } #exam { order: 6; } #qotd { order: 7; }
    #score { order: 8; } #pace { order: 9; } #study { order: 10; } #chal { order: 11; } #plan { order: 12; } #words { order: 13; } #tests { order: 14; }
    #today.stretch #exam { order: 2; grid-column: span 12 !important; }
    #today.stretch #next { order: 3; } #today.stretch #mist { order: 4; } #today.stretch #due { order: 4; }
    #today.stretch #gain { order: 5; grid-column: span 12 !important; }
    #today.examday #next { grid-column: span 12 !important; grid-row: auto; }
    #today.examday #gain { order: 4; grid-column: span 8 !important; } #today.examday #mist { order: 5; }
  }

  .td .card-head { justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .td .card-head > .k { flex: 1 1 auto; margin: 0; outline-offset: 4px; }
  .td .card-head .card-act { margin-left: auto; }
  .td .sub, .td-takes .sub { margin: 18px 0 8px; font: 600 11px/1.3 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .td .sub:first-child, .td-takes .sub:first-child { margin-top: 0; }
  .td .line, .td-takes .line { margin: 6px 0 0; font: 400 14.5px/1.45 var(--font); color: var(--ink); text-wrap: pretty; }
  .td .line.soft, .td-takes .line.soft { color: var(--soft); font-size: 13.5px; }
  .td .row, .td-takes .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .td .acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .td .big { font: 600 44px/1 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; color: var(--ink); }
  .td .bar4 { display: block; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin-top: 6px; }
  .td .bar4 > i { display: block; height: 100%; background: var(--amber); border-radius: 2px; }
  .td hr.sep { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  .td .tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 6px; background: var(--tile-2); font: 600 11px/1.6 var(--font); color: var(--ink); }
  .td .tag.ink { background: var(--ink); color: var(--on-ink); }
  .td a.plain { color: inherit; text-decoration: none; }
  .td a.plain:hover { text-decoration: underline; }

  /* hero */
  #hero { padding: 4px 0 0; }
  .hero-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  .hero-top .h1 { margin: 4px 0 0; outline: none; }
  .hero-name { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .hero-name .field { max-width: 240px; }
  .hero-stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .hero-stats a { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 16px; background: var(--tile);
    font: 600 13px var(--font); color: var(--ink); text-decoration: none; }
  .hero-stats a.bold { background: var(--ink); color: var(--on-ink); }
  .hero-stats svg { width: 16px; height: 16px; }
  .hero-stats .on svg .flame { fill: var(--amber); stroke: var(--amber-deep); }
  .brief { margin: 10px 0 0; font: 400 15px/1.5 var(--font); color: var(--soft); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .brief a { color: var(--ink); text-decoration: none; }
  .brief a:hover { text-decoration: underline; }
  .brief .sep { color: var(--faint); }
  .brief .risk { color: var(--ink); font-weight: 600; }

  /* up next */
  #next { background: var(--wash); }
  #next .lead { display: grid; gap: 6px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid color-mix(in srgb, var(--amber) 25%, transparent); }
  #next .lead-t { font: 700 20px/1.25 var(--font); letter-spacing: -.01em; color: var(--ink); }
  .size { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  .size .seg button { min-height: 36px; }
  /* the streak: flame and number centred on one line, the number in the text font (the user: misaligned) */
  .streak { display: inline-flex; align-items: center; gap: 6px; font: 600 14px/1 var(--font); font-variant-numeric: tabular-nums; }
  .streak > span[aria-hidden] { display: inline-flex; }
  .streak svg { display: block; width: 16px; height: 16px; }
  .why-i { appearance: none; border: 1.5px solid var(--faint); background: none; color: var(--soft); width: 18px; height: 18px; border-radius: 50%;
    font: 600 11px/1 var(--font); font-style: italic; margin-left: 8px; vertical-align: 2px; cursor: pointer; padding: 0; }
  .why-i[aria-expanded="true"] { border-color: var(--ink); color: var(--ink); }
  .exam-sum { margin: 10px 0 0; font-size: 16px; }
  .exam-det { margin-top: 12px; }
  .size > * { margin: 0; }
  .size-picks { display: flex; align-items: center; }
  .size-picks .chips { gap: 6px; align-items: center; margin: 0; }
  .size-help { margin: 6px 0 0; }
  .sess-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 14px; }
  .reason { margin: 16px 0 0; font: 500 15px/1.45 var(--font); color: var(--ink); }
  .blocks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 2px; transition: opacity .15s; }
  .blocks.stale { opacity: .6; }
  .blocks li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 40px; padding: 4px 0; border-bottom: 1px solid color-mix(in srgb, var(--amber) 16%, transparent); }
  .blocks li .no { font: 500 13px var(--mono); color: var(--soft); }
  .blocks li .lb { font: 500 14.5px/1.35 var(--font); color: var(--ink); }
  .blocks li .lb .meta { display: block; margin-top: 2px; }
  .blocks li .qm { font: 500 13px var(--mono); color: var(--ink); white-space: nowrap; }
  .blocks li.tot .lb { font-weight: 700; }
  .blocks li.then { border-bottom: 0; }
  .blocks li.then .lb { color: var(--soft); font-size: 13.5px; }
  .tchips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .tchip { display: inline-flex; flex-direction: column; gap: 4px; padding: 7px 11px 6px; border-radius: 10px; background: var(--paper); font: 600 13.5px var(--font); color: var(--ink); }
  .tchip .tc-t { display: inline-flex; align-items: center; gap: 6px; }
  .tchip .mbar { width: 100%; }
  .q1 { margin-top: 16px; padding: 16px 18px; border-radius: 12px; background: var(--paper); }
  .q1-after { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 12px; }
  .go { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-top: 18px; }
  .note-ok { margin: 10px 0 0; font: 400 13px/1.4 var(--font); color: var(--soft); }
  .receipt { margin: 0 0 18px; padding: 14px 16px; border-radius: 12px; background: var(--paper); }
  .receipt p { margin: 4px 0 0; font: 400 14.5px/1.45 var(--font); color: var(--ink); }
  .receipt p.fig { font: 600 16px var(--mono); }

  /* due today */
  .due { margin-top: 22px; padding-top: 18px; border-top: 1px solid color-mix(in srgb, var(--amber) 25%, transparent); }
  #due > .due { margin-top: 0; padding-top: 0; border-top: 0; }
  .due-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; }
  .due-head .k { margin: 0; }
  .due-head .meta { color: var(--ink); }
  .drow { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid color-mix(in srgb, var(--amber) 14%, transparent); }
  .drow:last-child { border-bottom: 0; }
  .drow[data-status="skipped"] { opacity: .55; }
  .drow .dt { font: 600 15px/1.35 var(--font); color: var(--ink); }
  .drow .dt .tag { margin-left: 6px; vertical-align: 1px; }
  .drow .dm { margin-top: 2px; }
  .drow .dwhy { margin: 6px 0 0; font: 400 13.5px/1.45 var(--font); color: var(--ink); }
  .drow .dres { margin: 4px 0 0; font: 500 13px var(--mono); color: var(--ink); }
  .drow .dact { display: flex; align-items: center; gap: 6px; }
  .drow .dextra { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .st { position: relative; display: inline-grid; place-items: center; width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .st[data-s="done"], .st[data-s="marked"] { background: var(--amber); box-shadow: none; }
  .st[data-s="done"]::after, .st[data-s="marked"]::after { content: ""; width: 9px; height: 5px; border: solid var(--ink-deep); border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
  .st[data-s="progress"] { box-shadow: inset 0 0 0 1.5px var(--ink); background: conic-gradient(var(--ink) calc(var(--f, 0) * 1turn), transparent 0); -webkit-mask: radial-gradient(circle, transparent 5px, #000 5.5px); mask: radial-gradient(circle, transparent 5px, #000 5.5px); }
  .st[data-s="skipped"] { box-shadow: none; }
  .st[data-s="skipped"]::after { content: ""; width: 12px; height: 2px; background: var(--soft); }
  .st-box { display: inline-grid; place-items: center; width: 28px; height: 28px; }
  .st-box input { width: 20px; height: 20px; accent-color: var(--amber); margin: 0; }

  /* mistakes / review card */
  .mist-fig { display: flex; align-items: baseline; gap: 10px; }
  .trow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .trow:last-child { border-bottom: 0; }
  .trow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
  .trow button.tl { all: unset; cursor: pointer; font: 500 14px/1.35 var(--font); color: var(--ink); }
  .trow button.tl:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 4px; }
  .trow .tm { grid-column: 2 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .trow .tm .glyph { width: 16px; height: 16px; }
  .habit { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .habit .hn { font: 600 15px/1.35 var(--font); }
  .habit .hn.broken { text-decoration: line-through; }
  .habit .tell { font-style: italic; }

  /* questions of the day */
  .qd-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .qd-tabs { display: none; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .qd-tabs button { display: inline-flex; align-items: center; gap: 8px; min-height: var(--ctl); padding: 0 12px; border-radius: 10px; border: 0; background: var(--tile-2);
    font: 600 14px var(--font); color: var(--ink); cursor: pointer; }
  .qd-tabs button[aria-selected="true"] { background: var(--ink); color: var(--on-ink); }
  .qd-rowk { margin: 0 0 10px; }
  .qd-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .qd-row + .qd-rowk { margin-top: 28px; }
  .qd-slot { display: grid; align-content: start; gap: 10px; padding: 18px; border-radius: 12px; background: var(--paper); }
  .qd-lab { display: flex; align-items: center; gap: 8px; }
  .mk { position: relative; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); flex: none; font: 700 10px/1 var(--font); }
  .mk[data-m="right"] { background: var(--amber); box-shadow: none; color: var(--ink-deep); }
  .mk[data-m="wrong"] { background: var(--ink); box-shadow: none; color: var(--on-ink); }
  .mk[data-rep]::after { content: "↻"; position: absolute; right: -6px; top: -7px; font: 700 10px var(--font); color: var(--ink); }
  .qd-text { margin: 0; font: 400 var(--q-opt)/1.55 var(--serif); color: var(--ink); }
  .qd-after { display: grid; gap: 8px; }
  .qd-after .line { margin: 0; }
  .qd-past { display: flex; align-items: center; gap: 12px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
  .qd-past .quiet { margin: 0; flex: none; }
  .qd-days { flex: 1; min-width: 0; display: flex; justify-content: flex-end; gap: 6px; overflow: hidden; }
  .qd-days .qd-day { flex: none; width: 44px; }
  .qd-days .qd-day.mon { box-shadow: inset 2px 0 0 var(--line); }
  .qd-past .k { margin-right: 4px; }
  .qd-day { display: inline-grid; justify-items: center; gap: 4px; min-width: 44px; min-height: 44px; padding: 5px 6px; border: 0; border-radius: 10px; background: var(--tile-2); cursor: pointer; font: 600 12px var(--font); color: var(--ink); }
  .qd-day[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
  .qd-day .mm { display: flex; gap: 3px; }
  .qd-day .mm i { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.2px var(--faint); }
  .qd-day .mm i[data-m="right"] { background: var(--amber); box-shadow: none; }
  .qd-day .mm i[data-m="wrong"] { background: var(--ink); box-shadow: none; }
  .qd-arch { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 14px; }
  @media (max-width: 1079px) {
    .qd-tabs { display: flex; }
    .qd-rowk { display: none; }
    .qd-row { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .qd-row + .qd-rowk { margin-top: 0; }
    .qd-slot:not(.on) { display: none; }
    .qd-slot { padding: 0; background: none; touch-action: pan-y; }
    .qd-lab .mk { display: none; }
  }

  /* points, pace, score */
  .gain-head { position: sticky; top: calc(var(--bar, 64px) + 4px); z-index: 2; background: var(--tile); padding: 6px 0 10px; margin: -6px 0 6px; }
  @media (min-width: 1080px) { .gain-head { top: 8px; } }
  .gain-rows .skill-row { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .gain-rows .skill-row:last-child { border-bottom: 0; }
  .extra-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .extra-row b { font: 600 18px var(--mono); }
  .dom-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .dom-row .mbar { width: 100%; }
  .score-band { font: 600 48px/1 var(--mono); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .causes-fix { margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: var(--paper); }
  .pace-fig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
  .pace-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .pace-row:last-child { border-bottom: 0; }

  /* exam */
  .exam-trig { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; border-radius: 8px; border: 0; background: var(--tile-2); font: 600 13.5px var(--font); color: var(--ink); cursor: pointer; }
  .exam-cap { font: 600 17px/1.35 var(--font); color: var(--ink); }
  .td .countdown { margin-top: 14px; }
  .td .countdown .num { font-size: 28px; }
  .check-list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
  .check-list label { display: flex; align-items: center; gap: 10px; min-height: 40px; font: 400 14px/1.35 var(--font); cursor: pointer; }
  .check-list input { width: 18px; height: 18px; accent-color: var(--amber); flex: none; }
  .ready-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }

  /* study */
  .figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 759px) { .figs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .fig { padding: 12px 14px; border-radius: 10px; background: var(--paper); }
  .fig .v { font: 600 24px/1.1 var(--mono); }
  .fig .k { display: block; margin-top: 4px; }
  /* the day detail is the calendar's caption, under it (the user: it floated beside the controls) */
  .cal-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; margin-top: 18px; }
  .day-detail { padding: 14px 0 0; border-top: 1px solid var(--line); background: none; }
  .day-detail[hidden] { display: none; }
  .day-detail .dd-t { font: 600 15px/1.35 var(--font); }
  .day-detail ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }

  /* challenge, words, plan, tests */
  .board { list-style: none; margin: 10px 0 0; padding: 0; }
  .board li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 36px; border-bottom: 1px solid var(--line); font: 500 14px var(--font); }
  .board li.you { background: var(--wash); box-shadow: inset 3px 0 0 var(--amber); padding-left: 6px; }
  .board li .meta { color: var(--ink); }
  .slots10 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .slots10 > div { display: grid; justify-items: center; gap: 4px; }
  .slots10 .cell[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
  .slots10 .fpct { font: 500 10px var(--mono); color: var(--soft); }
  .slot-detail:empty { display: none; }
  .slot-detail { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--paper); }
  .slot-detail .line { margin: 0; }
  .td .blk { margin-top: 18px; }
  .out-row { justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--line); font: 400 13.5px var(--font); }
  .wk-hd { all: unset; display: grid; gap: 2px; justify-items: center; cursor: pointer; border-radius: 6px; }
  .wk-hd:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .plan-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 759px) { .plan-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .wk-pager { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .wk-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  .wk-day { display: grid; gap: 4px; align-content: start; padding: 8px 6px; border-radius: 10px; background: var(--paper); font: 500 12px var(--font); text-align: center; min-height: 96px; }
  .wk-day[data-today] { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .wk-day.off { background: none; box-shadow: inset 0 0 0 1px var(--line); opacity: .6; }
  .wk-day .wk-k { font: 600 11px var(--font); color: var(--soft); text-transform: uppercase; letter-spacing: .06em; }
  .wk-day .wk-s { font: 600 12px var(--font); }
  .wk-day .meta { font-size: 10.5px; }
  .wk-day .quiet { font-size: 12px; min-height: 28px; padding: 0 4px; }
  .draft-ctl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; margin-top: 8px; }
  @media (max-width: 759px) { .draft-ctl { grid-template-columns: minmax(0, 1fr); } }
  .draft-ctl label.label { display: block; margin-bottom: 6px; }
  .days7 { display: flex; flex-wrap: wrap; gap: 4px; }
  .days7 button { min-width: 40px; min-height: var(--ctl); border: 0; border-radius: 8px; background: var(--tile-2); font: 600 13px var(--font); color: var(--ink); cursor: pointer; }
  .days7 button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
  .week-rows { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .week-rows li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); font: 400 13.5px var(--font); }
  .week-rows li b { font: 600 13px var(--mono); min-width: 88px; }
  .cta-steps { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0 0; padding: 0; list-style: none; }
  .cta-steps a { font: 500 14px var(--font); color: var(--ink); }
  .tests-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 1079px) { .tests-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 759px) { .tests-grid { grid-template-columns: minmax(0, 1fr); } }
  .tcard { display: grid; gap: 8px; align-content: start; padding: 16px; border-radius: 12px; background: var(--paper); }
  .tcard.open { box-shadow: inset 3px 0 0 var(--amber); }
  .tcard .band { font: 600 34px/1 var(--mono); letter-spacing: -.02em; }
  .mchips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .mchips button { min-width: 28px; height: 26px; padding: 0 5px; border-radius: 6px; border: 0; background: var(--ink); color: var(--on-ink); font: 500 12px var(--mono); cursor: pointer; }
  .mchips button.blank { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--faint); }

  @media (max-width: 759px) {
    .td .big { font-size: 38px; }
    .score-band { font-size: 40px; }
    .qd-slot .opt { min-height: 56px; }
    /* touch targets of at least 40px (§14) */
    .brief a, .trow button.tl { display: inline-flex; align-items: center; min-height: 40px; }
    .td .quiet, .td .btn, .td .pill, .exam-trig, .hero-stats a { min-height: 40px; }
    .mchips button { min-width: 40px; height: 40px; }
    .td a.chip { min-height: 40px; } .wk-hd { min-height: 40px; align-content: center; }
    .wk-strip { gap: 4px; } .wk-day { padding: 8px 2px; } .wk-day .wk-s { font-size: 10.5px; overflow-wrap: anywhere; }
  }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none !important; } }
</style>
</head>
<body data-page="today">
<header id="bar"></header>
<main class="page td" id="main" tabindex="-1">
  <p class="td-upd" id="upd" hidden>Updating…</p>
  <p class="note-ok" id="dayNote" role="status" hidden></p>
  <div id="today">
    <section id="hero" aria-label="Today"></section>
    <section id="next" class="card" aria-label="Up next"></section>
    <section id="due" class="card" aria-label="Due today"></section>
    <section id="qotd" class="card" aria-label="Questions of the day"></section>
    <section id="gain" class="card" aria-label="Points on the table"></section>
    <section id="mist" class="card" aria-label="Mistakes"></section>
    <section id="exam" class="card" aria-label="SAT countdown"></section>
    <section id="score" class="card" aria-label="Score"></section>
    <section id="pace" class="card" aria-label="Pace"></section>
    <section id="study" class="card" aria-label="Study time"></section>
    <section id="plan" class="card" aria-label="Study plan"></section>
    <section id="chal" class="card" aria-label="Daily challenge"></section>
    <section id="words" class="card" aria-label="Words"></section>
    <section id="tests" class="card" aria-label="Recent tests"></section>
  </div>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/assets/question.js"></script>
<script>UI.shell({ page: 'today', now: false });</script>
<script>
(() => {
  'use strict';
  const h = UI.h, $ = id => document.getElementById(id);
  const S = { t: null, ins: null, q: null, cal: null, chal: null, board: null, hist: null, histMore: [], calMonth: null, calDay: null,
              week: null, draft: null, qday: null, gainSort: 'points', mistView: 'type', causePick: null, calMetric: 'minutes' };
  const api = (p, o) => UI.api(p, o);
  const post = (p, body) => api(p, { method: 'POST', body: body || {} });
  const put = (p, body) => api(p, { method: 'PUT', body });
  const n = x => UI.num(x);
  const pl = (k, one, many) => `${n(k)} ${k === 1 ? one : (many || one + 's')}`;
  const pct = x => `${Math.round((x > 1 ? x / 100 : x || 0) * 100)}%`;
  const TOP = slug => (UI.TOPIC && UI.TOPIC[slug] || {}).short || String(slug || '').replace(/_/g, ' ');
  const DSHORT = d => ((UI.DOMAINS || []).find(x => x[0] === d) || [d, d])[1];
  const sdur = s => UI.dur((s || 0) / 60);
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : '';
  const phone = () => matchMedia('(max-width: 759px)').matches;
  const narrow = () => matchMedia('(max-width: 1079px)').matches;
  const ls = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
               set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} } };
  const localDay = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const addDays = (iso, k) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + k); return d.toISOString().slice(0, 10); };
  const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
  const today = () => (S.t && S.t.days && S.t.days.today) || localDay();
  const flame = on => h('span', { class: on ? 'on' : '', html: UI.svg(UI.ICON.flame, 16), 'aria-hidden': 'true' });

  /* ---------------------------------------------------------------- small builders */
  function btn(label, onClick, cls = 'btn') {
    const b = h('button', { type: 'button', class: cls, text: label });
    if (onClick) b.addEventListener('click', e => run(b, () => onClick(e, b)));
    return b;
  }
  const quiet = (label, onClick) => btn(label, onClick, 'quiet');
  // a start that fails says so in its own card, under its controls, which keep their values (§3a)
  const inCard = (host, fn) => async () => {
    const old = host.querySelector(':scope > .field-err');
    if (old) old.remove();
    try { await fn(); } catch (e) {
      if (e && e.name === 'AbortError') return;
      host.append(h('p', { class: 'field-err', role: 'alert', text: errText(e) }));
    }
  };
  const pill = (label, onClick) => btn(label, onClick, 'pill');
  const link = (label, href, cls = 'quiet') => h('a', { class: cls, href, text: label });
  const line = (text, cls = '') => h('p', { class: 'line' + (cls ? ' ' + cls : ''), text });
  const meta = text => h('p', { class: 'meta', text });
  const sub = text => h('p', { class: 'sub', text });
  const bar4 = f => h('span', { class: 'bar4', 'aria-hidden': 'true' }, h('i', { style: `width:${Math.max(0, Math.min(100, Math.round((f || 0) * 100)))}%` }));
  const join = (...xs) => xs.flat().filter(Boolean).join(' · ');
  // decision 7: a server line's zero parts ("0 check-ins") say nothing, so they go; "0 of 2" stays
  const nz = s => String(s || '').split(' · ').filter(x => !/^0 (?!of\b)/.test(x.trim())).join(' · ');
  function errText(e) {
    const d = e && e.detail;
    if (d && typeof d === 'object' && d.reason) return cap(String(d.reason).replace(/_/g, ' ')) + '.';
    if (typeof d === 'string' && d.length < 120) return cap(d) + (/[.!?]$/.test(d) ? '' : '.');
    return e && e.offline ? 'Can’t reach SAT Freshman.' : 'That didn’t work. Try again.';
  }
  async function run(b, fn) {
    if (b.getAttribute('aria-busy') === 'true') return;
    b.setAttribute('aria-busy', 'true');
    try { await fn(); } catch (e) { if (e && e.name !== 'AbortError') UI.toast(errText(e)); }
    finally { b.removeAttribute('aria-busy'); }
  }
  function head(id, label, ...right) {
    const r = right.flat().filter(Boolean);
    return h('div', { class: 'card-head' }, h('h2', { class: 'k', id: id + '-h', tabindex: '-1', text: label }),
      r.length ? h('div', { class: 'card-act' }, ...r) : null);
  }
  function card(id, label, right, ...kids) {
    const el = $(id);
    el.setAttribute('aria-labelledby', id + '-h');
    el.replaceChildren(head(id, label, right || []), ...kids.flat().filter(Boolean));
    return el;
  }
  const skel = (id, label, ...shapes) => card(id, label, null, shapes.map(x => UI.skel(null, x)));
  const topicChip = (slug, o = {}) => {
    const c = h('span', { class: 'tchip', 'aria-label': join(TOP(slug), o.answered !== undefined && `${n(o.answered)} answered`, o.traps && pl(o.traps, 'open mistake')) });
    c.append(h('span', { class: 'tc-t' }, UI.glyph(slug), TOP(slug),
      o.traps ? h('span', { class: 'dots', 'aria-hidden': 'true' }, Array.from({ length: Math.min(3, o.traps) }, () => h('i'))) : null));
    if (o.mastery !== undefined) c.append(h('span', { class: 'mbar', 'aria-hidden': 'true' }, h('i', { style: `--m:${Math.max(0, Math.min(1, o.mastery || 0))}` })));
    return c;
  }

  /* ---------------------------------------------------------------- starting things */
  function hrefOf(path, r) {
    if (!r) return '/';
    if (r.href) return r.href;
    if (r.next_url) return r.next_url;
    const id = encodeURIComponent(r.id || r.session || '');
    if (/^\/mock/.test(path)) return `/test/?s=${id}`;
    if (/^\/words\/run/.test(path)) return `/words/run/?id=${id}`;
    if (r.runner === 'test') return `/test/?s=${encodeURIComponent(r.session)}`;
    return `/practice/session/?id=${id}`;
  }
  async function go(st) {
    if (!st) return;
    if (typeof st === 'string') { location.href = st; return; }
    if (!st.path) { if (st.href) location.href = st.href; return; }
    const path = String(st.path).replace(/^\/api(?=\/)/, '');
    if (/^\/challenge\/start|^\/contest\/daily\/start/.test(path)) return startChallenge();
    const r = await post(path, st.body || {});
    location.href = hrefOf(path, r);
  }
  const drill = body => go({ path: '/drill', body });
  async function startChallenge() {
    const r = await post('/contest/daily/start');
    location.href = hrefOf('/contest', r);
  }
  function prefetchSession(el) {
    el.addEventListener('pointerdown', () => {
      if (document.querySelector('link[data-pf]')) return;
      document.head.append(h('link', { rel: 'prefetch', href: '/practice/session/', 'data-pf': '' }));
    }, { once: true });
  }
  // one .ics with several events: UI.ics makes one calendar per event, so their VEVENTs are joined (§8, T17)
  function icsFile(name, events) {
    const texts = events.map(ev => UI.ics(Object.assign({ download: false }, ev)));
    const vevents = texts.flatMap(t => t.match(/BEGIN:VEVENT[\s\S]*?END:VEVENT\r\n/g) || []);
    const text = texts[0].replace(/BEGIN:VEVENT[\s\S]*END:VEVENT\r\n/, vevents.join(''));
    const a = h('a', { href: URL.createObjectURL(new Blob([text], { type: 'text/calendar;charset=utf-8' })), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }
  const BYDAY = ['MO', 'TU', 'WE', 'TH', 'FR', 'SA', 'SU'];
  // Add to calendar (§8, T17): the SAT, and the study days at a time the student picks
  function calSheet() {
    const p = S.t.profile, pr = (UI.prefs.now && UI.prefs.now()) || {};
    const days = (p.days || '').split('').map((b, i) => b === '1' ? BYDAY[i] : null).filter(Boolean);
    const study = !!(p.exam_date && p.minutes && days.length && (S.t.plan || p.days));
    const time = h('input', { type: 'time', class: 'field sm', value: pr.study_time || '17:00', 'aria-label': 'Study time' });
    const withStudy = h('input', { type: 'checkbox', checked: study });
    let sheet;
    const body = b => {
      b.append(h('p', { class: 'line', text: join(`SAT · ${UI.date(p.exam_date, 'long')}`, 'all day', 'a reminder at 6 PM the evening before') }));
      if (!study) return;
      b.append(h('label', { class: 'row', style: 'margin-top:14px' }, withStudy,
        h('span', { text: join(`Study days · ${days.map(d => ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'][BYDAY.indexOf(d)]).join(', ')}`, `${n(p.minutes)} min`, `until ${UI.date(addDays(p.exam_date, -1))}`) })));
      b.append(h('div', { class: 'row', style: 'margin-top:10px' }, h('span', { class: 'label', text: 'Start at' }), time));
      if (!pr.study_time && S.t.usual_start) {
        const [hh, mm] = S.t.usual_start.split(':').map(Number);
        const said = new Date(2000, 0, 1, hh, mm).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        b.append(h('p', { class: 'line soft' }, `You usually start around ${said} · `, quiet('Use it', (e, x) => {
          time.value = S.t.usual_start; x.parentNode.remove();
          return UI.prefs.set({ study_time: S.t.usual_start });
        })));
      }
    };
    sheet = UI.sheet({ title: 'Add to calendar', body, actions: [{ label: 'Cancel', quiet: true }, { label: 'Download', primary: true, onClick: () => {
      const evs = [{ title: 'SAT', start: p.exam_date, allDay: true, alarm: 360, description: 'Doors close at 8:00 AM.' }];
      if (study && withStudy.checked && time.value) {
        const first = studyStart(days);
        evs.push({ title: 'Study · SAT Freshman', start: first, time: time.value, minutes: p.minutes, repeat: 'weekly', byday: days, until: addDays(p.exam_date, -1), url: `${location.origin}/` });
      }
      icsFile('sat-freshman.ics', evs);
    } }] });
    return sheet;
  }
  // the first study day from today, so the weekly rule starts on one of its own days
  function studyStart(days) {
    for (let k = 0; k < 7; k++) { const d = addDays(today(), k), i = (new Date(d + 'T12:00:00').getDay() + 6) % 7; if (days.includes(BYDAY[i])) return d; }
    return today();
  }
  function twinSheet(body, recall, title) {
    if (!UI.twinSheet) return drill(body);
    const s = UI.twinSheet({ body, recall: recall ? { text: recall } : null, title: title || 'Try one now', onDone: () => refresh(['today']) });
    if (s && s.el && !title) s.el.id = 'tryOne';
  }

  /* ---------------------------------------------------------------- loading */
  let live = 0, fromCache = false;
  const upd = () => { $('upd').hidden = !(fromCache && live > 0); };
  function load(path, paint, onFail, o = {}) {
    live++; upd();
    let painted = false;
    const p = (o.nocache ? api(path).then(d => { painted = true; paint(d, false); return d; })
      : UI.cached(path, (d, c) => { painted = true; if (c) { fromCache = true; upd(); } paint(d, c); }, { store: 'local', until: 'day' }))
      .catch(e => { if (!painted) onFail(e); else if (!o.quietFail) UI.toast('Couldn’t refresh everything. Showing your last copy.'); })
      .finally(() => { live--; upd(); });
    return p;
  }
  const TODAY_CARDS = ['next', 'mist', 'score', 'plan', 'exam', 'study', 'words'];
  const LOADERS = {
    today: () => load('/today', d => { S.t = d; paintToday(); }, () => {
      TODAY_CARDS.forEach(id => UI.cardError($(id), () => LOADERS.today()));
      const hs = document.querySelector('.hero-stats');
      if (hs) hs.replaceChildren(UI.cardError(null, () => LOADERS.today()));
      else $('hero').append(UI.cardError(null, () => LOADERS.today()));
    }),
    insights: () => load('/today/insights', d => { S.ins = d; paintInsights(); }, () => {
      ['gain', 'pace'].forEach(id => UI.cardError($(id), () => LOADERS.insights()));
      S.ins = { failed: true };
      if (S.t) paintScore();
    }),
    qotd: () => load(S.qday ? `/qotd?day=${S.qday}` : '/qotd', d => { S.q = S.qNote ? Object.assign({}, d, { note: S.qNote }) : d; paintQotd(); if (S.t) paintWords(); },
      () => UI.cardError($('qotd'), () => LOADERS.qotd(), 'Couldn’t load today’s questions.'), { nocache: !!S.qday }),
    calendar: () => load(`/calendar?month=${S.calMonth || localDay().slice(0, 7)}`, d => { S.cal = d; paintStudy(); },
      () => { S.cal = { failed: true }; paintStudy(); }, { nocache: !!S.calMonth }),
    chal: () => Promise.all([
      load('/contest/daily', d => { S.chal = d; paintChal(); }, () => UI.cardError($('chal'), () => LOADERS.chal(), 'Couldn’t load the challenge.')),
      load('/contest/daily/board?limit=5', d => { S.board = d; if (S.chal) paintChal(); }, () => {}, { quietFail: true }),
    ]),
    tests: () => load('/history?kind=tests&all=1&limit=6', d => { S.hist = d; S.histMore = []; paintTests(); },
      () => UI.cardError($('tests'), () => LOADERS.tests())),
  };
  let refreshTimer = 0;
  function refresh(which) {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => (which || Object.keys(LOADERS)).forEach(k => LOADERS[k]()), 150);
  }

  function firstPaint() {
    paintHero();
    // each at its card's final shape: Up next's size row, 3 block rows and a 4-line question; per slot a label, 3 stem lines, 4 options
    skel('next', 'Up next', { w: '70%', h: 32 }, 'rows:3', 'lines:4');
    const col = () => h('div', { class: 'qd-slot on' }, UI.skel(null, { w: '45%', h: 12 }), UI.skel(null, 'lines:3'), UI.skel(null, 'rows:4'));
    card('qotd', 'Questions of the day', null, h('div', { class: 'qd-row' }, col(), col()));
    skel('gain', 'Points on the table', 'rows:4');
    skel('mist', 'Mistakes', 'rows:3');
    skel('due', 'Due today', 'rows:3');
    skel('exam', 'SAT', 'lines:3');
    skel('score', 'Score', 'chart:120');
    skel('pace', 'Pace', 'cells:22');
    skel('study', 'Study time', 'lines:4');
    skel('plan', 'Study plan', 'lines:4');
    skel('chal', 'Daily challenge', 'rows:3');
    skel('words', 'Words', 'lines:2');
    skel('tests', 'Recent tests', 'lines:3');
  }

  /* ---------------------------------------------------------------- the whole of /api/today */
  function stageMode() { const st = S.t && S.t.next && S.t.next.stage; return st && st.mode || null; }
  function paintToday() {
    const mode = stageMode();
    const grid = $('today');
    const hour = new Date().getHours();
    const examDay = mode === 'exam' && hour < 13;
    grid.classList.toggle('stretch', ['stretch', 'taper', 'eve', 'exam'].includes(mode));
    grid.classList.toggle('examday', examDay);
    // T13: in the final stretch #exam sits under the hero in the DOM too, so it is the second card
    if (grid.classList.contains('stretch')) $('hero').after($('exam'));
    else $('gain').after($('mist')), $('mist').after($('exam'));
    if (examDay) $('exam').after($('next'));
    else if (grid.classList.contains('stretch')) $('exam').after($('next'));
    else $('hero').after($('next'));
    $('next').after($('due'));
    paintHero(); paintNext(); paintMist(); paintExam(); paintPlan(); paintWords(); paintScore();
    if (S.ins && !S.ins.failed) paintGain();
    if (S.cal) paintStudy();
    if (S.chal) paintChal();
    loadHelpers();
  }
  const helpersAsked = new Set();
  function loadHelpers() {
    (S.t.assets || []).forEach(name => {
      if (helpersAsked.has(name)) return;
      helpersAsked.add(name);
      const s = h('script', { src: `/assets/${name}.js` });
      s.onload = () => { if (name === 'results-ui' && S.hist) paintTests(); if (name === 'plan-ui') paintNext(); };
      document.body.append(s);
    });
  }

  /* ---------------------------------------------------------------- hero (§2, T19) */
  function paintHero() {
    const t = S.t, p = (t && t.profile) || {};
    const now = new Date(), hr = now.getHours();
    const greet = hr >= 5 && hr < 12 ? 'Good morning' : hr >= 12 && hr < 18 ? 'Good afternoon' : 'Good evening';
    const el = $('hero');
    const title = h('h1', { class: 'h1', id: 'hero-h', tabindex: '-1', text: p.name ? `${greet}, ${p.name}` : greet });
    const left = h('div', {}, h('p', { class: 'k', text: UI.date(now, 'eyebrow') }), title);
    if (t && !p.name) left.append(h('div', { class: 'hero-name' }, quiet('Add your name', (e, b) => nameEdit(b.parentNode))));
    const top = h('div', { class: 'hero-top' }, left, t ? heroChips(t) : null);
    el.replaceChildren(top);
    if (!t) return;
    const mode = stageMode();
    if (['stretch', 'taper', 'eve'].includes(mode)) el.append(line('Rehearse, keep what you have, fix what repeats.'));
    const facts = (t.brief || []).slice(0, 3).map(f => f.href ? h('a', { href: f.href, text: f.text }) : h('span', { text: f.text }));
    const risk = t.at_risk;
    if (risk) {
      const left_ = Math.max(0, Math.round(risk.left_ms / 60000));
      facts.unshift(h('span', { class: 'risk' }, `One answer keeps your ${risk.streak}-day streak · ${UI.dur(left_)} left today`,
        risk.spare ? ' · or a spare covers it' : ''),
        btn('1 question', () => twinSheet(risk.start.body, null, 'One question')));
      if (facts.length > 4) facts.length = 4;
    }
    if (facts.length) el.append(h('p', { class: 'brief' }, facts.flatMap((f, i) => i ? [h('span', { class: 'sep', 'aria-hidden': 'true', text: '·' }), f] : [f])));

  function heroChips(t) {

  // drift (T10, R16): the sittings behind it, what the new start changes, then the choice
  function driftBlock(t, sg) {

    const el = h('div', { class: 'blk' }, sub('Your plan’s start'),
      line(down ? `Tests are running below the plan’s start (${was} → ${sg.current})` : `Your last tests average ${sg.current}; your plan started from ${was}.`));

      if (a && b && a.pace_per_week !== undefined) effect.textContent = `New start ${sg.current} · the pace needed goes from +${Math.round(a.pace_per_week)} to +${Math.max(0, Math.round(b.pace_per_week))} a week`;

  const CAUSE = { clock: 'Clock', entry: 'Entry', trap: 'Traps', slip: 'Slips', gap: 'Gaps', misread: 'Misreads', changed: 'Changed' };
  function causesBlock(c) {
    const el = h('div', { class: 'blk' });
    el.append(sub('Where points went · last 14 days'));
    if (!c.total || c.total < 5) { el.append(line('Fewer than 5 misses in 14 days: nothing to sort yet.', 'soft')); return el; }
    const segs = Object.keys(CAUSE).filter(k => c.by[k]).map(k => ({ key: k, label: CAUSE[k], value: c.by[k] }));

    if (UI.stackBar) UI.stackBar(el, segs, { largest: true, noun: 'misses', label: 'Misses by cause', onPick: sg => { S.causePick = sg.key; fixRow(c, sg.key, fix); } });
    else el.append(meta(segs.map(s => `${s.label} ${s.value}`).join(' · ')));

    el.append(fix);
    if (S.causePick) fixRow(c, S.causePick, fix);

      ? `On tests you changed ${ch.right_to_wrong} right answers to wrong and ${ch.wrong_to_right} wrong to right: keep your first answer unless you find an error.`

  /* the target dialog (§9, T11) */
  function targetSheet(opener, draft) {
    const p = S.t.profile, sc = S.t.score;
    let v = (draft ? draft.target : p.target) || (sc ? Math.min(800, Math.ceil(((sc.low + sc.high) / 2 + 60) / 10) * 10) : 600);
    let rwNow = p.rw_now || null, rwT = p.rw_target || null;

    const save = h('button', { type: 'button', class: 'pill', text: 'Save', disabled: true });

    num.addEventListener('input', () => { if (num.value.length >= 3) set(+num.value); });

    const quick = UI.chips(null, QUICK.map(x => ({ value: x, label: String(x) })), { value: v, label: 'Quick targets', onChange: x => set(x) });

    rwA.addEventListener('input', rwSync); rwB.addEventListener('input', rwSync);
    let tk = 0;
    function askTakes() {
      clearTimeout(tk);
      tk = setTimeout(async () => {
        const w = S.t.workload && S.t.workload.need && S.t.workload.need.target;
        const kids = [h('p', { class: 'sub', text: 'What it takes' })];
        if (w && w.target === v && w.right_of_44) kids.push(line(`${v} ≈ ${w.right_of_44} of 44 right · you’re near ${w.now_of_44}`));
        if (w && w.target === v && w.skills && w.skills.length) kids.push(line(`The ones you’re most likely missing are in ${w.skills.slice(0, 3).map(TOP).join(', ')}`, 'soft'));
        try {
          const pv = await previewFor({ target: v });
          const tn = pv.target_note;
          if (tn && tn.route_up && v > 580) kids.push(line(`Needs the harder module 2: at least ${tn.route_right} of ${tn.route_of} right in module 1`, 'soft'));
          if (p.exam_date && pv.pace_per_week) kids.push(line(join(`${pv.study_days} study days`, `about ${Math.round(pv.pace_per_week)} a week`, pv.pace_tag)));

            const dates = (((UI.shellData && UI.shellData()) || {}).dates || []).map(d => d.day).filter(d => d > p.exam_date).slice(0, 6);

        } catch (_) {}

    save.addEventListener('click', () => run(save, async () => {
      if (draft) { draft.target = v; sheet.close(); paintPlan(); return; }
      const was = { target: p.target ?? null, rw_now: p.rw_now ?? null, rw_target: p.rw_target ?? null };
      const change = Object.assign({ target: v, rw_now: rwNow, rw_target: rwT }, later ? { exam_date: later } : {});

      sheet.close();

      UI.toast(`Target ${v}${later ? ` · SAT ${UI.date(later)}` : ''}`, { undo: () => put('/me', was).then(() => { Object.assign(S.t.profile, was); refresh(['today', 'insights']); }).catch(() => UI.toast('Not saved. Try again.')) });
      refresh(['today', 'insights']);
    }));
    const clear = quiet('Clear target', async () => { await put('/me', { target: null }); S.t.profile.target = null; sheet.close(); paintScore(); refresh(['today']); });
    sheet = UI.sheet({ title: 'Target', label: 'Target', body: b => {
      b.append(h('p', { class: 'meta', text: 'Math, 200 to 800' }), h('div', { class: 'row' }, num), rng, quick.el,
        meta(join(sc && `Latest ${sc.low}–${sc.high}`, S.t.plan && S.t.plan.current && `Plan start ${S.t.plan.current}`)), note, takes);

  /* ---------------------------------------------------------------- SAT countdown (§10, T12, T13) */
  let stopCount = null;
  // Plan's preview on the student's own numbers, with some of them changed (T11, T12)
  function previewFor(over) {
    const p = S.t.profile, sc = S.t.score;
    const current = (S.t.plan && S.t.plan.current) || (sc ? Math.round((sc.low + sc.high) / 20) * 10 : p.current) || undefined;
    const body = Object.assign({ current, target: p.target || undefined, exam_date: p.exam_date || undefined, minutes: p.minutes || 45, days: p.days || '1111111' }, over);   // every day, as the workload counts
    if (body.target && body.current && body.target < body.current) return Promise.resolve({});   // the server refuses a target below now
    return post('/plan/preview', body);
  }
  // at most `ms` to wait, so a slow preview never holds a control shut
  const within = (pr, ms = 700) => Promise.race([pr.catch(() => null), new Promise(r => setTimeout(() => r(null), ms))]);
  async function examPop(anchor) {
    const dates = (((UI.shellData && UI.shellData()) || {}).dates || []).filter(d => d.day >= today());
    // each official date with what it means: study days, the pace it asks, its tag (T12)
    const pvs = await Promise.all(dates.map(d => within(previewFor({ exam_date: d.day }))));
    return UI.examDate(anchor, { value: S.t.profile.exam_date, onSave: setExam, dates: dates.map((d, i) => {
      const pv = pvs[i] || {}, paced = S.t.profile.target && pv.pace_per_week !== undefined;
      return { date: d.day, register_by: d.register_by, late_by: d.late_by, study_days: pv.study_days ?? null,
        per_week: paced ? Math.max(0, Math.round(pv.pace_per_week)) : null, tag: paced ? pv.pace_tag : null };

      kids.push(meta(join(st.rehearsals && `${pl(st.rehearsals.filter(r => !r.done).length, 'rehearsal')} left`, t.review && t.review.due && `${pl(t.review.due, 'check-in')} due`, t.traps.now && t.traps.now.n && join(pl(t.traps.now.n, 'mistake'), t.traps.now.gain && `worth ≈ +${t.traps.now.gain}`))));

    if (ex && ex.readiness && ex.readiness.length) {

    if (old || misses >= 5) acts.append(twinB);
    acts.append(h('a', { class: 'btn', href: `/results/report/?id=${encodeURIComponent(r.id)}`, text: 'Review' }));
    if (misses > 0) acts.append(btn(`Fix ${misses}`, () => drill({ from_session: r.id })));
    else acts.append(h('span', { class: 'meta', text: 'All right' }));
    if (!(old || misses >= 5)) acts.append(twinB);
    acts.append(quiet('New one like this', () => go({ path: '/mock/new', body: { full: r.kind === 'mock' } })));
    el.append(acts);
    return el;
  }

  /* ---------------------------------------------------------------- keys, rollover, return (T20, §12) */
  function cards() {
    return [...document.querySelectorAll('#today > section')].filter(s => s.offsetParent !== null)
      .sort((a, b) => { const A = a.getBoundingClientRect(), B = b.getBoundingClientRect(); return Math.abs(A.top - B.top) > 8 ? A.top - B.top : A.left - B.left; });
  }
  function moveCard(k) {
    const list = cards();
    let cur = list.findIndex(s => s.contains(document.activeElement));
    // nothing focused: the card at the top of the view is the current one, so J from the top goes to the second card
    if (cur < 0) cur = Math.max(0, list.filter(s => s.getBoundingClientRect().top <= 80).length - 1);
    const j = Math.max(0, Math.min(list.length - 1, cur + k));
    const hd = list[j].querySelector('h1, h2');
    if (hd) { hd.focus({ preventScroll: true }); hd.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  }
  UI.keys.register('today', {
    J: { does: 'Next card', run: () => moveCard(1) },
    K: { does: 'Previous card', run: () => moveCard(-1) },
    T: { does: 'Try one now', run: () => { const x = S.t && S.t.traps && (S.t.traps.top || [])[0]; if (x) twinSheet({ pool: 'redo', ids: [x.id], count: 1, source: 'try' }, x.label); } },
    Enter: { does: 'Run the focused card’s main action', when: () => document.activeElement && document.activeElement.matches('#today h2.k, #today h1'),
      run: () => { const c = document.activeElement.closest('section'); const b = c && (c.querySelector('.pill') || c.querySelector('.btn')); if (b) b.click(); } },
  }, { label: 'Today' });

  let day0 = localDay();
  setInterval(() => {
    if (localDay() === day0) return;
    day0 = localDay();
    S.qday = null; S.calMonth = null; S.calDay = null; SZ.sel = null; SZ.preview = null; SZ.q1 = null; SZ.sid = null; S.chalRev = null;
    const note = $('dayNote');
    note.textContent = 'It’s a new day. Here are today’s questions.'; note.hidden = false;
    refresh();
  }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(['today', 'insights', 'chal', 'tests']); });
  addEventListener('pageshow', e => { if (e.persisted) refresh(['today', 'insights', 'chal', 'tests']); });

  /* ---------------------------------------------------------------- go */
  const dq = new URLSearchParams(location.search).get('day');
  if (dq) {
    const t0 = localDay();
    if (/^\d{4}-\d{2}-\d{2}$/.test(dq) && dq < t0 && dayDiff(dq, t0) <= 30) S.qday = dq;
    else if (dq !== t0) S.qNote = 'That day is out of range. Here is today’s.';
  }
  firstPaint();
  LOADERS.today();
  LOADERS.insights();
  LOADERS.qotd();
  LOADERS.calendar();
  LOADERS.chal();
  LOADERS.tests();
})();
</script>
