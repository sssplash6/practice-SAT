<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan · SAT Freshman</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* The study plan (spec 3.6, plan.md L1-L21, decisions 4 and 7): the landing, the
     four-step wizard and the plan view in three tabs. Shared pieces are ui.css and
     plan-ui.js; these rules lay the page out on the shared scale (DIRECTION 1). */
  .pl * { min-width: 0; }
  .pl h1, .pl h2, .pl h3, .pl p { margin: 0; }
  .pl-sec { margin-top: 24px; }
  .pl .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .pl .spread { justify-content: space-between; }
  .pl .soft { color: var(--soft); }
  /* :where: a helper, never over .btn.ink or .badge.ink (their own colours win) */
  .pl :where(.ink) { color: var(--ink); }
  .pl .line-t { font: 400 14.5px/1.5 var(--font); color: var(--ink); }
  .pl-main { display: grid; gap: var(--card-gap); align-content: start; }
  .pl-after { margin-top: 8px; }
  .pl-hmeta { display: inline-flex; align-items: center; gap: 8px; }

  /* ---- the title row: the page's name and its one action; on the plan view the tabs sit between them */
  .pl-title { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; }
  .pl-title .meta { margin-top: 4px; }
  .pl-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "name tabs acts" "set set set" "shared shared shared"; align-items: center; gap: 0 24px; }
  /* the tablist's own hairline continues under the name and the actions */
  .pl-head::before { content: ""; grid-area: 1 / 1 / 2 / -1; align-self: end; height: 1px; background: var(--line); }
  .pl-name { display: contents; }
  .pl-name > h1 { grid-area: name; padding: 4px 0 8px; }
  .pl-head > .pl-tabbar { grid-area: tabs; align-self: end; }
  .pl-name > .pl-acts { grid-area: acts; padding-bottom: 4px; }
  .pl-head > .pl-set { grid-area: set; margin-top: 8px; }
  .pl-head > .pl-shared { grid-area: shared; }
  .pl .pl-shared { margin-top: 4px; font: 500 12.5px var(--font); color: var(--soft); }
  .pl-view > .pl-panel { margin-top: 24px; }
  @media (max-width: 759px) {
    /* a phone: name and actions on one line, the settings, then the tabs, which stick under the 56px bar
       (the head steps aside so the tabs' sticky box is the whole view, not the head) */
    .pl-head { display: contents; }
    .pl-head::before { content: none; }
    .pl-name { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pl-name > h1, .pl-name > .pl-acts { padding: 0; }
    .pl-head > .pl-set { margin-top: 4px; }
    .pl-tabbar { position: sticky; top: calc(56px + env(safe-area-inset-top, 0px)); z-index: 6; margin-top: 8px; background: var(--page); }
  }

  /* ---- banners: the most urgent one, on the shared .banner; the rest behind "N more" */
  .pl-banners { display: grid; gap: 8px; margin-top: 16px; justify-items: stretch; }
  .pl-banners:empty { display: none; }
  .pl-banners > .banner { margin: 0; }
  .pl-banner > .help { flex: 1 0 100%; margin: 0; }
  /* a phone: the line, its button and the x on one row where they fit (the line wraps inside itself) */
  @media (max-width: 759px) { .pl-banner > .banner-t { flex: 1 1 140px; } }
  .banner-t .pl-bmore { font: inherit; color: var(--ink-2); gap: 2px; vertical-align: baseline; }
  .pl-bmore svg { width: 14px; height: 14px; color: var(--soft); }
  .pl-ext svg { width: 14px; height: 14px; }   /* opens College Board in a new tab */

  /* ---- the status block: rows in the side column from 1280px; columns under the day below that; two on a phone */
  .pl-tiles { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); padding: 0; overflow: hidden; }
  .pl-tile { position: relative; display: grid; align-content: start; gap: 4px; padding: 12px var(--card-pad); }
  .pl-tile + .pl-tile { box-shadow: inset 1px 0 0 var(--line); }
  .twocol-side .pl-tiles { grid-template-columns: minmax(0, 1fr); }
  .twocol-side .pl-tile + .pl-tile { box-shadow: inset 0 1px 0 var(--line); }
  @media (max-width: 759px) {
    .pl-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pl-tile:nth-child(odd) { box-shadow: none; }
    .pl-tile:nth-child(n + 3) { box-shadow: inset 0 1px 0 var(--line); }
    .pl-tile:nth-child(n + 3):nth-child(even) { box-shadow: inset 0 1px 0 var(--line), inset 1px 0 0 var(--line); }
  }
  .pl-tile .stat-sub { margin: 0; }
  .pl-tile .stat-sub .badge { margin-right: 4px; }
  .pl-tile .btn.sm, .pl-tile .quiet { justify-self: start; }
  .pl-big { font: 600 28px/1.05 var(--font); letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pl-big small { font: 500 12.5px var(--font); letter-spacing: 0; color: var(--soft); white-space: nowrap; }
  .pl-to { font-size: .62em; font-weight: 400; letter-spacing: 0; color: var(--soft); vertical-align: .18em; }
  /* a total (four digits each side) keeps to one line in a narrow tile */
  .pl-big[data-long] { white-space: nowrap; }
  @media (max-width: 759px) { .pl-big[data-long] { font-size: 22px; } }
  .pg-subject { margin-bottom: 16px; }
  /* a whole-row tap target behind the row's text; a link or button in the row stays its own */
  .pl-tile > * { position: relative; z-index: 1; pointer-events: none; }
  .pl-tile > .pl-tap { position: absolute; inset: 0; z-index: 0; pointer-events: auto; appearance: none; border: 0; padding: 0; background: none; cursor: pointer; }
  .pl-tile a, .pl-tile button:not(.pl-tap) { pointer-events: auto; }
  @media (hover: hover) and (pointer: fine) { .pl-tile:has(> .pl-tap:hover) { background: var(--hover); } }
  .pl-tile:has(> .pl-tap:active) { background: color-mix(in srgb, var(--surface), var(--ink) 6%); }
  .pl-tap:focus-visible { outline: 2px solid var(--amber-deep); outline-offset: -2px; }
  /* a tile whose tap opens its details says so with a small caret after its label */
  .pl-tile .stat-k { display: flex; align-items: center; gap: 6px; }
  .pl-tile .stat-k svg { width: 14px; height: 14px; }
  .pl-det { display: grid; gap: 8px; max-width: 300px; font: 400 14px/1.45 var(--font); color: var(--ink); }
  .pl-det .pl-links { margin-top: 4px; }
  .pl-links { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .pl-track { position: relative; height: 6px; border-radius: 4px; background: var(--track); margin: 8px 0 4px; }
  .pl-track > b { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
  .pl-track > b.gap { background: var(--amber); opacity: .3; }
  .pl-track > b.band { background: var(--ink); opacity: .22; }
  .pl-track > i { position: absolute; top: -4px; width: 3px; height: 14px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
  .pl-track > i.t { background: var(--amber); }
  /* This week: the meter's blocks (a study day each) with the day's letter under each */
  .pl-wkl { display: flex; gap: 3px; margin-top: 4px; }
  .pl-wkl > span { flex: 1 1 0; font: 500 11.5px var(--font); color: var(--soft); }
  .pl-wkl > [data-today] { color: var(--ink); font-weight: 600; }

  /* ---- the Plan tab: the day and the month in main, the status and the side cards beside them */
  .pl-dayhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-height: 34px; margin-bottom: 12px; }
  .pl-dayopt { margin-left: auto; }
  .pl-facts .pl-have { padding: 9px 2px; margin: -9px -2px; font: inherit; color: var(--ink); text-decoration: underline dotted var(--faint); text-underline-offset: 3px; gap: 4px; vertical-align: baseline; }
  .pl-have svg { width: 16px; height: 16px; flex: none; }
  .pl-facts .pl-have svg { width: 14px; height: 14px; align-self: center; }
  .pl-day-go { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .pl-dayhead ~ .trows { margin-top: 8px; }
  .pl-trim { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--surface); box-shadow: var(--edge); display: grid; gap: 8px; }
  .pl-trim p { font: 400 14.5px/1.5 var(--font); }
  .pl-meter { margin-top: 12px; }
  .pl-meter > .meta { margin-top: 4px; }
  .pl-foot { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .pl-foot > p { font: 600 14.5px/1.4 var(--font); flex: 1 1 220px; display: flex; align-items: center; gap: 10px; }
  /* Day done: a ring around a check, closed (it sweeps shut on the last tick) */
  .pl-ring { --rs: 28px; --ring-w: 3px; color: var(--ink); }
  .pl-ring svg { width: 14px; height: 14px; }
  /* the done rows, tucked under "N done" */
  .pl-done { margin-top: 4px; border-top: 1px solid var(--line); }
  .pl-done > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; min-height: var(--row-h); font: 500 14px var(--font); color: var(--soft); font-variant-numeric: tabular-nums; }
  .pl-done > summary::-webkit-details-marker { display: none; }
  .pl-done > summary svg { width: 16px; height: 16px; transition: rotate .2s var(--ease); }
  .pl-done[open] > summary svg, .wz-later[open] > summary > svg, .wz-more[open] > summary > svg, .wz-all[open] > summary > svg { rotate: 180deg; }
  @media (hover: hover) and (pointer: fine) { .pl-done > summary:hover { color: var(--ink); } }
  .pl-done-n { color: var(--ink); font-weight: 600; }
  .pl-done > .trows { padding-bottom: 4px; }
  .pl-check { display: grid; gap: 2px; margin-top: 8px; }
  .pl-rest { padding: 12px 0 4px; display: grid; gap: 8px; justify-items: start; }
  .pl-rest p { font: 500 14.5px/1.45 var(--font); }
  /* the calendar card: the week's head, its tasks and theme, then the month */
  .pl-wk { display: grid; gap: 8px; margin-bottom: 12px; }
  .pl-wk > .card-head { margin: 0; }
  /* a goal: met a filled dot, open a ring, missed a dash (its words are in the label and the theme line) */
  .pl-goals { display: inline-flex; align-items: center; gap: 6px; }
  .pl-goals i { width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); }
  .pl-goals i[data-s="met"] { background: var(--ink); box-shadow: none; }
  .pl-goals i[data-s="missed"] { height: 1.5px; border-radius: 1px; background: var(--soft); box-shadow: none; }
  #week .cal-head { gap: 4px; }
  #week .cal-title { min-width: 0; text-align: left; }
  /* the calendar's key (behind the ? by the month's title): one mark a line */
  body[data-page="plan"] .cal-key { margin: 0; display: grid; gap: 8px; }
  body[data-page="plan"] .cal-scale { display: grid; gap: 8px; }
  /* only today, the day picked, test days, days off, the SAT and the week on show keep a shape; other days are a
     number and a mark on the card. The week on show is a soft band */
  .pl #week .cal.plan .cal-d:not(.blank):not([data-wk]):not([data-today]):not([aria-selected="true"]):not([data-exam]):not([data-kind="test"][data-state="future"]):not([data-kind="off"]):not([data-drop]) { background: none; box-shadow: none; }
  /* the week on show is one band: each of its days fills the 4px gaps beside it, the band's ends are round */
  .pl #week .cal.plan .cal-d[data-wk] { --bl: 4px; --br: 4px; border-radius: 0; }
  .pl #week .cal.plan .cal-row > .cal-d[data-wk]:is(:first-child, :not([data-wk]) + *) { --bl: 0px; border-top-left-radius: 10px; border-bottom-left-radius: 10px; }
  .pl #week .cal.plan .cal-row > .cal-d[data-wk]:is(:last-child, :has(+ :not([data-wk]))) { --br: 0px; border-top-right-radius: 10px; border-bottom-right-radius: 10px; }
  .pl #week .cal.plan .cal-d[data-wk]:not([aria-selected="true"]):not([data-exam]):not([data-kind="off"]):not([data-drop]) {
    background: var(--well); box-shadow: calc(-1 * var(--bl)) 0 0 var(--well), var(--br) 0 0 var(--well); }
  .pl #week .cal.plan .cal-d[data-wk]:is([aria-selected="true"], [data-exam], [data-kind="off"]) { border-radius: 8px; }
  /* today: its date on a small ink chip, never a box round the day (the picked day is the boxed one) */
  .pl #week .cal.plan .cal-d[data-today]:not([data-wk]):not([aria-selected="true"]) { background: none; box-shadow: none; }
  .pl #week .cal.plan .cal-d[data-today] .cal-n { top: 3px; left: 3px; padding: 1px 5px; border-radius: 6px; background: var(--ink); color: var(--on-ink); font-weight: 600; }
  @media (max-width: 759px) {
    .pl #week .cal.plan .cal-d[data-wk] { --bl: 3px; --br: 3px; }   /* the phone grid's gap */
    .pl #week .cal.plan .cal-d[data-today] .cal-n { top: 1px; left: 1px; padding: 1px 4px; }
  }
  /* L15: a day the plan changed by itself carries a dot after its date until it is opened (its label says so too);
     beside the number, clear of the phase name, your-own mark, minutes and task count */
  .pl .cal.plan .cal-d[data-chg] .cal-n::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 4px; border-radius: 50%; background: var(--ink); vertical-align: 1px; }
  /* the month: weeks before the plan and after the SAT fold away; a missed day is a ring with an x */
  .pl .cal.plan .cal-row:not(:has(button.cal-d)) { display: none; }
  .pl .cal.plan .cal-d.blank .cal-n { color: var(--soft); }
  .pl .cal.compact .cal-meta { display: none; }
  .pl .cal.plan.compact .cal-own, .pl .cal.plan.compact .cal-phase { display: none; }
  .pl .cal.plan .cal-d[data-state="missed"] .cal-mark, body[data-page="plan"] .cal-sw.missed {
    background: linear-gradient(45deg, transparent 44%, var(--faint) 44% 56%, transparent 56%), linear-gradient(-45deg, transparent 44%, var(--faint) 44% 56%, transparent 56%); box-shadow: inset 0 0 0 1.5px var(--faint); }
  /* a small month (the builder's Live plan, the landing's ready plan): ordinary days are a number and a mark, no box */
  .pl .cal.plan.compact .cal-d:not(.blank):not([data-today]):not([aria-selected="true"]):not([data-exam]):not([data-kind="off"]) { background: none; box-shadow: none; }
  .pl .cal.plan.compact .cal-d[data-phase]::before { content: none; }
  /* side cards: coming up, phases, map, sweep */
  .pl-up { display: grid; }
  .pl-up button { appearance: none; border: 0; background: none; cursor: pointer; text-align: left; padding: 8px 0; border-top: 1px solid var(--line);
    display: grid; gap: 2px; font: inherit; color: var(--ink); }
  .pl-up button:first-child { border-top: 0; padding-top: 0; }
  .pl-up .d { font: 500 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--soft); }
  .pl-up .t { font: 500 14.5px/1.4 var(--font); }
  /* a Coming up row: a hover band (rows on the page, so the band reaches 8px past the text) */
  .pl-up button { margin: 0 -8px; padding-inline: 8px; border-radius: 8px; transition: background-color .14s var(--ease); }
  @media (hover: hover) and (pointer: fine) { .pl-up button:hover { background: var(--hover); } }
  .pl-upnotes { display: grid; gap: 2px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
  .pl-upbox { padding: 0 var(--card-pad); }
  .pl-grp-h { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-bottom: 8px; }
  .pl-grp + .pl-grp { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  /* phases: each a group (its name, dates, what it does) with its weeks nested under a 1px guide line; the week on
     show carries the amber mark on the guide, the phase under way says "now" */
  .pl-phases { display: grid; }
  .pl-ph { border-top: 1px solid var(--line); }
  .pl-ph:first-child { border-top: 0; }
  .pl-ph-s { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: baseline; padding: 8px 0; list-style: none; }
  .pl-ph:first-child > .pl-ph-s { padding-top: 0; }
  summary.pl-ph-s { grid-template-columns: minmax(0, 1fr) auto 12px; }
  summary.pl-ph-s::-webkit-details-marker { display: none; }
  summary.pl-ph-s::after { content: ""; grid-area: 1 / 3; justify-self: center; align-self: center; width: 5px; height: 5px; border-right: 1.5px solid var(--soft); border-bottom: 1.5px solid var(--soft);
    transform: translateY(-2px) rotate(45deg); transition: transform .15s var(--ease); }
  .pl-ph[open] > summary.pl-ph-s::after { transform: translateY(1px) rotate(-135deg); }
  @media (hover: hover) and (pointer: fine) { summary.pl-ph-s:hover::after { border-color: var(--ink); } }
  .pl-ph b { font: 600 14.5px var(--font); }
  .pl-ph-s > span:not(.meta) { grid-column: 1 / -1; font: 400 12.5px/1.45 var(--font); color: var(--soft); }
  .pl-wks { display: grid; margin: 0 0 8px 4px; padding-left: 4px; box-shadow: inset 1px 0 0 var(--line); }
  .pl-wkr { appearance: none; border: 0; background: none; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 32px; padding: 0 8px; border-radius: 8px; text-align: left; font: 400 14px var(--font); color: var(--soft); }
  .pl-wkr > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-wkr > .meta { flex: none; font-variant-numeric: tabular-nums; }
  .pl-wkr[data-on] { background: var(--wash); color: var(--ink-strong); font-weight: 600; }
  @media (hover: hover) and (pointer: fine) { .pl-wkr:not([data-on]):hover { background: var(--hover); color: var(--ink); } }
  .pl-wkr:focus-visible { outline-offset: -2px; }
  @media (pointer: coarse) { .pl-wkr { min-height: var(--touch); } summary.pl-ph-s { min-height: var(--touch); align-content: center; } }
  @media (prefers-reduced-motion: reduce) { summary.pl-ph-s::after { transition: none; } }
  .pl-map { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .pl-mapd { display: flex; gap: 4px; }
  .pl-map i { width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--faint); display: grid; place-items: center; font: 600 9px var(--font); font-style: normal; }
  .pl-map i[data-on] { background: var(--ink); color: var(--on-ink); box-shadow: none; }
  .pl-strip19 { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px; }
  .pl-strip19 i { height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--faint); display: grid; place-items: center; font: 600 9px var(--font); font-style: normal; }
  .pl-strip19 i[data-on] { background: var(--ink); color: var(--on-ink); box-shadow: none; }
  .pl-sweep { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .pl-sweep i { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; font: 600 11.5px var(--font); font-style: normal; }
  .pl-sweep i[data-s="ok"] { background: var(--amber); color: var(--ink-deep); }
  .pl-sweep i[data-s="back"] { background: var(--ink); color: var(--on-ink); }
  .pl-sweep i[data-s="togo"] { box-shadow: inset 0 0 0 1.5px var(--faint); }
  /* a phone: the next task's Start stays in reach once the day's own Start has scrolled away */
  .pl-thumb { display: none; }
  .pl-thumb[hidden] { display: none !important; }
  @media (max-width: 759px) {
    .pl-thumb { display: flex; align-items: center; gap: 12px; position: sticky; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 7;
      margin: 16px calc(-1 * var(--gutter)) 0; padding: 8px var(--gutter); background: var(--page); box-shadow: 0 -1px 0 var(--line); }
    .pl-thumb p { flex: 1 1 auto; font: 500 14px/1.35 var(--font); }
    .pl-thumb p .soft { display: block; font: 500 12.5px var(--font); }
  }

  /* ---- landing (no plan): the title and its one primary, then the plan you'd get beside your numbers */
  .pl-draft { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .pl-ready-b { display: grid; gap: 16px; }
  @media (min-width: 900px) { .pl-ready-b { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
  .pl-ready-b .k { margin-bottom: 4px; }
  .pl-mini { display: grid; gap: 16px; align-content: start; }
  @media (max-width: 759px) { .pl-mini { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* ---- Plans list: one row a plan; Edit or Open shows, the rest on hover or focus (always on touch) */
  .pl-plans { display: grid; }
  .pl-prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
  .pl-prow:first-child { border-top: 0; padding-top: 0; }
  .pl-pmain { display: grid; gap: 4px; }
  .pl-prow .h3 { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .pl-prow .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; }
  .pl-more2 { display: inline-flex; flex-wrap: wrap; gap: 8px; }

  :is(.pg-split > span, .pg-sw)[data-g="3"] { background: color-mix(in srgb, var(--ink) 14%, var(--paper)); }
  .pg-sw { display: inline-block; width: 12px; height: 12px; border-radius: 4px; }
  .pg-split + .pg-key { margin: 12px 0 0; display: grid; gap: 4px; }
  .pg-conf { display: grid; gap: 8px; margin-top: 4px; }
  .pg-untried { margin-top: 8px; }
  .pg-untried summary { cursor: pointer; font: 600 14px var(--font); padding: 8px 0; min-height: var(--ctl); }
  .pg-utl { display: flex; flex-wrap: wrap; gap: 8px 16px; padding: 4px 0 8px; font: 500 14px var(--font); }
  .pg-utl a { color: var(--ink); text-decoration: none; }
  .pg-utl a:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ---- the changes sheet, and the calendar sheet's two ways in */
  .pl-chgs { display: grid; }
  .pl-chg { appearance: none; border: 0; background: none; font: 400 14.5px/1.45 var(--font); color: var(--ink); text-align: left; display: flex; flex-wrap: wrap; justify-content: space-between;
    gap: 2px 12px; padding: 8px 0; min-height: var(--row-h); align-items: center; border-top: 1px solid var(--line); }
  .pl-chgs > .pl-chg:first-child { border-top: 0; }
  button.pl-chg { cursor: pointer; }
  button.pl-chg:hover > span:first-child { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }
  .pl-opts { display: grid; gap: 12px; }
  .pl-opts > :empty { display: none; }
  .pl-opt { display: grid; gap: 4px; }
  .pl-opts > * + .pl-opt { border-top: 1px solid var(--line); padding-top: 12px; }
  .pl-opt-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pl-opt .help { margin: 0; }
  /* a first-use empty: the mark's corners (UI.spotArt) above its line */
  .pl-empty { display: grid; justify-items: center; gap: 12px; padding: 16px 0 8px; text-align: center; }
  .pl-empty > p { max-width: 40ch; }

  /* ---- a picked day far from its card comes to it; the card's content slides in (200 ms) */
  .pl-panel .card, .pl-sec { scroll-margin-top: 0; }
  @media (max-width: 759px) { .pl-panel .card, .pl-sec { scroll-margin-top: 44px; } }
  @media (prefers-reduced-motion: no-preference) {
    #week .cal.plan .cal-d { transition: background-color .16s var(--ease), box-shadow .16s var(--ease); }
  }
  body[data-plan-mode] .banner:is([data-kind="first"], [data-kind="nudge"]) { display: none; }

  /* ---- loading: the page's shape, pulsing only when motion is allowed (spec 3.6 6) */
  .pl-skcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .pl-skcal .skel { height: 44px; border-radius: 6px; }
  @media (prefers-reduced-motion: no-preference) { .pl .skel { animation: plpulse 1.4s ease-in-out infinite; } }
  @keyframes plpulse { 50% { opacity: .55; } }

  /* ---- moving a task (L12): each target says its new load or why not, in text */
  .pl-dragging, .pl-dragging * { cursor: grabbing !important; user-select: none; }
  .pl-ghost { position: fixed; left: 0; top: 0; z-index: 90; pointer-events: none; padding: 4px 8px; border-radius: 8px; background: var(--ink); color: var(--on-ink);
    font: 600 14px var(--font); box-shadow: var(--shadow-pop); max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl [data-drop] { position: relative; }
  .pl [data-drop="no"] { opacity: .45; }
  .pl [data-drop="ok"] { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .pl [data-drop="ok"][data-over] { background: var(--wash); box-shadow: inset 0 0 0 2px var(--amber); opacity: 1; }
  .pl-drop { display: block; font: 500 11.5px/1.2 var(--font); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl .cal-d .pl-drop { position: absolute; left: 1px; right: 1px; bottom: 1px; font-size: 9px; text-align: center; background: var(--paper); border-radius: 4px; }
  .pl-moving { margin: 4px 0 0; font: 500 12.5px/1.4 var(--font); color: var(--ink); }

  /* ---- the test-day sheet (?print=sheet) */
  .pl-trap { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  .pl-trap:first-of-type { border-top: 0; padding-top: 0; }
  .pl-sheet { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--card-gap); align-items: start; }
  .pl-sheet > #bring { position: sticky; top: 16px; }
  @media (max-width: 1079px) { .pl-sheet { grid-template-columns: minmax(0, 1fr); } .pl-sheet > #bring { position: static; } }
  .pl-stem { font: 400 15px/1.55 var(--serif, var(--font)); color: var(--ink); white-space: pre-line; max-width: 68ch; }
  .pl-choices { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; max-width: 68ch; }
  .pl-choices li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 8px; background: var(--well); font: 400 14.5px/1.4 var(--font); }
  .pl-choices li[data-key] { background: var(--wash); font-weight: 600; }
  .pl-choices li[data-trap] { color: var(--soft); }
  .pl-choices li[data-trap] .c { text-decoration: line-through; text-decoration-color: var(--soft); }
  .pl-trap .help, .pl-trap .line-t { max-width: 68ch; }
  .pl-check .check { min-height: var(--touch); }
  .pl-check .check input { width: 20px; height: 20px; }

  /* ---- phone: overlays are bottom sheets, every tap target 44px (spec 3.6 7) */
  @media (max-width: 759px) {
    body[data-page="plan"] .menu { position: fixed !important; left: 0 !important; right: 0 !important; top: auto !important; bottom: 0 !important; width: auto !important; max-width: none !important;
      max-height: 70vh; overflow-y: auto; border-radius: 12px 12px 0 0; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
    body[data-page="plan"] .menu [role^="menuitem"] { min-height: var(--touch); }
    .trow-sub .chips > button, .pl-banner .chips > button { min-height: var(--touch); }
    .trows .trow { -webkit-touch-callout: none; }
    .pg-cell { height: var(--touch); }
    /* a text link keeps its look and gets a 44px reach */
    .pg a:not(.btn):not(.pill), .pl a.quiet { position: relative; }
    .pg a:not(.btn):not(.pill)::after, .pl a.quiet::after { content: ""; position: absolute; inset: -12px -2px; }
    .pl .btn.sm, .pl .btn.icon, .pl .seg > button, .wz-wd select, .wz-skill .seg > button { min-height: var(--touch); }
    .pl .btn.sm.icon, .pl .btn.icon { min-width: var(--touch); }
    .wz-wd select { height: auto; }
    .pl label.check, .pl .wz-sw, .pg-untried summary { min-height: var(--touch); }
    .pg-utl a { display: inline-block; padding: 8px 0; }
  }

  /* ---- paper (3l): title, the status, phases, every month and the week-by-week list */
  .pl-print { display: none; }
  @media print {
    .pl-panel, .pl-tabbar, .pl-thumb, .pl-banners, [role="status"] { display: none !important; }
    .pl-head::before { content: none; }
    .pl-print { display: block; }
    summary.pl-ph-s::after { content: none; }
    .pl-print .pl-tiles { grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)) !important; margin-top: 12px; }
    .pl-print .pl-tile + .pl-tile { box-shadow: inset 1px 0 0 var(--line) !important; }
    .pl-pcal { width: 100%; border-collapse: separate; border-spacing: 3px; table-layout: fixed; }
    .pl-pcal th { font: 500 10px var(--font); color: var(--soft); text-align: center; }
    .pl-pcal td { height: 44px; padding: 4px 6px; vertical-align: top; border: 1px solid var(--line); border-radius: 6px; break-inside: avoid; }
    .pl-pcal td b { display: block; font: 600 11px var(--font); font-variant-numeric: tabular-nums; }
    .pl-pcal td span { display: block; font: 400 10px var(--font); color: var(--soft); margin-top: 2px; }
    .pl-pcal td.out { border-color: transparent; }
    .pl-pcal td.out b { color: var(--soft); font-weight: 400; }
    .pl-pcal td.test { border: 1.5px solid var(--ink); }
    .pl-pcal td.sat { background: var(--amber); border-color: var(--amber); }
    .pl-pcal tr { break-inside: avoid; }
    .pl-pweek { margin-top: 8px; }
    .pl-pweek ul { margin: 4px 0 0; padding-left: 16px; font: 400 11.5px/1.45 var(--font); }
    .pl-trap { break-inside: avoid; }
    .pl-sheet { display: block; }
    .pl-stem { font-size: 12.5px; }
    .pl-choices li { padding: 2px 8px; font-size: 12px; }
  }
</style>
