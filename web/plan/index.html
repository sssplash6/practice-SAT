<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plan · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* The study plan (spec 3.6, plan.md L1-L21, decisions 4 and 7): the landing, the
     four-step wizard and the plan view in three tabs. Shared pieces are ui.css and
     plan-ui.js; these rules lay the page out. */
  .pl { padding-bottom: 120px; }
  .pl * { min-width: 0; }
  .pl h1, .pl h2, .pl h3, .pl p { margin: 0; }
  .pl-sec { margin-top: 18px; }
  .pl .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .pl .spread { justify-content: space-between; }
  .pl .soft { color: var(--soft); }
  .pl .ink { color: var(--ink); }
  .pl .tag { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--tile-2);
    font: 600 11.5px/1 var(--font); color: var(--ink); white-space: nowrap; }
  .pl .tag.or { background: var(--amber); color: var(--ink-deep); }
  .pl .tag.line { background: none; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .pl .line-t { font: 400 14px/1.5 var(--font); color: var(--ink); }
  .pl .card-head { margin-bottom: 12px; }
  .pl .x { appearance: none; border: 0; background: none; width: 32px; height: 32px; border-radius: 8px; cursor: pointer; color: var(--soft); display: grid; place-items: center; }
  .pl .x:hover { background: var(--tile-2); color: var(--ink); }

  /* ---- title row, tiles */
  .pl-title { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 20px; }
  .pl-title h1 { font: 800 28px/1.1 var(--font); letter-spacing: -.025em; }
  .pl-title .meta { margin-top: 6px; }
  .pl-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
  .pl-tiles .stat { display: grid; align-content: start; gap: 6px; padding: 16px; }
  .pl-big { font: 500 38px/1 var(--mono); letter-spacing: -.03em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pl-big small { font: 500 15px var(--mono); color: var(--soft); letter-spacing: 0; }
  .pl-tiles .stat-sub { margin: 0; }
  .pl-tiles .btn.sm, .pl-tiles .quiet, .pl-tiles .tag { justify-self: start; }
  .pl-big small { white-space: nowrap; }
  .pl-track { position: relative; height: 6px; border-radius: 3px; background: var(--mat); margin: 8px 0 4px; }
  .pl-track > b { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .pl-track > b.gap { background: var(--amber); opacity: .3; }
  .pl-track > b.band { background: var(--ink); opacity: .22; }
  .pl-track > i { position: absolute; top: -4px; width: 3px; height: 14px; margin-left: -1.5px; border-radius: 2px; background: var(--ink); }
  .pl-track > i.t { background: var(--amber); }
  .pl-dots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .pl-dots > span { display: grid; justify-items: center; gap: 3px; font: 500 10px var(--mono); color: var(--soft); }
  .pl-dots i { width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--faint); position: relative; }
  .pl-dots [data-s="done"] i, .pl-dots [data-s="made_up"] i { background: var(--ink); box-shadow: none; }
  .pl-dots [data-s="partial"] i { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .pl-dots [data-s="missed"] i::after { content: ""; position: absolute; left: 2px; right: 2px; top: 4.75px; height: 1.5px; background: var(--soft); }
  .pl-dots [data-today] i { box-shadow: inset 0 0 0 2px var(--amber); }
  .pl-dots [data-today] { color: var(--ink); }
  @media (max-width: 759px) {
    /* the four tiles are one row to swipe, so the day comes straight after the title */
    .pl-tiles { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 14px calc(-1 * var(--gutter)) 0; padding: 0 var(--gutter) 4px;
      scroll-padding: 0 var(--gutter); scrollbar-width: none; }
    .pl-tiles::-webkit-scrollbar { display: none; }
    .pl-tiles > * { flex: 0 0 72%; scroll-snap-align: start; }
    .pl-tiles .stat { padding: 12px; }
    .pl-big { font-size: 26px; }
    .pl-title h1 { font-size: 24px; }
  }

  /* ---- banners, tabs, the changelog */
  .pl-banners { display: grid; gap: 10px; margin-top: 16px; }
  .pl-banners:empty { display: none; }
  .pl-banner { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; padding: 14px 16px; border-radius: 12px;
    background: var(--wash); box-shadow: inset 3px 0 0 var(--amber); }
  .pl-banner > p { font: 500 14.5px/1.45 var(--font); color: var(--ink); align-self: center; }
  .pl-banner .help { margin: 0; grid-column: 1 / -1; }
  .pl-banner .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pl-banner .chips > button { min-height: 34px; font-size: 13px; }
  .pl-tabbar { position: sticky; top: 0; z-index: 6; background: var(--paper); margin-top: 20px; padding: 8px 0; box-shadow: 0 1px 0 var(--line); }
  @media (max-width: 759px) { .pl-tabbar { top: var(--bar, 56px); } }

  /* ---- Plan tab */
  .pl-cols { display: grid; grid-template-columns: minmax(0, 7.5fr) minmax(0, 4.5fr); gap: 16px; align-items: start; margin-top: 16px; }
  .pl-stack { display: grid; gap: 16px; align-content: start; }
  @media (max-width: 1079px) { .pl-cols { grid-template-columns: minmax(0, 1fr); } }
  .pl-dayhead { display: grid; gap: 10px; }
  .pl-dayhead .k { color: var(--ink); }
  .pl-day-go { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-top: 12px; }
  .pl-have { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 12px; }
  .pl-have .k { margin-right: 4px; }
  .pl-have .chips { gap: 6px; }
  .pl-have .chips > button { min-height: 34px; padding: 0 12px; font: 500 13px var(--mono); }
  .pl-trim { margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 8px; }
  .pl-trim p { font: 400 13.5px/1.5 var(--font); }
  .pl-meter { margin-top: 14px; }
  .pl-foot { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .pl-foot > p { font: 600 15px/1.4 var(--font); flex: 1 1 220px; }
  .pl-check { display: grid; gap: 2px; margin-top: 10px; }
  .pl-rest { padding: 18px 0 6px; display: grid; gap: 10px; justify-items: start; }
  .pl-rest p { font: 500 15px/1.45 var(--font); }
  .pl-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  .pl-wd { appearance: none; border: 0; cursor: pointer; display: grid; gap: 4px; align-content: start; padding: 9px 7px; border-radius: 10px;
    background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); text-align: left; color: var(--ink); font: inherit; min-height: 92px; position: relative; }
  .pl-wd .k { letter-spacing: .06em; }
  /* the weekday and the date on two fixed lines in every cell, so the rows below line up */
  .pl-wdn { display: grid; gap: 1px; line-height: 1.15; }
  .pl-wdn .n { font: 500 13px var(--mono); letter-spacing: 0; color: var(--ink); }
  .pl-wdn .short { display: none; }
  @media (max-width: 759px) { .pl-wdn .long { display: none; } .pl-wdn .short { display: inline; } }
  .pl-wd .mono { font-size: 12px; }
  .pl-wd[data-today] { box-shadow: inset 0 3px 0 var(--ink), inset 0 0 0 1px var(--ink); }
  .pl-wd[aria-pressed="true"] { background: var(--wash); box-shadow: inset 0 0 0 2px var(--amber); }
  .pl-wd[data-kind="off"] { background: repeating-linear-gradient(-45deg, var(--paper) 0 5px, var(--mat) 5px 6px); }
  .pl-wd .ic { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .pl-wd[data-kind="test"] .ic { border-radius: 4px; width: 18px; }
  .pl-wd[data-kind="exam"] .ic { box-shadow: none; background: var(--amber); width: auto; height: auto; border-radius: 4px; padding: 1px 5px; font: 600 10px var(--mono); color: var(--ink-deep); }
  .pl-wd[data-kind="rest"] .ic, .pl-wd[data-kind="eve"] .ic, .pl-wd[data-kind="off"] .ic { visibility: hidden; }
  .pl-wd[data-status="done"] .ic, .pl-wd[data-status="made_up"] .ic { background: var(--ink); }
  .pl-wd[data-status="partial"] .ic { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); }
  .pl-wd .wbar { height: 3px; border-radius: 2px; background: var(--mat); overflow: hidden; }
  .pl-wd .wbar > i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--ink); }
  .pl-wd .dotc { position: absolute; top: 6px; right: 6px; }
  @media (max-width: 759px) { .pl-week { gap: 4px; } .pl-wd { padding: 7px 4px; min-height: 80px; } .pl-wd .k { font-size: 9.5px; letter-spacing: .02em; } .pl-wd .mono { font-size: 10.5px; } }
  .pl-weekhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
  .pl-weekhead .h3 { margin-right: auto; }
  .pl-theme { margin-top: 6px; font: 400 13.5px/1.45 var(--font); color: var(--soft); }
  .pl-up { display: grid; }
  .pl-up button { appearance: none; border: 0; background: none; cursor: pointer; text-align: left; padding: 9px 0; border-top: 1px solid var(--line);
    display: grid; gap: 2px; font: inherit; color: var(--ink); }
  .pl-up button:first-child { border-top: 0; }
  .pl-up .d { font: 500 12.5px var(--mono); color: var(--soft); }
  .pl-up .t { font: 500 14px/1.4 var(--font); }
  .pl-up p { padding-top: 8px; border-top: 1px solid var(--line); font: 400 13px/1.5 var(--font); color: var(--soft); }
  .pl-strip19 { display: grid; grid-template-columns: repeat(19, minmax(0, 1fr)); gap: 3px; margin-top: 10px; }
  .pl-strip19 i { height: 16px; border-radius: 3px; box-shadow: inset 0 0 0 1.5px var(--faint); display: grid; place-items: center; font: 600 9px var(--font); font-style: normal; }
  .pl-strip19 i[data-on] { background: var(--ink); color: var(--on-ink); box-shadow: none; }
  .pl-phases { display: grid; gap: 6px; }
  .pl-ph { padding: 10px 12px; border-radius: 10px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 3px; }
  .pl-ph[data-now] { background: var(--wash); box-shadow: inset 3px 0 0 var(--amber); }
  .pl-ph[data-now] b { font-weight: 800; }
  .pl-ph b { font: 700 14px var(--font); }
  .pl-ph .mono { font-size: 11.5px; }
  .pl-ph span:last-child { font: 400 12.5px/1.4 var(--font); }
  .pl-thumb { display: none; }
  .pl-thumb[hidden] { display: none !important; }
  @media (max-width: 759px) {
    .pl-thumb { display: flex; align-items: center; gap: 10px; position: sticky; bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 7;
      margin: 18px calc(-1 * var(--gutter)) 0; padding: 10px var(--gutter); background: var(--paper); box-shadow: 0 -1px 0 var(--line); }
    .pl-thumb p { flex: 1 1 auto; font: 500 13.5px/1.35 var(--font); }
    .pl-thumb p .soft { display: block; font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  }

  /* ---- landing */
  .pl-hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 28px; padding: 36px; border-radius: 18px; background: var(--wash); }
  .pl-hero h1 { font: 800 clamp(30px, 4vw, 44px)/1.05 var(--font); letter-spacing: -.035em; margin-top: 10px; text-wrap: balance; }
  .pl-hero .lead { margin-top: 12px; font: 400 16px/1.5 var(--font); color: var(--soft); max-width: 52ch; }
  .pl-hero .row { margin-top: 22px; }
  .pl-hero .meta { margin-top: 10px; }
  .pl-ready { display: grid; gap: 12px; align-content: start; padding: 18px; border-radius: 14px; background: var(--paper); }
  .pl-ready .cal .cal-key { display: none; }
  .pl .cal.plan.compact .cal-own, .pl .cal.plan.compact .cal-phase { display: none; }
  .pl-mini { display: grid; gap: 10px; align-content: start; }
  .pl-mini .stat { background: var(--paper); }
  .pl-draft { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 14px 16px; border-radius: 12px; background: var(--paper); }
  .pl-draft p { flex: 1 1 240px; font: 500 14.5px/1.4 var(--font); }
  .pl-bank { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .pl-bank .card { display: grid; gap: 8px; align-content: start; }
  .pl-bank .n { font: 500 36px/1 var(--mono); letter-spacing: -.03em; }
  .pl-bank p { font: 400 13.5px/1.45 var(--font); color: var(--soft); }
  .pl-how { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .pl-how .card { display: grid; gap: 8px; align-content: start; }
  .pl-how .num-c { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); font: 500 13px var(--mono); }
  .pl-how p { font: 400 13.5px/1.5 var(--font); color: var(--soft); }
  @media (max-width: 759px) {
    .pl-hero { grid-template-columns: minmax(0, 1fr); padding: 20px; gap: 20px; }
    .pl-mini { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .pl-mini .stat { padding: 10px; }
    .pl-mini .stat-v { font-size: 16px; }
    .pl-bank { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .pl-how { grid-template-columns: minmax(0, 1fr); }
  }

  /* ---- Plans list */
  .pl-plans { display: grid; }
  .pl-prow { display: grid; gap: 6px; padding: 14px 0; border-top: 1px solid var(--line); }
  .pl-prow:first-child { border-top: 0; }
  .pl-prow .h3 { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .pl-prow .acts { display: flex; flex-wrap: wrap; gap: 6px; }
  .pl-dow { display: flex; gap: 4px; flex-wrap: wrap; }
  .pl-dow span { display: grid; justify-items: center; min-width: 34px; padding: 3px 4px; border-radius: 6px; background: var(--tile); font: 500 10.5px var(--mono); color: var(--soft); }
  .pl-dow span b { font-weight: 500; color: var(--ink); }

  /* ---- wizard */
  .wz-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 20px; }
  .wz-top h1 { font: 800 28px/1.1 var(--font); letter-spacing: -.025em; }
  .wz-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }
  .wz-steps button { appearance: none; border: 0; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px;
    background: var(--tile); color: var(--soft); font: 600 14px var(--font); text-align: left; position: relative; min-height: var(--touch); }
  .wz-steps button:disabled { cursor: default; opacity: .6; }
  .wz-steps .c { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--faint); font: 500 12.5px var(--mono); }
  .wz-steps [data-done] { color: var(--ink); }
  .wz-steps [data-done] .c { background: var(--ink); color: var(--on-ink); box-shadow: none; }
  .wz-steps [aria-current="step"] { background: var(--wash); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--amber); }
  .wz-steps [aria-current="step"] .c { box-shadow: inset 0 0 0 1.5px var(--amber); }
  .wz-steps [data-err]::after { content: ""; position: absolute; top: 8px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--ink); }
  .wz-stepname { display: none; margin-top: 10px; font: 600 14px var(--font); }
  .wz-body { display: grid; grid-template-columns: minmax(0, 660px) 320px; gap: 28px; margin-top: 22px; align-items: start; justify-content: space-between; }
  .wz-step { display: grid; gap: 22px; }
  .wz-step > header p { margin-top: 6px; color: var(--soft); font: 400 14.5px/1.5 var(--font); }
  .wz-field { display: grid; gap: 8px; }
  .wz-field > .label { margin: 0; }
  .wz-note { padding: 12px 14px; border-radius: 10px; background: var(--tile); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font: 400 14px/1.45 var(--font); }
  .wz-note p { flex: 1 1 240px; }
  .wz-choice { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .wz-choice button { appearance: none; border: 0; cursor: pointer; text-align: left; padding: 14px; border-radius: 12px; background: var(--tile); display: grid; gap: 4px; font: inherit; color: var(--ink); }
  .wz-choice button[aria-checked="true"] { background: var(--wash); box-shadow: inset 0 0 0 1.5px var(--amber); }
  .wz-choice b { font: 600 15px var(--font); }
  .wz-choice span { font: 400 13px/1.45 var(--font); color: var(--soft); }
  .wz-range { position: relative; height: 40px; }
  .wz-range svg { width: 100%; height: 40px; display: block; overflow: visible; }
  .wz-gain { padding: 18px; border-radius: 14px; background: var(--wash); display: grid; gap: 10px; }
  .wz-gain .row { gap: 10px 16px; }
  .wz-gain .big { font: 500 30px/1 var(--mono); }
  .wz-gain .big.t { color: var(--amber-deep); }
  .wz-dates { display: grid; gap: 6px; }
  .wz-date { appearance: none; border: 0; cursor: pointer; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center;
    padding: 11px 14px; border-radius: 12px; background: var(--tile); font: inherit; color: var(--ink); }
  .wz-date[aria-checked="true"] { background: var(--wash); box-shadow: inset 0 0 0 1.5px var(--amber); }
  .wz-date b { font: 600 15px var(--font); }
  .wz-date .meta { grid-column: 1; font-size: 12.5px; }
  .wz-date .badge { grid-row: 1 / span 2; grid-column: 2; }
  .wz-tiles { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .wz-wd { display: grid; gap: 0; border-radius: 10px; overflow: hidden; background: var(--tile); }
  .wz-wd > button { appearance: none; border: 0; cursor: pointer; display: grid; gap: 2px; justify-items: center; padding: 10px 4px 8px; background: transparent; font: inherit; color: var(--soft); min-height: var(--touch); }
  .wz-wd > button b { font: 600 13.5px var(--font); color: var(--ink); }
  .wz-wd > button span { font: 500 10px var(--mono); letter-spacing: .1em; }
  .wz-wd[data-on] > button { background: var(--wash); color: var(--ink); }
  .wz-wd select { border: 0; border-top: 1px solid var(--line); height: 34px; background: var(--paper); font: 500 12.5px var(--mono); text-align: center; width: 100%; }
  .wz-wd select.diff { text-decoration: underline; text-underline-offset: 3px; }
  .wz-wd .meta { font-size: 10px; text-align: center; padding: 4px 2px 6px; line-height: 1.3; }
  .wz-wd.shake { animation: wzshake .3s; }
  @keyframes wzshake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  @media (prefers-reduced-motion: reduce) { .wz-wd.shake { animation: none; } }
  .wz-rows { display: grid; gap: 0; }
  .wz-dom { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 10px; }
  .wz-dom:first-child { border-top: 0; }
  .wz-dom[data-state="focus"] { background: var(--wash); margin: 0 -14px; padding: 14px; border-radius: 12px; border-top-color: transparent; }
  .wz-dom[data-state="strong"] { box-shadow: inset 0 0 0 1.5px var(--ink); margin: 0 -14px; padding: 14px; border-radius: 12px; }
  .wz-dom-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; }
  .wz-dom-head .meta { font-size: 12px; }
  .wz-skills { display: grid; gap: 0; padding-left: 12px; border-left: 2px solid var(--line); }
  .wz-skill { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 7px 0; }
  .wz-skill .nm { display: flex; align-items: center; gap: 8px; font: 500 14px/1.3 var(--font); }
  .wz-skill .nm .glyph { width: 18px; height: 18px; flex: none; }
  .wz-skill .meta { grid-column: 1; font-size: 12px; }
  .wz-skill .seg { grid-row: 1 / span 2; grid-column: 2; }
  .wz-skill .seg > button { min-height: 32px; padding: 0 9px; font-size: 12.5px; }
  .wz-points { display: grid; gap: 4px; }
