<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tests · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* There is no shelf. A test is built the moment it is started, from
     questions this student has never seen, so the page is two doors and the
     sittings behind them. */
  .doors { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; }
  .door { border-radius: 14px; padding: 28px 28px 26px; display: flex; flex-direction: column; gap: 28px; min-height: 250px; }
  .door.full { background: var(--wash); }
  .door.mod { background: var(--tile); }
  .door .num { font-size: clamp(56px, 7vw, 84px); }
  .door .row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .door .meta { color: var(--ink); }
  .door-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .modules { display: flex; gap: 6px; align-items: center; }
  .modules i { width: 44px; height: 8px; border-radius: 4px; background: var(--ink); display: block; }
  .modules i.two { background: linear-gradient(90deg, var(--ink) 50%, var(--faint) 50%); }
  .door.mod .modules i { width: 44px; }

  .clock {
    appearance: none; border: 0; background: none; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 8px; margin-left: -8px;
    color: var(--ink); font: 500 12.5px var(--mono); border-radius: 8px;
  }
  .clock svg { width: 21px; height: 21px; }
  .clock .hand { stroke: var(--amber); stroke-width: 2.2; }
  .clock[aria-pressed="false"] { color: var(--faint); }
  .clock[aria-pressed="false"] .hand { stroke: currentColor; stroke-width: 1.6; }

  .list { margin-top: 44px; display: grid; gap: 2px; }
  .item {
    display: grid; grid-template-columns: 76px minmax(0, 1fr) auto 20px; gap: 16px; align-items: center;
    padding: 15px 16px; border-radius: 10px; text-decoration: none; color: var(--ink);
    transition: background-color .16s var(--ease);
  }
  @media (hover: hover) and (pointer: fine) { .item:hover { background: var(--tile); } }
  .item .when { font: 500 12.5px var(--mono); color: var(--soft); }
  .item .what { font: 600 15px var(--font); }
  .item .band { font: 800 19px var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .item svg { width: 18px; height: 18px; color: var(--faint); }
  .diag { margin-top: 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  @media (max-width: 759px) { .doors { grid-template-columns: minmax(0, 1fr); } .door { min-height: 0; } }
</style>
</head>
<body data-page="tests">
<header id="bar"></header>

<main class="page">
  <div class="doors">
    <section class="door full rise" aria-label="Full section">
      <div class="row"><span class="num">44</span><span class="meta">questions · 70 min</span></div>
      <div class="modules" aria-hidden="true"><i></i><i class="two"></i></div>
      <div class="door-foot">
        <button type="button" class="clock" id="clock" aria-pressed="true" aria-label="Timed"></button>
        <button type="button" class="pill" id="full">Start</button>
      </div>
    </section>
    <section class="door mod rise rise-2" aria-label="One module">
      <div class="row"><span class="num">22</span><span class="meta">questions · 35 min</span></div>
      <div class="modules" aria-hidden="true"><i></i></div>
      <div class="door-foot">
        <span></span>
        <button type="button" class="quiet" id="mod">Start</button>
      </div>
    </section>
  </div>
  <p class="error" id="err" hidden style="margin-top:14px"></p>

  <div class="list" id="list"></div>
  <div class="diag"><a class="quiet" href="/test/" id="diag">Diagnostic</a><span class="meta">20 questions · 32 min</span></div>
</main>

<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script>
(() => {
  'use strict';
  const { api, h, svg, ICON, band, day, $ } = UI;
  UI.shell();

  let timed = true;
  const clock = $('#clock');
  clock.innerHTML = svg(ICON.clock, 21) + '<span>Timed</span>';
  clock.addEventListener('click', () => {
    timed = !timed;
    clock.setAttribute('aria-pressed', String(timed));
    clock.lastElementChild.textContent = timed ? 'Timed' : 'Untimed';
  });

  async function begin(full, btn) {
    btn.setAttribute('aria-busy', 'true');
    $('#err').hidden = true;
    try {
      const s = await api('/mock/new', { method: 'POST', body: { full, timed } });
      location.href = `/test/?s=${encodeURIComponent(s.id)}`;
    } catch (e) {
      btn.removeAttribute('aria-busy');
      $('#err').textContent = e.message; $('#err').hidden = false;
    }
  }
  $('#full').addEventListener('click', e => begin(true, e.currentTarget));
  $('#mod').addEventListener('click', e => begin(false, e.currentTarget));

  const NAME = { mock: 'Section', module: 'Module', diagnostic: 'Diagnostic' };
  (async () => {
    let hist;
    try { hist = await api('/history'); } catch (_) { return; }
    const tests = hist.sessions.filter(s => NAME[s.kind]);
    $('#list').replaceChildren(...tests.map(s => h('a', { class: 'item', href: `/results/report/?id=${encodeURIComponent(s.id)}` },
      h('span', { class: 'when', text: day(s.finished) }),
      h('span', { class: 'what', text: NAME[s.kind] }),
      h('span', { class: 'band', text: s.estimate ? band(s.estimate) : `${s.right}/${s.asked}` }),
      h('span', { html: svg(ICON.arrow, 18) }))));
  })();
})();
</script>
</body>
</html>
