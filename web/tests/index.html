<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tests · SAT Freshman</title>
<meta name="description" content="Practice tests: your estimated score, every kind of test, shared papers and your sittings.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* Tests (spec 3.4 section 2, tests.md X1-X23; redesign 2026-10-19). Main column: the next test and its Start (the one
     card of its own), then In progress, New test, Papers, Your sittings as sections of one surface. The aside (.twocol):
     the estimate and what moves it, one surface. Everything shared is ui.css; these rules lay the page out. Tokens only. */
  .ts { --twocol-top: 60px; }        /* the aside sticks under the section bar */
  .ts * { min-width: 0; }
  .ts-main { display: grid; gap: var(--card-gap); align-content: start; }
  .ts-sec { scroll-margin-top: 64px; }
  .card-head .h2 { margin: 0; }
  /* one surface each: the sections under the next test, and the estimate with what moves it; a hairline between
     sections (the first one shown has none, whichever of In progress and Test, fix, prove is hidden) */
  .ts-one > .ts-sec:not([hidden]) ~ .ts-sec:not([hidden]) { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--line); }

  /* the header: the title, then (under 1280px, where the aside sits below) the estimate in one line, its band first */
  .ts-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; }
  .ts-head .h1 { margin: 0; }
  .ts-subj { flex-basis: 100%; margin-top: 8px; }     /* the subject switch, on its own line 12px under the title */
  .ts-head { margin-bottom: calc(20px - var(--card-gap)); }     /* and 20px down to the next test */
  .ts-est { font: 500 12.5px/1.4 var(--font); color: var(--soft); font-variant-numeric: tabular-nums; text-decoration: none; }
  .ts-est b { font: 600 16px/1.2 var(--font); letter-spacing: -.01em; color: var(--ink-strong); }
  @media (hover: hover) and (pointer: fine) { .ts-est:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; } }
  @media (min-width: 1280px) { .ts-est { display: none; } }
  /* the next test, the page's one raised hero (.card.hero): what it is, its facts, the page's one primary at the
     right; under them the test's shape (module 1 against the route line at 14, then module 2) or, for a resume,
     what is answered */
  .card.ts-next { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; }
  .nx-text { display: grid; gap: 2px; }
  .nx-text > * { margin: 0; }
  .nx-text > .k { margin-bottom: 2px; }
  .nx-acts { display: flex; flex-flow: row-reverse wrap; align-items: center; gap: 8px 16px; }   /* Start is first in the DOM and sits at the right end */
  .nx-shape { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(var(--mods, 1), minmax(0, 1fr)); gap: 12px 20px; }
  .nx-shape.two { --mods: 2; }
  .nx-acts .pill.done > svg { display: none; }     /* the drawn check takes the play mark's place */
  .nx-plan { font: 500 14.5px var(--font); }

  /* the estimate (aside), number first: the title with which way it moved directly under it, the confidence top
     right; then the band with its scale beside it on one baseline, then how far from the target */
  #score { display: grid; gap: 8px; }
  #score > .card-head { margin-bottom: 0; align-items: flex-start; }
  #score > p { margin: 0; }
  #score > .quiet { justify-self: start; }
  .sc-title { display: grid; gap: 2px; }
  .sc-title > * { margin: 0; }
  .sc-conf { display: inline-flex; align-items: center; gap: 4px; }     /* beside "of 800" (the ghost's Example tag too) */
  .sc-fig { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
  /* the one number the page is about: the band at the hero step (.hero-num) */
  .sc-band { font: 600 var(--fs-hero)/1 var(--font); letter-spacing: -.03em; color: var(--ink-strong); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sc-unit { font: 400 12.5px var(--font); color: var(--soft); }
  .sc-head { font: 500 14.5px/1.45 var(--font); color: var(--ink); }
  .sc-empty { display: flex; align-items: center; gap: 8px; font: 400 14.5px/1.5 var(--font); }
  .sc-chart { min-height: 110px; margin-top: 4px; }
  .sc-ghost { display: grid; gap: 8px; }
  .sc-facts { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 8px 12px; margin: 0; padding-top: 8px; border-top: 1px solid var(--line); }
  .sc-fact dt { margin: 0 0 2px; }
  .sc-fact dd { margin: 0; font: 600 14px/1.3 var(--font); color: var(--ink); font-variant-numeric: tabular-nums; }
  .sc-fact dd a { color: inherit; text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .sc-line { margin: 0; font: 400 14.5px/1.45 var(--font); color: var(--ink); }
  .sc-more > .sc-line { margin-top: 6px; }
  .ts-how { justify-self: start; }

  /* what moves this band (aside): Where points went | Habits */
  .mv-seg { margin-bottom: 12px; }
  .mv-pane { display: grid; gap: 8px; }
  .mv-pane[hidden] { display: none; }
  .mv-pane > p { margin: 0; }
  .mv-rows { margin: 0; padding: 0; list-style: none; display: grid; }
  .mv-row { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 72px auto; align-items: center; gap: 4px 12px; min-height: var(--row-h);
    padding: 4px 0; border-bottom: 1px solid var(--line); font: 400 14.5px/1.35 var(--font); }
  .mv-name { font-weight: 600; }
  .mv-n { font-size: 12.5px; color: var(--soft); }
  .mv-pts { font: 500 14px var(--font); font-variant-numeric: tabular-nums; }
  .mv-fold { margin-top: 8px; }
  .mv-fold > .quiet { margin-top: 4px; }
  .mv-skills { display: grid; }
  .hb-bar { display: flex; flex-wrap: wrap; gap: 8px; }
  .hb-rows { margin: 0; padding: 0; list-style: none; display: grid; }
  .hb-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 64px minmax(0, 300px); align-items: center; gap: 4px 12px; min-height: 44px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .hb-g { display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font: 600 11.5px var(--font); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .hb-row.good .hb-g { box-shadow: inset 0 0 0 1.5px var(--faint); color: var(--soft); }
  .hb-t { display: grid; gap: 2px; }
  .hb-t b { font: 600 14.5px/1.35 var(--font); }
  .hb-ev { font: 400 12.5px/1.4 var(--font); color: var(--soft); }
  .hb-spark { display: inline-flex; color: var(--ink); }
  .hb-acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 12px; }
  .hb-empty { display: flex; align-items: center; gap: 8px; }
  /* the aside is 300px wide (.twocol-side is the size container; ui.css stacks the skill rows in it): rows stack
     their figures and actions under the name */
  @container (max-width: 520px) {
    .sc-band { font-size: 56px; }     /* 64px "520–600" would touch the 300px aside's edge */
    .mv-row { grid-template-columns: minmax(0, 1fr) auto; }
    .mv-row > .mv-n { grid-column: 1; grid-row: 2; }
    .mv-row > .mv-pts { grid-column: 2; grid-row: 1; justify-self: end; }
    .mv-row > :last-child { grid-column: 2; grid-row: 2; justify-self: end; }
    .hb-row { grid-template-columns: 22px minmax(0, 1fr) auto; }
    .hb-row > .hb-acts { grid-column: 2 / -1; justify-content: flex-start; }
  }

  /* Test, fix, prove and In progress */
  .cy-steps { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .cy-seg { display: grid; gap: 4px; align-content: start; justify-items: start; }
  .cy-seg > i { display: block; width: 100%; height: 4px; border-radius: 2px; background: var(--track); }
  .cy-seg.done > i { background: var(--amber); }
  .cy-seg b { font: 600 14.5px var(--font); }
  #cycle > .meter { margin-top: 12px; max-width: 360px; }
  .lv-l > .meter { max-width: 360px; margin: 2px 0; }
  .lv-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 16px; min-height: var(--row-h); padding: 8px 0;
    transition: opacity .18s var(--ease), transform .18s var(--ease); }
  .lv-row + .lv-row { border-top: 1px solid var(--line); }
  .lv-row.out { opacity: 0; transform: translateX(-8px); }
  .lv-l { display: grid; gap: 2px; }
  .lv-l p { margin: 0; }
  .lv-acts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px 16px; }
  @media (prefers-reduced-motion: reduce) { .lv-row { transition: none; } }

  /* New test: one line a kind (name, facts, your result, then Start and ⋯), four of them until "n more kinds"; its
     tags and what it is for open with ⋯. Papers: a tile per paper, its preview (what you should get right in module
     1, against the route line) in a quiet well with the text under it in no box; a row again on a phone. A row's or
     tile's Start and ⋯ show on hover or focus with a mouse (.reveal), always on touch; the next test's keeps them
     out and carries a Next badge */
  .ts-met { margin-left: auto; }
  .ts-met a { color: var(--ink); text-underline-offset: 3px; }
  .ts-list { display: grid; }
  .ts-card { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 16px; min-height: var(--row-h); padding: 8px 0; }
  .ts-card + .ts-card { border-top: 1px solid var(--line); }     /* Full section, the first kind, never folds away */
  .ts-card:focus-visible, .sr-row:focus-visible { border-radius: 6px; }     /* the shared amber-deep ring, rounded */
  /* a kind or a sitting reads as one target: a warm band on hover, 8px past the text, under the row's content */
  .kind, .paper, .sr-row { position: relative; isolation: isolate; }
  .kind::before, .paper::before, .sr-row::before { content: ""; position: absolute; inset: 0 -8px; z-index: -1; border-radius: 8px; background: var(--hover);
    opacity: 0; transition: opacity .14s var(--ease); pointer-events: none; }
  .ts-tiles > .paper::before { inset: -8px; border-radius: 12px; }
  @media (hover: hover) and (pointer: fine) { .kind:hover::before, .paper:hover::before, .sr-row:hover::before { opacity: 1; } }
  .tc-head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; }
  .tc-title { margin: 0; }
  .tc-line { color: var(--ink); }
  .kind .tc-line { margin-left: auto; font-variant-numeric: tabular-nums; }
  .tc-acts { grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: 8px; }
  /* a paper tile: the preview (a quiet well with the 22 blocks alone), then the name and one line of what to expect,
     Start and ⋯ to their right across both lines; no frame around the text */
  .ts-tiles { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px 16px; }     /* 300: the line and Start fit side by side */
  .ts-tiles > .ts-card { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "prev prev" "head acts" "sub acts"; align-content: start; align-items: center;
    gap: 2px 12px; min-height: 0; padding: 0; }
  .ts-tiles > .ts-card + .ts-card { border-top: 0; }
  .ts-tiles .tc-head { grid-area: head; }
  .ts-tiles .tc-acts { grid-area: acts; }
  .tc-sub { grid-area: sub; margin: 0; }
  .tc-prev { grid-area: prev; display: grid; align-content: center; min-height: 44px; margin-bottom: 8px; padding: 0 14px; border-radius: 8px; background: var(--well); }
  .tc-prev .meter-k, .tc-prev .meter-n { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }   /* said once, under the name */
  .tc-prev.none .meter-bar { opacity: .45; }    /* not rated yet: the 22 blocks and the route line, unlit */
  .ts-foot { display: flex; margin-top: 8px; }     /* "n more kinds", "Show all": under the list, on its left edge */
  .ts-foot:empty { display: none; }
  .ts-empty { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 0; }
  .ts-empty p { margin: 0; font: 400 14.5px/1.5 var(--font); }
  /* the paper and sitting filters live behind one Filters button at every width; the sort stays out beside it,
     and the active filters show as chips under the head */
  :is(.filters[aria-label="Paper filters"], .filters[aria-label="Sitting filters"]) > :not(.filters-open):not(.filters-keep) { display: none; }
  :is(.filters[aria-label="Paper filters"], .filters[aria-label="Sitting filters"]) > .filters-open { display: inline-flex; }
  .ts-bar-head { margin-left: auto; }
  #papers > .card-head, #sittings > .card-head { align-items: center; }
  .ts-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .ts-chips[hidden] { display: none; }
  .fchip svg { width: 12px; height: 12px; color: var(--soft); }     /* the drawn x a removable chip ends in */
  .ts-export { display: flex; justify-content: flex-end; margin-top: 8px; }

  /* Your sittings */
  .st-list { display: grid; }
  .sr-row { display: grid; gap: 4px; padding: 8px 0; }
  .sr-row + .sr-row { border-top: 1px solid var(--line); }
  .sr-l1 { display: grid; grid-template-columns: 24px 76px minmax(0, 1fr) minmax(96px, auto) auto; align-items: center; gap: 4px 12px; min-height: var(--row-h); }
  .sr-cmp { display: inline-flex; align-items: center; min-height: 28px; }
  label.sr-cmp { cursor: pointer; }
  .sr-cmp input { margin: 0; cursor: pointer; }     /* ui.css draws the box (18px, amber with a check when ticked) */
  .sr-d { display: grid; gap: 2px; font-variant-numeric: tabular-nums; }
  .sr-d b { font: 600 14px/1.2 var(--font); color: var(--ink); }
  .sr-d span { font: 400 12.5px/1.2 var(--font); color: var(--soft); }
  .sr-k { display: grid; gap: 2px; }
  .sr-k b { font: 600 14.5px/1.3 var(--font); }
  .sr-ks { font: 400 12.5px/1.35 var(--font); color: var(--soft); font-variant-numeric: tabular-nums; }
  .sr-s { display: grid; gap: 2px; justify-items: start; }
  .sr-band { font: 600 16px/1.1 var(--font); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .sr-chips, .sr-mg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .sr-miss { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .sr-mg .k { margin-right: 2px; }
  .sr-l2 { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-left: 36px; }
  .sr-l2:empty { display: none; }
  .sr-acts { display: flex; align-items: center; gap: 8px; }
  .sr-note { margin: 0; font: 400 14.5px/1.45 var(--font); color: var(--ink); }
  .sr-ed { display: grid; gap: 8px; margin-left: 36px; max-width: 560px; }
  .sr-ed-acts { display: flex; align-items: center; gap: 12px; justify-content: flex-end; }
  .st-cmp { margin-top: 12px; }

  /* the sheets: start (start.js), the paper (talk.js), share, compare (compare.js), how scoring works */
  .start-sheet .sheet-body { display: grid; gap: 16px; }
  .st-steps { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
  .st-steps:has(> :nth-child(2):last-child) { --n: 2; }
  .st-step { display: grid; gap: 6px; }
  .st-step > i { height: 4px; border-radius: 2px; background: var(--track); }
  .st-step.on > i { background: var(--amber); }
  .st-step-l { font: 600 12.5px var(--font); color: var(--soft); background: none; border: 0; padding: 0; text-align: left; }
  button.st-step-l { cursor: pointer; color: var(--ink); text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 3px; }
  .st-step[aria-current] .st-step-l { color: var(--ink); }
  .st-pane { display: grid; gap: 8px; align-content: start; }
  :is(.st-pane, .share-sheet .sheet-body, .sh-pane) > .seg { justify-self: start; }     /* a seg is as wide as its options, not the sheet */
  .st-h { margin: 8px 0 0; display: flex; align-items: center; gap: 6px; font: 600 14.5px var(--font); }
  .st-pane .help { margin: 0; }
  .st-presets { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .st-presets .label { margin: 0; }
  /* the kinds, modules, timings and traps are .choice-row toggles; a two-line one holds its name and facts in .st-ct */
  .st-cards { display: grid; gap: 4px; }     /* one calm list of kinds */
  .st-ct { display: grid; gap: 2px; padding: 2px 0; }
  .st-radios, .st-mods { display: grid; gap: 4px; }
  .st-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .st-row .meta { margin: 0; }
  .st-field { display: grid; gap: 4px; max-width: 420px; }
  .st-num { width: 96px; }
  .st-skills { display: grid; gap: 12px; }
  .st-domain { display: grid; gap: 6px; }
  .st-dom { justify-self: start; font-weight: 600; }
  .st-dom[aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--amber); text-underline-offset: 4px; }
  .st-sw { display: flex; align-items: center; gap: 4px; }
  .st-traps { display: grid; gap: 4px; max-height: 320px; overflow-y: auto; }
  .st-aids { margin: 8px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  .st-save { margin-top: 8px; }
  /* the start sheet's foot is the dialog's own .sheet-foot, outside the scroll: Back, the summary, Start / Next */
  .st-foot .st-err { flex: 1 0 100%; order: -1; margin: 0; }
  .st-sum { flex: 1 1 200px; margin: 0 auto 0 0; font-size: 12.5px; color: var(--soft); }
  .st-go { display: inline-flex; gap: 8px; align-items: center; }
  .tk-box { display: grid; gap: 12px; }
  .tk-panel { display: grid; gap: 12px; align-content: start; outline: none; }
  .tk-panel[hidden] { display: none; }
  .tk-gate { max-width: 52ch; }
  .tk-src { margin: 0; }
  .tk-tops { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .tk-top { display: grid; gap: 8px; align-content: start; padding: 12px 16px; border-radius: var(--radius); background: var(--well); }
  .tk-top .k { margin: 0; }
  .tk-traps { margin: 0; padding-left: 18px; display: grid; gap: 4px; font: 400 14.5px/1.45 var(--font); }
  .tk-cheap { display: flex; flex-wrap: wrap; gap: 6px; }
  .tk-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tk-group { margin: 4px 0 0; }
  .tk-rows { margin: 0; padding: 0; list-style: none; display: grid; }
  .tk-row { padding: 4px 0 8px; border-bottom: 1px solid var(--line); }
  .tk-head { display: grid; grid-template-columns: 96px minmax(0, 1fr) minmax(0, 200px) 64px; align-items: center; gap: 4px 12px; width: 100%; min-height: 44px;
    padding: 6px 4px; border: 0; border-radius: 8px; background: none; color: var(--ink); text-align: left; cursor: pointer; font: 400 14.5px var(--font); }
  @media (hover: hover) and (pointer: fine) { .tk-head:hover { background: var(--hover); } }
  .tk-slot { font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .tk-topic { display: grid; gap: 2px; }
  .tk-topic b { font: 600 14.5px/1.3 var(--font); }
  .tk-tier { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--soft); }
  .tk-right { display: grid; gap: 2px; }
  .tk-rt { font: 600 14px var(--font); font-variant-numeric: tabular-nums; }
  .tk-bar-r { display: block; height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .tk-bar-r i { display: block; height: 100%; background: var(--ink); }
  .tk-you { display: inline-flex; align-items: center; gap: 4px; font: 500 12.5px var(--font); color: var(--soft); }
  .tk-you b { font: 600 14px var(--font); color: var(--ink); }
  .tk-lines { display: grid; gap: 2px; padding: 0 4px 0 112px; }
  .tk-lines p { margin: 0; }
  .tk-trap { font: 400 14px/1.45 var(--font); color: var(--ink); }
  .tk-trap.soft { color: var(--soft); }
  .tk-more { display: grid; gap: 8px; padding: 8px 4px 4px 112px; }
  .tk-acts, .tk-pa { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; }
  .tk-pa .quiet { font-size: 14px; }
  .tk-pa [aria-pressed="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--amber); text-underline-offset: 4px; }
  .tk-posts { display: grid; }
  .tk-post { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .tk-post.reply { padding: 8px 0 8px 12px; border-bottom: 0; box-shadow: inset 2px 0 0 var(--line); }
  .tk-replies { display: grid; gap: 2px; margin-top: 4px; }
  .tk-ph { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .tk-ph b { font: 600 14px var(--font); }
  .tk-when { font-size: 12.5px; color: var(--soft); }
  .tk-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 400 14.5px/1.5 var(--font); }
  .tk-edit { display: grid; gap: 6px; }
  .tk-edit-acts { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .tk-empty { margin: 8px 0; }
  /* the composer sticks to the bottom of the sheet's scroll, inside its padding (no bleed to fight the sheet's) */
  .tk-compose { position: sticky; bottom: 0; z-index: 1; display: grid; gap: 8px; margin-top: 4px; padding: 12px 0; background: var(--paper); box-shadow: inset 0 1px 0 var(--line); }
  .tk-comp-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: end; }
  .tk-comp-row textarea { resize: vertical; min-height: 64px; }
  .tk-comp-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .tk-comp-meta select { max-width: 220px; }
  .tk-name { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tk-name[hidden], .tk-reply[hidden] { display: none; }
  .tk-name .k { margin: 0; }
  .tk-name input { width: 180px; }
  .tk-reply { margin: 0; display: flex; gap: 12px; align-items: center; }
  .share-sheet .sheet-body { display: grid; gap: 12px; }
  .sh-pane { display: grid; gap: 12px; }
  .sh-pane[hidden], .sh-race[hidden] { display: none; }
  .sh-pane .help, .share-sheet .k { margin: 0; }
  .sh-link { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
  .sh-race { display: grid; gap: 12px; }
  .sh-code { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
  .sh-code b { font-size: 16px; letter-spacing: .08em; }
  .cmp-sheet .sheet-body { display: grid; gap: 12px; }
  .cmp-wrap { overflow-x: auto; }
  .cmp-facts th.k { font-weight: 600; }
  .cmp-facts td, .cmp-slots td:first-child, .cmp-dom > span { font-variant-numeric: tabular-nums; }
  .cmp-facts tr.diff td, .cmp-slots tr.diff td { font-weight: 600; }
  .cmp-more { display: grid; gap: 8px; }
  .cmp-more > .k { margin: 8px 0 0; }
  .cmp-sum { margin: 0; font: 600 14.5px var(--font); }
  .cmp-m { font: 600 14px var(--font); }
  .cmp-m.blank { color: var(--soft); }
  .cmp-doms { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .cmp-doms li { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4px 12px; align-items: center; font: 400 14.5px var(--font); }
  .cmp-dom { display: grid; gap: 2px; font-size: 12.5px; }
  .cmp-bar { display: block; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .cmp-bar i { display: block; height: 100%; background: var(--ink); }
  .cmp-group { display: grid; gap: 6px; }
  .cmp-gh { display: flex; align-items: center; gap: 12px; }
  .cmp-types { margin: 0; padding-left: 18px; display: grid; gap: 4px; font: 400 14.5px/1.45 var(--font); }
  .cmp-types li { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .cmp-acts { display: flex; gap: 12px; }
  /* how scoring works: module 1 forks to the harder module 2 (amber) or the easier one (ink), drawn */
  .hs-route { display: grid; grid-template-columns: auto 56px minmax(0, 1fr); align-items: stretch; margin-bottom: 12px; }
  .hs-route > .hs-box { align-self: center; }
  .hs-forkbox { position: relative; }
  .hs-fork { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .hs-fork path { fill: none; stroke-width: 1.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .hs-fork .up { stroke: var(--amber); }
  .hs-fork .down { stroke: var(--faint); }
  .hs-split { display: grid; gap: 8px; align-content: center; }
  .hs-box { display: inline-block; justify-self: start; padding: 6px 10px; border-radius: 8px; background: var(--well); font: 600 12.5px/1.35 var(--font); }
  .hs-box.on { background: var(--wash); box-shadow: inset 0 0 0 1px var(--amber); }
  .hs-list { margin: 0; padding-left: 18px; display: grid; gap: 8px; font: 400 14.5px/1.5 var(--font); }

  @media (max-width: 759px) {
    .ts-sec { scroll-margin-top: 108px; }
    .card.ts-next { grid-template-columns: minmax(0, 1fr); }
    .nx-acts > .pill { flex: 1 0 100%; }     /* Start full width, its quiet links under it */
    .nx-shape.two { --mods: 1; }     /* 22 blocks each need the full width */
    .nx-acts { flex-direction: row; }
    .cy-steps { grid-template-columns: 1fr; }
    .lv-row { grid-template-columns: 1fr; }
    .lv-acts { justify-content: flex-start; }
    /* a paper on a phone is a row again: its name and Start, the line under it, then the blocks out of their well */
    .ts-tiles { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .ts-tiles > .ts-card { grid-template-areas: "head acts" "sub acts" "prev prev"; padding: 8px 0; }
    .ts-tiles > .ts-card + .ts-card { border-top: 1px solid var(--line); }
    .ts-tiles > .paper::before { inset: 0 -8px; }
    .tc-prev { min-height: 0; margin: 6px 0 0; padding: 0; background: none; }
    .kind .tc-line { margin-left: 0; }     /* your result flows after the facts, not floating mid-row */
    /* "No traps ready yet" goes under the facts like the other rows' results; ⋯ stays at the row's end */
    .kind.reveal-host { grid-template-areas: "head more" "stat stat"; }
    .kind.reveal-host > .tc-head { grid-area: head; }
    .kind.reveal-host > .tc-acts { display: contents; }
    .kind.reveal-host > .tc-acts > .meta { grid-area: stat; }
    .kind.reveal-host > .tc-acts > .ibtn { grid-area: more; }
    /* a sitting on a phone: tick, what it was and its band; the date and minutes; the actions; nothing dropped */
    .sr-l1 { grid-template-columns: 24px minmax(0, 1fr) auto; }
    .sr-l1 > .sr-cmp { grid-column: 1; grid-row: 1; }
    .sr-l1 > .sr-k { grid-column: 2; grid-row: 1; }
    .sr-l1 > .sr-s { grid-column: 3; grid-row: 1; justify-items: end; text-align: right; }
    .sr-l1 > .sr-d { grid-column: 2 / -1; grid-row: 2; display: flex; flex-wrap: wrap; gap: 6px; }
    .sr-l1 > .sr-d b { font: 400 12.5px/1.2 var(--font); color: var(--soft); }
    .sr-l1 > .sr-d span:not(:empty)::before { content: "· "; }
    .sr-l1 > .sr-acts { grid-column: 2 / -1; grid-row: 3; }
    .sr-l2, .sr-ed { margin-left: 0; }
    .st-go { flex: 1 0 100%; justify-content: flex-end; }
    .st-go .pill { flex: 1 1 auto; }
    .tk-head { grid-template-columns: 72px minmax(0, 1fr) auto; }
    .tk-head > .tk-right { grid-column: 2 / 3; grid-row: 2; }
    .tk-head > .tk-you { grid-row: 1; grid-column: 3; }
    .tk-lines, .tk-more { padding-left: 4px; }
    .tk-comp-meta select { max-width: 60%; }
    .cmp-doms li { grid-template-columns: 1fr 1fr; }
    .cmp-doms li > b { grid-column: 1 / -1; }
  }
</style>
</head>
