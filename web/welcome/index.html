<style>
  /* Welcome: the Sign in card (.si, me.css) with a name and an email */
  .wl-lead { margin: 0; font: 400 14.5px/1.5 var(--font); color: var(--soft); }
  .wl-form { display: grid; gap: 12px; }
  .wl-form .pill { justify-self: stretch; }
  .wl-note { margin: -4px 0 0; font: 400 12.5px/1.45 var(--font); color: var(--soft); }
  .wl-swap { margin: 0; font: 400 14px/1.45 var(--font); color: var(--soft); }
  .wl-skip { padding-top: 16px; border-top: 1px solid var(--line); }   /* the way past the form, under a hairline, on the card's one left edge */
  .wl-skip .quiet { color: var(--soft); }
</style>
</head>
<body data-page="welcome">
<header id="bar"></header>
<main class="page me" id="main" tabindex="-1">
  <div class="si" data-m="stagger">
    <section class="card hero" id="card" data-m-now aria-labelledby="si-h">
      <div class="si-head"><span id="mark"></span><h1 class="h1" id="si-h">Welcome to SAT Freshman</h1></div>
      <div id="body"></div>
    </section>
  </div>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/me/account.js"></script>
<script src="/welcome/welcome.js"></script>
</body>
