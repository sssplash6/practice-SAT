<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Welcome · SAT Freshman</title>
<meta name="description" content="Make a free account or sign in with an email code. No password.">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/me/me.css">
<style>
  /* Sign in (Shell 5; shell-me U19, U19b, U20, U21): one centred card */
  .si { max-width: 440px; margin: 8px auto 96px; }
  .si .card { display: grid; gap: 16px; }
  .si-head { display: flex; align-items: center; gap: 12px; }
  .si-head svg { width: 32px; height: 32px; }
  .si-panel { display: grid; gap: 12px; min-height: 120px; align-content: start; }
  .si-panel .field { width: 100%; }
  .si .qr { display: grid; justify-items: center; gap: 10px; padding: 16px; border-radius: var(--radius); background: var(--paper); }
  .si .qr svg { width: 180px; height: 180px; }
  .si .code-big { text-align: center; }
  .si .check { font-size: 14px; }
  .si-google:empty { display: none; }
  .wl-lead { margin: 0; font: 400 15px/1.5 var(--font); color: var(--soft); }
  .wl-form { display: grid; gap: 12px; }
  .wl-form .pill { justify-self: stretch; height: 44px; border-radius: 10px; }
  .wl-skip { text-align: center; padding-top: 4px; }
  .wl-skip .quiet { color: var(--soft); }
  @media (max-width: 759px) { .si { margin-top: 0; } }
</style>
</head>
<body data-page="welcome">
<header id="bar"></header>
<main class="page me" id="main" tabindex="-1">
  <div class="si">
    <section class="card" id="card" aria-labelledby="si-h">
      <div class="si-head"><span id="mark"></span><h1 class="h1" id="si-h">Welcome to SAT Freshman</h1></div>
      <div id="body"></div>
    </section>
  </div>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/me/account.js"></script>
<script src="/welcome/welcome.js"></script>
</body>
</html>
