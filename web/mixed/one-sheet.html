<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mixed practice, one sheet · SAT Freshman</title>
<meta name="description" content="One sheet of topics, four to a line, each opening to its own sticker.">
<link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .stage > svg.scene { --scene-max: 940px; aspect-ratio: 960 / 660; --scene-ratio: 1.4545; }
  .sheet { fill:#F7F5F0; stroke:var(--ink); stroke-width:1.5; transition: height .34s var(--ease); }
  .band { font:700 10px var(--mono); fill:var(--ink); letter-spacing:.16em; text-transform:uppercase; }
  .bandrule { stroke:var(--line); stroke-width:1; }

  /* closed, a topic is only its name. The sheet is a list until you open one. */
  .cell { cursor:pointer; transition: transform .34s var(--ease); }
  .name { font:500 9px var(--mono); fill:var(--soft); letter-spacing:.02em; transition: fill .18s var(--ease); }
  .caret { fill:none; stroke:var(--faint); stroke-width:1.3; stroke-linecap:round; stroke-linejoin:round;
           transition: transform .28s var(--ease), stroke .18s var(--ease); transform-box:fill-box; transform-origin:center; }
  .cell:hover .name { fill:var(--ink); }
  .cell:hover .caret { stroke:var(--ink); }
  .cell.open .name { fill:var(--ink); font-weight:500; }
  .cell.open .caret { transform: rotate(180deg); stroke:var(--ink); }

  .bandg { transition: transform .34s var(--ease); }

  /* open, it drops a panel: the drawing, and the count you are building */
  .panel { transition: opacity .26s var(--ease), transform .3s var(--ease); transform-box:fill-box; transform-origin:top center; }
  .panel[data-open="0"] { opacity:0; transform: translateY(-6px) scale(.97); pointer-events:none; }
  .panel[data-open="1"] { opacity:1; transform:none; }
  .panelbg { fill:#fff; stroke:var(--line); stroke-width:1; }
  .step { cursor:pointer; }
  .stepbg { fill:#F7F5F0; stroke:var(--line); stroke-width:1; transition: fill .16s var(--ease), stroke .16s var(--ease); }
  .step:hover .stepbg { fill:#fff; stroke:var(--faint); }
  .stepg { fill:none; stroke:var(--ink); stroke-width:1.5; stroke-linecap:round; }
  .step[data-off="1"] { cursor:default; opacity:.35; pointer-events:none; }
  .count { font:700 13px var(--font); fill:var(--ink); font-variant-numeric:tabular-nums; }
  .count[data-zero="1"] { fill:var(--faint); }

  .stk { fill:#FBFAF7; stroke:var(--ink); stroke-width:1.3; stroke-linejoin:round; }
  .stki { fill:none; stroke:var(--ink); stroke-width:.9; opacity:.55; stroke-linecap:round; }
  .stkl { fill:none; stroke:var(--ink); stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  .stkd { fill:var(--ink); }

  .page { fill:#fff; stroke:var(--ink); stroke-width:1.5; }
  .rule { stroke:var(--line); stroke-width:1; }
  .total { font:900 46px var(--font); fill:var(--amber); letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
  .lbl { font:500 10px var(--mono); fill:var(--soft); letter-spacing:.14em; text-transform:uppercase; }
  .placed { cursor:pointer; } .placed:hover { opacity:.55; }
  .fly .stk { fill:#fff; stroke:var(--amber); stroke-width:1.6; } .fly .stki { stroke:var(--amber); opacity:.9; } .fly .stkl { stroke:var(--amber); } .fly .stkd { fill:var(--amber); }
  @media (prefers-reduced-motion: reduce) { .cell, .bandg, .panel, .sheet { transition: none; } }
</style>
</head>
<body data-nav="mixed">

<a class="skip" href="#main">Skip to content</a>

<div class="app">
  <aside class="rail"></aside>

  <main class="main" id="main">
    <header class="head">
      <button class="rail-toggle" type="button" aria-label="Show navigation" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <h1 class="head-title">Mixed practice, one sheet</h1>
    </header>

    <section class="stage rise">
      <svg class="scene" id="scene" viewBox="0 0 960 660" aria-hidden="true">
        <g id="board">
          <g id="sheet"></g>
          <g id="pageG" style="cursor:pointer">
            <rect class="page" id="pageRect" x="620" y="30" width="240" height="400" rx="4"/>
            <g id="rules"></g>
            <g id="page"></g>
            <text class="total" id="total" x="740" y="0" text-anchor="middle">0</text>
            <text class="lbl" id="totalLbl" x="740" y="0" text-anchor="middle">questions</text>
          </g>
        </g>

      </svg>
      <button class="btn" type="button" id="go" disabled>Build a set</button>
    </section>
  </main>
</div>

<script src="../assets/app.js"></script>
<script>
const NS='http://www.w3.org/2000/svg', reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const txt=(p,x,y,s,cls,a={})=>{const t=el('text',{x,y,class:cls,'dominant-baseline':'middle',...a},p);t.textContent=s;return t;};
const lerp=(a,b,k)=>a+(b-a)*k, easeIn=k=>k*k*k, easeOut=k=>1-Math.pow(1-k,3);
const tween=(ms,fn,ease=easeOut)=>new Promise(r=>{if(reduce){fn(1);return r();}const t0=performance.now();(function s(n){const k=Math.min(1,(n-t0)/ms);fn(ease(k));k<1?requestAnimationFrame(s):r();})(t0)});
const $=id=>document.getElementById(id);

/* one glyph per topic, each a small diagram of the thing itself. Drawn around (0,0), about 20px across. */
const poly=(n,r,rot=-90)=>Array.from({length:n},(_,i)=>{const a=(rot+i*360/n)*Math.PI/180;return (r*Math.cos(a)).toFixed(2)+','+(r*Math.sin(a)).toFixed(2);}).join(' ');
const star=(r,ri)=>Array.from({length:10},(_,i)=>{const a=(-90+i*36)*Math.PI/180,rr=i%2?ri:r;return (rr*Math.cos(a)).toFixed(2)+','+(rr*Math.sin(a)).toFixed(2);}).join(' ');

const SHAPES={
  /* Algebra */
  numberline: g=>{ el('path',{class:'stkl',d:'M-10 2 H10 M-6 -1 V5 M0 -1 V5 M6 -1 V5'},g); el('circle',{class:'stkd',cx:3,cy:2,r:2.6},g); },          // one solution on a number line
  graphline:  g=>{ el('path',{class:'stki',d:'M-9 7 H9 M-7 9 V-9'},g); el('path',{class:'stkl',d:'M-9 6 L9 -7'},g); },                             // a line on axes
  slope:      g=>{ el('path',{class:'stkl',d:'M-9 7 L9 -7'},g); el('path',{class:'stki',d:'M-3 2.3 H4.6 V-3.6'},g); },                               // rise over run
  cross:      g=>{ el('path',{class:'stkl',d:'M-9 -6 L9 8 M-9 8 L9 -6'},g); el('circle',{class:'stkd',cx:0,cy:1,r:2.4},g); },                       // two lines, one solution
  ray:        g=>{ el('path',{class:'stkl',d:'M-10 2 H10'},g); el('path',{class:'stkl',d:'M-.4 2 H9','stroke-width':3.2},g); el('circle',{class:'stk',cx:-3,cy:2,r:2.8},g); }, // an open circle and a shaded ray
  /* Advanced Math */
  equiv:      g=>el('path',{class:'stkl',d:'M-7 -5 H7 M-7 0 H7 M-7 5 H7','stroke-width':1.8},g),                                                    // identically equal
  curveline:  g=>{ el('path',{class:'stkl',d:'M-9 8 Q0 -14 9 8'},g); el('path',{class:'stkl',d:'M-10 1 H10'},g); el('circle',{class:'stkd',cx:-5.4,cy:1,r:2.1},g); el('circle',{class:'stkd',cx:5.4,cy:1,r:2.1},g); }, // a line meeting a curve
  parabola:   g=>{ el('path',{class:'stki',d:'M-9 6 H9 M0 9 V-9'},g); el('path',{class:'stkl',d:'M-8 -8 Q0 14 8 -8'},g); },                          // a parabola on axes
  /* Data */
  balance:    g=>{ el('path',{class:'stkl',d:'M0 -8 V8 M-8 -5 H8 M-5 9 H5'},g); el('path',{class:'stki',d:'M-8 -5 L-10.5 1 M-8 -5 L-5.5 1 M8 -5 L10.5 1 M8 -5 L5.5 1 M-11 1.5 H-5 M5 1.5 H11'},g); }, // a balance
  percent:    g=>{ el('circle',{class:'stk',cx:-5,cy:-5,r:3},g); el('circle',{class:'stk',cx:5,cy:5,r:3},g); el('path',{class:'stkl',d:'M-8 9 L8 -9'},g); }, // %
  bars:       g=>{ el('rect',{class:'stk',x:-9,y:1,width:5,height:8},g); el('rect',{class:'stk',x:-2.5,y:-6,width:5,height:15},g); el('rect',{class:'stk',x:4,y:-2,width:5,height:11},g); el('path',{class:'stki',d:'M-11 9.5 H11'},g); }, // a histogram
  scatter:    g=>{ el('path',{class:'stki',d:'M-9 8 H9 M-9 8 V-9'},g); el('path',{class:'stki',d:'M-8 6 L8 -6'},g); [[-5,4],[-2,1.5],[1,-.5],[3,-4],[6,-2.5]].forEach(([x,y])=>el('circle',{class:'stkd',cx:x,cy:y,r:1.7},g)); }, // a scatterplot with its fit
  die:        g=>{ el('rect',{class:'stk',x:-9,y:-9,width:18,height:18,rx:3},g); [[-4.5,-4.5],[0,0],[4.5,4.5]].forEach(([x,y])=>el('circle',{class:'stkd',cx:x,cy:y,r:1.8},g)); }, // a die
  errorbar:   g=>{ el('path',{class:'stkl',d:'M-9 0 H9 M-9 -3.5 V3.5 M9 -3.5 V3.5'},g); el('circle',{class:'stkd',cx:0,cy:0,r:2.8},g); },            // an estimate and its margin
  magnifier:  g=>{ el('circle',{class:'stk',cx:-2,cy:-2,r:6.5},g); el('path',{class:'stkl',d:'M2.8 2.8 L9 9','stroke-width':2.4},g); },                // look closely
  /* Geometry */
  cube:       g=>{ el('polygon',{class:'stk',points:poly(6,10.5,-90)},g); el('path',{class:'stki',d:'M0 0 L0 10.5 M0 0 L-9.1 -5.25 M0 0 L9.1 -5.25'},g); },
  angle:      g=>{ el('path',{class:'stk',d:'M-9 8 L2 -9 L9 8 z','fill-opacity':0},g); el('path',{class:'stki',d:'M-1.26 -3.96 A6 6 0 0 0 4.29 -3.45'},g); },
  right:      g=>{ el('polygon',{class:'stk',points:'-9,9 9,9 9,-9'},g); el('path',{class:'stki',d:'M9 5 h-4 v4'},g); },
  dotcircle:  g=>{ el('circle',{class:'stk',r:9.5},g); el('circle',{class:'stkd',r:1.6},g); },

  /* Reading and Writing: the same hand, drawn from what each question asks you
     to do with a text rather than from the grammar it tests */
  centralidea: g=>{ el('path',{class:'stki',d:'M-7 -6 H9 M-7 6 H6'},g); el('path',{class:'stkl',d:'M-7 0 H9'},g); el('circle',{class:'stkd',cx:-10,cy:0,r:1.9},g); },  // the line that carries it
  citation:    g=>{ el('path',{class:'stkl',d:'M-9.5 -8 V8','stroke-width':2.4},g); el('path',{class:'stki',d:'M-5 -5 H9 M-5 0 H9 M-5 5 H4'},g); },                     // a passage, marked
  evidencedata:g=>{ el('rect',{class:'stk',x:-10,y:-1,width:4,height:9},g); el('rect',{class:'stk',x:-4.5,y:-7,width:4,height:15},g); el('path',{class:'stki',d:'M3 -4 H10 M3 1 H10 M3 6 H8'},g); },
  therefore:   g=>{ [[0,-6],[-5.2,4],[5.2,4]].forEach(([x,y])=>el('circle',{class:'stkd',cx:x,cy:y,r:2.1},g)); },                                                        // the inference mark
  slotword:    g=>{ el('path',{class:'stkl',d:'M-11 0 H-5.5 M5.5 0 H11'},g); el('rect',{class:'stk',x:-5,y:-4.2,width:10,height:8.4,rx:1.8},g); },                      // a word in its sentence
  outline:     g=>{ el('path',{class:'stki',d:'M-9 -7 V7'},g); el('path',{class:'stkl',d:'M-5 -6 H9 M-1 0 H9 M3 6 H9'},g); },                                          // how a text is built
  crosstext:   g=>{ el('rect',{class:'stk',x:-10.5,y:-7,width:8,height:14,rx:1.4},g); el('rect',{class:'stk',x:2.5,y:-7,width:8,height:14,rx:1.4},g); el('path',{class:'stkl',d:'M-2.5 0 H2.5'},g); },
  converge:    g=>{ el('path',{class:'stki',d:'M-11 -6 h5 M-11 0 h5 M-11 6 h5'},g); el('path',{class:'stkl',d:'M-4 0 H10 M6.6 -3.2 L10 0 L6.6 3.2'},g); },             // notes into one line
  bridge:      g=>{ el('rect',{class:'stk',x:-10.5,y:2,width:7.5,height:7.5,rx:1.4},g); el('rect',{class:'stk',x:3,y:2,width:7.5,height:7.5,rx:1.4},g); el('path',{class:'stkl',d:'M-6.8 1.4 q6.8 -11 13.6 0'},g); },
  colon:       g=>{ el('path',{class:'stkl',d:'M-11 0 H-3.5 M3.5 0 H11'},g); el('circle',{class:'stkd',cx:0,cy:-3,r:1.9},g); el('circle',{class:'stkd',cx:0,cy:3,r:1.9},g); },
  caret:       g=>{ el('path',{class:'stkl',d:'M-10 -3 H10'},g); el('path',{class:'stkl',d:'M-4 7 L0 0.5 L4 7'},g); },                                                  // the proofreader's mark
};

const TOPICS_BY_SUBJECT = {
  math: [
    ['Algebra',       [['Linear eqs','linear_equations_in_one_variable','numberline'],['Lines','linear_equations_in_two_variables','graphline'],['Linear fn','linear_functions','slope'],['Systems','systems_of_linear_equations','cross'],['Inequalities','linear_inequalities','ray']]],
    ['Advanced Math', [['Expressions','equivalent_expressions','equiv'],['Nonlin. eqs','nonlinear_equations_and_systems','curveline'],['Nonlinear fn','nonlinear_functions','parabola']]],
    ['Data',          [['Ratios','ratios_rates_proportions_and_units','balance'],['Percents','percentages','percent'],['1-var data','one_variable_data','bars'],['2-var data','two_variable_data','scatter'],['Probability','probability','die'],['Samples','sample_statistics_and_margin_of_error','errorbar'],['Claims','evaluating_statistical_claims','magnifier']]],
    ['Geometry',      [['Area/volume','area_and_volume','cube'],['Angles','lines_angles_and_triangles','angle'],['Trig','right_triangles_and_trigonometry','right'],['Circles','circles','dotcircle']]],
  ],
  verbal: [
    ['Information and Ideas', [['Central ideas','central_ideas_and_details','centralidea'],['Evidence, text','command_of_evidence_textual','citation'],['Evidence, data','command_of_evidence_quantitative','evidencedata'],['Inferences','inferences','therefore']]],
    ['Craft and Structure',   [['Words in context','words_in_context','slotword'],['Structure','text_structure_and_purpose','outline'],['Cross-text','cross_text_connections','crosstext']]],
    ['Expression of Ideas',   [['Synthesis','rhetorical_synthesis','converge'],['Transitions','transitions','bridge']]],
    ['Conventions',           [['Boundaries','boundaries','colon'],['Form and sense','form_structure_and_sense','caret']]],
  ],
};

/* ---------------------------------------------------------------- the sheet
   Closed, a topic is only its name, four to a line. Tapping one drops a panel
   under it with the drawing and the count, and the rows below slide down to
   make room. The sheet is a list you read first and a set of stickers second. */
const SHEET={x:70,y:30,w:460,pad:20,top:20,bot:18};
const CELL={w:105,h:30}, COLS=4, BAND_H=26, BAND_GAP=12, PANEL={w:97,h:80,gap:6};
const PAGE={x:620,y:30,w:240}, SLOT={cols:6,dx:36,dy:34,x0:650,y0:62};

const sticker=(p,shape,cls='')=>{ const g=el('g',{class:cls},p); SHAPES[shape](g); return g; };

const basket={}; let total=0, CAP=0;
let bands=[], stalls=[];

/* ---------------------------------------------------------------- layout
   Rows are laid out top down. A row that holds an open topic is taller by the
   panel, so every cell in it keeps its line and only the row grows. */
function relayout(animate){
  let cur=SHEET.top;
  bands.forEach(b=>{
    b.g.style.transform=`translate(0px, ${cur}px)`;
    let rowY=BAND_H;
    const rows=Math.ceil(b.cells.length/COLS);
    for(let r=0;r<rows;r++){
      const inRow=b.cells.filter(c=>c.row===r);
      const open=inRow.some(c=>c.open);
      inRow.forEach(c=>{ c.g.style.transform=`translate(${c.x}px, ${rowY}px)`; });
      rowY+=CELL.h+(open?PANEL.h+PANEL.gap:0);
    }
    b.height=rowY+10;
    cur+=b.height+BAND_GAP;
  });
  const h=cur-BAND_GAP+SHEET.bot;
  $('sheetRect').setAttribute('height',h);
  if(!animate) $('board').setAttribute('transform',`translate(0 ${Math.max(0,(660-(collapsedH+72))/2-SHEET.y).toFixed(1)})`);
  return h;
}

let collapsedH=0;

function buildSheet(domains){
  $('sheet').replaceChildren(); $('rules').replaceChildren();
  bands=[]; stalls=[];
  el('rect',{class:'sheet',id:'sheetRect',x:SHEET.x,y:SHEET.y,width:SHEET.w,height:0,rx:6},$('sheet'));

  domains.forEach(([dom,items])=>{
    const bg=el('g',{class:'bandg'},$('sheet'));
    bg.style.transform='translate(0px, 0px)';
    const inner=el('g',{transform:`translate(${SHEET.x} ${SHEET.y})`},bg);
    txt(inner,SHEET.pad,8,dom,'band');
    el('line',{class:'bandrule',x1:SHEET.pad,y1:18,x2:SHEET.w-SHEET.pad,y2:18},inner);

    const cells=items.map(([name,slug,shape],i)=>{
      const col=i%COLS, row=Math.floor(i/COLS);
      const g=el('g',{class:'cell'},inner);
      const x=SHEET.pad+col*CELL.w;
      g.style.transform=`translate(${x}px, 0px)`;
      el('rect',{x:0,y:0,width:CELL.w,height:CELL.h,fill:'transparent'},g);   // the line is the target
      txt(g,3,15,name,'name');
      el('path',{class:'caret',d:'M92 13.2 l3.4 3.6 l3.4 -3.6'},g);

      /* the panel: the drawing, and how many of this topic you have taken */
      const seat=el('g',{transform:`translate(${(CELL.w-PANEL.w)/2} ${CELL.h+PANEL.gap})`},g);
      const panel=el('g',{class:'panel','data-open':'0'},seat);
      el('rect',{class:'panelbg',x:0,y:0,width:PANEL.w,height:PANEL.h,rx:8},panel);
      sticker(panel,shape).setAttribute('transform',`translate(${PANEL.w/2} 27) scale(1.25)`);

      const st={slug,name,shape,n:0,open:false,row,col,x,g,panel,
                cx:x+SHEET.x+CELL.w/2, cy:0};
      const minus=el('g',{class:'step','data-off':'1'},panel);
      el('circle',{class:'stepbg',cx:20,cy:60,r:11},minus);
      el('path',{class:'stepg',d:'M15 60h10'},minus);
      const count=txt(panel,PANEL.w/2,60.5,'0','count',{'text-anchor':'middle','data-zero':'1'});
      const plus=el('g',{class:'step'},panel);
      el('circle',{class:'stepbg',cx:PANEL.w-20,cy:60,r:11},plus);
      el('path',{class:'stepg',d:`M${PANEL.w-25} 60h10M${PANEL.w-20} 55v10`},plus);

      st.count=count; st.minus=minus;
      minus.addEventListener('pointerdown',e=>{ e.stopPropagation(); takeBack(st); });
      plus.addEventListener('pointerdown',e=>{ e.stopPropagation(); add(st); });
      g.addEventListener('pointerdown',()=>toggle(st));

      stalls.push(st); return st;
    });
    bands.push({dom,g:bg,cells});
  });

  collapsedH=relayout(false);
  $('board').setAttribute('transform',`translate(0 ${Math.max(0,(660-(collapsedH+72))/2-SHEET.y).toFixed(1)})`);

  /* the page is cut to the closed sheet, so the two read level at rest */
  $('pageRect').setAttribute('height',collapsedH);
  const rows=Math.floor((collapsedH-46)/SLOT.dy);
  CAP=rows*SLOT.cols;
  for(let i=0;i<rows;i++) el('line',{class:'rule',x1:PAGE.x+16,y1:SLOT.y0+i*SLOT.dy+12,x2:PAGE.x+PAGE.w-16,y2:SLOT.y0+i*SLOT.dy+12},$('rules'));
  $('total').setAttribute('y',SHEET.y+collapsedH+44);
  $('totalLbl').setAttribute('y',SHEET.y+collapsedH+66);
}

function toggle(st){
  st.open=!st.open;
  st.g.classList.toggle('open',st.open);
  st.panel.setAttribute('data-open',st.open?'1':'0');
  relayout(true);
}

/* ---------------------------------------------------------------- the page */
const page=$('page'), pageG=$('pageG'), totalT=$('total'), go=$('go');
const placed=[];
const slotAt=n=>({x:SLOT.x0+(n%SLOT.cols)*SLOT.dx, y:SLOT.y0+Math.floor(n/SLOT.cols)*SLOT.dy});

function paint(st){
  st.count.textContent=st.n;
  st.count.setAttribute('data-zero',st.n?'0':'1');
  st.minus.setAttribute('data-off',st.n?'0':'1');
  totalT.textContent=total; go.disabled=total===0;
}

function add(st){
  if(total>=CAP) return;
  st.n++; total++; basket[st.slug]=st.n; paint(st);
  const {x:tx,y:ty}=slotAt(total-1);
  const board=$('board').getAttribute('transform')||'';
  const dy=parseFloat((board.match(/translate\(0 ([-\d.]+)\)/)||[0,0])[1])||0;
  const from={x:st.cx, y:SHEET.y+bandTop(st)+cellTop(st)+CELL.h+PANEL.gap+27+dy};
  const f=sticker($('flyer'),st.shape,'fly');
  tween(540,k=>{ const s=lerp(1.25,1.15,k)+.28*Math.sin(Math.PI*k);
    f.setAttribute('transform',`translate(${lerp(from.x,tx,k)} ${lerp(from.y,ty,k)-66*Math.sin(Math.PI*k)}) scale(${s}) rotate(${36*Math.sin(Math.PI*k)})`); },easeIn)
  .then(()=>{
    f.remove();
    const g=sticker(page,st.shape,'placed');
    g.setAttribute('transform',`translate(${tx} ${ty}) scale(1.15)`);
    el('circle',{r:12,fill:'transparent'},g);      // most of a glyph is fill:none stroke, so give it a real target
    const rec={el:g,st}; placed.push(rec);
    g.addEventListener('pointerdown',e=>{ e.stopPropagation(); pull(rec); });
    tween(200,k=>pageG.setAttribute('transform',`translate(0 ${1.5*Math.sin(Math.PI*k)})`));
  });
}

/* where a cell's panel currently sits, so the sticker flies from the drawing */
function bandOf(st){ return bands.find(b=>b.cells.includes(st)); }

function bandTop(st){
  let cur=SHEET.top;
  for(const b of bands){ if(b.cells.includes(st)) return cur; cur+=b.height+BAND_GAP; }
  return cur;
}

function cellTop(st){
  const b=bandOf(st); let y=BAND_H;
  for(let r=0;r<st.row;r++){
    const open=b.cells.some(c=>c.row===r&&c.open);
    y+=CELL.h+(open?PANEL.h+PANEL.gap:0);
  }
  return y;
}

function takeBack(st){
  const rec=[...placed].reverse().find(r=>r.st===st);
  if(rec) return pull(rec);
}

function pull(rec){
  const i=placed.indexOf(rec); if(i<0) return;
  placed.splice(i,1); rec.el.remove();
  rec.st.n=Math.max(0,rec.st.n-1);
  if(rec.st.n<=0) delete basket[rec.st.slug]; else basket[rec.st.slug]=rec.st.n;
  total=Math.max(0,total-1); paint(rec.st);
  placed.forEach((r,n)=>{ const {x,y}=slotAt(n); r.el.setAttribute('transform',`translate(${x} ${y}) scale(1.15)`); });
}

pageG.addEventListener('pointerdown', async ()=>{
  if(!total) return;
  await tween(320,k=>page.setAttribute('opacity',1-k));
  page.replaceChildren(); page.setAttribute('opacity',1); placed.length=0;
  stalls.forEach(st=>{ st.n=0; paint(st); });
  for(const k in basket) delete basket[k];
  total=0; totalT.textContent='0'; go.disabled=true;
});

function loadSubject(id){
  page.replaceChildren(); page.setAttribute('opacity',1); $('flyer').replaceChildren();
  placed.length=0; for(const k in basket) delete basket[k];
  total=0; go.disabled=true;
  buildSheet(TOPICS_BY_SUBJECT[id] || TOPICS_BY_SUBJECT.math);
  totalT.textContent='0';
}
document.addEventListener('satf:subject', e=>loadSubject(e.detail.id));
loadSubject((window.SATF && window.SATF.subject().id) || 'math');

/* -- ROUTER SEAM: the set is `basket`, a map of topic slug -> question count -- */
go.addEventListener('click', ()=>console.log('[router] /practice/combined', {...basket}));
</script>
