<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mixed practice, list · SAT Freshman</title>
<meta name="description" content="Four domains on a line, each opening its topics onto a sticker sheet.">
<link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .board {
    padding: clamp(22px,3.5vh,36px) var(--gutter) 40px;
    width: 100%; max-width: 1060px;
    display: grid; grid-template-columns: minmax(0,1fr) 248px; gap: 34px;
    align-items: start;
  }

  /* the four domains, one line. A domain is its name until you open it. */
  .domains { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); column-gap:16px; }
  .dom-btn {
    appearance:none; border:0; background:none; cursor:pointer;
    width:100%; display:flex; align-items:center; gap:8px;
    padding:0 6px 11px 0; border-bottom:1px solid var(--line);
    font:700 10.5px var(--mono); letter-spacing:.15em; text-transform:uppercase;
    color:var(--soft); text-align:left;
    transition:color .16s var(--ease), border-color .16s var(--ease);
  }
  @media (hover:hover) and (pointer:fine) { .dom-btn:hover { color:var(--ink); } }
  .dom-btn .caret { margin-left:auto; flex:none; color:var(--faint); transition:transform .28s var(--ease), color .16s var(--ease); }
  .dom[data-open="true"] .dom-btn { color:var(--ink); border-color:var(--ink); }
  .dom[data-open="true"] .caret { transform:rotate(180deg); color:var(--ink); }

  /* 0fr to 1fr is the one way to transition to a height you do not know */
  .drawer { display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s var(--ease); }
  .dom[data-open="true"] .drawer { grid-template-rows:1fr; }
  .drawer-in { overflow:hidden; }

  .topics { list-style:none; margin:0; padding:6px 0 18px; }
  .topic {
    width:100%; display:flex; align-items:center; gap:10px;
    padding:5px 6px 5px 0; border:0; background:none; cursor:pointer;
    font:500 11.5px var(--mono); letter-spacing:.01em; color:var(--ink); text-align:left;
    border-radius:6px;
    transition:background-color .16s var(--ease);
  }
  @media (hover:hover) and (pointer:fine) { .topic:hover { background:var(--sleeve); } .topic:hover .cut { opacity:.85; } .topic:hover .stk { fill:#fff; } }
  .topic:active { transform:scale(.99); }
  .topic-n { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cut {
    margin-left:auto; flex:none;
    width:38px; height:38px; display:grid; place-items:center;
    border:1px dashed var(--ink); border-radius:9px; opacity:.4;
    transition:opacity .16s var(--ease);
  }
  .n-badge {
    flex:none; min-width:17px; height:17px; padding:0 4px;
    display:grid; place-items:center; border-radius:999px;
    background:var(--ink); color:#fff;
    font:900 9px var(--font); font-variant-numeric:tabular-nums;
  }
  .n-badge[hidden] { display:none; }

  .glyph { width:26px; height:26px; display:block; color:var(--ink); }
  .stk  { fill:#FBFAF7; stroke:currentColor; stroke-width:1.3; stroke-linejoin:round; transition:fill .18s; }
  .stki { fill:none; stroke:currentColor; stroke-width:.9; opacity:.55; stroke-linecap:round; }
  .stkl { fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  .stkd { fill:currentColor; }

  /* the sheet you are building: ruled paper, stickers land on it */
  .sheet { position:sticky; top:78px; }
  .paper {
    position:relative;
    min-height:420px; padding:14px;
    border:1.5px solid var(--ink); border-radius:4px; background:#fff;
    background-image:repeating-linear-gradient(to bottom, transparent 0 33px, var(--line) 33px 34px);
    background-position:0 12px;
    display:grid; grid-template-columns:repeat(6,1fr); align-content:start; gap:0;
    cursor:pointer;
  }
  .paper-empty {
    position:absolute; inset:auto 18px 50% 18px; transform:translateY(50%);
    margin:0; text-align:center;
    font:500 10.5px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
  }
  .placed {
    display:grid; place-items:center; height:34px;
    background:none; border:0; padding:0; cursor:pointer;
    transition:opacity .16s var(--ease), transform .16s var(--ease);
  }
  .placed .glyph { width:22px; height:22px; }
  @media (hover:hover) and (pointer:fine) { .placed:hover { opacity:.45; transform:scale(.92); } }

  .tally { display:flex; align-items:flex-end; gap:14px; margin-top:16px; }
  .tally-n { display:block; font:900 32px var(--font); letter-spacing:-.04em; color:var(--amber); font-variant-numeric:tabular-nums; line-height:1; }
  .tally-k { display:block; margin-top:3px; font:500 10px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--soft); }
  .tally-clear {
    margin-left:auto; appearance:none; border:0; background:none; cursor:pointer;
    font:500 11px var(--mono); letter-spacing:.05em; color:var(--soft);
    text-decoration:underline; text-underline-offset:3px; transition:color .16s var(--ease);
  }
  .tally-clear:hover { color:var(--ink); }
  .tally-clear[hidden] { display:none; }
  .sheet .btn { width:100%; margin-top:14px; }

  /* a sticker in flight, from its cut square to the sheet */
  .flyer { position:fixed; z-index:60; pointer-events:none; color:var(--amber); }
  .flyer .glyph { width:30px; height:30px; }
  .flyer .stk { fill:#fff; stroke:var(--amber); stroke-width:1.6; }
  .flyer .stki { stroke:var(--amber); opacity:.9; }
  .flyer .stkl { stroke:var(--amber); }
  .flyer .stkd { fill:var(--amber); }

  @media (max-width: 1040px) {
    .board { grid-template-columns:minmax(0,1fr); }
    .sheet { position:static; }
    .paper { min-height:220px; }
  }
  @media (max-width: 720px) { .domains { grid-template-columns:repeat(2,minmax(0,1fr)); row-gap:4px; } }
  @media (max-width: 420px) { .domains { grid-template-columns:minmax(0,1fr); } }
  @media (prefers-reduced-motion: reduce) { .drawer, .caret, .topic, .placed { transition:none; } }
</style>
</head>
<body data-nav="mixed">

<a class="skip" href="#main">Skip to content</a>

<div class="app">
  <aside class="rail"></aside>

  <main class="main" id="main">
    <header class="head">
      <button class="rail-toggle" type="button" aria-label="Show navigation" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <h1 class="head-title">Mixed practice, list</h1>
    </header>

    <div class="board rise">
      <ul class="domains" id="domains"></ul>

      <div class="sheet">
        <div class="paper" id="paper"></div>
        <div class="tally">
          <span>
            <span class="tally-n" id="total">0</span>
            <span class="tally-k" id="totalK">questions</span>
          </span>
          <button class="tally-clear" type="button" id="clear" hidden>Start over</button>
        </div>
        <button class="btn" type="button" id="go" disabled>Build a set</button>
      </div>
    </div>
  </main>
</div>

<script src="../assets/app.js"></script>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* one glyph per topic, each a small diagram of the thing itself. Drawn around (0,0), about 20px across. */
const poly=(n,r,rot=-90)=>Array.from({length:n},(_,i)=>{const a=(rot+i*360/n)*Math.PI/180;return (r*Math.cos(a)).toFixed(2)+','+(r*Math.sin(a)).toFixed(2);}).join(' ');
const star=(r,ri)=>Array.from({length:10},(_,i)=>{const a=(-90+i*36)*Math.PI/180,rr=i%2?ri:r;return (rr*Math.cos(a)).toFixed(2)+','+(rr*Math.sin(a)).toFixed(2);}).join(' ');

const SHAPES={
  /* Algebra */
  numberline: g=>{ el('path',{class:'stkl',d:'M-10 2 H10 M-6 -1 V5 M0 -1 V5 M6 -1 V5'},g); el('circle',{class:'stkd',cx:3,cy:2,r:2.6},g); },          // one solution on a number line
  graphline:  g=>{ el('path',{class:'stki',d:'M-9 7 H9 M-7 9 V-9'},g); el('path',{class:'stkl',d:'M-9 6 L9 -7'},g); },                             // a line on axes
  slope:      g=>{ el('path',{class:'stkl',d:'M-9 7 L9 -7'},g); el('path',{class:'stki',d:'M-3 2.3 H4.6 V-3.6'},g); },                               // rise over run
  cross:      g=>{ el('path',{class:'stkl',d:'M-9 -6 L9 8 M-9 8 L9 -6'},g); el('circle',{class:'stkd',cx:0,cy:1,r:2.4},g); },                       // two lines, one solution
  ray:        g=>{ el('path',{class:'stkl',d:'M-10 2 H10'},g); el('path',{class:'stkl',d:'M-.4 2 H9','stroke-width':3.2},g); el('circle',{class:'stk',cx:-3,cy:2,r:2.8},g); }, // an open circle and a shaded ray
  /* Advanced Math */
  equiv:      g=>el('path',{class:'stkl',d:'M-7 -5 H7 M-7 0 H7 M-7 5 H7','stroke-width':1.8},g),                                                    // identically equal
  curveline:  g=>{ el('path',{class:'stkl',d:'M-9 8 Q0 -14 9 8'},g); el('path',{class:'stkl',d:'M-10 1 H10'},g); el('circle',{class:'stkd',cx:-5.4,cy:1,r:2.1},g); el('circle',{class:'stkd',cx:5.4,cy:1,r:2.1},g); }, // a line meeting a curve
  parabola:   g=>{ el('path',{class:'stki',d:'M-9 6 H9 M0 9 V-9'},g); el('path',{class:'stkl',d:'M-8 -8 Q0 14 8 -8'},g); },                          // a parabola on axes
  /* Data */
  balance:    g=>{ el('path',{class:'stkl',d:'M0 -8 V8 M-8 -5 H8 M-5 9 H5'},g); el('path',{class:'stki',d:'M-8 -5 L-10.5 1 M-8 -5 L-5.5 1 M8 -5 L10.5 1 M8 -5 L5.5 1 M-11 1.5 H-5 M5 1.5 H11'},g); }, // a balance
  percent:    g=>{ el('circle',{class:'stk',cx:-5,cy:-5,r:3},g); el('circle',{class:'stk',cx:5,cy:5,r:3},g); el('path',{class:'stkl',d:'M-8 9 L8 -9'},g); }, // %
  bars:       g=>{ el('rect',{class:'stk',x:-9,y:1,width:5,height:8},g); el('rect',{class:'stk',x:-2.5,y:-6,width:5,height:15},g); el('rect',{class:'stk',x:4,y:-2,width:5,height:11},g); el('path',{class:'stki',d:'M-11 9.5 H11'},g); }, // a histogram
  scatter:    g=>{ el('path',{class:'stki',d:'M-9 8 H9 M-9 8 V-9'},g); el('path',{class:'stki',d:'M-8 6 L8 -6'},g); [[-5,4],[-2,1.5],[1,-.5],[3,-4],[6,-2.5]].forEach(([x,y])=>el('circle',{class:'stkd',cx:x,cy:y,r:1.7},g)); }, // a scatterplot with its fit
  die:        g=>{ el('rect',{class:'stk',x:-9,y:-9,width:18,height:18,rx:3},g); [[-4.5,-4.5],[0,0],[4.5,4.5]].forEach(([x,y])=>el('circle',{class:'stkd',cx:x,cy:y,r:1.8},g)); }, // a die
  errorbar:   g=>{ el('path',{class:'stkl',d:'M-9 0 H9 M-9 -3.5 V3.5 M9 -3.5 V3.5'},g); el('circle',{class:'stkd',cx:0,cy:0,r:2.8},g); },            // an estimate and its margin
  magnifier:  g=>{ el('circle',{class:'stk',cx:-2,cy:-2,r:6.5},g); el('path',{class:'stkl',d:'M2.8 2.8 L9 9','stroke-width':2.4},g); },                // look closely
  /* Geometry */
  cube:       g=>{ el('polygon',{class:'stk',points:poly(6,10.5,-90)},g); el('path',{class:'stki',d:'M0 0 L0 10.5 M0 0 L-9.1 -5.25 M0 0 L9.1 -5.25'},g); },
  angle:      g=>{ el('path',{class:'stk',d:'M-9 8 L2 -9 L9 8 z','fill-opacity':0},g); el('path',{class:'stki',d:'M-1.26 -3.96 A6 6 0 0 0 4.29 -3.45'},g); },
  right:      g=>{ el('polygon',{class:'stk',points:'-9,9 9,9 9,-9'},g); el('path',{class:'stki',d:'M9 5 h-4 v4'},g); },
  dotcircle:  g=>{ el('circle',{class:'stk',r:9.5},g); el('circle',{class:'stkd',r:1.6},g); },

  /* Reading and Writing: the same hand, drawn from what each question asks you
     to do with a text rather than from the grammar it tests */
  centralidea: g=>{ el('path',{class:'stki',d:'M-7 -6 H9 M-7 6 H6'},g); el('path',{class:'stkl',d:'M-7 0 H9'},g); el('circle',{class:'stkd',cx:-10,cy:0,r:1.9},g); },  // the line that carries it
  citation:    g=>{ el('path',{class:'stkl',d:'M-9.5 -8 V8','stroke-width':2.4},g); el('path',{class:'stki',d:'M-5 -5 H9 M-5 0 H9 M-5 5 H4'},g); },                     // a passage, marked
  evidencedata:g=>{ el('rect',{class:'stk',x:-10,y:-1,width:4,height:9},g); el('rect',{class:'stk',x:-4.5,y:-7,width:4,height:15},g); el('path',{class:'stki',d:'M3 -4 H10 M3 1 H10 M3 6 H8'},g); },
  therefore:   g=>{ [[0,-6],[-5.2,4],[5.2,4]].forEach(([x,y])=>el('circle',{class:'stkd',cx:x,cy:y,r:2.1},g)); },                                                        // the inference mark
  slotword:    g=>{ el('path',{class:'stkl',d:'M-11 0 H-5.5 M5.5 0 H11'},g); el('rect',{class:'stk',x:-5,y:-4.2,width:10,height:8.4,rx:1.8},g); },                      // a word in its sentence
  outline:     g=>{ el('path',{class:'stki',d:'M-9 -7 V7'},g); el('path',{class:'stkl',d:'M-5 -6 H9 M-1 0 H9 M3 6 H9'},g); },                                          // how a text is built
  crosstext:   g=>{ el('rect',{class:'stk',x:-10.5,y:-7,width:8,height:14,rx:1.4},g); el('rect',{class:'stk',x:2.5,y:-7,width:8,height:14,rx:1.4},g); el('path',{class:'stkl',d:'M-2.5 0 H2.5'},g); },
  converge:    g=>{ el('path',{class:'stki',d:'M-11 -6 h5 M-11 0 h5 M-11 6 h5'},g); el('path',{class:'stkl',d:'M-4 0 H10 M6.6 -3.2 L10 0 L6.6 3.2'},g); },             // notes into one line
  bridge:      g=>{ el('rect',{class:'stk',x:-10.5,y:2,width:7.5,height:7.5,rx:1.4},g); el('rect',{class:'stk',x:3,y:2,width:7.5,height:7.5,rx:1.4},g); el('path',{class:'stkl',d:'M-6.8 1.4 q6.8 -11 13.6 0'},g); },
  colon:       g=>{ el('path',{class:'stkl',d:'M-11 0 H-3.5 M3.5 0 H11'},g); el('circle',{class:'stkd',cx:0,cy:-3,r:1.9},g); el('circle',{class:'stkd',cx:0,cy:3,r:1.9},g); },
  caret:       g=>{ el('path',{class:'stkl',d:'M-10 -3 H10'},g); el('path',{class:'stkl',d:'M-4 7 L0 0.5 L4 7'},g); },                                                  // the proofreader's mark
};

const TOPICS_BY_SUBJECT = {
  math: [
    ['Algebra',       [['Linear eqs','linear_equations_in_one_variable','numberline'],['Lines','linear_equations_in_two_variables','graphline'],['Linear fn','linear_functions','slope'],['Systems','systems_of_linear_equations','cross'],['Inequalities','linear_inequalities','ray']]],
    ['Advanced Math', [['Expressions','equivalent_expressions','equiv'],['Nonlin. eqs','nonlinear_equations_and_systems','curveline'],['Nonlinear fn','nonlinear_functions','parabola']]],
    ['Data',          [['Ratios','ratios_rates_proportions_and_units','balance'],['Percents','percentages','percent'],['1-var data','one_variable_data','bars'],['2-var data','two_variable_data','scatter'],['Probability','probability','die'],['Samples','sample_statistics_and_margin_of_error','errorbar'],['Claims','evaluating_statistical_claims','magnifier']]],
    ['Geometry',      [['Area/volume','area_and_volume','cube'],['Angles','lines_angles_and_triangles','angle'],['Trig','right_triangles_and_trigonometry','right'],['Circles','circles','dotcircle']]],
  ],
  verbal: [
    ['Information and Ideas', [['Central ideas','central_ideas_and_details','centralidea'],['Evidence, text','command_of_evidence_textual','citation'],['Evidence, data','command_of_evidence_quantitative','evidencedata'],['Inferences','inferences','therefore']]],
    ['Craft and Structure',   [['Words in context','words_in_context','slotword'],['Structure','text_structure_and_purpose','outline'],['Cross-text','cross_text_connections','crosstext']]],
    ['Expression of Ideas',   [['Synthesis','rhetorical_synthesis','converge'],['Transitions','transitions','bridge']]],
    ['Conventions',           [['Boundaries','boundaries','colon'],['Form and sense','form_structure_and_sense','caret']]],
  ],
};

/* ---------------------------------------------------------------- the list
   Four domains on one line. A domain is its name until you open it, and then
   it drops its topics underneath: the name, and the sticker still on its
   backing. Tapping a topic peels one onto the sheet; holding keeps peeling. */
const basket={}; let total=0;
const rows=[];                 // one per topic
const placed=[];               // one per sticker on the sheet, in order
const paper=$('paper');

function glyph(shape){
  const s=el('svg',{viewBox:'-13 -13 26 26','aria-hidden':'true'});
  s.setAttribute('class','glyph');
  SHAPES[shape](s);
  return s;
}

const caret = () => {
  const s=el('svg',{width:12,height:12,viewBox:'0 0 24 24','aria-hidden':'true'});
  s.setAttribute('class','caret');
  el('path',{d:'M6 9.5 12 15.5 18 9.5',fill:'none',stroke:'currentColor','stroke-width':'2','stroke-linecap':'round','stroke-linejoin':'round'},s);
  return s;
};

function build(domains){
  const host=$('domains'); host.replaceChildren(); rows.length=0;

  domains.forEach(([dom,items])=>{
    const li=document.createElement('li');
    li.className='dom'; li.dataset.open='false';

    const btn=document.createElement('button');
    btn.type='button'; btn.className='dom-btn'; btn.setAttribute('aria-expanded','false');
    const nm=document.createElement('span'); nm.textContent=dom;
    btn.append(nm, caret());

    const drawer=document.createElement('div'); drawer.className='drawer';
    const inner=document.createElement('div'); inner.className='drawer-in';
    const ul=document.createElement('ul'); ul.className='topics';

    items.forEach(([name,slug,shape])=>{
      const item=document.createElement('li');
      const t=document.createElement('button');
      t.type='button'; t.className='topic';
      t.setAttribute('aria-label','Add a '+name+' question');

      const n=document.createElement('span'); n.className='topic-n'; n.textContent=name;
      const badge=document.createElement('span'); badge.className='n-badge'; badge.hidden=true; badge.textContent='0';
      const cut=document.createElement('span'); cut.className='cut';
      cut.appendChild(glyph(shape));
      t.append(n, badge, cut);
      item.appendChild(t); ul.appendChild(item);

      const row={slug,name,shape,n:0,badge,cut,hold:null};
      rows.push(row);

      /* tap peels one, holding keeps peeling, the way the sheet did before */
      const start=()=>{ add(row); const t0=performance.now();
        const tick=()=>{ if(row.hold===null) return; const s=(performance.now()-t0)/1000;
          add(row); row.hold=setTimeout(tick, s<.7?240 : s<1.8?110 : 55); };
        row.hold=setTimeout(tick,260); };
      const stop=()=>{ clearTimeout(row.hold); row.hold=null; };
      t.addEventListener('pointerdown',e=>{ try{ t.setPointerCapture(e.pointerId); }catch(_){} start(); });
      ['pointerup','pointerleave','pointercancel'].forEach(ev=>t.addEventListener(ev,stop));
      t.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); add(row); } });
    });

    inner.appendChild(ul); drawer.appendChild(inner);
    li.append(btn, drawer); host.appendChild(li);

    btn.addEventListener('click',()=>{
      const open=li.dataset.open!=='true';
      li.dataset.open=String(open);
      btn.setAttribute('aria-expanded',String(open));
    });
  });

  paintTotal();
}

/* ---------------------------------------------------------------- the sheet */
function add(row){
  if(placed.length>=120) return;
  row.n++; total++; basket[row.slug]=row.n;
  row.badge.hidden=false; row.badge.textContent=row.n;

  const btn=document.createElement('button');
  btn.type='button'; btn.className='placed';
  btn.setAttribute('aria-label','Take back a '+row.name+' question');
  btn.appendChild(glyph(row.shape));
  const rec={el:btn,row};
  btn.addEventListener('click',()=>take(rec));
  placed.push(rec);
  paper.appendChild(btn);
  paintTotal();

  if(reduce) return;
  // fly a copy from the cut square to where the sticker just landed
  const from=row.cut.getBoundingClientRect(), to=btn.getBoundingClientRect();
  btn.style.opacity='0';
  const f=document.createElement('div');
  f.className='flyer'; f.appendChild(glyph(row.shape));
  f.style.left=(from.left+from.width/2)+'px'; f.style.top=(from.top+from.height/2)+'px';
  document.body.appendChild(f);
  const dx=(to.left+to.width/2)-(from.left+from.width/2), dy=(to.top+to.height/2)-(from.top+from.height/2);
  const a=f.animate([
    {transform:'translate(-50%,-50%) scale(1) rotate(0deg)'},
    {transform:`translate(-50%,-50%) translate(${dx*.5}px,${dy*.5-46}px) scale(1.18) rotate(22deg)`, offset:.5},
    {transform:`translate(-50%,-50%) translate(${dx}px,${dy}px) scale(.78) rotate(0deg)`},
  ],{duration:520,easing:'cubic-bezier(.4,0,.2,1)'});
  a.onfinish=()=>{ f.remove(); btn.style.opacity=''; };
}

function take(rec){
  const i=placed.indexOf(rec); if(i<0) return;
  placed.splice(i,1); rec.el.remove();
  const row=rec.row;
  row.n=Math.max(0,row.n-1);
  row.badge.textContent=row.n; row.badge.hidden=!row.n;
  if(row.n) basket[row.slug]=row.n; else delete basket[row.slug];
  total=Math.max(0,total-1);
  paintTotal();
}

function paintTotal(){
  $('total').textContent=total;
  $('totalK').textContent=total===1?'question':'questions';
  $('go').disabled=total===0;
  $('clear').hidden=total===0;
  const empty=paper.querySelector('.paper-empty');
  if(total===0 && !empty){
    const p=document.createElement('p');
    p.className='paper-empty'; p.textContent='Peel a sticker for each question';
    paper.appendChild(p);
  } else if(total>0 && empty) empty.remove();
}

function clearAll(){
  placed.splice(0).forEach(r=>r.el.remove());
  rows.forEach(r=>{ r.n=0; r.badge.textContent='0'; r.badge.hidden=true; });
  for(const k in basket) delete basket[k];
  total=0; paintTotal();
}
$('clear').addEventListener('click',clearAll);
paper.addEventListener('click',e=>{ if(e.target===paper||e.target.classList.contains('paper-empty')) clearAll(); });

function loadSubject(id){
  clearAll();
  build(TOPICS_BY_SUBJECT[id] || TOPICS_BY_SUBJECT.math);
}
document.addEventListener('satf:subject', e=>loadSubject(e.detail.id));
loadSubject((window.SATF && window.SATF.subject().id) || 'math');

/* -- ROUTER SEAM: the set is `basket`, a map of topic slug -> question count -- */
$('go').addEventListener('click', ()=>console.log('[router] /practice/combined', {...basket}));
</script>
