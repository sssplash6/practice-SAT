<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mixed practice, list · SAT Freshman</title>
<meta name="description" content="Topics four to a line, each opening to a count.">
<link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
  /* No drawn sheet here, so this is laid out as real elements rather than by
     hand inside an SVG. The grid gives the four-to-a-line arrangement, and an
     open row grows on its own because its cell is taller. */
  .list { padding: clamp(24px,4vh,40px) var(--gutter) 40px; max-width: 780px; width: 100%; }

  .domain + .domain { margin-top: 30px; }
  .domain-k {
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
    font: 700 10px var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ink);
  }

  .topics { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); column-gap: 14px; }

  .topic-btn {
    appearance: none; border: 0; background: none; cursor: pointer;
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 13px 10px 13px 0;
    font: 500 12px var(--mono); letter-spacing: .01em; color: var(--soft);
    text-align: left;
    transition: color .16s var(--ease);
  }
  @media (hover: hover) and (pointer: fine) { .topic-btn:hover { color: var(--ink); } }
  .topic-btn .caret {
    margin-left: auto; flex: none; color: var(--faint);
    transition: transform .28s var(--ease), color .16s var(--ease);
  }
  .topic[data-open="true"] .topic-btn { color: var(--ink); }
  .topic[data-open="true"] .caret { transform: rotate(180deg); color: var(--ink); }
  .topic[data-count="on"] .topic-btn { color: var(--ink); }

  /* the drawer: 0fr to 1fr is the one way to transition to an unknown height */
  .drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s var(--ease); }
  .topic[data-open="true"] .drawer { grid-template-rows: 1fr; }
  .drawer-in { overflow: hidden; }
  .panel {
    display: flex; align-items: center; gap: 14px;
    margin: 0 10px 14px 0; padding: 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    opacity: 0; transform: translateY(-4px);
    transition: opacity .26s var(--ease) .04s, transform .26s var(--ease) .04s;
  }
  .topic[data-open="true"] .panel { opacity: 1; transform: none; }
  .glyph { flex: none; width: 40px; height: 40px; display: block; color: var(--ink); }

  .stepper { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .step {
    appearance: none; cursor: pointer;
    width: 28px; height: 28px; display: grid; place-items: center;
    border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink);
    transition: border-color .16s var(--ease), background-color .16s var(--ease), transform .14s var(--ease);
  }
  @media (hover: hover) and (pointer: fine) { .step:hover:not(:disabled) { border-color: var(--faint); background: var(--sleeve); } }
  .step:active:not(:disabled) { transform: scale(.92); }
  .step:disabled { opacity: .3; cursor: default; }
  .count { min-width: 26px; text-align: center; font: 700 14px var(--font); font-variant-numeric: tabular-nums; }
  .count[data-zero="true"] { color: var(--faint); }

  .stk { fill:#FBFAF7; stroke:currentColor; stroke-width:1.3; stroke-linejoin:round; }
  .stki { fill:none; stroke:currentColor; stroke-width:.9; opacity:.55; stroke-linecap:round; }
  .stkl { fill:none; stroke:currentColor; stroke-width:1.4; stroke-linecap:round; stroke-linejoin:round; }
  .stkd { fill:currentColor; }

  /* what you have built so far, and the way out */
  .tally {
    position: sticky; bottom: 0; z-index: 5;
    display: flex; align-items: flex-end; gap: 20px;
    margin-top: 32px; padding: 16px 0 4px;
    background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, var(--paper) 22%);
  }
  .tally-n { display: block; font: 900 34px var(--font); letter-spacing: -.04em; color: var(--amber); font-variant-numeric: tabular-nums; line-height: 1; }
  .tally-k { display: block; margin-top: 3px; font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  .tally .btn { margin-left: auto; }
  .tally-clear {
    appearance: none; border: 0; background: none; cursor: pointer;
    font: 500 11.5px var(--mono); letter-spacing: .06em; color: var(--soft);
    text-decoration: underline; text-underline-offset: 3px;
    transition: color .16s var(--ease);
  }
  .tally-clear:hover { color: var(--ink); }
  .tally-clear[hidden] { display: none; }

  @media (max-width: 900px) { .topics { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 520px) { .topics { grid-template-columns: minmax(0,1fr); } .panel { margin-right: 0; } }
  @media (prefers-reduced-motion: reduce) { .drawer, .panel, .caret, .step { transition: none; } }
</style>
</head>
<body data-nav="mixed">

<a class="skip" href="#main">Skip to content</a>

<div class="app">
  <aside class="rail"></aside>

  <main class="main" id="main">
    <header class="head">
      <button class="rail-toggle" type="button" aria-label="Show navigation" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <h1 class="head-title">Mixed practice, list</h1>
    </header>

    <div class="list rise">
      <div id="domains"></div>
      <div class="tally">
        <span>
          <span class="tally-n" id="total">0</span>
          <span class="tally-k" id="totalK">questions</span>
        </span>
        <button class="tally-clear" type="button" id="clear" hidden>Start over</button>
        <button class="btn" type="button" id="go" disabled>Build a set</button>
      </div>
    </div>
  </main>
</div>

<script src="../assets/app.js"></script>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const $=id=>document.getElementById(id);

/* one glyph per topic, each a small diagram of the thing itself. Drawn around (0,0), about 20px across. */
const poly=(n,r,rot=-90)=>Array.from({length:n},(_,i)=>{const a=(rot+i*360/n)*Math.PI/180;return (r*Math.cos(a)).toFixed(2)+','+(r*Math.sin(a)).toFixed(2);}).join(' ');
const star=(r,ri)=>Array.from({length:10},(_,i)=>{const a=(-90+i*36)*Math.PI/180,rr=i%2?ri:r;return (rr*Math.cos(a)).toFixed(2)+','+(rr*Math.sin(a)).toFixed(2);}).join(' ');

const SHAPES={
  /* Algebra */
  numberline: g=>{ el('path',{class:'stkl',d:'M-10 2 H10 M-6 -1 V5 M0 -1 V5 M6 -1 V5'},g); el('circle',{class:'stkd',cx:3,cy:2,r:2.6},g); },          // one solution on a number line
  graphline:  g=>{ el('path',{class:'stki',d:'M-9 7 H9 M-7 9 V-9'},g); el('path',{class:'stkl',d:'M-9 6 L9 -7'},g); },                             // a line on axes
  slope:      g=>{ el('path',{class:'stkl',d:'M-9 7 L9 -7'},g); el('path',{class:'stki',d:'M-3 2.3 H4.6 V-3.6'},g); },                               // rise over run
  cross:      g=>{ el('path',{class:'stkl',d:'M-9 -6 L9 8 M-9 8 L9 -6'},g); el('circle',{class:'stkd',cx:0,cy:1,r:2.4},g); },                       // two lines, one solution
  ray:        g=>{ el('path',{class:'stkl',d:'M-10 2 H10'},g); el('path',{class:'stkl',d:'M-.4 2 H9','stroke-width':3.2},g); el('circle',{class:'stk',cx:-3,cy:2,r:2.8},g); }, // an open circle and a shaded ray
  /* Advanced Math */
  equiv:      g=>el('path',{class:'stkl',d:'M-7 -5 H7 M-7 0 H7 M-7 5 H7','stroke-width':1.8},g),                                                    // identically equal
  curveline:  g=>{ el('path',{class:'stkl',d:'M-9 8 Q0 -14 9 8'},g); el('path',{class:'stkl',d:'M-10 1 H10'},g); el('circle',{class:'stkd',cx:-5.4,cy:1,r:2.1},g); el('circle',{class:'stkd',cx:5.4,cy:1,r:2.1},g); }, // a line meeting a curve
  parabola:   g=>{ el('path',{class:'stki',d:'M-9 6 H9 M0 9 V-9'},g); el('path',{class:'stkl',d:'M-8 -8 Q0 14 8 -8'},g); },                          // a parabola on axes
  /* Data */
  balance:    g=>{ el('path',{class:'stkl',d:'M0 -8 V8 M-8 -5 H8 M-5 9 H5'},g); el('path',{class:'stki',d:'M-8 -5 L-10.5 1 M-8 -5 L-5.5 1 M8 -5 L10.5 1 M8 -5 L5.5 1 M-11 1.5 H-5 M5 1.5 H11'},g); }, // a balance
  percent:    g=>{ el('circle',{class:'stk',cx:-5,cy:-5,r:3},g); el('circle',{class:'stk',cx:5,cy:5,r:3},g); el('path',{class:'stkl',d:'M-8 9 L8 -9'},g); }, // %
  bars:       g=>{ el('rect',{class:'stk',x:-9,y:1,width:5,height:8},g); el('rect',{class:'stk',x:-2.5,y:-6,width:5,height:15},g); el('rect',{class:'stk',x:4,y:-2,width:5,height:11},g); el('path',{class:'stki',d:'M-11 9.5 H11'},g); }, // a histogram
  scatter:    g=>{ el('path',{class:'stki',d:'M-9 8 H9 M-9 8 V-9'},g); el('path',{class:'stki',d:'M-8 6 L8 -6'},g); [[-5,4],[-2,1.5],[1,-.5],[3,-4],[6,-2.5]].forEach(([x,y])=>el('circle',{class:'stkd',cx:x,cy:y,r:1.7},g)); }, // a scatterplot with its fit
  die:        g=>{ el('rect',{class:'stk',x:-9,y:-9,width:18,height:18,rx:3},g); [[-4.5,-4.5],[0,0],[4.5,4.5]].forEach(([x,y])=>el('circle',{class:'stkd',cx:x,cy:y,r:1.8},g)); }, // a die
  errorbar:   g=>{ el('path',{class:'stkl',d:'M-9 0 H9 M-9 -3.5 V3.5 M9 -3.5 V3.5'},g); el('circle',{class:'stkd',cx:0,cy:0,r:2.8},g); },            // an estimate and its margin
  magnifier:  g=>{ el('circle',{class:'stk',cx:-2,cy:-2,r:6.5},g); el('path',{class:'stkl',d:'M2.8 2.8 L9 9','stroke-width':2.4},g); },                // look closely
  /* Geometry */
  cube:       g=>{ el('polygon',{class:'stk',points:poly(6,10.5,-90)},g); el('path',{class:'stki',d:'M0 0 L0 10.5 M0 0 L-9.1 -5.25 M0 0 L9.1 -5.25'},g); },
  angle:      g=>{ el('path',{class:'stk',d:'M-9 8 L2 -9 L9 8 z','fill-opacity':0},g); el('path',{class:'stki',d:'M-1.26 -3.96 A6 6 0 0 0 4.29 -3.45'},g); },
  right:      g=>{ el('polygon',{class:'stk',points:'-9,9 9,9 9,-9'},g); el('path',{class:'stki',d:'M9 5 h-4 v4'},g); },
  dotcircle:  g=>{ el('circle',{class:'stk',r:9.5},g); el('circle',{class:'stkd',r:1.6},g); },

  /* Reading and Writing: the same hand, drawn from what each question asks you
     to do with a text rather than from the grammar it tests */
  centralidea: g=>{ el('path',{class:'stki',d:'M-7 -6 H9 M-7 6 H6'},g); el('path',{class:'stkl',d:'M-7 0 H9'},g); el('circle',{class:'stkd',cx:-10,cy:0,r:1.9},g); },  // the line that carries it
  citation:    g=>{ el('path',{class:'stkl',d:'M-9.5 -8 V8','stroke-width':2.4},g); el('path',{class:'stki',d:'M-5 -5 H9 M-5 0 H9 M-5 5 H4'},g); },                     // a passage, marked
  evidencedata:g=>{ el('rect',{class:'stk',x:-10,y:-1,width:4,height:9},g); el('rect',{class:'stk',x:-4.5,y:-7,width:4,height:15},g); el('path',{class:'stki',d:'M3 -4 H10 M3 1 H10 M3 6 H8'},g); },
  therefore:   g=>{ [[0,-6],[-5.2,4],[5.2,4]].forEach(([x,y])=>el('circle',{class:'stkd',cx:x,cy:y,r:2.1},g)); },                                                        // the inference mark
  slotword:    g=>{ el('path',{class:'stkl',d:'M-11 0 H-5.5 M5.5 0 H11'},g); el('rect',{class:'stk',x:-5,y:-4.2,width:10,height:8.4,rx:1.8},g); },                      // a word in its sentence
  outline:     g=>{ el('path',{class:'stki',d:'M-9 -7 V7'},g); el('path',{class:'stkl',d:'M-5 -6 H9 M-1 0 H9 M3 6 H9'},g); },                                          // how a text is built
  crosstext:   g=>{ el('rect',{class:'stk',x:-10.5,y:-7,width:8,height:14,rx:1.4},g); el('rect',{class:'stk',x:2.5,y:-7,width:8,height:14,rx:1.4},g); el('path',{class:'stkl',d:'M-2.5 0 H2.5'},g); },
  converge:    g=>{ el('path',{class:'stki',d:'M-11 -6 h5 M-11 0 h5 M-11 6 h5'},g); el('path',{class:'stkl',d:'M-4 0 H10 M6.6 -3.2 L10 0 L6.6 3.2'},g); },             // notes into one line
  bridge:      g=>{ el('rect',{class:'stk',x:-10.5,y:2,width:7.5,height:7.5,rx:1.4},g); el('rect',{class:'stk',x:3,y:2,width:7.5,height:7.5,rx:1.4},g); el('path',{class:'stkl',d:'M-6.8 1.4 q6.8 -11 13.6 0'},g); },
  colon:       g=>{ el('path',{class:'stkl',d:'M-11 0 H-3.5 M3.5 0 H11'},g); el('circle',{class:'stkd',cx:0,cy:-3,r:1.9},g); el('circle',{class:'stkd',cx:0,cy:3,r:1.9},g); },
  caret:       g=>{ el('path',{class:'stkl',d:'M-10 -3 H10'},g); el('path',{class:'stkl',d:'M-4 7 L0 0.5 L4 7'},g); },                                                  // the proofreader's mark
};

const TOPICS_BY_SUBJECT = {
  math: [
    ['Algebra',       [['Linear eqs','linear_equations_in_one_variable','numberline'],['Lines','linear_equations_in_two_variables','graphline'],['Linear fn','linear_functions','slope'],['Systems','systems_of_linear_equations','cross'],['Inequalities','linear_inequalities','ray']]],
    ['Advanced Math', [['Expressions','equivalent_expressions','equiv'],['Nonlin. eqs','nonlinear_equations_and_systems','curveline'],['Nonlinear fn','nonlinear_functions','parabola']]],
    ['Data',          [['Ratios','ratios_rates_proportions_and_units','balance'],['Percents','percentages','percent'],['1-var data','one_variable_data','bars'],['2-var data','two_variable_data','scatter'],['Probability','probability','die'],['Samples','sample_statistics_and_margin_of_error','errorbar'],['Claims','evaluating_statistical_claims','magnifier']]],
    ['Geometry',      [['Area/volume','area_and_volume','cube'],['Angles','lines_angles_and_triangles','angle'],['Trig','right_triangles_and_trigonometry','right'],['Circles','circles','dotcircle']]],
  ],
  verbal: [
    ['Information and Ideas', [['Central ideas','central_ideas_and_details','centralidea'],['Evidence, text','command_of_evidence_textual','citation'],['Evidence, data','command_of_evidence_quantitative','evidencedata'],['Inferences','inferences','therefore']]],
    ['Craft and Structure',   [['Words in context','words_in_context','slotword'],['Structure','text_structure_and_purpose','outline'],['Cross-text','cross_text_connections','crosstext']]],
    ['Expression of Ideas',   [['Synthesis','rhetorical_synthesis','converge'],['Transitions','transitions','bridge']]],
    ['Conventions',           [['Boundaries','boundaries','colon'],['Form and sense','form_structure_and_sense','caret']]],
  ],
};

/* ---------------------------------------------------------------- the list
   Four topics to a line. A topic is its name until you open it, and then it
   drops a drawer holding its drawing and the number of questions you want.
   The grid does the arranging: an open cell is taller, so its row grows and
   the rest of the line stays put. */
const basket={}; let total=0;
const rows=[];                       // one per topic, so counts can be reset in a sweep

const caret = () => {
  const s=el('svg',{width:13,height:13,viewBox:'0 0 24 24','aria-hidden':'true'});
  s.setAttribute('class','caret');
  el('path',{d:'M6 9.5 12 15.5 18 9.5',fill:'none',stroke:'currentColor','stroke-width':'1.9','stroke-linecap':'round','stroke-linejoin':'round'},s);
  return s;
};

function glyph(shape){
  const s=el('svg',{viewBox:'-13 -13 26 26','aria-hidden':'true'});
  s.setAttribute('class','glyph');
  SHAPES[shape](s);
  return s;
}

function build(domains){
  const host=$('domains'); host.replaceChildren(); rows.length=0;

  domains.forEach(([dom,items])=>{
    const sec=document.createElement('section');
    sec.className='domain';
    const k=document.createElement('p');
    k.className='domain-k'; k.textContent=dom;
    sec.appendChild(k);

    const ul=document.createElement('ul');
    ul.className='topics';

    items.forEach(([name,slug,shape])=>{
      const li=document.createElement('li');
      li.className='topic'; li.dataset.open='false'; li.dataset.count='off';

      const btn=document.createElement('button');
      btn.type='button'; btn.className='topic-btn'; btn.setAttribute('aria-expanded','false');
      const nm=document.createElement('span'); nm.textContent=name;
      btn.append(nm, caret());

      const drawer=document.createElement('div'); drawer.className='drawer';
      const inner=document.createElement('div'); inner.className='drawer-in';
      const panel=document.createElement('div'); panel.className='panel';

      const stepper=document.createElement('div'); stepper.className='stepper';
      const minus=document.createElement('button');
      minus.type='button'; minus.className='step'; minus.disabled=true;
      minus.setAttribute('aria-label','One fewer '+name);
      minus.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      const out=document.createElement('output');
      out.className='count'; out.dataset.zero='true'; out.textContent='0';
      const plus=document.createElement('button');
      plus.type='button'; plus.className='step';
      plus.setAttribute('aria-label','One more '+name);
      plus.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      stepper.append(minus, out, plus);

      panel.append(glyph(shape), stepper);
      inner.appendChild(panel); drawer.appendChild(inner);
      li.append(btn, drawer);
      ul.appendChild(li);

      const row={slug,name,n:0,li,out,minus};
      rows.push(row);

      btn.addEventListener('click',()=>{
        const open=li.dataset.open!=='true';
        li.dataset.open=String(open);
        btn.setAttribute('aria-expanded',String(open));
      });
      minus.addEventListener('click',()=>bump(row,-1));
      plus.addEventListener('click',()=>bump(row,1));
    });

    sec.appendChild(ul); host.appendChild(sec);
  });
  paintTotal();
}

function bump(row,d){
  const next=Math.max(0,row.n+d);
  if(next===row.n) return;
  row.n=next; total+=d;
  if(row.n) basket[row.slug]=row.n; else delete basket[row.slug];
  row.out.textContent=row.n;
  row.out.dataset.zero=row.n?'false':'true';
  row.minus.disabled=!row.n;
  row.li.dataset.count=row.n?'on':'off';
  paintTotal();
}

function paintTotal(){
  $('total').textContent=total;
  $('totalK').textContent=total===1?'question':'questions';
  $('go').disabled=total===0;
  $('clear').hidden=total===0;
}

$('clear').addEventListener('click',()=>{
  rows.forEach(r=>{ if(r.n) bump(r,-r.n); });
});

function loadSubject(id){
  for(const k in basket) delete basket[k];
  total=0;
  build(TOPICS_BY_SUBJECT[id] || TOPICS_BY_SUBJECT.math);
}
document.addEventListener('satf:subject', e=>loadSubject(e.detail.id));
loadSubject((window.SATF && window.SATF.subject().id) || 'math');

/* -- ROUTER SEAM: the set is `basket`, a map of topic slug -> question count -- */
$('go').addEventListener('click', ()=>console.log('[router] /practice/combined', {...basket}));
</script>

</body>
</html>
