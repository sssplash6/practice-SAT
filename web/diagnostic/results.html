<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diagnostic results · SAT Freshman</title>
<meta name="description" content="Where you stand across the four math domains.">
<link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
  /* One number, four bars. The number is a band because twenty questions
     cannot support a point, and the bars carry no numbers at all because five
     questions per domain cannot support one either. */
  .sheet-body { max-width:640px; margin:0 auto; padding:clamp(28px,6vh,56px) var(--gutter) 64px; }

  .band { text-align:center; }
  .band-k { font:500 11.5px var(--mono); letter-spacing:.09em; text-transform:uppercase; color:var(--faint); }
  .band-v {
    margin-top:6px; font:900 clamp(2.9rem,10vw,4.6rem)/1 var(--font);
    letter-spacing:-.05em; color:var(--amber); font-variant-numeric:tabular-nums;
  }
  .band-n { margin-top:8px; font-size:13.5px; color:var(--soft); max-width:46ch; margin-inline:auto; }

  .domains { margin-top:clamp(32px,6vh,52px); display:flex; flex-direction:column; }
  .dom { padding:18px 0; border-top:1px solid var(--line); }
  .dom:last-child { border-bottom:1px solid var(--line); }

  .dom-top { display:flex; align-items:baseline; gap:12px; }
  .dom-name { font:700 15.5px var(--font); letter-spacing:-.01em; }
  .dom-band { margin-left:auto; font:500 12px var(--mono); letter-spacing:.04em; color:var(--soft); }

  .track { margin-top:11px; height:7px; border-radius:999px; background:var(--mat); overflow:hidden; }
  .fill {
    height:100%; border-radius:999px; background:var(--ink);
    width:0; transition:width .9s var(--ease);
  }
  .dom-note { margin-top:9px; font-size:13.5px; color:var(--soft); }
  .dom-focus { margin-top:5px; font-size:13px; color:var(--faint); }

  .after { margin-top:34px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .txt {
    appearance:none; border:0; background:none; cursor:pointer; padding:0 2px;
    font:600 14px var(--font); color:var(--soft); transition:color .16s var(--ease);
  }
  @media (hover:hover) and (pointer:fine) { .txt:hover { color:var(--ink); } }

  .caveat {
    margin-top:30px; padding-top:18px; border-top:1px solid var(--line);
    font-size:12.5px; line-height:1.6; color:var(--faint);
  }

  /* the paper, one question per block */
  .review { border:0; padding:0; background:none; max-width:min(660px,94vw); max-height:88dvh; }
  .review::backdrop { background:rgba(63,63,63,.34); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); }
  .review-in {
    position:relative; background:var(--paper); border:1px solid var(--line);
    border-radius:14px; padding:26px clamp(20px,4vw,32px) 30px; max-height:88dvh; overflow:auto;
  }
  .review-x {
    position:absolute; top:12px; right:12px; appearance:none; border:0; background:none;
    cursor:pointer; width:34px; height:34px; display:grid; place-items:center;
    border-radius:999px; color:var(--faint);
  }
  @media (hover:hover) and (pointer:fine) { .review-x:hover { color:var(--ink); background:var(--sleeve); } }
  .review h2 { font:700 17px var(--font); margin-bottom:4px; }

  .q { padding:18px 0; border-top:1px solid var(--line); }
  .q-top { display:flex; align-items:center; gap:9px; font:500 11.5px var(--mono); letter-spacing:.05em; color:var(--faint); }
  .q-verdict { margin-left:auto; font-weight:500; }
  .q[data-ok="false"] .q-verdict { color:#b3261e; }
  .q-stem { margin-top:9px; font-size:14.5px; white-space:pre-wrap; }
  .q-fig { margin-top:10px; }
  .q-fig svg { max-width:100%; height:auto; overflow:visible; }
  .q-ans { margin-top:10px; font-size:13.5px; color:var(--soft); }
  .q-ans b { color:var(--ink); font-weight:600; }
  .q-why { margin-top:7px; font-size:13.5px; color:var(--soft); }

  @media (prefers-reduced-motion: reduce) { .fill { transition:none; } }
</style>
</head>
<body>

<main class="sheet-body">
  <section class="band rise" id="band" hidden>
    <p class="band-k" id="bandK">Math</p>
    <p class="band-v" id="bandV">&nbsp;</p>
    <p class="band-n" id="bandN"></p>
  </section>

  <section class="domains rise rise-2" id="domains"></section>

  <div class="after rise rise-2">
    <a class="btn" href="../index.html" id="onward">Start practising</a>
    <button class="txt" type="button" id="reviewBtn">See the questions</button>
  </div>

  <p class="caveat" id="caveat"></p>
</main>

<dialog class="review" id="review" aria-label="Every question, with the answer">
  <div class="review-in">
    <button class="review-x" type="button" id="reviewX" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
      </svg>
    </button>
    <h2>Every question</h2>
    <div id="reviewList"></div>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const sid = new URL(location.href).searchParams.get('s');

const caveat = (asked, perDomain) =>
  `A band, not a score. ${asked} questions cannot place you more precisely than this, ` +
  `and ${perDomain} questions cannot measure a domain -- the College Board says the same ` +
  'about its own report. Read the bars as where to practise next, not as what you are ' +
  'bad at. A full practice test is the only thing that gives you a real score.';

async function load() {
  if (!sid) { location.replace('./'); return; }
  const r = await fetch(`/api/session/${encodeURIComponent(sid)}/results`);
  if (r.status === 403) { location.replace(`./signup.html?s=${encodeURIComponent(sid)}`); return; }
  if (r.status === 409) { location.replace('./'); return; }
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function paint(d) {
  const practice = d.mode === 'practice';
  $('band').hidden = false;

  if (practice) {
    /* No score estimate here. The student picked these topics themselves, in
       whatever mix they liked, so a projected section score off them would be
       a number with nothing behind it. The count is the honest headline. */
    $('bandK').textContent = 'Mixed practice';
    $('bandV').textContent = `${d.right}/${d.asked}`;
    $('bandN').textContent = d.right === d.asked ? 'All of them' : '';
    document.title = 'Practice results · SAT Freshman';
    $('onward').href = '../mixed/';
    $('onward').textContent = 'Another set';
  } else if (d.mode === 'mock') {
    $('onward').href = '../mock/';
    $('onward').textContent = 'Back to the shelf';
  } else {
    $('bandV').textContent = `${d.estimate.low}–${d.estimate.high}`;
    $('bandK').textContent = d.mode === 'mock'
      ? `Mock ${d.mock} · Math section`
      : `${d.estimate.section}, from ${d.asked} questions`;
    /* no praise attached: "nice work" on 2 of 16 is worse than saying nothing */
    $('bandN').textContent = `${d.right} of ${d.asked} right`;

    /* A mock is adaptive, so which second module you were given is part of the
       result and not a detail. The lower one has a ceiling, and a student who
       hit it deserves to know that is why the number stopped where it did. */
    if (d.mode === 'mock' && d.estimate.route) {
      const m1 = d.module1 || {};
      const route = d.estimate.route === 'upper'
        ? 'the harder second module'
        : 'the easier second module';
      $('bandN').textContent =
        `${d.right} of ${d.asked} right. Module 1 went ${m1.right} of ${m1.asked}, ` +
        `which earned ${route}.` +
        (d.estimate.capped
          ? ` The easier module tops out at ${d.estimate.high}, so this section could not score above it.`
          : '');
    }
  }

  $('domains').innerHTML = d.domains.map(x => `
    <div class="dom">
      <div class="dom-top">
        <span class="dom-name">${x.domain}</span>
        <span class="dom-band">${x.band}</span>
      </div>
      <div class="track"><div class="fill" data-to="${Math.round(x.mastery * 100)}"></div></div>
      <p class="dom-note">${x.note}</p>
      ${x.focus.length ? `<p class="dom-focus">Start with ${x.focus.join(', ')}.</p>` : ''}
    </div>`).join('');

  /* fill after a frame, so the bars grow rather than arrive full */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('.fill').forEach(f => { f.style.width = f.dataset.to + '%'; });
  }));

  if (practice) {
    $('caveat').textContent =
      'Practice, not a measurement. These are the topics you chose, so the bars ' +
      'say how today went on them and nothing about where you would score.';
  } else if (d.mode === 'mock') {
    /* This IS the full section, so it must not tell you to go and sit one. */
    $('caveat').textContent =
      'A full Math section, in the shape the real one takes: two modules of 22, ' +
      '35 minutes each, the second chosen from how the first went. It is still a ' +
      'band rather than a score, because these questions have not been sat by ' +
      'thousands of students the way the real ones have, and that calibration is ' +
      'what turns answers into a number.';
  } else {
    const perDomain = d.domains.length ? d.domains[0].asked : 0;
    $('caveat').textContent = caveat(d.asked, perDomain);
  }
  buildReview(d.review || []);
}

function buildReview(list) {
  $('reviewList').innerHTML = list.map((q, i) => {
    const given = q.type === 'mcq'
      ? (Number.isInteger(q.given) ? 'ABCD'[q.given] : 'nothing')
      : (q.given || 'nothing');
    return `
      <div class="q" data-ok="${q.correct}">
        <div class="q-top">
          <span>${i + 1}</span><span>${q.domain}</span><span>${q.difficulty}</span>
          <span class="q-verdict">${q.correct ? 'right' : 'wrong'}</span>
        </div>
        ${q.figure ? `<div class="q-fig">${q.figure}</div>` : ''}
        <p class="q-stem"></p>
        <p class="q-ans">You put <b>${given}</b>. The answer is <b>${q.answer}</b>.</p>
        <p class="q-why">${q.rationale || ''}</p>
      </div>`;
  }).join('');
  /* stems are plain text with real newlines, so they are set as text */
  document.querySelectorAll('.q-stem').forEach((el, i) => { el.textContent = list[i].stem; });

  /* the same 1.45 the test window uses: a chart's labels are 11px inside its
     viewBox, which reads far too small beside the text. No fitting loop here,
     because this panel scrolls by design. */
  document.querySelectorAll('.q-fig svg').forEach(svg => {
    const w = (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width)
              || parseFloat(svg.getAttribute('width')) || 0;
    if (!w) return;
    svg.removeAttribute('width');
    svg.removeAttribute('height');
    svg.style.width = Math.round(w * 1.45) + 'px';
  });
}

$('reviewBtn').addEventListener('click', () => $('review').showModal());
$('reviewX').addEventListener('click', () => $('review').close());
$('review').addEventListener('click', e => { if (e.target === $('review')) $('review').close(); });

load().then(d => d && paint(d)).catch(() => {
  $('band').hidden = false;
  $('bandV').textContent = '—';
  $('bandN').textContent = 'Those results could not be loaded.';
});
</script>

</body>
</html>
