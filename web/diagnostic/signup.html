<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your results · SAT Freshman</title>
<meta name="description" content="Where to send your diagnostic results.">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* The diagnostic's one gate: the paper is marked, and the results go to a
     name and an address before they are shown. */
  .gate { max-width: 460px; display: grid; gap: 16px; }
  .gate .h1 { margin: 0; }
  .gate .skel.line.lg { width: 60%; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field[aria-invalid="true"] { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .go { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
  /* the page is waiting on the email's link: a quiet live dot beside the line that says so */
  #sentState { display: flex; align-items: baseline; gap: 8px; }
  #sentState::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--amber); transform: translateY(-1px); }
  @media (max-width: 420px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body data-page="diagnostic">
<header id="bar"></header>

<main class="page" id="main" tabindex="-1">
  <div class="gate" id="wait" aria-busy="true"><span class="skel line lg"></span><span class="skel line"></span></div>
  <form class="gate" id="form" novalidate hidden>
    <h1 class="h1">Where should the diagnostic results go?</h1>
    <div class="pair">
      <label><span class="label">First name</span><input class="field" id="first" autocomplete="given-name" required maxlength="60"></label>
      <label><span class="label">Last name</span><input class="field" id="last" autocomplete="family-name" required maxlength="60"></label>
    </div>
    <label><span class="label">Email</span><input class="field" id="email" type="email" autocomplete="email" required inputmode="email" spellcheck="false"></label>
    <p class="error" id="err" role="alert" hidden></p>
    <div class="go"><button class="pill" type="submit" id="go">See my results</button><span class="note">One email, to confirm it</span></div>
    <p class="note" id="pk" hidden>Or <button type="button" class="quiet" id="pkgo">save with a passkey</button>: no email, and the results open at once.</p>
  </form>
  <div class="gate" id="sent" hidden>
    <h1 class="h1">Check your email</h1>
    <p id="sentText"></p>
    <p class="note" role="status" id="sentState">This page opens your results as soon as you confirm.</p>
    <div class="go"><button type="button" class="pill" id="pkgo2" hidden>Save with a passkey</button><button type="button" class="quiet" id="again">Use a different email</button></div>
  </div>
  <div class="gate" id="later" hidden>
    <h1 class="h1">Finish the diagnostic first</h1>
    <p>Your results are ready once the last module is handed in.</p>
    <div class="go"><a class="pill" href="/diagnostic/">Back to the diagnostic</a></div>
  </div>
</main>

<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/me/account.js"></script>
<script>
/* The diagnostic's gate (R38, shell-me U19): a saved learner (passkey, verified email or
   Google, account.saved) goes straight to the results with no form. Anyone else gives a
   name and an email; the results open here once the email's link is tapped. */
(() => {
  'use strict';
  const { $ } = UI;
  UI.shell({ ownPrimary: true });   // the page has its own orange; Up next’s Start goes .btn
  const sid = new URL(location.href).searchParams.get('s');
  if (!sid) { location.replace('/diagnostic/'); return; }
  const report = `/results/report/?id=${encodeURIComponent(sid)}`;
  const show = id => ['wait', 'form', 'sent', 'later'].forEach(x => { $('#' + x).hidden = x !== id; });
  const fail = text => { $('#err').textContent = text; $('#err').hidden = false; };
  // results come back 200 once this learner is saved or the email is confirmed
  const check = () => UI.api(`/session/${encodeURIComponent(sid)}/results`, { quiet: true }).then(() => true, e => {
    if (e && e.status === 409) return 'finish';
    return false;
  });
  check().then(r => {
    if (r === true) { location.replace(report); return; }
    if (r === 'finish') { show('later'); return; }
    show('form');
    UI.acct.passkeyReady().then(ok => { $('#pk').hidden = !ok; });
  });
  const viaPasskey = async () => {
    try { await UI.acct.savePasskey(); UI.acct.flash('Saved. This passkey signs you in wherever your passwords sync.'); location.href = report; }
    catch (e) { if (!e || e.name !== 'NotAllowedError') { show('form'); fail('Couldn’t save a passkey here. Use your email instead.'); } }
  };
  $('#pkgo').addEventListener('click', viaPasskey);
  $('#pkgo2').addEventListener('click', viaPasskey);
  let poll = 0;
  $('#again').addEventListener('click', () => { clearInterval(poll); show('form'); $('#email').focus(); });

  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    const first = $('#first').value.trim(), last = $('#last').value.trim(), email = $('#email').value.trim();
    const emailOk = !!email && $('#email').checkValidity();
    [[$('#first'), first], [$('#last'), last], [$('#email'), emailOk]]
      .forEach(([el, ok]) => el.setAttribute('aria-invalid', String(!ok)));
    if (!first || !last || !emailOk) return fail('Both names and an email we can reach.');

    $('#err').hidden = true;
    $('#go').setAttribute('aria-busy', 'true');
    try {
      const r = await UI.api(`/session/${encodeURIComponent(sid)}/signup`, { method: 'POST', body: { first, last, email } });
      $('#go').removeAttribute('aria-busy');
      if (r && r.verified) { location.href = report; return; }
      const masked = email.replace(/^(.)[^@]*(@.*)$/, (m, a, b) => `${a}•••${b}`);
      $('#sentText').textContent = r && r.email === 'outbox'
        ? 'Email isn’t switched on for this site yet, so no confirmation can arrive. Save with a passkey instead to see your results now.'
        : `We sent a confirmation to ${masked}. Tap Confirm in it, on any device.`;
      $('#pkgo2').hidden = !(r && r.email === 'outbox') || $('#pk').hidden;
      show('sent');
      clearInterval(poll);
      poll = setInterval(async () => { if (await check() === true) { clearInterval(poll); location.href = report; } }, 3000);
    } catch (ex) {
      $('#go').removeAttribute('aria-busy');
      // a name the server refuses says so; a 422 with no words of its own is the email
      const said = ex.data && typeof ex.data.detail === 'string' ? UI.cap(ex.data.detail) + '.' : null;
      fail(ex.status === 422 ? said || 'That email did not look right.' : ex.status === 409 ? 'Finish the test first.' : 'Something went wrong.');
    }
  });
})();
</script>
</body>
</html>
