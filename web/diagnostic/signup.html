<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your results · SAT Freshman</title>
<meta name="description" content="Where to send your diagnostic results.">
<link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .centre { min-height:100dvh; display:grid; place-items:center; padding:40px var(--gutter); }
  .card { width:min(430px,100%); }

  .card h1 { font:900 clamp(1.9rem,5vw,2.6rem)/1.02 var(--font); letter-spacing:-.04em; }
  .card > p { margin-top:10px; color:var(--soft); font-size:14px; }

  form { margin-top:26px; display:flex; flex-direction:column; gap:14px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:420px) { .pair { grid-template-columns:1fr; } }

  label { display:flex; flex-direction:column; gap:6px; }
  label span { font:600 12px var(--font); letter-spacing:.03em; text-transform:uppercase; color:var(--soft); }
  input {
    font:500 15px var(--font); color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    transition:border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  input:focus { outline:0; border-color:var(--amber); box-shadow:0 0 0 3px var(--amber-wash); }
  input[aria-invalid="true"] { border-color:#b3261e; }

  .btn { width:100%; margin-top:6px; }
  .btn[disabled] { opacity:.45; }

  .err { color:#b3261e; font-size:13px; min-height:18px; }
  .fine { margin-top:16px; font-size:12.5px; color:var(--faint); line-height:1.5; }
</style>
</head>
<body>

<div class="centre">
  <div class="card rise">
    <h1>Where should the results go?</h1>
    <p id="lede">Sixteen questions marked. Tell us where to send them.</p>

    <form id="form" novalidate>
      <div class="pair">
        <label>
          <span>First name</span>
          <input id="first" name="first" autocomplete="given-name" required maxlength="60">
        </label>
        <label>
          <span>Last name</span>
          <input id="last" name="last" autocomplete="family-name" required maxlength="60">
        </label>
      </div>
      <label>
        <span>Email</span>
        <input id="email" name="email" type="email" autocomplete="email" required
               inputmode="email" spellcheck="false">
      </label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit" id="go">See my results</button>
    </form>

    <p class="fine">We send one email to confirm the address. Your results are ready either way.</p>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const sid = new URL(location.href).searchParams.get('s');
if (!sid) location.replace('./');

$('form').addEventListener('submit', async e => {
  e.preventDefault();
  const first = $('first').value.trim();
  const last  = $('last').value.trim();
  const email = $('email').value.trim();

  /* the browser's own check, so the rules live in one place */
  for (const [el, ok] of [[$('first'), first], [$('last'), last],
                          [$('email'), email && $('email').checkValidity()]]) {
    el.setAttribute('aria-invalid', String(!ok));
  }
  if (!first || !last || !email || !$('email').checkValidity()) {
    $('err').textContent = 'Both names and an email we can reach.';
    return;
  }

  $('err').textContent = '';
  $('go').disabled = true;
  $('go').textContent = 'One moment';

  try {
    const r = await fetch(`/api/session/${encodeURIComponent(sid)}/signup`, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ first, last, email }),
    });
    if (!r.ok) throw new Error(r.status === 422 ? 'That email did not look right.' : 'Something went wrong.');
    location.href = `./results.html?s=${encodeURIComponent(sid)}`;
  } catch (ex) {
    $('err').textContent = ex.message;
    $('go').disabled = false;
    $('go').textContent = 'See my results';
  }
});
</script>

</body>
</html>
