<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your results · SAT Freshman</title>
<meta name="description" content="Where to send your diagnostic results.">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* The diagnostic's one gate: the paper is marked, and the results go to a
     name and an address before they are shown. */
  .gate { max-width: 460px; display: grid; gap: 18px; }
  .gate .h1 { margin: 6px 0 10px; }
  .gate label .k { display: block; margin-bottom: 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field[aria-invalid="true"] { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .go { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 6px; }
  @media (max-width: 420px) { .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body data-page="diagnostic">
<header id="bar"></header>

<main class="page">
  <form class="gate rise" id="form" novalidate>
    <div><span class="k">Diagnostic</span><h1 class="h1">Where should the results go?</h1></div>
    <div class="pair">
      <label><span class="k">First name</span><input class="field" id="first" autocomplete="given-name" required maxlength="60"></label>
      <label><span class="k">Last name</span><input class="field" id="last" autocomplete="family-name" required maxlength="60"></label>
    </div>
    <label><span class="k">Email</span><input class="field" id="email" type="email" autocomplete="email" required inputmode="email" spellcheck="false"></label>
    <p class="error" id="err" role="alert" hidden></p>
    <div class="go"><button class="pill" type="submit" id="go">See my results</button><span class="note">One email, to confirm it</span></div>
  </form>
</main>

<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script>
(() => {
  'use strict';
  const { $ } = UI;
  UI.shell();
  const sid = new URL(location.href).searchParams.get('s');
  if (!sid) { location.replace('/diagnostic/'); return; }
  const report = `/results/report/?id=${encodeURIComponent(sid)}`;

  const fail = text => { $('#err').textContent = text; $('#err').hidden = false; };

  $('#form').addEventListener('submit', async e => {
    e.preventDefault();
    const first = $('#first').value.trim(), last = $('#last').value.trim(), email = $('#email').value.trim();
    const emailOk = !!email && $('#email').checkValidity();
    [[$('#first'), first], [$('#last'), last], [$('#email'), emailOk]]
      .forEach(([el, ok]) => el.setAttribute('aria-invalid', String(!ok)));
    if (!first || !last || !emailOk) return fail('Both names and an email we can reach.');

    $('#err').hidden = true;
    $('#go').setAttribute('aria-busy', 'true');
    try {
      await UI.api(`/session/${encodeURIComponent(sid)}/signup`, { method: 'POST', body: { first, last, email } });
      location.href = report;
    } catch (ex) {
      $('#go').removeAttribute('aria-busy');
      fail(ex.status === 422 ? 'That email did not look right.' : ex.status === 409 ? 'Finish the test first.' : 'Something went wrong.');
    }
  });
})();
</script>
</body>
</html>
