<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Email confirmed · SAT Freshman</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/ui.css">
<style>
  .done { display: grid; gap: 16px; justify-items: start; max-width: 520px; }
  .done .h1 { margin: 0; }
  .done .acts { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
</style>
</head>
<body data-page="diagnostic">
<header id="bar"></header>

<main class="page" id="main" tabindex="-1">
  <div class="done">
    <h1 class="h1" id="title">Email confirmed</h1>
    <p id="text">Your progress is saved. The page where you took the diagnostic opens your results by itself.</p>
    <div class="acts"><a class="pill" href="/">Today</a><a class="quiet" href="/signin/" id="other">Sign in on this device</a></div>
  </div>
</main>

<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script>
  UI.shell({ ownPrimary: true });   // the page has its own orange; Up next’s Start goes .btn
  if (new URL(location.href).searchParams.get('state') === 'bad') {
    document.title = 'Link expired · SAT Freshman';
    UI.$('#title').textContent = 'That link has expired';
    UI.$('#text').textContent = 'Confirmation links work once, for 30 minutes. Send the results to your email again from the diagnostic, or save with a passkey there.';
    UI.$('#other').hidden = true;
  }
</script>
</body>
</html>
