<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diagnostic · SAT Freshman</title>
<meta name="description" content="Find the level to start from, in one sitting.">
<link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .open {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(26px,5vh,44px); padding:24px var(--gutter) 48px; text-align:center;
  }

  .open h2 {
    margin:0;
    font:900 clamp(2.4rem,8vw,4.4rem)/.98 var(--font);
    letter-spacing:-.045em; text-wrap:balance;
  }

  .acts { display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; }
  .acts .btn-quiet { min-height:46px; padding:0 22px; font-size:14.5px; font-weight:700; }
</style>
</head>
<body data-nav="diagnostic">

<a class="skip" href="#main">Skip to content</a>

<div class="app">
  <aside class="rail"></aside>

  <main class="main" id="main">
    <header class="head">
      <button class="rail-toggle" type="button" aria-label="Show navigation" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <h1 class="head-title">Diagnostic</h1>
    </header>

    <section class="open">
      <h2 class="rise">Diagnostic test</h2>
      <div class="acts rise rise-2">
        <button class="btn btn-quiet" type="button" id="skip">Skip</button>
        <button class="btn" type="button" id="go">Continue</button>
      </div>
    </section>
  </main>
</div>

<script src="../assets/app.js"></script>
<script>
document.getElementById('skip').addEventListener('click',()=>console.log('[router] /overview'));
document.getElementById('go').addEventListener('click',()=>console.log('[router] /diagnostic/start'));
</script>

</body>
</html>
