<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diagnostic · SAT Freshman</title>
<meta name="description" content="Find the level to start from, in one sitting.">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  .door { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end;
          border-radius: 14px; padding: 28px; background: var(--wash); max-width: 760px; }
  .door .num { font-size: clamp(64px, 10vw, 104px); display: block; margin-top: 8px; }
  .door .meta { display: block; margin-top: 10px; color: var(--ink); }
  .door-facts { margin: 16px 0 0; padding: 0 0 0 18px; display: grid; gap: 6px; font: 400 15px/1.45 var(--font); color: var(--ink); }
  @media (max-width: 560px) { .door { grid-template-columns: 1fr; padding: 20px 16px; } .door .pill { width: 100%; justify-content: center; } }
</style>
</head>
<body data-page="diagnostic">
<header id="bar"></header>

<main class="page">
  <div class="door rise">
    <div>
      <span class="k">Diagnostic</span><span class="num">20</span><span class="meta">questions · 32 min · all four domains evenly</span>
      <ul class="door-facts">
        <li>A first band, about 200 points wide, and where your points went</li>
        <li>No answers until you hand in, like a real module</li>
        <li>Asks for your name and email before the result</li>
      </ul>
    </div>
    <div><a class="pill" href="/tests/?start=diagnostic" id="diagStart">Start</a></div>
  </div>
</main>

<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/tests/start.js"></script>
<script>
UI.shell();
// Start builds the diagnostic in one tap (the same call Up next makes) and lands in its lobby:
// no Tests page, no start sheet. The href stays as the fallback if a script is blocked.
document.getElementById('diagStart').addEventListener('click', e => {
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button || !window.TestStart) return;
  e.preventDefault();
  if (e.currentTarget.getAttribute('aria-busy')) return;
  TestStart.go({ kind: 'diagnostic' }, e.currentTarget).catch(() => {});
});
</script>
</body>
</html>
