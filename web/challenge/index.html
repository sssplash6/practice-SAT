<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Challenge · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* Ten questions, the same for everyone today, one sitting each. Ranked by
     how many are right, then by the clock. */
  .head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
  .head .num { font-size: clamp(64px, 10vw, 104px); display: block; margin-top: 8px; }
  .head .meta { display: block; margin-top: 10px; color: var(--ink); }
  .days { display: flex; gap: 2px; margin-top: 30px; }
  .board { margin-top: 18px; display: grid; gap: 2px; }
  .line { display: grid; grid-template-columns: 44px minmax(0, 1fr) 60px 64px; gap: 14px; align-items: center;
          padding: 12px 16px; border-radius: 10px; }
  .line:nth-child(odd) { background: var(--tile); }
  .line.you { background: var(--wash); box-shadow: inset 0 0 0 1.5px var(--amber); }
  .line .r { font: 800 16px var(--font); font-variant-numeric: tabular-nums; }
  .line .nm { font: 600 15px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line .v { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .line .t { font: 500 13px var(--mono); color: var(--soft); text-align: right; font-variant-numeric: tabular-nums; }
  .named { margin-top: 18px; display: flex; gap: 10px; max-width: 420px; }
  .named .field { flex: 1; }
</style>
</head>
<body data-page="challenge">
<header id="bar"></header>

<main class="page">
  <div class="head rise">
    <div>
      <span class="k" id="day"></span>
      <span class="num" id="big">10</span>
      <span class="meta" id="sub">questions · 16 min</span>
    </div>
    <div id="act"></div>
  </div>
  <form class="named rise rise-2" id="named" hidden>
    <input class="field" id="name" maxlength="24" placeholder="Your name" autocomplete="nickname" aria-label="Your name on the board">
    <button type="submit" class="quiet" style="margin:0">Save</button>
  </form>
  <p class="error" id="err" hidden></p>

  <div class="choices days" id="days" role="group" aria-label="Day">
    <button type="button" data-d="0" aria-pressed="true">Today</button>
    <button type="button" data-d="1" aria-pressed="false">Yesterday</button>
  </div>
  <div class="board rise rise-2" id="board"></div>
</main>

<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script>
(() => {
  'use strict';
  const { api, h, day, mmss, $ } = UI;
  UI.shell();

  function local(offsetDays) {
    const d = new Date(); d.setDate(d.getDate() - offsetDays);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function paintBoard(b) {
    const host = $('#board');
    if (!b.entries.length) { host.replaceChildren(h('p', { class: 'empty', text: 'No one yet.' })); return; }
    host.replaceChildren(...b.entries.map(e => h('div', { class: 'line' + (e.you ? ' you' : '') },
      h('span', { class: 'r', text: e.rank }),
      h('span', { class: 'nm', text: e.name }),
      h('span', { class: 'v', text: `${e.right}/${e.asked}` }),
      h('span', { class: 't', text: mmss(e.seconds) }))));
  }

  async function showDay(offset) {
    const d = local(offset);
    try { paintBoard(await api(`/challenge/board?day=${d}`)); } catch (_) {}
  }
  $('#days').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $('#days').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    showDay(Number(b.dataset.d));
  });

  $('#named').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('#name').value.trim();
    if (!name) return;
    try { await api('/me', { method: 'PUT', body: { name } }); $('#named').hidden = true; showDay(0); UI.me(true); }
    catch (err) { $('#err').textContent = err.message; $('#err').hidden = false; }
  });

  (async () => {
    let c;
    try { c = await api('/challenge'); } catch (e) { $('#err').textContent = 'The server is not answering.'; $('#err').hidden = false; return; }
    $('#day').textContent = day(c.day);
    const you = c.board.you;
    if (c.finished && you) {
      $('#big').textContent = `#${you.rank}`;
      $('#sub').textContent = `of ${c.board.players} · ${you.right}/${you.asked} · ${mmss(you.seconds)}`;
      const me = await UI.me().catch(() => null);
      if (me && !me.profile.name) $('#named').hidden = false;
    } else {
      $('#sub').textContent = `questions · ${Math.round(c.seconds / 60)} min${c.board.players ? ` · ${c.board.players} in` : ''}`;
      const b = h('button', { type: 'button', class: 'pill', text: c.session ? 'Resume' : 'Start' });
      b.addEventListener('click', async () => {
        b.setAttribute('aria-busy', 'true');
        try {
          const s = await api('/challenge/start', { method: 'POST' });
          location.href = `/practice/session/?id=${encodeURIComponent(s.id)}`;
        } catch (e) { b.removeAttribute('aria-busy'); $('#err').textContent = e.message; $('#err').hidden = false; }
      });
      $('#act').append(b);
    }
    paintBoard(c.board);
    showDay(0);
  })();
})();
</script>
</body>
</html>
