<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Challenge · SAT Freshman</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* Ten questions, the same for everyone today, one sitting each. Ranked by
     how many are right, then by the clock. */
  /* the page's one hero: your rank (or today's count) at the hero step, its meta, Start; then the day switch and the board */
  .ch-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 24px; margin-top: 16px; }
  .ch-sub { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin: 0; min-height: 64px; }
  .ch-sub .skel { width: 220px; align-self: center; }
  .ch-big { font-size: var(--fs-hero); line-height: 1; letter-spacing: -.035em; color: var(--ink-strong); }
  .ch-sub .meta { font-size: 14.5px; }
  .ch-head .named { flex: 1 1 100%; margin: 0; }
  .named { display: flex; gap: 8px; max-width: 420px; }
  .named .field { flex: 1; }
  .named .quiet { margin: 0; }
  .days { margin-top: 32px; }
  .board { margin-top: 12px; display: grid; border-top: 1px solid var(--line); }
  .ch-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) 60px 64px; gap: 12px; align-items: center;
            min-height: var(--row-h); padding: 4px 12px; border-bottom: 1px solid var(--line); }
  /* yours: the wash band, the rank in amber-deep, the name at 600 and a "You" label; no stripe, the same height as
     every row. It stays on screen:
     scrolled past, it sticks to the top or the bottom edge (the phone's bar and tabs) */
  .ch-row.you { position: sticky; top: 0; bottom: 0; z-index: 1; background: var(--wash); }
  .ch-row.you .r { color: var(--amber-deep); }
  .ch-row.you .nm { font-weight: 600; }
  .ch-row .nm .badge { margin-left: 8px; vertical-align: 1px; }
  .ch-row .r { font: 600 14.5px var(--font); font-variant-numeric: tabular-nums; }
  .ch-row .nm { font: 500 14.5px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-row .v { font: 500 12.5px var(--font); text-align: right; font-variant-numeric: tabular-nums; }
  .ch-row .t { font: 500 12.5px var(--font); color: var(--soft); text-align: right; font-variant-numeric: tabular-nums; }
  .board > .empty { padding: 16px 0; }
  .board .empty-sample .ch-row { border-bottom: 0; }
  @media (max-width: 759px) {
    .ch-row.you { top: calc(56px + env(safe-area-inset-top, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    .ch-head .pill { flex: 1 1 100%; justify-content: center; }
  }
</style>
</head>
<body data-page="challenge">
<header id="bar"></header>

<main class="page" data-m="stagger">
  <h1 class="h1">Daily challenge</h1>
  <section class="card hero ch-head" aria-label="Today" data-m-now>
    <p class="ch-sub" id="sub" aria-busy="true"><span class="skel line"></span></p>
    <div id="act"></div>
    <form class="named" id="named" hidden>
      <input class="field" id="name" maxlength="24" placeholder="Your name" autocomplete="nickname" aria-label="Your name on the board">
      <button type="submit" class="quiet">Save</button>
    </form>
  </section>
  <p class="error" id="err" hidden></p>

  <div class="days" id="days"></div>
  <div class="board" id="board" aria-busy="true"></div>
</main>

<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script>
(() => {
  'use strict';
  const { api, h, day, mmss, $ } = UI;
  UI.shell();

  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  function local(offsetDays) { const d = new Date(); d.setDate(d.getDate() - offsetDays); return ymd(d); }

  function paintBoard(b) {
    const host = $('#board');
    host.removeAttribute('aria-busy');
    const row = e => h('div', { class: 'ch-row' + (e.you ? ' you' : ''), 'data-key': `${e.rank}:${e.name}` },
      h('span', { class: 'r', text: e.rank }),
      h('span', { class: 'nm' }, e.name, e.you ? h('span', { class: 'badge', text: 'You' }) : null),
      h('span', { class: 'v', text: `${e.right}/${e.asked}` }),
      h('span', { class: 't', text: mmss(e.seconds) }));
    // an empty board shows what a row will look like, dimmed, under the one line
    if (!b.entries.length) { host.replaceChildren(); UI.empty(host, { sample: row({ rank: 1, name: 'Your name', right: 10, asked: 10, seconds: 570 }), text: 'No one yet.' }); return; }
    // a day switch glides: rows that stay move to their place, the rest fade (UI.glide; the first paint is plain)
    if (UI.glide && host.dataset.painted) UI.glide(host, () => host.replaceChildren(...b.entries.map(row)));
    else host.replaceChildren(...b.entries.map(row));
    host.dataset.painted = '1';
  }
  // a day is 0 (today), 1 (yesterday) or a date, read when it is shown (a page left open past midnight)
  async function showDay(d) {
    try { paintBoard(await api(`/challenge/board?day=${typeof d === 'number' ? local(d) : d}`)); } catch (_) {}
  }
  // ?day=YYYY-MM-DD (Today's "Yesterday: #4" link): that day's board, as its own option when it is older than yesterday
  const want = new URLSearchParams(location.search).get('day');
  const days = [{ value: 0, label: 'Today' }, { value: 1, label: 'Yesterday' }];
  let start = 0;
  if (want && /^\d{4}-\d{2}-\d{2}$/.test(want)) {
    start = [local(0), local(1)].indexOf(want);
    if (start < 0) { days.push({ value: want, label: day(want) }); start = want; }
  }
  const daySeg = UI.seg($('#days'), days, { value: start, label: 'Day', onChange: showDay });
  showDay(daySeg.value);             // the one board fetch; the head's /api/challenge carries only the top five

  $('#named').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('#name').value.trim();
    if (!name) return;
    try { await api('/me', { method: 'PUT', body: { name } }); $('#named').hidden = true; showDay(daySeg.value); UI.me(true); }
    catch (err) { $('#err').textContent = err.message; $('#err').hidden = false; }
  });

  (async () => {
    let c;
    try { c = await api('/challenge'); } catch (e) { $('#sub').replaceChildren(); $('#err').textContent = 'The server is not answering.'; $('#err').hidden = false; return; }
    const sub = $('#sub');
    sub.removeAttribute('aria-busy');
    const board = c.board || {}, you = board.you;
    if (c.finished && you) {
      sub.replaceChildren(h('span', { class: 'num hero-num ch-big', text: `#${you.rank}` }),
        h('span', { class: 'meta', text: [`of ${board.players}`, `${you.right}/${you.asked}`, mmss(you.seconds), c.day ? day(c.day) : null].filter(Boolean).join(' · ') }));
      const me = await UI.me().catch(() => null);
      if (me && !me.profile.name) $('#named').hidden = false;
    } else {
      sub.replaceChildren(h('span', { class: 'num hero-num ch-big', text: String(c.count || 10) }),
        h('span', { class: 'meta', text: ['questions', c.seconds ? `${Math.round(c.seconds / 60)} min` : null, board.players ? `${board.players} in` : null, c.day ? day(c.day) : null].filter(Boolean).join(' · ') }));
      const b = h('button', { type: 'button', class: 'pill', text: c.session ? 'Resume' : 'Start' });
      b.addEventListener('click', async () => {
        b.setAttribute('aria-busy', 'true');
        try {
          const s = await api('/challenge/start', { method: 'POST' });
          location.href = `/practice/session/?id=${encodeURIComponent(s.id)}`;
        } catch (e) { b.removeAttribute('aria-busy'); $('#err').textContent = e.message; $('#err').hidden = false; }
      });
      $('#act').append(b);
    }
  })();
})();
</script>
</body>
</html>
