<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leaderboard · SAT Freshman</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/compete/compete.css">
<style>
  /* The leaderboard (spec 3.7 §5, compete.md): the podium (the page's hero) and the table in main. From 1280px the
     side column holds metric, period, who and Find; below that one summary button on the title row opens them in a sheet */
  .lb-main { display: grid; gap: 16px; align-content: start; }
  .lb-ctl .k-row { margin-bottom: 4px; }
  .lb-metrics { display: grid; gap: 2px; margin-bottom: 12px; }
  .lb-metrics > .choice-row:not([aria-pressed="true"]) { box-shadow: none; }   /* a list to pick from: plain rows and the hover band, the pick in the one selected look */
  .lb-ctl .lb-period .seg > button { padding: 0 8px; }   /* five periods on one line in 300px */
  .lb-ctl .lb-filters { display: grid; gap: 8px; width: 100%; }
  .lb-ctl .lb-filters select.field, .find .field { width: 100%; max-width: none; }
  .lb-ctl .resets { color: var(--soft); font-weight: 400; }
  .lb-sum { margin-left: auto; max-width: 100%; }
  .lb-sum > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (min-width: 1280px) { .lb-sum { display: none; } }
  @media (max-width: 1279px) { .lb-side { display: none; } }
</style>
</head>
<body data-page="compete">
<header id="bar"></header>
<main class="page cx" id="main" tabindex="-1">
  <header class="cx-head">
    <h1 class="h1">Leaderboard</h1>
    <div id="subnav"></div>
    <button type="button" class="btn sm lb-sum" id="lb-sum" aria-haspopup="dialog">Board</button>
  </header>
  <div class="cx-subject" id="subject"></div>
  <div class="twocol">
    <div class="lb-main" data-m="stagger">
      <section id="podium" aria-label="Podium"></section>
      <section class="card" id="table" aria-label="Board"></section>
    </div>
    <aside class="twocol-side lb-side" aria-label="Board controls">
      <section class="lb-ctl" id="ctl" aria-label="Metric, period and who"></section>
      <div class="find" id="find"></div>
    </aside>
  </div>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script>UI.shell('compete');</script>
<script src="/assets/compete-ui.js"></script>
<script src="/compete/leaderboard/leaderboard.js"></script>
</body>
</html>
