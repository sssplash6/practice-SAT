<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Leaderboard · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/compete/compete.css">
<style>
  /* The leaderboard (spec 3.7 §5, compete.md): controls → podium → your path → find → table */
  .lb-ctl .lb-filters { display: inline-flex; flex-wrap: wrap; gap: 8px 12px; margin-left: auto; }
  .lb-ctl .lb-fbtn { display: none; }
  .lb-ctl .resets { color: var(--soft); font-weight: 400; }
  .lb-sheet { display: grid; gap: 12px; }
  .lb-sheet select.field { width: 100%; }
  @media (max-width: 759px) {
    /* the metrics scroll sideways on one line, full labels, ending with their i */
    .lb-ctl .lb-metrics { flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding-inline: calc(var(--gutter) - 9px); margin: 0 calc(-1 * var(--gutter)); padding: 0 var(--gutter); scrollbar-width: none; }
    .lb-ctl .lb-metrics::-webkit-scrollbar { display: none; }
    .lb-ctl .lb-metrics .choices { flex-wrap: nowrap; }
    .lb-ctl .lb-metrics .choices button { flex: none; white-space: nowrap; scroll-snap-align: start; }
    .lb-ctl .lb-filters { display: none; }
    .lb-ctl .lb-fbtn { display: inline-flex; }
  }
</style>
</head>
<body data-page="compete">
<header id="bar"></header>
<main class="page cx" id="main" tabindex="-1">
  <h1 class="h1">Leaderboard</h1>
  <div id="subnav"></div>
  <section class="lb-ctl" id="ctl" aria-label="Board controls"></section>
  <section id="podium" aria-label="Podium"></section>
  <p class="path-line" id="path"></p>
  <div class="find" id="find"></div>
  <section id="table" aria-label="Board"></section>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script>UI.shell('compete');</script>
<script src="/assets/compete-ui.js"></script>
<script src="/compete/leaderboard/leaderboard.js"></script>
</body>
</html>
