<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your rankings · SAT Freshman</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/compete/compete.css">
<style>
  /* Your rankings (spec 3.7 §6, compete.md layout): main Summary · Your ranks · Pace · Contest history; side Rating ·
     Records · Rivals, then Badges, Seasons, Champions and the Level ladder folded. Below 1280px one column, in --o order. */
  .sum-tiles { --cols: 5; --cols-phone: 2; }
  @media (max-width: 1279px) {
    #main > .twocol > :is(.cx-main, .twocol-side) { display: contents; }
    #main > .twocol > * > * { order: var(--o, 50); }
  }
  .cx .card-head > .card-fold { margin-left: auto; }
  .cx .card-act + .card-fold { margin-left: 0; }
  .rate-block { display: flex; align-items: center; gap: 16px; }
  .rate-block .hero-num { display: block; margin: 2px 0; }
  .pace-rows { display: grid; gap: 12px; }
  .pace-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 12px; align-items: center; }
  .pace-row .tb { position: relative; height: 8px; border-radius: 4px; background: var(--track); }
  .pace-row .tb > i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: inherit; background: var(--amber); }
  .pace-row .tb > b { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--ink); }
  .pace-row .pm { grid-column: 2; font: 500 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--soft); }
  .pace-row .pa { grid-column: 2; justify-self: start; }
  .hist-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
  .hist .xbtn { display: grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; cursor: pointer; color: var(--ink); }
  .hist .xbtn svg { width: 16px; height: 16px; transition: transform .16s var(--ease); }
  .hist .xbtn[aria-expanded="true"] svg { transform: rotate(90deg); }
  .hist td .star svg { width: 14px; height: 14px; vertical-align: -2px; color: var(--amber-deep); }
  .hx-ph { display: none; }
  .rv-act { display: inline-flex; align-items: center; gap: 16px; }
  .rv-act .quiet { margin: 0 -4px 0 0; }
  #rivals .rowmenu { flex: none; width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--soft); cursor: pointer; }
  @media (hover: hover) and (pointer: fine) { #rivals .rowmenu:hover { background: var(--well); color: var(--ink); } }
  #ranks td[colspan] { text-align: left; }
  .mt-l { display: inline-flex; align-items: center; gap: 8px; }
  /* the four reference cards read as one list while folded: joined, the edge between them is the hairline */
  .twocol-side > .card[data-collapsed] { padding-block: 14px; }
  .twocol-side > .card[data-collapsed] + .card[data-collapsed] { margin-top: calc(-1 * var(--card-gap)); border-top-left-radius: 0; border-top-right-radius: 0; }
  .twocol-side > .card[data-collapsed]:has(+ .card[data-collapsed]) { border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
  @media (max-width: 759px) { .pace-row { grid-template-columns: 90px minmax(0, 1fr); } .cx .hx-opt { display: none; }
    .hx-ph { display: block; margin-top: 2px; font: 500 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--soft); } .hist th.hx-opt { display: none; } }
</style>
</head>
<body data-page="compete">
<header id="bar"></header>
<main class="page cx" id="main" tabindex="-1">
  <header class="cx-head">
    <h1 class="h1">Your rankings</h1>
    <div id="subnav"></div>
  </header>
  <div class="cx-subject" id="subject"></div>
  <div class="twocol">
    <div class="cx-main" data-m="stagger">
      <section class="card" id="summary" style="--o:1" aria-labelledby="summary-h"></section>
      <section class="card" id="ranks" style="--o:3" aria-labelledby="ranks-h"></section>
      <section class="card" id="pace" style="--o:4" aria-labelledby="pace-h"></section>
      <section class="card" id="history" style="--o:7" aria-labelledby="history-h"></section>
    </div>
    <aside class="twocol-side" data-m="stagger">
      <section class="card hero" id="rating" style="--o:2" aria-labelledby="rating-h"></section>
      <section class="card" id="records" style="--o:5" aria-labelledby="records-h"></section>
      <section class="card" id="rivals" style="--o:6" aria-labelledby="rivals-h"></section>
      <section class="card" id="badges" style="--o:8" aria-labelledby="badges-h" data-collapsed></section>
      <section class="card" id="seasons" style="--o:9" aria-labelledby="seasons-h" data-collapsed></section>
      <section class="card" id="champions" style="--o:10" aria-labelledby="champions-h" data-collapsed></section>
      <section class="card" id="ladder" style="--o:11" aria-labelledby="ladder-h" data-collapsed></section>
    </aside>
  </div>
</main>
<nav id="tabs"></nav>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script>UI.shell({ page: 'compete', ownPrimary: true });   /* Rating's Practise (or Start today's challenge) is the one orange */</script>
<script src="/assets/compete-ui.js"></script>
<script src="/compete/rankings/rankings.js"></script>
</body>
</html>
