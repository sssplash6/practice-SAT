<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Practice · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/runner.css">
<style>
  /* The practice session (spec 3.3 part 2). The runner (runner.css) draws the set; these
     rules lay out the loading and error states, the Summary (2.11) and the print view (2.12). */
  body { background: var(--paper); }
  .ps-state { max-width: 560px; margin: 0 auto; padding: 72px 16px; display: grid; gap: 14px; justify-items: start; }
  .ps-state p { margin: 0; font: 500 16px/1.5 var(--font); }
  .ps-state .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .ps-skel { max-width: 760px; margin: 0 auto; padding: 88px 16px; display: grid; gap: 12px; }

  /* Summary */
  .sm-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px;
    background: var(--paper); box-shadow: inset 0 -1px 0 var(--line); }
  .sm-exit { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border-radius: 8px; color: var(--ink);
    font: 600 14px var(--font); text-decoration: none; }
  .sm-exit:hover { background: var(--tile); }
  .sm-title { font: 600 14px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .psum { max-width: 860px; margin: 0 auto; padding: 24px 16px 120px; display: grid; gap: 28px; }
  .psum * { min-width: 0; }
  .psum h2 { margin: 0 0 12px; font: 700 18px/1.25 var(--font); letter-spacing: -.015em; }
  .sm-head { display: grid; gap: 8px; }
  .sm-score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .sm-score .num { font-size: 96px; line-height: .95; letter-spacing: -.04em; }
  .sm-score .acc { font: 600 18px/1.3 var(--font); }
  .sm-before { margin: 0; font: 500 15px/1.45 var(--font); color: var(--soft); }
  .sm-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .sm-note { margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--wash); box-shadow: inset 3px 0 0 var(--amber); font: 500 14px/1.45 var(--font); }
  .psum .stats { --cols: 4; }
  @media (min-width: 1000px) { .psum .stats.six { --cols: 6; } }
  .sm-lines { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .sm-lines li { font: 400 14.5px/1.5 var(--font); }
  .sm-lines b { font-weight: 700; }
  .sm-rows { display: grid; gap: 2px; }
  .sm-row { display: grid; grid-template-columns: 28px minmax(0, 1.4fr) 56px 76px minmax(0, 1.4fr) auto; align-items: center; gap: 10px 14px;
    padding: 10px 0; border-bottom: 1px solid var(--line); font: 500 14px/1.35 var(--font); }
  .sm-row .n { font: 500 13px var(--mono); color: var(--ink); }
  .sm-row .t { font: 500 12.5px var(--mono); color: var(--soft); }
  .sm-mb { display: grid; gap: 4px; }
  .sm-mb .bar2 { position: relative; height: 6px; border-radius: 3px; background: var(--m-track, var(--line)); overflow: hidden; }
  .sm-mb .bar2 i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .sm-mb .bar2 .g { background: var(--m-fill, var(--amber)); opacity: .3; }
  .sm-mb .bar2 .a { background: var(--ink); }
  .sm-mb .w { font: 500 12.5px var(--font); color: var(--soft); }
  .sm-types { margin-top: 10px; }
  .sm-types summary { cursor: pointer; font: 600 14px var(--font); }
  .sm-types ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; font: 400 14px/1.45 var(--font); }
  .sm-diff { display: grid; gap: 8px; }
  .sm-diff .r { display: grid; grid-template-columns: 76px 64px 1fr 56px; gap: 12px; align-items: center; font: 500 14px var(--font); }
  .sm-diff .r .t { font: 500 13px var(--mono); color: var(--soft); }
  .sm-diff .fill { height: 8px; border-radius: 4px; background: var(--tile); overflow: hidden; }
  .sm-diff .fill i { display: block; height: 100%; background: var(--amber); }
  .sm-legend { margin: 8px 0 0; font: 500 13px var(--mono); color: var(--soft); }
  .sm-chart { overflow-x: auto; }
  .sm-mist { display: grid; gap: 14px; }
  .sm-mist h3 { margin: 0 0 6px; font: 700 15px var(--font); }
  .sm-mist ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .sm-mist li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font: 400 14px/1.45 var(--font); }
  .sm-mist li .s { color: var(--soft); font-size: 13px; }
  .sm-rl-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sm-rl { display: grid; }
  .sm-rl-row { display: grid; grid-template-columns: 44px minmax(0, 2fr) 92px 56px minmax(0, 2fr) 56px; align-items: center; gap: 8px 12px;
    padding: 8px 6px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; font: 500 14px/1.35 var(--font);
    color: var(--ink); cursor: pointer; width: 100%; }
  .sm-rl-row:hover { background: var(--tile); }
  .sm-rl-row .cell { pointer-events: none; }
  .sm-rl-row .ty { display: flex; gap: 8px; align-items: center; overflow: hidden; }
  .sm-rl-row .ty span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sm-rl-row .t { font: 500 13px var(--mono); }
  .sm-rl-row .m { color: var(--soft); font-size: 13px; }
  .sm-rl-row .fl { font: 500 12px var(--font); color: var(--soft); }
  .sm-rl-row[hidden] { display: none; }
  .sm-next { display: grid; gap: 12px; }
  .sm-next .primary { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .sm-next .help { margin: 0; }
  .sm-next .quiet-acts { display: flex; flex-wrap: wrap; gap: 6px 8px; }
  .sm-next .quiet-acts .btn { height: 36px; font-size: 13.5px; }
  @media (max-width: 759px) {
    .sm-score .num { font-size: 72px; }
    .sm-row { grid-template-columns: 24px minmax(0, 1fr) auto; }
    .sm-row .sm-mb { grid-column: 2 / -1; }
    .sm-row .t { grid-column: 2; }
    .sm-rl-row { grid-template-columns: 40px minmax(0, 1fr) auto; }
    .sm-rl-row .m, .sm-rl-row .fl { grid-column: 2 / -1; }
    .sm-diff .r { grid-template-columns: 70px 56px 1fr 48px; gap: 8px; }
    .sm-next .primary .pill, .sm-next .quiet-acts .btn { width: 100%; justify-content: center; }
  }

  /* Print view */
  .pv { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }
  .pv-ctl { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 20px; padding: 12px 14px; border-radius: 12px; background: var(--tile); }
  .pv-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; padding-bottom: 12px; margin-bottom: 20px; border-bottom: 2px solid var(--ink); }
  .pv-head h1 { margin: 0; font: 800 22px/1.2 var(--font); }
  .pv-head .meta { font: 500 13px var(--mono); }
  .pv-name { font: 600 15px var(--font); }
  .pv-q { break-inside: avoid; page-break-inside: avoid; padding: 14px 0 22px; border-bottom: 1px solid var(--line); }
  .pv-q .pv-n { font: 800 15px var(--font); margin-bottom: 6px; }
  .pv-key { break-before: page; page-break-before: always; padding-top: 12px; }
  .pv-key h2 { font: 800 20px var(--font); margin: 0 0 12px; }
  .pv-key ol { margin: 0; padding-left: 22px; display: grid; gap: 14px; }
  .pv-key li { font: 400 14px/1.5 var(--font); break-inside: avoid; }
  .pv-key .opt-l { margin: 2px 0 0; color: var(--soft); font-size: 13px; }
  .pv.nokey .pv-key { display: none; }
  @media print {
    .pv-ctl, .sm-top, .no-print { display: none !important; }
    body { background: #fff; color: #000; }
    .pv { padding: 0; max-width: none; }
    .pv-q { border-color: #999; }
  }
</style>
</head>
<body>
<main id="main">
  <div id="run"></div>
  <div id="view" hidden></div>
</main>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/assets/question.js"></script>
<script src="/assets/runner.js"></script>
<script src="/practice/session/session.js"></script>
</body>
</html>
