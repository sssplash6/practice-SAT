<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Practice · SAT Freshman</title>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="/assets/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<link rel="stylesheet" href="/assets/runner.css">
<style>
  /* The practice session (spec 3.3 part 2). The runner (runner.css) draws the set; these
     rules lay out the loading and error states, the Summary (2.11) and the print view (2.12). */
  body { background: var(--page); }   /* the Summary and the states on the warm page; the runner sets its own ground */
  .ps-state { max-width: 560px; margin: 0 auto; padding: 48px 16px; display: grid; gap: 12px; justify-items: start; }
  .ps-state p { margin: 0; font: 600 16px/1.5 var(--font); }
  .ps-state .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  /* the loading state draws the runner's frame: its 64px bar (56 on a phone) and its 700px column */
  .ps-skel-top { height: 64px; box-shadow: inset 0 -1px 0 var(--line); }
  .ps-skel-col { max-width: 740px; margin: 0 auto; padding: 16px 20px; display: grid; gap: 12px; }
  @media (max-width: 759px) { .ps-skel-top { height: 56px; } .ps-skel-col { padding: 12px 16px; } }

  /* The question screen (decision 7): from 760 px the strip is one quiet row, each tool its icon;
     the name and key are in the tooltip (title) and still read to screen readers. Phones keep the captions. */
  @media (min-width: 760px) {
    .rn-practice .rn-qstrip { flex-wrap: nowrap; }
    .rn-practice .rn-qleft { flex: 1 1 auto; }
    .rn-practice .rn-qstrip .rn-qtools { flex: none; flex-wrap: nowrap; }
    .rn-practice .rn-qtools .tool { flex-direction: row; justify-content: center; min-width: 36px; min-height: 36px; padding: 0 8px; }
    .rn-practice .rn-qtools .tool .tl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  }

  /* Summary (BIG 9): from 1100 wide two columns. The lead column (sticky) has the score, what changed and the
     next step; the main column the Review list, then the breakdowns behind disclosures. Below 1100 they stack. */
  /* the bar is the page's colour and flat at rest; it lifts only while the Summary scrolls under it (data-scrolled) */
  .sm-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px;
    background: var(--page); transition: box-shadow .2s var(--ease); }
  .sm-title { margin: 0; font: 600 14px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .psum { max-width: 1120px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 32px; }
  .psum * { min-width: 0; }
  .sm-lead, .sm-main { display: grid; gap: 32px; align-content: start; }
  @media (min-width: 1100px) {
    .psum { grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); column-gap: 48px; align-items: start; }   /* 380: a fix-set pill keeps one line */
    .sm-lead { position: sticky; top: 76px; }
  }
  .psum h2 { margin: 0; font: 600 16px/1.3 var(--font); letter-spacing: -.01em; }
  .psum h3 { margin: 0 0 8px; font: 600 14.5px/1.3 var(--font); }
  /* the score card is the page's one hero (.card.hero): the figure at the hero step, the set's strip, time and pace */
  .sm-head { display: grid; gap: 16px; }
  /* one column wide enough (760-1099): what changed sits beside the score card (the user: the white space right of the score) */
  @media (min-width: 760px) and (max-width: 1099px) {
    .sm-lead { grid-template-columns: minmax(0, 1fr) minmax(0, auto); column-gap: 48px; }
    .sm-lead > :not(.sm-changed) { grid-column: 1; }
    .sm-lead > .sm-changed { grid-column: 2; grid-row: 1; align-self: center; margin: 0; }
  }
  .sm-score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; }
  /* the set-done drawing (UI.spotArt 'done'): the mark's corners filled to the domains' mastery, top right of the card;
     a later view of the same set draws it still */
  .sm-head { position: relative; }
  .sm-art { position: absolute; top: var(--card-pad); right: var(--card-pad); }
  .sm-head:has(.sm-art:not(:empty)) .sm-score { padding-right: 76px; }
  .sm-art:empty { display: none; }
  .sm-art .spot { width: 64px; height: 64px; }
  .sm-art.seen .sp-in { animation: none; }
  /* the receipt fills in once, 30ms apart, on the set's first view */
  .sm-head .strip.fill-in > * { animation: sm-cell .24s var(--ease) calc(var(--i, 0) * 30ms) both; }
  @keyframes sm-cell { from { opacity: 0; transform: scaleY(.4); } }
  @media (prefers-reduced-motion: reduce) { .sm-head .strip.fill-in > * { animation: none; } }
  :root[data-motion="reduce"] .sm-head .strip.fill-in > * { animation: none; }
  .sm-score .num { font-size: var(--fs-hero); line-height: 1; letter-spacing: -.035em; color: var(--ink-strong); }
  .sm-head .strip { max-width: 360px; }
  .sm-pairs { display: flex; flex-wrap: wrap; gap: 6px 28px; }
  .sm-pair { display: inline-flex; align-items: baseline; gap: 6px; font: 400 14.5px/1.4 var(--font); color: var(--soft); }
  .sm-pair .num { font-size: 20px; letter-spacing: -.01em; color: var(--ink-strong); }
  .sm-score .accs { display: grid; gap: 4px; }
  .sm-score .acc { font: 600 16px/1.35 var(--font); }
  .sm-score .was { font-weight: 400; color: var(--soft); }
  .sm-meta { margin: 0; font: 400 12.5px/1.5 var(--font); color: var(--soft); }
  .sm-note { margin: 0; font: 400 14.5px/1.5 var(--font); color: var(--ink); }
  .sm-changed { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 20px minmax(0, max-content) minmax(0, 1fr);
    align-items: center; gap: 8px 12px; font: 400 14.5px/1.45 var(--font); }
  .sm-changed li { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: center; }
  .sm-changed li > :first-child { width: 18px; height: 18px; color: var(--soft); }
  .sm-changed .nm { font-weight: 600; }
  .sm-changed .w { color: var(--soft); }
  .sm-changed .w b { font-weight: 600; color: var(--ink); }
  .sm-next { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .sm-rank { font: 600 16px var(--font); font-variant-numeric: tabular-nums; }
  .sm-sec { display: grid; gap: 12px; }
  .sm-rl-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
  .sm-rl-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .sm-rl-acts:empty { display: none; }
  .sm-rl { display: grid; border-top: 1px solid var(--line); }
  .sm-rl-row { display: grid; grid-template-columns: 32px minmax(0, 2fr) 64px 52px minmax(0, 2fr); align-items: center; gap: 8px 14px;
    min-height: 44px; padding: 4px 6px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left;
    font: 400 14.5px/1.4 var(--font); color: var(--ink); cursor: pointer; width: 100%; }
  .sm-rl-row:hover { background: var(--hover); }   /* the shared row band: --tile would vanish on the warm page */
  .sm-rl-row > * { pointer-events: none; }
  .sm-rl-row .ty { display: flex; gap: 10px; align-items: center; overflow: hidden; }
  .sm-rl-row .ty svg { flex: none; color: var(--soft); }
  .sm-rl-row .ty span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sm-rl-row .d, .sm-rl-row .m { font-size: 12.5px; color: var(--soft); }
  .sm-rl-row .t { font: 400 12.5px var(--font); color: var(--soft); font-variant-numeric: tabular-nums; }
  .sm-rl-row[hidden] { display: none; }

  .sm-folds { display: grid; border-top: 1px solid var(--line); }
  .sm-fold { border-bottom: 1px solid var(--line); }
  .sm-fold > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 0 6px;
    list-style: none; font: 600 14.5px var(--font); color: var(--ink); }
  .sm-fold > summary::-webkit-details-marker { display: none; }
  .sm-fold > summary::after { content: ""; flex: none; width: 7px; height: 7px; margin: -4px 4px 0 0; border-right: 1.5px solid var(--soft);
    border-bottom: 1.5px solid var(--soft); transform: rotate(45deg); transition: transform .15s var(--ease); }
  .sm-fold[open] > summary::after { margin-top: 4px; transform: rotate(225deg); }
  .sm-fold > summary:hover { background: var(--hover); }
  .sm-fold-b { display: grid; gap: 16px; padding: 4px 6px 16px; }
  @media (prefers-reduced-motion: reduce) { .sm-fold > summary::after { transition: none; } }

  .sm-lines { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .sm-lines li { font: 400 14.5px/1.5 var(--font); }
  .sm-lines b { font-weight: 600; }
  .sm-rows { display: grid; }
  .sm-row { display: grid; grid-template-columns: 24px minmax(0, 1.4fr) 56px 76px minmax(0, 1.6fr) auto; align-items: center; gap: 8px 14px;
    padding: 8px 0; border-bottom: 1px solid var(--line); font: 400 14.5px/1.4 var(--font); }
  .sm-row > :first-child { color: var(--soft); }
  .sm-row .n { font: 500 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--ink); }
  .sm-row .t { font: 400 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--soft); }
  .sm-mb { display: grid; gap: 6px; }
  .sm-mb .bar2 { position: relative; height: 6px; border-radius: 3px; background: var(--m-track, var(--track)); overflow: hidden; }
  .sm-mb .bar2 i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .sm-mb .bar2 .g { background: var(--m-fill, var(--amber)); opacity: .3; }
  .sm-mb .bar2 .a { background: var(--ink); }
  .sm-mb .w { font-size: 12.5px; color: var(--soft); }
  .sm-types ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .sm-types li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font: 400 14.5px/1.45 var(--font); }
  .sm-types li .t { font: 400 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--soft); }
  .sm-diff { display: grid; gap: 8px; }
  .sm-diff .r { display: grid; grid-template-columns: 76px 64px 1fr 56px; gap: 12px; align-items: center; font: 400 14.5px var(--font); }
  .sm-diff .r .t { font: 400 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--soft); }
  .sm-diff .fill { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
  .sm-diff .fill i { display: block; height: 100%; background: var(--ink); }
  .sm-legend { margin: 0; font: 400 12.5px/1.5 var(--font); color: var(--soft); }
  .sm-chart { overflow-x: auto; }
  .sm-mist ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .sm-mist li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font: 400 14.5px/1.45 var(--font); }
  .sm-mist li .s { color: var(--soft); font-size: 12.5px; }
  /* new mistakes: the label, its skill and Fix now in shared columns, so every Fix now lines up on the right (the user) */
  .sm-mist ul.sm-new { grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 16px; }
  .sm-new li { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; }
  .sm-new li .btn { justify-self: end; }
  @media (max-width: 759px) {
    .sm-row { grid-template-columns: 24px minmax(0, 1fr) auto; }
    .sm-row .sm-mb { grid-column: 2 / -1; }
    .sm-row .t { grid-column: 2; }
    .sm-rl-row { grid-template-columns: 32px minmax(0, 1fr) auto; row-gap: 2px; }
    .sm-rl-row .d, .sm-rl-row .m { grid-column: 2 / -1; }
    .sm-rl-row .t { grid-column: 3; grid-row: 1; }
    .sm-diff .r { grid-template-columns: 70px 56px 1fr 48px; gap: 8px; }
    /* the pill on its own row, then Same settings and More on one */
    .sm-next > .pill { width: 100%; justify-content: center; }
    .sm-next > .btn:not(.sm-more) { flex: 1 1 auto; justify-content: center; }
  }

  /* Print view (.pv-page: .pv is the grid-in preview's value inside every workspace) */
  .pv-page { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  .pv-ctl { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 16px; padding: 12px; border-radius: var(--radius-card); background: var(--raised); box-shadow: var(--shadow-1); }
  .pv-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 2px solid var(--ink); }
  .pv-head h1 { margin: 0; font: 600 22px/1.2 var(--font); letter-spacing: -.02em; }
  .pv-name { font: 600 14.5px var(--font); }
  .pv-q { break-inside: avoid; page-break-inside: avoid; padding: 12px 0 20px; border-bottom: 1px solid var(--line); }
  .pv-q .pv-n { font: 600 16px var(--font); margin-bottom: 6px; }
  .pv-key { break-before: page; page-break-before: always; padding-top: 12px; }
  .pv-key h2 { font: 600 16px var(--font); margin: 0 0 12px; }
  .pv-key ol { margin: 0; padding-left: 22px; display: grid; gap: 12px; }
  .pv-key li { font: 400 14.5px/1.5 var(--font); break-inside: avoid; }
  .pv-key .opt-l { margin: 2px 0 0; color: var(--soft); font-size: 12.5px; }
  .pv-page.nokey .pv-key { display: none; }
  @media print {
    .pv-ctl, .sm-top, .no-print { display: none !important; }
    body { background: #fff; color: #000; }
    .pv-page { padding: 0; max-width: none; }
    .pv-q { border-color: #999; }
  }
  /* the page's <main> is the one landmark; the runner's column must not claim its transition name too */
  #run main { view-transition-name: none; }
</style>
</head>
<body>
<main id="main">
  <div id="run"></div>
  <div id="view" hidden></div>
</main>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/assets/question.js"></script>
<script src="/assets/runner.js"></script>
<script src="/practice/session/session.js"></script>
</body>
</html>
