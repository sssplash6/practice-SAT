<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Practice · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  /* The practice builder (spec 3.3 part 1, practice.md P1-P25). Everything shared
     (seg, chips, sheets, cells, the atlas) is ui.css; these rules lay the page out. */
  .pr { padding-bottom: 120px; }
  .pr * { min-width: 0; }
  .pr-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; }
  .pr-head-l { display: grid; gap: 6px; flex: 1 1 420px; }
  .pr-head-l .seg { justify-self: start; }
  .pr-head-l .help { margin: 0; }
  .pr-links { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
  .pr-links a, .pr-links button { display: inline-flex; align-items: center; gap: 7px; min-height: var(--ctl); padding: 0 10px; border-radius: 8px;
    font: 600 14px var(--font); color: var(--ink); text-decoration: none; background: none; border: 0; cursor: pointer; }
  .pr-links .n { font: 500 13px var(--mono); color: var(--soft); }
  .pr-links .n.on { color: var(--ink); }
  @media (hover: hover) and (pointer: fine) { .pr-links a:hover, .pr-links button:hover { background: var(--tile); } }
  .pr-route { font: 400 13.5px/1.45 var(--font); color: var(--ink); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .pr-route .btn { height: 34px; font-size: 13px; }
  .pr-sec { margin-top: 18px; }
  .pr-banner { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 12px;
    background: var(--wash); box-shadow: inset 3px 0 0 var(--amber); }
  .pr-banner p { margin: 0; font: 500 14.5px/1.45 var(--font); }
  .pr-banner .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pr-banner .help { flex-basis: 100%; margin: 0; }
  .pr-ready { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .pr-card { display: grid; gap: 6px; align-content: start; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); }
  .pr-card b { font: 700 14.5px/1.3 var(--font); }
  .pr-card .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .pr-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .pr-chip { display: inline-grid; align-content: center; gap: 2px; min-height: 36px; padding: 6px 12px; border-radius: 10px; border: 0; background: var(--tile);
    font: 600 13.5px/1.2 var(--font); color: var(--ink); cursor: pointer; text-align: left; position: relative; }
  .pr-chip[aria-pressed="true"] { background: var(--wash); box-shadow: inset 0 0 0 1.5px var(--amber); }
  .pr-chip[aria-disabled="true"] { color: var(--faint); cursor: default; }
  .pr-chip .why { font: 500 11px var(--mono); color: var(--soft); }
  .pr-chip .x { margin-left: 4px; }
  .pr-chips .quiet { min-height: 36px; }
  .pr-coach { margin: 8px 0 0; font: 400 13px/1.5 var(--font); color: var(--ink); }
  .pr-coach b { font-weight: 600; }
  .pr-note { margin: 8px 0 0; font: 400 13px/1.45 var(--font); color: var(--soft); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .pr-search label { display: block; margin-bottom: 6px; }
  .pr-search .field { width: 100%; height: 48px; font-size: 15.5px; }
  .pr-sline { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font: 400 13.5px/1.4 var(--font); }
  .pr-sline .chipx { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 8px; background: var(--tile); font: 600 12.5px var(--font); border: 0; color: var(--ink); cursor: pointer; }
  .pr-sline .meta { font-size: 12.5px; }
  .pr-results { margin-top: 10px; display: grid; gap: 8px; }
  .pr-res { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border-radius: 10px; background: var(--tile); font: 400 13.5px/1.4 var(--font); }
  .pr-res .mono { font-size: 12.5px; }
  .pr-res .acts { display: flex; flex-wrap: wrap; gap: 6px; }

  .pr-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px; align-items: start; margin-top: 18px; }
  .pr-tree { grid-column: span 7; }
  .pr-set { grid-column: span 5; position: sticky; top: 80px; max-height: calc(100vh - 176px); overflow: auto; overscroll-behavior: contain; }
  .pr-thead { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .pr-thead .h2 { margin: 0; }
  .pr-thead .ctl { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .pr-thead select { height: var(--ctl); border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 0 8px; font: 500 13.5px var(--font); max-width: 100%; }
  .pr-jump { display: none; }
  .pr-new { margin: 0 0 10px; padding: 12px 14px; border-radius: 10px; background: var(--tile); font: 400 13.5px/1.45 var(--font); }
  .pr-count { font: 500 12.5px var(--mono); color: var(--soft); }

  .tri { flex: none; width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--ink); background: var(--paper); padding: 0; cursor: pointer; display: grid; place-items: center; position: relative; }
  .tri::after { content: ''; }
  .tri[aria-checked="true"], .tri[aria-checked="mixed"] { background: var(--amber); border-color: var(--amber); }
  .tri[aria-checked="true"]::after { width: 9px; height: 5px; border: 2px solid var(--ink-deep); border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg); }
  .tri[aria-checked="mixed"]::after { width: 10px; height: 2px; background: var(--ink-deep); }
  .tri::before { content: ''; position: absolute; inset: -12px; }

  .dcard { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); margin-bottom: 10px; }
  .dhead { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto 28px; grid-template-areas: "c n s v" "l l l l"; gap: 6px 12px; align-items: center; min-height: 56px; padding: 6px 14px; cursor: pointer; }
  .dhead > .tri { grid-area: c; } .dhead > .dname { grid-area: n; } .dhead > .dsel { grid-area: s; } .dhead > .chev { grid-area: v; }
  .dhead > .dline { grid-area: l; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding-left: 32px; }
  .dhead .mcell { width: 120px; }
  .dhead .dname { font: 700 16px/1.25 var(--font); cursor: pointer; }
  .wchip { font: 500 12px var(--mono); color: var(--soft); background: var(--tile); border-radius: 6px; padding: 3px 7px; white-space: nowrap; }
  .mcell { display: grid; gap: 4px; }
  .mcell .mbar { height: 4px; }
  .mcell .w { font: 500 11px var(--mono); color: var(--soft); }
  .rec { font: 500 12.5px var(--mono); color: var(--ink); white-space: nowrap; }
  .rec.none { color: var(--soft); }
  .open { display: inline-flex; align-items: center; gap: 5px; font: 500 12.5px var(--mono); white-space: nowrap; }
  .open.none { color: var(--soft); }
  .chev { width: 28px; height: 28px; border-radius: 8px; border: 0; background: none; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  .chev svg { transition: transform .16s var(--ease); }
  .chev svg { transform: rotate(0deg); }
  [aria-expanded="true"] > .chev svg, .chev[aria-expanded="true"] svg { transform: rotate(90deg); }
  .dbody { border-top: 1px solid var(--line); }
  .srow { display: grid; grid-template-columns: 20px 22px minmax(0, 1fr) 28px; grid-template-areas: "c g n v" "l l l l"; gap: 4px 10px; align-items: center; min-height: 56px; padding: 6px 14px; border-top: 1px solid var(--line); cursor: pointer; user-select: none; }
  .srow:first-child { border-top: 0; }
  .srow > .tri { grid-area: c; } .srow > .sg { grid-area: g; } .srow > .nm { grid-area: n; } .srow > .chev { grid-area: v; }
  .srow > .sline { grid-area: l; display: grid; grid-template-columns: 140px 90px minmax(0, 1fr) 70px 60px; gap: 4px 12px; align-items: center; padding-left: 52px; }
  .srow .sg { display: grid; place-items: center; } .srow .glyph { width: 22px; height: 22px; }
  .srow .mwrap .mcell { width: 100%; }
  .srow .sname { font: 600 15px/1.25 var(--font); }
  .srow .ssub { font: 500 11.5px/1.35 var(--mono); color: var(--soft); margin-top: 2px; }
  .srow .worth { font: 600 13px var(--mono); }
  .srow .worth small { display: block; font: 500 10.5px/1.3 var(--mono); color: var(--soft); }
  .srow .last { font: 500 12px var(--mono); color: var(--soft); }
  .srow.dim > :not(.tri):not(.chev) { opacity: .42; }
  .srow .reason { color: var(--ink); opacity: 1; }
  .spanel { padding: 4px 14px 14px 56px; border-top: 1px dashed var(--line); background: var(--paper); }
  .spanel .stats { font: 500 12.5px/1.6 var(--mono); color: var(--ink); margin: 8px 0; display: block; }
  .spanel h4 { margin: 14px 0 6px; font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .spanel .btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .spanel .btns .btn { height: 36px; font-size: 13.5px; }
  .omis { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; justify-content: space-between; padding: 6px 0; font: 400 13.5px/1.4 var(--font); border-bottom: 1px solid var(--line); }
  .lhead { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; padding: 8px 0 6px; background: var(--paper); border-bottom: 1px solid var(--line); font: 600 13px var(--font); }
  .lhead .meta { font-size: 11.5px; }
  .trow { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; min-height: 44px; border-bottom: 1px solid var(--line); }
  .trow.dim .tmain { opacity: .42; }
  .trow .tmain { flex: 1; display: grid; gap: 3px; }
  .trow .tname { font: 600 14px/1.3 var(--font); }
  .trow .tabout { font: 400 13px/1.4 var(--font); color: var(--soft); }
  .trow .tchips { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font: 500 11.5px var(--mono); color: var(--ink); }
  .trow .tchips .t { background: var(--tile); border-radius: 5px; padding: 2px 6px; }
  .trow .tchips .off { color: var(--faint); }
  .trow .tacts { display: flex; flex-wrap: wrap; gap: 2px 6px; }
  .trow .tacts .quiet { min-height: 32px; font-size: 13px; padding: 0 6px; }
  mark.hit { background: var(--wash-2); color: inherit; border-radius: 2px; }
  .qlink { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font: inherit; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .ws-mobile { display: none; }
  .skel-card { padding: 16px; }
  .pr-map { display: grid; gap: 10px; }
  .pr-map .mrow { display: grid; gap: 4px; }
  .pr-map .mrow .mh { display: flex; justify-content: space-between; gap: 8px; font: 600 13px var(--font); }
  .pr-map .atlas { --atlas: 16px; }
  .pr-map .quick { display: flex; flex-wrap: wrap; gap: 6px; }
  .pr-habits .hrow { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .pr-habits .hrow p { margin: 2px 0 0; font: 400 13px/1.45 var(--font); }

  /* settings */
  .pr-set { padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
  .pr-set .sgrp { padding: 14px 0; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .pr-set .sgrp:first-of-type { border-top: 0; padding-top: 0; }
  .pr-set .sgrp > .k { display: block; }
  .pr-set .help { margin: 0; }
  .pr-set .seg { display: flex; flex-wrap: wrap; }
  .pr-set .seg > button { flex: 1 1 auto; }
  .radio-row { display: flex; gap: 10px; align-items: flex-start; min-height: 44px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .radio-row:last-child { border-bottom: 0; }
  .radio-row input { margin: 3px 0 0; width: 18px; height: 18px; flex: none; accent-color: var(--amber); }
  .radio-row .rl { flex: 1; display: grid; gap: 2px; font: 500 14px/1.35 var(--font); }
  .radio-row .rl .help { font-size: 12.5px; }
  .radio-row .rn { font: 500 12.5px var(--mono); color: var(--soft); white-space: nowrap; }
  .radio-row.off { color: var(--faint); cursor: default; }
  .sub { margin: 4px 0 8px 28px; display: grid; gap: 8px; }
  .inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .inline .field { height: 40px; width: 90px; }
  .lvls { display: grid; grid-template-columns: repeat(7, 44px); gap: 6px; }
  .lvls button { height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font: 600 14px var(--mono); color: var(--ink); cursor: pointer; display: grid; place-items: center; line-height: 1; }
  .lvls button small { font: 500 10px var(--mono); color: var(--soft); }
  .lvls button[aria-pressed="true"] { background: var(--wash); box-shadow: inset 0 0 0 1.5px var(--amber); }
  .lvls button[data-tier="easy"] { border-bottom: 3px solid var(--lvl-easy); }
  .lvls button[data-tier="medium"] { border-bottom: 3px solid var(--lvl-med); }
  .lvls button[data-tier="hard"] { border-bottom: 3px solid var(--lvl-hard); }
  .lock { display: flex; gap: 8px; align-items: flex-start; font: 400 13px/1.45 var(--font); color: var(--ink); }
  .sfoot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--line); }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

  /* your sets */
  .pr-sets .h2 { margin: 0 0 10px; }
  .pr-sets .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .pr-sets select { height: var(--ctl); border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 0 8px; font: 500 13.5px var(--font); max-width: 100%; }
  .setrow { display: grid; grid-template-columns: 130px minmax(0, 1.4fr) minmax(0, 1fr) 90px 110px 64px auto; gap: 10px; align-items: center; min-height: 56px; padding: 8px 0; border-bottom: 1px solid var(--line); font: 400 13.5px/1.35 var(--font); }
  .setrow .mono { font-size: 12.5px; }
  .setrow .acts { display: flex; flex-wrap: wrap; gap: 4px 6px; justify-content: flex-end; }
  .setrow .acts .quiet, .setrow .acts .btn, .setrow .acts .pill { min-height: 34px; height: 34px; font-size: 13px; }
  .setrow .skills { display: flex; flex-wrap: wrap; gap: 4px; }
  .setrow .skills span { background: var(--tile); border-radius: 6px; padding: 2px 6px; font: 500 12px var(--font); }

  /* the action bar */
  .pr-abar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--paper); box-shadow: 0 -1px 0 var(--line), 0 -12px 30px -18px rgba(0, 0, 0, .25); }
  body.has-side .pr-abar { left: var(--side-w); }
  body.has-rail .pr-abar { left: var(--rail-w); }
  .pr-abar-in { max-width: var(--max); margin: 0 auto; min-height: 72px; padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px 20px; align-items: center; justify-content: space-between; }
  .pr-abar .sum { display: grid; gap: 3px; flex: 1; cursor: default; }
  .pr-abar .l1 { font: 600 15px/1.35 var(--font); }
  .pr-abar .l2 { font: 500 12px/1.4 var(--mono); color: var(--soft); }
  .pr-abar .sk { display: flex; flex-wrap: wrap; gap: 4px; }
  .pr-abar .sk span { background: var(--tile); border-radius: 6px; padding: 2px 6px; font: 500 12px var(--font); }
  .pr-abar .go { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .pr-abar .reason { font: 500 13px var(--font); color: var(--ink); max-width: 280px; }
  .pr-abar .error { margin: 0; }
  .pr-rw { display: grid; gap: 16px; margin-top: 18px; }
  .pr-rw .card h3 { margin: 0 0 8px; }
  .pr-rw .rwd { margin-top: 10px; }
  .pr-rw .rwd b { font: 700 14px var(--font); }
  .pr-rw .rws { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font: 400 14px var(--font); }
  .pr-rw form { display: grid; gap: 10px; }
  .pr-rw form .field { width: 100%; }
  .skel-tree .skel { margin-bottom: 10px; }

  @media (max-width: 1039px) {
    .pr-grid { grid-template-columns: minmax(0, 1fr); }
    .pr-tree, .pr-set { grid-column: 1 / -1; }
    .pr-set { position: static; max-height: none; overflow: visible; order: -1; }
    .pr-set .sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; }
    .pr-set .sgrid > .wide { grid-column: 1 / -1; }
    .pr-ready { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 759px) {
    .pr { padding-bottom: 250px; }
    .pr-set { order: 2; padding: 16px; }
    .pr-set .sgrid { display: block; }
    .pr-jump { display: flex; width: 100%; justify-content: space-between; min-height: 44px; margin: 0 0 10px; }
    .ws-mobile { display: inline-flex; }
    .srow { min-height: 60px; }
    .srow > .sline { display: flex; flex-wrap: wrap; gap: 4px 12px; padding-left: 32px; }
    .srow > .sline .mcell { width: 80px; }
    .srow .last { display: inline; }
    .spanel { padding-left: 16px; }
    .setrow { grid-template-columns: minmax(0, 1fr) auto; }
    .setrow > :nth-child(n+3):not(.acts) { grid-column: 1; }
    .setrow .acts { grid-column: 1 / -1; justify-content: flex-start; }
    .pr-abar, body.has-side .pr-abar, body.has-rail .pr-abar { left: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    .pr-abar-in { flex-direction: column; align-items: stretch; padding-bottom: 10px; min-height: 0; }
    .pr-abar .go { flex-direction: column; align-items: stretch; }
    .pr-abar .go .pill { width: 100%; height: 52px; }
    .pr-abar .go .quiet.ws { display: none; }
    .pr-abar .sum { cursor: pointer; }
    .pr-ready { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .lvls { grid-template-columns: repeat(7, minmax(0, 44px)); }
  }
  @media print { .pr-abar { display: none; } }
</style>
</head>
<body data-page="practice">
<header id="bar"></header>
<main class="page pr" id="main" tabindex="-1">
  <header class="pr-head">
    <div class="pr-head-l">
      <div id="subject"></div>
      <h1 class="h1">Practice</h1>
      <p class="meta" id="meta">… skills · … question types · unlimited questions, never repeated</p>
      <p class="meta" id="points"></p>
      <div class="pr-route" id="route" hidden></div>
    </div>
    <nav class="pr-links" id="links" aria-label="Your lists"></nav>
  </header>
  <div id="banners" class="pr-sec" hidden></div>
  <section id="ready" class="pr-sec" aria-label="Ready to start" hidden></section>
  <section class="pr-sec" aria-label="Presets" id="presetSec">
    <div class="pr-chips" id="presets"></div>
    <p class="pr-coach" id="coach" hidden></p>
    <p class="pr-note" id="linkNote" hidden></p>
  </section>
  <section class="pr-sec pr-search" id="searchSec">
    <label class="k" for="q">Search or build a set</label>
    <input class="field" id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="circles hard 10 timed · a type name · a College Board ID · or paste a question">
    <div class="pr-sline" id="sline" aria-live="polite"></div>
    <div class="pr-results" id="results"></div>
  </section>
  <div id="rw" class="pr-rw" hidden></div>
  <div class="pr-grid" id="grid">
    <section class="pr-tree" id="tree" aria-label="Skills">
      <div class="pr-thead" id="thead"></div>
      <button type="button" class="btn pr-jump" id="jump"></button>
      <div id="newHere"></div>
      <div id="treeBody" class="skel-tree"></div>
    </section>
    <aside class="pr-set" id="settings" aria-label="Settings"></aside>
  </div>
  <section class="pr-sec pr-sets" id="sets" aria-label="Your sets"></section>
</main>
<div class="pr-abar" id="abar" role="region" aria-label="Start">
  <div class="pr-abar-in">
    <div class="sum" id="abarSum">
      <p class="error" id="abarErr" hidden></p>
      <span class="l1" id="l1">Loading…</span>
      <span class="l2" id="l2"></span>
      <span class="sk" id="abarSkills"></span>
    </div>
