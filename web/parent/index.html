<style>
  .par { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--card-gap); }
  .par-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 4px; }
  .par-top svg { width: 28px; height: 28px; flex: none; }
  .par-top .grow { flex: 1 1 200px; min-width: 0; margin: 0; }
  .par-lead { margin: 0; font: 400 14.5px/1.5 var(--font); color: var(--soft); text-wrap: pretty; }
  .par-form { display: grid; gap: 12px; }
  .par-in { display: grid; gap: 12px; max-width: 480px; }
  .par-in > .h2 { margin: 0; }
  .par-in .help { margin: 0; }
  .par-form .pill { justify-self: stretch; }
  .par-card { display: grid; gap: 12px; }
  .par-card > .card-head { margin: 0; }
  .par-fig { display: grid; gap: 4px; justify-items: start; }
  .par-sub { display: flex; flex-wrap: wrap; gap: 2px 16px; margin: 4px 0 0; font: 500 14px/1.4 var(--font); font-variant-numeric: tabular-nums; color: var(--ink); }
  .par-sub > span + span { color: var(--soft); }
  .par-steps { margin: 0; padding-left: 22px; display: grid; gap: 6px; font: 400 14.5px/1.5 var(--font); color: var(--ink); }
  .par-tot { --cols: 4; --cols-phone: 2; padding: 4px 0; }
  .par-tot .stat { background: none; padding: 0; border-radius: 0; box-shadow: none; }   /* plain figures on the page, no tile edge */
  .par-tot .stat-v { font-size: 16px; letter-spacing: -.01em; }
  .par-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--card-gap); }
  @media (min-width: 640px) { .par-cols { grid-template-columns: 1fr 1fr; } }
  .par-bars { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; align-items: end; height: 72px; }
  .par-bars i { display: block; border-radius: 2px 2px 0 0; background: var(--faint); }
  .par-bars i.on { background: var(--amber); }
  .par-bars i[data-at] { box-shadow: 0 0 0 1.5px var(--ink); }
  .par-axis { display: flex; justify-content: space-between; gap: 12px; margin-top: -4px; font: 500 12.5px var(--font); font-variant-numeric: tabular-nums; color: var(--soft); }
  .par-read { color: var(--ink); text-align: center; }
  .par-list { list-style: none; margin: 0; padding: 0; display: grid; font: 400 14.5px/1.4 var(--font); }
  .par-list li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
  .par-list li:first-child { border-top: 0; padding-top: 0; }
  .par-list li b { margin-left: auto; font: 600 14.5px var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }   /* stays right when a long test name wraps it */
  .par-sk { flex: 1; min-width: 0; }
  .par-subj { color: var(--soft); font-size: 13px; }
  .par-sc { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px 24px; align-items: baseline; font: 400 14.5px/1.4 var(--font); font-variant-numeric: tabular-nums; }
  .par-sc .k { margin: 0; }
  .par-sc > :nth-child(3n+2), .par-sc > :nth-child(3n) { text-align: right; }
  .par-sc b { font-weight: 600; }
  .par-sc-t { font-weight: 600; }
  .par-sc + .meta { margin: 0; }
  .par-meter { display: block; height: 4px; border-radius: 2px; background: var(--track); margin-top: 6px; overflow: hidden; }
  .par-meter i { display: block; height: 100%; background: var(--ink); }
  .par-kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; margin: 0; font: 400 14.5px/1.4 var(--font); }
  .par-kv dt { color: var(--soft); } .par-kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .par-empty { margin: 0; color: var(--soft); font: 400 14.5px var(--font); }
  .par-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
</style>
</head>

</html>
