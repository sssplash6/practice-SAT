<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Parent view · SAT Freshman</title>
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<script src="/assets/head.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/ui.css">
<style>
  .par { max-width: 760px; margin: 0 auto; padding: 8px 0 80px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .par-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  .par-top svg { width: 30px; height: 30px; flex: none; }
  .par-top .grow { flex: 1 1 200px; min-width: 0; }
  .par-top h1 { margin: 0; font: 800 22px/1.15 var(--font); letter-spacing: -.02em; }
  .par-lead { margin: 0; font: 400 15px/1.5 var(--font); color: var(--soft); }
  .par-form { display: grid; gap: 12px; max-width: 420px; }
  .par-form .pill { justify-self: stretch; }
  .par-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .par-tile { display: grid; gap: 4px; padding: 14px 16px; border-radius: var(--radius-card); background: var(--tile); }
  .par-tile b { font: 600 24px/1.1 var(--mono); letter-spacing: -.02em; }
  .par-tile span { font: 500 12.5px var(--font); color: var(--soft); }
  .par-card { display: grid; gap: 12px; padding: 18px 20px; border-radius: var(--radius-card); background: var(--tile); }
  .par-card h2 { margin: 0; font: 700 17px var(--font); letter-spacing: -.01em; }
  .par-card .sub { margin: -6px 0 0; font: 400 13px var(--font); color: var(--soft); }
  .par-cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  @media (min-width: 640px) { .par-cols { grid-template-columns: 1fr 1fr; } }
  .par-bars { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 4px; align-items: end; height: 90px; }
  .par-bars i { display: block; border-radius: 3px 3px 0 0; background: var(--faint); }
  .par-bars i.on { background: var(--amber); }
  .par-axis { display: flex; justify-content: space-between; font: 500 11.5px var(--mono); color: var(--soft); }
  .par-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font: 400 14.5px/1.4 var(--font); }
  .par-list li { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .par-list li b { font: 600 13px var(--mono); white-space: nowrap; }
  .par-meter { display: block; height: 6px; border-radius: 3px; background: var(--mat); margin-top: 5px; overflow: hidden; }
  .par-meter i { display: block; height: 100%; background: var(--ink); }
  .par-kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 18px; margin: 0; font: 400 14.5px/1.4 var(--font); }
  .par-kv dt { color: var(--soft); } .par-kv dd { margin: 0; text-align: right; }
  .par-empty { margin: 0; color: var(--soft); font: 400 14px var(--font); }
  .par-mail { display: flex; align-items: center; gap: 10px; font: 400 14.5px/1.4 var(--font); }
  .par-foot { display: flex; justify-content: center; }
</style>
</head>
<body data-page="parent">
<main class="page"><div class="par" id="root"></div></main>
<script src="/assets/ui.js"></script>
<script src="/assets/kit.js"></script>
<script src="/assets/charts.js"></script>
<script src="/me/account.js"></script>
<script src="/parent/parent.js"></script>
</body>
</html>
