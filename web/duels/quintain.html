<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duels, quintain · SAT Freshman</title>
<meta name="description" content="Strike the shield, and get clear before the bag comes round.">
<link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
  .stage > svg.scene { aspect-ratio: 800 / 520; --scene-ratio: 1.538; cursor: pointer;
    overflow: hidden; }   /* the lance starts off stage and must stay there */

  .timber { fill:#EDE8DE; stroke:var(--ink); stroke-width:1.5; stroke-linejoin:round; }
  .grain  { fill:none; stroke:var(--ink); stroke-width:.7; opacity:.3; stroke-linecap:round; }
  .lash   { fill:none; stroke:var(--ink); stroke-width:1.4; stroke-linecap:round; }
  .post   { fill:#E6DCC9; stroke:var(--ink); stroke-width:1.8; }
  .rings  { fill:none; stroke:var(--ink); stroke-width:.8; opacity:.45; }

  .shield { fill:#F2EDE1; stroke:var(--ink); stroke-width:1.6; stroke-linejoin:round; }
  .boss   { fill:var(--amber); stroke:var(--amber); }
  .bag    { fill:#E3DCCC; stroke:var(--ink); stroke-width:1.5; stroke-linejoin:round; }
  .rope   { fill:none; stroke:var(--ink); stroke-width:1.3; stroke-linecap:round; }

  .lance  { fill:#E6DCC9; stroke:var(--ink); stroke-width:1.4; stroke-linejoin:round; }
  .tip    { fill:var(--ink); }

  /* the lane the lance runs, and the arc the bag will sweep through it */
  .lane   { fill:none; stroke:var(--line); stroke-width:1.4; stroke-dasharray:5 7; }
  .sweep  { fill:none; stroke:var(--amber); stroke-width:2.4; stroke-linecap:round; opacity:.5; }
  .spark  { stroke:var(--amber); stroke-width:2; stroke-linecap:round; }
  .dust   { fill:none; stroke:var(--soft); stroke-width:1.4; stroke-linecap:round; }

  .tnum   { font:900 30px var(--font); fill:var(--ink); letter-spacing:-.03em; }
  .tkey   { font:500 9.5px var(--mono); fill:var(--soft); letter-spacing:.16em; text-transform:uppercase; }
  .tscore { font:900 17px var(--font); fill:var(--amber); letter-spacing:-.02em; }
  .pass   { fill:none; stroke:var(--ink); stroke-width:1.6; }
  .pass.todo { opacity:.2; }
  .pass.hit  { fill:var(--ink); }
  .pass.caught { stroke:var(--amber); fill:none; stroke-width:2.2; }

  .mute { cursor:pointer; }
  .mute rect { fill:transparent; }
  .mute path, .mute line { fill:none; stroke:var(--faint); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; transition:stroke .16s var(--ease); }
  .mute:hover path, .mute:hover line { stroke:var(--ink); }
</style>
</head>
<body data-nav="duels">

<a class="skip" href="#main">Skip to content</a>

<div class="app">
  <aside class="rail"></aside>

  <main class="main" id="main">
    <header class="head">
      <button class="rail-toggle" type="button" aria-label="Show navigation" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <h1 class="head-title">Duels, quintain</h1>
    </header>

    <section class="stage rise">
      <svg class="scene" id="scene" viewBox="0 0 800 520" aria-hidden="true">
        <g id="ground"></g>
        <g id="arm"></g>
        <g id="postg"></g>
        <g id="lanceg"></g>
        <g id="fx"></g>
        <g id="tally"></g>
        <g class="mute" id="mute"></g>
      </svg>
      <button class="btn" type="button" id="go">Find a duel</button>
    </section>
  </main>
</div>

<script src="../assets/app.js"></script>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOut=k=>1-Math.pow(1-k,3);
const tween=(ms,fn,ease=easeOut)=>new Promise(r=>{if(reduce){fn(1);return r();}const t0=performance.now();
  (function s(n){const k=Math.min(1,(n-t0)/ms);fn(ease(k));k<1?requestAnimationFrame(s):r();})(performance.now())});

/* ---------------------------------------------------------------- sound
   Synthesised, nothing fetched, and silent until the first tap. */
const snd=(()=>{
  let ctx,master,muted=false,buf=null,whirr=null;
  const get=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
      master=ctx.createGain(); master.gain.value=.9; master.connect(ctx.destination); }
    if(ctx.state==='suspended') ctx.resume(); return ctx; };
  const noise=c=>{ if(buf) return buf; const n=c.sampleRate*2; buf=c.createBuffer(1,n,c.sampleRate);
    const d=buf.getChannelData(0); let last=0;
    for(let i=0;i<n;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.5; } return buf; };
  const burst=(dur,type,freq,gain,q=1,rate=1)=>{ const c=get(); if(!c||muted) return;
    const s=c.createBufferSource(); s.buffer=noise(c); s.playbackRate.value=rate*(1+Math.random()*.2);
    const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const g=c.createGain(); const t=c.currentTime;
    g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+dur+.02); };
  const tone=(type,f0,f1,dur,gain,delay=0)=>{ const c=get(); if(!c||muted) return;
    const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+delay;
    o.type=type; o.frequency.setValueAtTime(f0,t);
    if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(master); o.start(t); o.stop(t+dur+.02); };
  return {
    get muted(){ return muted; },
    toggle(){ muted=!muted; if(muted) this.whirrStop(); return muted; },
    hoof(){ burst(.07,'lowpass',260,.13,.8,.7); },                 // the run in
    couch(){ burst(.06,'highpass',1300,.18); },                    // the lance drops
    crack(){ burst(.09,'bandpass',1500,.42,1.4); tone('square',300,90,.13,.2);
             tone('sine',150,60,.2,.26); },                        // oak on oak
    whirrStart(){ const c=get(); if(!c||muted||whirr) return;
      const s=c.createBufferSource(); s.buffer=noise(c); s.loop=true;
      const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=320; f.Q.value=3;
      const g=c.createGain(); g.gain.value=0;
      s.connect(f).connect(g).connect(master); s.start(); whirr={s,g,f}; },
    whirrTo(k){ if(!whirr) return; const c=get(); if(!c) return; const t=c.currentTime;
      whirr.g.gain.setTargetAtTime(.04+.10*k,t,.05); whirr.f.frequency.setTargetAtTime(280+420*k,t,.06); },
    whirrStop(){ if(!whirr) return; const c=get(); const t=c?c.currentTime:0;
      try{ whirr.g.gain.setTargetAtTime(0,t,.03); whirr.s.stop(t+.14); }catch(e){} whirr=null; },
    clear(){ burst(.16,'highpass',900,.13,.8); tone('triangle',760,760,.34,.09); },  // the bag goes by
    caught(){ burst(.16,'lowpass',300,.4,.7); tone('sine',95,38,.26,.34); },         // it does not
    whiff(){ burst(.2,'bandpass',700,.1,1.6); },
    reload(){ tone('triangle',300,520,.12,.1); burst(.05,'highpass',1500,.1); },
  };
})();

/* ---------------------------------------------------------------- the scene
   Seen from above, like the rest of the pages, which also puts the arm's spin
   in the plane of the page. A post with a free arm: a shield on one end, a
   sandbag on the other. Run the lance in, strike the shield, and be out of the
   lane before the bag comes round, because a good strike sends it round fast.

   Two beats to a pass. Tap to strike, tap again to pull out. */
const PIV={x:474,y:262}, ARM=148, LANEY=262;
const LANCE0=54, LANCEMAX=372, RUN=1500;         // where the lance starts, ends, how long the run is
const STRIKE=PIV.x-ARM, WINDOW=58;               // the shield sits here; this is how close counts
const PASSES=5;

let armA=Math.PI, omega=0, quality=0;            // shield to the left at rest
let state='idle', t0=0, lanceX=LANCE0, lanceOut=0;
let pass=0, score=0, results=[];

const rad=a=>({x:PIV.x+Math.cos(a)*ARM, y:PIV.y+Math.sin(a)*ARM});

/* the ground it is planted in, and the lane the lance runs down */
(()=>{
  const g=$('ground');
  el('line',{class:'lane',x1:30,y1:LANEY,x2:PIV.x-46,y2:LANEY},g);
  for(let i=0;i<9;i++){                          // trodden earth around the post
    const a=i/9*Math.PI*2+.4, r=196+((i*37)%26);
    el('path',{class:'dust',d:`M${PIV.x+Math.cos(a)*r} ${PIV.y+Math.sin(a)*r*.62} l${9+i%4*5} ${i%2?3:-3}`,opacity:.3},g);
  }
})();

/* the post, end grain up */
(()=>{
  const g=$('postg');
  el('circle',{class:'post',cx:PIV.x,cy:PIV.y,r:23},g);
  [16,10,5].forEach(r=>el('circle',{class:'rings',cx:PIV.x,cy:PIV.y,r},g));
  el('circle',{class:'tip',cx:PIV.x,cy:PIV.y,r:2.4},g);
})();

/* the arm is built once in its own frame of reference, then only turned */
let armNode=null;
function buildArm(){
  const g=$('arm'); g.replaceChildren();
  const a=el('g',{},g); armNode=a;

  el('path',{class:'timber',d:`M${-ARM} -7 L${ARM} -6 L${ARM} 6 L${-ARM} 7 Z`},a);
  for(let i=-3;i<=3;i++) if(i) el('line',{class:'grain',x1:i*34,y1:-4,x2:i*34+16,y2:4},a);

  /* the shield, edge on from up here, with its boss */
  el('path',{class:'shield',d:`M${ARM+7} -43 q11 43 0 86 l-16 0 q-9 -43 0 -86 z`},a);
  el('path',{class:'grain',d:`M${ARM+3} -36 q9 36 0 72`},a);                      // the rim
  el('circle',{class:'boss',cx:ARM+3,cy:0,r:8.5},a);
  el('circle',{class:'rings',cx:ARM+3,cy:0,r:13},a);

  /* the sandbag, on its rope, on the trailing end */
  el('path',{class:'rope',d:`M${-ARM+4} 0 h-22`},a);
  el('path',{class:'bag',d:`M${-ARM-18} 0 q0 -26 -26 -26 q-26 0 -26 26 q0 26 26 26 q26 0 26 -26 z`},a);
  el('path',{class:'lash',d:`M${-ARM-22} -9 q-22 -7 -44 0M${-ARM-22} 9 q-22 7 -44 0`},a);
  el('path',{class:'rope',d:`M${-ARM-14} -7 q-6 7 0 14`},a);                      // the neck, tied off
}
function drawArm(){
  if(!armNode) buildArm();
  armNode.setAttribute('transform',`translate(${PIV.x} ${PIV.y}) rotate(${armA*180/Math.PI})`);
}

/* the lance likewise: drawn once with its point on the origin, then slid */
let lanceNode=null;
function buildLance(){
  const g=$('lanceg'); g.replaceChildren();
  const a=el('g',{},g); lanceNode=a;
  el('path',{class:'lance',d:'M-210 -6 L-16 -3.4 L-16 3.4 L-210 6 Z'},a);
  el('path',{class:'tip',d:'M0 0 l-18 -5 v10 z'},a);
  el('path',{class:'lash',d:'M-150 -7 v14M-162 -7 v14'},a);
}
function drawLance(){
  if(!lanceNode) buildLance();
  lanceNode.setAttribute('transform',`translate(${lanceX-lanceOut} ${LANEY})`);
}

/* the five passes, and what each one came to */
function paintTally(){
  const t=$('tally'); t.replaceChildren();
  for(let i=0;i<PASSES;i++){
    const x=58+i*26, r=results[i];
    const cls=r===undefined?'pass todo':r==='clear'?'pass hit':r==='caught'?'pass caught':'pass';
    el('circle',{class:cls,cx:x,cy:452,r:7},t);
    if(r==='miss') el('path',{class:'pass',d:`M${x-5} 447 l10 10M${x-5} 457 l10 -10`},t);
  }
  const n=el('text',{class:'tnum',x:52,y:498},t); n.textContent=score;
  const k=el('text',{class:'tkey',x:52+(score>99?58:score>9?40:22),y:498},t); k.textContent='points';
  if(pass>=PASSES){
    const g=el('g',{transform:'translate(190 442)'},t);
    el('path',{d:'M-9 0a9 9 0 1 0 3-6.7',fill:'none',stroke:'#F18508','stroke-width':2,'stroke-linecap':'round'},g);
    el('path',{d:'M-7 -9 l1 4.6 l4.6 -1',fill:'none',stroke:'#F18508','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  }
}

/* ---------------------------------------------------------------- the pass */
let raf=0, last=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;

  if(state==='run'){
    const k=clamp((now-t0)/RUN,0,1);
    lanceX=LANCE0+(LANCEMAX-LANCE0)*k;
    if(Math.floor(k*14)!==Math.floor((k-dt/RUN*1000)*14)) snd.hoof();
    drawLance();
    if(k>=1) resolve('miss');                       // ran past without striking
  }

  if(state==='spin'){
    armA+=omega*dt;
    snd.whirrTo(clamp(omega/8,0,1));
    drawArm();
    /* the bag is opposite the shield, so it reaches the lane half a turn on */
    if(armA>=Math.PI*2) resolve('caught');
  }

  if(state==='out'){                                 // pulling clear
    lanceOut=Math.min(300,lanceOut+900*dt);
    armA+=omega*dt; drawArm(); drawLance();
    if(armA>=Math.PI*2+.9){ snd.whirrStop(); settle(); }
  }

  raf=requestAnimationFrame(frame);
}

function startPass(){
  if(pass>=PASSES) return;
  state='run'; t0=performance.now(); lanceX=LANCE0; lanceOut=0;
  armA=Math.PI; omega=0; drawArm(); drawLance();
}

function strike(){
  const off=Math.abs(lanceX-STRIKE);
  if(off>WINDOW){ snd.whiff(); return resolve('miss'); }
  const q=1-off/WINDOW;                              // dead on the boss is 1
  quality=q;
  snd.couch(); snd.crack();
  sparks(rad(armA),q);
  /* a harder strike sends the arm round faster, so a better hit is a tighter
     escape. That is the whole bargain of the thing. */
  omega=3+4*q;
  state='spin'; snd.whirrStart();
}

function pullOut(){
  if(state!=='spin') return;
  state='out'; snd.clear();
}

function resolve(kind){
  if(kind==='caught'){ snd.whirrStop(); snd.caught(); sparks(rad(armA+Math.PI),1,true); }
  results[pass]=kind;
  const pts=kind==='clear'?Math.max(1,Math.round(quality*5))*2
          : kind==='caught'?Math.max(1,Math.round(quality*5)) : 0;
  score+=pts; pass++; paintTally();
  if(pts) flash(rad(armA),pts);
  state='wait';
  setTimeout(()=>{ if(pass<PASSES){ armA=Math.PI; omega=0; lanceOut=0; drawArm(); startPass(); } else state='done'; },
             kind==='miss'?520:900);
}
function settle(){ resolve('clear'); }

function sparks(p,q,heavy){
  if(reduce) return;
  const n=heavy?9:4+Math.round(q*5), g=el('g',{},$('fx'));
  const lines=Array.from({length:n},()=>{
    const a=Math.random()*Math.PI*2, len=8+Math.random()*(heavy?22:14);
    return {a,len,l:el('line',{class:'spark',x1:p.x,y1:p.y,x2:p.x,y2:p.y},g)};
  });
  tween(460,k=>{
    const e=easeOut(k);
    lines.forEach(s=>{
      const r0=6+e*s.len*1.7, r1=r0+s.len*(1-k*.7);
      s.l.setAttribute('x1',p.x+Math.cos(s.a)*r0); s.l.setAttribute('y1',p.y+Math.sin(s.a)*r0);
      s.l.setAttribute('x2',p.x+Math.cos(s.a)*r1); s.l.setAttribute('y2',p.y+Math.sin(s.a)*r1);
    });
    g.setAttribute('opacity',1-k);
  },k=>k).then(()=>g.remove());
}
function flash(p,pts){
  const t=el('text',{class:'tscore',x:p.x,y:p.y-30,'text-anchor':'middle'},$('fx'));
  t.textContent='+'+pts;
  tween(780,k=>{ t.setAttribute('y',p.y-30-k*26); t.setAttribute('opacity',1-k*k); },k=>k).then(()=>t.remove());
}

/* one tap does whatever the pass is waiting for */
$('scene').addEventListener('pointerdown',()=>{
  if(state==='idle'){ startPass(); return; }
  if(state==='run'){ strike(); return; }
  if(state==='spin'){ pullOut(); return; }
  if(state==='done'){ pass=0; score=0; results=[]; lanceOut=0; armA=Math.PI;
                      drawArm(); paintTally(); snd.reload(); startPass(); }
});

/* ---------------------------------------------------------------- the mute */
(()=>{
  const m=$('mute'); let off=false;
  const paint=()=>{
    m.replaceChildren();
    el('rect',{x:722,y:450,width:44,height:44,rx:10},m);
    el('path',{d:'M737 469h6l7-7v20l-7-7h-6z'},m);
    if(off) el('path',{d:'M754 466l10 10M764 466l-10 10'},m);
    else { el('path',{d:'M755 466a7 7 0 0 1 0 12'},m); el('path',{d:'M759 462a12 12 0 0 1 0 20'},m); }
    m.setAttribute('aria-label',off?'Turn sound on':'Turn sound off');
  };
  m.addEventListener('pointerdown',e=>{ e.stopPropagation(); off=snd.toggle(); paint(); });
  paint();
})();

drawArm(); drawLance(); paintTally();
last=performance.now(); raf=requestAnimationFrame(frame);

/* -- ROUTER SEAM: placement runs for three duels, per spec/rating.md --------- */
const go=$('go');
(()=>{
  const p=(window.SATF&&window.SATF.player&&window.SATF.player())||{placed:true};
  if(!p.placed) go.textContent='Calibrate';
})();
go.addEventListener('click',()=>console.log('[router] /duel/find'));
</script>

</body>
