<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duels · SAT Freshman</title>
<meta name="description" content="Five questions, one opponent, one rating on the line.">
<link rel="icon" href="../assets/mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;900&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/app.css">
<style>
  /* The rank is the page. The mark is the badge, per spec/rating.md: the ring
     fills in ten steps and the counter takes the digit, so a level is read as
     how much is filled rather than off a colour ramp. */
  .rank {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(18px,3vh,30px); padding:24px var(--gutter) 48px; text-align:center;
  }

  .badge { width:clamp(180px,26vh,248px); height:auto; display:block; }
  .badge .fill { transition:none; }

  .stat { display:flex; flex-direction:column; align-items:center; gap:3px; }
  .stat-n {
    font:900 clamp(2.6rem,7vw,3.9rem)/1 var(--font);
    letter-spacing:-.05em; font-variant-numeric:tabular-nums;
  }
  .stat-k { font:500 10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--soft); }
  .stat-band { font:500 11.5px var(--mono); letter-spacing:.05em; color:var(--faint); }
  .unplaced .stat-n { color:var(--faint); }

  /* the ten steps, laid out flat, so the shape of the ladder is visible */
  .ladder { display:flex; align-items:flex-end; gap:5px; margin:0; padding:0; list-style:none; }
  .ladder li {
    width:12px; border-radius:2px; background:var(--line);
    transition:background-color .4s var(--ease), height .45s var(--ease-mid);
  }
  .ladder li[data-done="true"] { background:var(--ink); }
  .ladder li[data-here="true"] { background:var(--amber); }
  .ladder-k { font:500 10px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }

  .note { max-width:40ch; font-size:13.5px; color:var(--soft); }
  .note[hidden] { display:none; }

  @media (prefers-reduced-motion: reduce) { .ladder li { transition:none; } }
</style>
</head>
<body data-nav="duels">

<a class="skip" href="#main">Skip to content</a>

<div class="app">
  <aside class="rail"></aside>

  <main class="main" id="main">
    <header class="head">
      <button class="rail-toggle" type="button" aria-label="Show navigation" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <h1 class="head-title">Duels</h1>
    </header>

    <section class="rank rise" id="rank">
      <svg class="badge" id="badge" viewBox="0 0 100 100" role="img" aria-labelledby="badgeLabel">
        <title id="badgeLabel"></title>
      </svg>

      <div class="stat">
        <p class="stat-n" id="rating">0</p>
        <p class="stat-k" id="ratingKey">rating</p>
        <p class="stat-band" id="band"></p>
      </div>

      <div class="stat">
        <ol class="ladder" id="ladder" aria-hidden="true"></ol>
        <p class="ladder-k">ten levels</p>
      </div>

      <p class="note" id="note" hidden></p>

      <button class="btn" type="button" id="go">Find a duel</button>
    </section>
  </main>
</div>

<script src="../assets/app.js"></script>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const S=window.SATF||{};
const P=(S.player&&S.player())||{rating:1000,placed:false};
const LEVEL=(S.levelOf||(()=>3))(P.rating);
const CORNER=S.corner||'M45 8 H30 A22 22 0 0 0 8 30 V45 H34 V41 A7 7 0 0 1 41 34 H45 Z';

/* the bands, straight off spec/rating.md: a floor, eight equal steps, an open top */
const BANDS=[[1,800],[801,950],[951,1100],[1101,1250],[1251,1400],
             [1401,1550],[1551,1700],[1701,1850],[1851,2000],[2001,null]];

/* ---------------------------------------------------------------- the badge */
const quads=(fill,clip)=>[0,90,180,270].map(a=>
  el('path',{d:CORNER,fill,...(a?{transform:`rotate(${a} 50 50)`}:{})}));

function buildBadge(level,placed){
  const svg=$('badge'); 
  [...svg.querySelectorAll('g,defs')].forEach(n=>n.remove());
  const clip=el('clipPath',{id:'fillclip'},el('defs',{},svg));
  const rect=el('rect',{x:0,y:100,width:100,height:0},clip);

  const track=el('g',{},svg);
  quads('#E4E1DC').forEach(p=>track.appendChild(p));
  const fill=el('g',{class:'fill','clip-path':'url(#fillclip)'},svg);
  quads('#F18508').forEach(p=>fill.appendChild(p));

  const t=el('text',{x:50,y:51,'text-anchor':'middle','dominant-baseline':'central',
    'font-family':'Archivo, sans-serif','font-weight':'900','font-size':'36',fill:'#3F3F3F'},svg);
  t.textContent=placed?level:'';

  svg.querySelector('title').textContent=placed
    ? `Level ${level} of ten, rating ${P.rating}.`
    : 'Not yet placed. Three duels to go.';

  /* the ring climbing to the level is the one moment of motion on the page */
  const target=placed?level*10:0;
  if(reduce||!target){ rect.setAttribute('y',100-target); rect.setAttribute('height',target); return; }
  const t0=performance.now(), dur=900;
  (function step(now){
    const k=Math.max(0,Math.min(1,(now-t0)/dur)), e=1-Math.pow(1-k,3), h=target*e;
    rect.setAttribute('y',100-h); rect.setAttribute('height',h);
    if(k<1) requestAnimationFrame(step);
  })(t0);
}

/* ---------------------------------------------------------------- the ladder */
function buildLadder(level,placed){
  const ol=$('ladder'); ol.replaceChildren();
  for(let i=1;i<=10;i++){
    const li=document.createElement('li');
    li.style.height=(14+i*4)+'px';
    if(placed&&i<level) li.dataset.done='true';
    if(placed&&i===level) li.dataset.here='true';
    ol.appendChild(li);
  }
}

/* ---------------------------------------------------------------- the page */
(()=>{
  const placed=!!P.placed;
  buildBadge(LEVEL,placed);
  buildLadder(LEVEL,placed);

  $('rank').classList.toggle('unplaced',!placed);
  $('rating').textContent=placed?P.rating:'--';
  $('ratingKey').textContent=placed?'rating':'unplaced';

  const b=BANDS[LEVEL-1];
  $('band').textContent=placed
    ? (b[1]===null?`Level ${LEVEL} · ${b[0]} and up`:`Level ${LEVEL} · ${b[0]} to ${b[1]}`)
    : '';

  const note=$('note');
  if(!placed){
    note.hidden=false;
    note.textContent='Everyone starts at 1000, which is level 3. Three placement duels decide where you actually sit, and the level counts from there.';
  }

  const go=$('go');
  go.textContent=placed?'Find a duel':'Calibrate';
  go.addEventListener('click',()=>console.log('[router]',placed?'/duel/find':'/duel/calibrate'));
})();
</script>

</body>
</html>
